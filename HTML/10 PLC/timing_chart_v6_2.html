<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Timing Chart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bdr:#30363d;--tx:#e6edf3;--mu:#8b949e;--bl:#388bfd;--gn:#3fb950;--rd:#f85149;--cy:#79c0ff;--yl:#d29922;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'Malgun Gothic','Segoe UI',sans-serif;font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

.tb0{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:4px 14px;display:flex;align-items:center;gap:8px;}
.tb0-lbl{font-size:11px;color:var(--mu);white-space:nowrap;}
.ti{background:transparent;border:none;color:var(--tx);font-size:15px;font-weight:700;flex:1;outline:none;font-family:inherit;border-bottom:2px solid transparent;cursor:text;}
.ti:hover{border-bottom-color:var(--bdr);}
.ti:focus{border-bottom-color:var(--bl);}

/* Selected cell highlight (single click) */
.cd.cellsel{background:rgba(56,139,253,.18);outline:2px solid var(--bl);outline-offset:-1px;border-radius:2px;}

.tb{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:5px 10px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex-shrink:0;}
.tl{font-size:11px;color:var(--mu);}
.sp{width:1px;height:20px;background:var(--bdr);}
.btn{background:var(--bg3);border:1px solid var(--bdr);color:var(--tx);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;}
.btn:hover{background:#2d333b;border-color:var(--bl);}
.btn.on{background:rgba(56,139,253,.2);border-color:var(--bl);color:var(--cy);}
.btn.gr{color:var(--gn);}.btn.rd{color:var(--rd);}
.btn:disabled{opacity:.35;cursor:default;}
.tb input[type=number]{background:var(--bg3);border:1px solid var(--bdr);color:var(--tx);padding:3px 5px;border-radius:4px;width:52px;font-size:12px;text-align:center;font-family:inherit;}
.sww{display:flex;gap:4px;}
.sw{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent;}
.sw:hover{transform:scale(1.15);}.sw.on{border-color:#fff;}

#cWrap{flex:1;overflow:auto;position:relative;}
table{border-collapse:collapse;table-layout:fixed;}
th,td{border:1px solid var(--bdr);padding:0;margin:0;}

/* Row number column */
.rn{text-align:center;font-size:11px;cursor:pointer;user-select:none;vertical-align:middle;transition:background .1s,color .1s;}
.rn:hover{background:#2d333b;}
.rn.sel{background:var(--bl)!important;color:#fff!important;}

/* Row highlight when selected */
tr.rowsel td,.rowsel .rn{background:rgba(56,139,253,.07)!important;}
tr.rowsel td.rn{background:var(--bl)!important;color:#fff!important;}

/* Bars */
.bar{position:absolute;top:5px;height:26px;border-radius:4px;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(0,0,0,.75);z-index:2;overflow:visible;}
.bar:active{cursor:grabbing;}
.bar.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bl);}
.bar.asrc{box-shadow:0 0 0 2.5px var(--yl),0 0 8px var(--yl);}
.bar-rh{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;border-radius:0 4px 4px 0;background:rgba(0,0,0,.2);}
.bar-x{position:absolute;top:-7px;right:-7px;width:15px;height:15px;border-radius:50%;background:var(--rd);color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;}
.bar:hover .bar-x{display:flex;}
.bgh{position:absolute;top:5px;height:26px;border-radius:4px;opacity:.4;pointer-events:none;border:2px dashed rgba(255,255,255,.5);}

.tovl{position:absolute;inset:0;cursor:crosshair;z-index:1;}
.tgc{height:100%;border-right:1px solid var(--bdr);}
.tgc:nth-child(even){background:rgba(255,255,255,.018);}

/* Editable text cells */
.cw{position:relative;height:36px;display:flex;align-items:center;width:100%;}
.cd{width:100%;height:100%;display:flex;align-items:center;padding:0 6px;cursor:text;font-size:12px;color:var(--tx);}
.cd.grp{font-size:11px;font-weight:600;color:var(--mu);justify-content:center;}
.ce{position:absolute;inset:0;background:var(--bg3);border:1.5px solid var(--bl);border-radius:2px;color:var(--tx);font-family:inherit;font-size:12px;padding:0 6px;outline:none;display:none;z-index:20;}
.cw.ed .cd{display:none;} .cw.ed .ce{display:block;}

/* Column resize - detected via mousemove on th edge */
.th-hdr{overflow:visible;}
.abtn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--mu);padding:2px 3px;border-radius:3px;}
.abtn:hover{color:var(--tx);background:var(--bg3);}

/* SVG */
#aSvg{position:absolute;pointer-events:none;z-index:10;overflow:visible;}
.ap{stroke:#d29922;stroke-width:2;fill:none;}
.ahi{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer;}

/* V-lines */
.vl{position:absolute;top:0;z-index:9;cursor:ew-resize;width:2px;background:var(--rd);opacity:.8;}
.vl::before{content:'';position:absolute;top:0;bottom:0;left:-6px;right:-6px;}
.vllbl{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:9px;padding:2px 5px;border-radius:0 0 3px 3px;color:#fff;white-space:nowrap;background:var(--rd);font-weight:700;}

#arrowHint{display:none;position:fixed;top:60px;right:16px;background:rgba(210,153,34,.15);border:2px solid var(--yl);padding:8px 14px;border-radius:8px;font-size:12px;color:var(--yl);pointer-events:none;z-index:500;}
#SB{background:var(--bg2);border-top:1px solid var(--bdr);padding:3px 12px;font-size:11px;color:var(--mu);flex-shrink:0;}
::-webkit-scrollbar{width:7px;height:7px;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px;}
</style>
</head>
<body>

<div class="tb0"><span class="tb0-lbl">제목</span><input id="TI" class="ti" value="Timing Chart" placeholder="제목을 클릭하여 입력..."></div>
<div class="tb">
  <span class="tl">총시간(초)</span><input type="number" id="TT" min="5" max="180" value="30">
  <span class="tl">셀너비</span><input type="number" id="CW" min="16" max="100" value="34">
  <div class="sp"></div>
  <span class="tl">바 색상</span>
  <div class="sww" id="SWS"></div>
  <div class="sp"></div>
  <button class="btn" id="UB" onclick="undo()" disabled>↩ 되돌리기</button>
  <button class="btn" id="RB" onclick="redo()" disabled>↪ 다시하기</button>
  <div class="sp"></div>
  <button class="btn" onclick="saveLS()">💾 저장</button>
  <button class="btn" onclick="expJSON()">⬇ JSON</button>
  <button class="btn" onclick="document.getElementById('FI').click()">📂 JSON 열기</button>
  <button class="btn" onclick="expXLSX()">📊 Excel 내보내기</button>
  <input type="file" id="FI" accept=".json" style="display:none">
  <div class="sp"></div>
  <button class="btn gr" onclick="addRow()">＋ 항목</button>
  <button class="btn" onclick="addGroup()">＋ 그룹</button>
  <button class="btn" onclick="insRow()" title="선택한 행 위에 삽입">↕ 행 삽입</button>
  <button class="btn rd" onclick="delSelRow()" title="선택한 행 삭제">✕ 행 삭제</button>
  <div class="sp"></div>
  <button class="btn" id="AB" onclick="toggleArrow()">→ 화살표</button>
  <button class="btn" onclick="addVL()">| 세로바</button>
  <div class="sp"></div>
  <button class="btn rd" onclick="clearBars()">🗑 바 삭제</button>
</div>

<div id="cWrap">
  <table id="chart" cellspacing="0"><colgroup id="CG"></colgroup><thead id="TH"></thead><tbody id="TB"></tbody></table>
  <svg id="aSvg" width="0" height="0"></svg>
</div>
<div id="arrowHint">🎯 출발 바 클릭 → 도착 바 클릭 (ESC 취소)</div>
<div id="SB">드래그: 바 생성 | 바 드래그: 이동 | 바 클릭: 선택→색상 변경 | # 클릭: 행 선택 | 셀 클릭: 편집 | Ctrl+Z: 되돌리기</div>

<script>
const COLORS=['#3fb950','#bc8cff','#388bfd','#79c0ff','#d29922','#f85149','#ffa657','#e3b341'];
const RH=36,HDR=28,RNW=32; // RNW = row-number column width
let nR=1,nB=1,nA=1,nV=1;

// ── STATE ──────────────────────────────────────────────────────────────
let S={title:'Timing Chart',tt:30,cw:34,wu:100,ws:100,wn:160,
  rows:[],arrows:[],vlines:[],ac:'#3fb950',sel:null};
let hist=[],hIdx=-1;
let aMode=false,aSrc=null;
let drag=null,moved=false,colDrag=null;
let selCellWrap=null; // tracks the currently selected (not editing) cell
let selRow=null; // row selection for insert/delete (not in S - persists through render)

function mkR(u,s,n,bars){return{id:nR++,unit:u,sub:s,name:n,bars};}
function mkB(s,d,c){return{id:nB++,s,d,c};}

function initData(){
  S.rows=[
    mkR('Loader Cassette','','Loading (안착)',[]),
    mkR('Loader Cassette','','Cassette 감지 Sensor On',[]),
    mkR('Linear Robot','상 hand Pick','Robot Arm Pick',[mkB(1,3,'#3fb950'),mkB(9,4,'#bc8cff')]),
    mkR('Linear Robot','상 hand Pick','Arm Vac. ON',[mkB(3,1,'#3fb950'),mkB(16,1,'#3fb950')]),
    mkR('Linear Robot','상 hand Pick','Robot Arm Place',[mkB(7,3,'#bc8cff'),mkB(14,4,'#bc8cff')]),
    mkR('Linear Robot','상 hand Pick','Arm Vac. Off',[mkB(9,1,'#3fb950')]),
    mkR('Linear Robot','하 hand Place','상 Arm Z 이동',[mkB(10,2,'#3fb950')]),
    mkR('Linear Robot','하 hand Place','상 Arm X 전진',[mkB(12,2,'#3fb950')]),
    mkR('Linear Robot','하 hand Place','상 Arm Z UP',[mkB(13,1,'#3fb950')]),
    mkR('Linear Robot','하 hand Place','상 Arm HV. On',[mkB(14,1,'#3fb950')]),
    mkR('Linear Robot','하 hand Place','상 Arm X 후진',[mkB(15,2,'#3fb950')]),
  ];
}

// ── HISTORY ────────────────────────────────────────────────────────────
function sh(){
  hist=hist.slice(0,hIdx+1);
  hist.push(JSON.parse(JSON.stringify({S,nR,nB,nA,nV})));
  hIdx=hist.length-1;if(hist.length>60){hist.shift();hIdx--;}uhb();
}
function undo(){if(hIdx<=0)return;hIdx--;ap(hist[hIdx]);}
function redo(){if(hIdx>=hist.length-1)return;hIdx++;ap(hist[hIdx]);}
function ap(snap){const d=JSON.parse(JSON.stringify(snap));S=d.S;nR=d.nR;nB=d.nB;nA=d.nA;nV=d.nV;render();}
function uhb(){document.getElementById('UB').disabled=hIdx<=0;document.getElementById('RB').disabled=hIdx>=hist.length-1;}

// ── HELPERS ────────────────────────────────────────────────────────────
const snp=v=>Math.round(v/1)*1; // always 1s snap
const stW=()=>RNW+S.wu+S.ws+S.wn; // total sticky width (SVG/VL offset)
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function ss(m){document.getElementById('SB').textContent=m;}

// Clean span computation
function computeSpans(rows,keyFn){
  const map={};let i=0;
  while(i<rows.length){
    const key=keyFn(rows[i]);let j=i;
    while(j<rows.length&&keyFn(rows[j])===key)j++;
    map[rows[i].id]={n:j-i,isFirst:true};
    for(let k=i+1;k<j;k++)map[rows[k].id]={n:0,isFirst:false};
    i=j;
  }
  return map;
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render(){
  document.getElementById('TI').value=S.title;
  document.getElementById('TT').value=S.tt;
  document.getElementById('CW').value=S.cw;
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c===S.ac));
  uhb();
  renderCols();renderHead();renderBody();renderSVG();renderVL();bindEv();
}

function renderCols(){
  let h=`<col style="width:${RNW}px"><col style="width:${S.wu}px"><col style="width:${S.ws}px"><col style="width:${S.wn}px">`;
  for(let i=0;i<S.tt;i++)h+=`<col style="width:${S.cw}px">`;
  h+=`<col style="width:52px">`;
  document.getElementById('CG').innerHTML=h;
}

// Sticky th style helper (no double position property bug)
function ths(left,width,extra=''){
  return `position:sticky;top:0;left:${left}px;z-index:28;background:var(--bg2);height:${HDR}px;width:${width}px;text-align:center;font-size:11px;font-weight:700;color:var(--mu);white-space:nowrap;${extra}`;
}
// Sticky td style helper
function tds(left,extra=''){
  return `position:sticky;left:${left}px;z-index:12;background:var(--bg2);vertical-align:middle;${extra}`;
}

function renderHead(){
  const L0=0,L1=RNW,L2=RNW+S.wu,L3=RNW+S.wu+S.ws;
  let ticks='';
  for(let t=1;t<=S.tt;t++){
    const maj=t%5===0;
    ticks+=`<th style="text-align:center;height:${HDR}px;font-size:${maj?11:10}px;color:${maj?'var(--cy)':'var(--mu)'};font-weight:${maj?700:600}">${t}</th>`;
  }
  document.getElementById('TH').innerHTML=`<tr>
    <th style="${ths(L0,RNW)}">#</th>
    <th style="${ths(L1,S.wu,'overflow:visible')}" class="th-hdr" data-col="wu">대제목</th>
    <th style="${ths(L2,S.ws,'overflow:visible')}" class="th-hdr" data-col="ws">중제목</th>
    <th style="${ths(L3,S.wn,'border-right:2px solid #444c56;overflow:visible')}" class="th-hdr" data-col="wn">소제목</th>
    ${ticks}
    <th style="${ths(0,52,'left:auto;right:0')}"></th>
  </tr>`;
}

function renderBody(){
  const L0=0,L1=RNW,L2=RNW+S.wu,L3=RNW+S.wu+S.ws;
  const unitMap=computeSpans(S.rows,r=>r.unit);
  const subMap=computeSpans(S.rows,r=>r.unit+'§'+r.sub);

  let html='';
  S.rows.forEach((row,idx)=>{
    const um=unitMap[row.id]||{n:1,isFirst:true};
    const sm=subMap[row.id]||{n:1,isFirst:true};
    const isSel=selRow===row.id;
    html+=`<tr data-rowid="${row.id}"${isSel?' class="rowsel"':''}>`;

    // # (row number)
    html+=`<td class="rn${isSel?' sel':''}" data-rowid="${row.id}" style="${tds(L0,'width:'+RNW+'px;border-right:1px solid var(--bdr);color:var(--mu);font-size:11px')}">${idx+1}</td>`;

    // 대제목
    if(um.isFirst){
      html+=`<td rowspan="${um.n}" style="${tds(L1,'text-align:center;border-right:1px solid var(--bdr)')}">
        <div class="cw" data-rowid="${row.id}" data-field="unit">
          <div class="cd grp">${esc(row.unit)||'(대제목)'}</div>
          <input class="ce" value="${esc(row.unit)}" placeholder="대제목">
        </div></td>`;
    }
    // 중제목
    if(sm.isFirst){
      html+=`<td rowspan="${sm.n}" style="${tds(L2,'text-align:center;border-right:1px solid var(--bdr)')}">
        <div class="cw" data-rowid="${row.id}" data-field="sub">
          <div class="cd grp">${esc(row.sub)||''}</div>
          <input class="ce" value="${esc(row.sub)}" placeholder="중제목">
        </div></td>`;
    }
    // 소제목
    html+=`<td style="${tds(L3,'border-right:2px solid #444c56')}">
      <div class="cw" data-rowid="${row.id}" data-field="name">
        <div class="cd">${esc(row.name)||'(소제목)'}</div>
        <input class="ce" value="${esc(row.name)}" placeholder="소제목">
      </div></td>`;

    // Track
    const bars=row.bars.map(b=>{
      const isBSel=S.sel&&S.sel.r===row.id&&S.sel.b===b.id;
      const isASrc=aSrc&&aSrc.rid===row.id&&aSrc.bid===b.id;
      return `<div class="bar${isBSel?' sel':''}${isASrc?' asrc':''}" data-rowid="${row.id}" data-bid="${b.id}"
        style="left:${b.s*S.cw}px;width:${Math.max(b.d*S.cw-2,6)}px;background:${b.c}">
        <span style="pointer-events:none;font-size:10px;font-weight:700">${b.d>=2?b.d+'s':''}</span>
        <div class="bar-rh"></div><div class="bar-x">✕</div></div>`;
    }).join('');
    const grid='<div style="position:absolute;inset:0;display:flex;pointer-events:none">'
      +`<div class="tgc" style="width:${S.cw}px"></div>`.repeat(S.tt)+'</div>';
    html+=`<td colspan="${S.tt}" style="padding:0;overflow:visible">
      <div style="position:relative;height:${RH}px;width:${S.tt*S.cw}px">
        ${grid}<div class="tovl" data-rowid="${row.id}"></div>${bars}
      </div></td>`;

    // Actions
    html+=`<td style="${tds(0,'right:0;left:auto;border-left:1px solid var(--bdr);text-align:center')}">
      <button class="abtn" data-act="dup" data-rowid="${row.id}">⧉</button>
      <button class="abtn" data-act="del" data-rowid="${row.id}">🗑</button></td>`;
    html+='</tr>';
  });

  // Add row shortcut
  html+=`<tr><td colspan="${S.tt+5}" style="padding:5px 12px;cursor:pointer;font-size:12px;color:var(--mu);position:sticky;left:0"
    onmouseover="this.style.color='var(--gn)'" onmouseout="this.style.color='var(--mu)'" onclick="addRow()">＋ 항목 추가</td></tr>`;
  document.getElementById('TB').innerHTML=html;
}

// ── SVG ARROWS ─────────────────────────────────────────────────────────
function renderSVG(){
  const svg=document.getElementById('aSvg');
  const W=S.tt*S.cw,H=S.rows.length*RH;
  svg.style.left=stW()+'px';svg.style.top=HDR+'px';
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  let html=`<defs><marker id="AH" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#d29922"/></marker></defs>`;
  S.arrows.forEach(a=>{
    const fi=S.rows.findIndex(r=>r.id===a.fr),ti=S.rows.findIndex(r=>r.id===a.tr);
    if(fi<0||ti<0)return;
    const fb=S.rows[fi].bars.find(b=>b.id===a.fb),tb=S.rows[ti].bars.find(b=>b.id===a.tb);
    if(!fb||!tb)return;
    const x1=(fb.s+fb.d)*S.cw,y1=fi*RH+RH/2,x2=tb.s*S.cw,y2=ti*RH+RH/2,mx=x1+(x2-x1)*.6;
    const d=`M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}`;
    html+=`<g><path class="ap" d="${d}" marker-end="url(#AH)"/>
      <path class="ahi" d="${d}" data-aid="${a.id}"/></g>`;
  });
  svg.innerHTML=html;
  svg.querySelectorAll('.ahi').forEach(p=>{
    p.style.pointerEvents='stroke';
    p.onclick=()=>{if(confirm('화살표를 삭제할까요?')){sh();S.arrows=S.arrows.filter(a=>a.id!==+p.dataset.aid);render();}};
  });
}

// ── V-LINES ────────────────────────────────────────────────────────────
function renderVL(){
  document.querySelectorAll('.vl').forEach(v=>v.remove());
  const sw=stW(),H=HDR+S.rows.length*RH+30;
  S.vlines.forEach(vl=>{
    const el=document.createElement('div');
    el.className='vl';el.style.cssText=`left:${sw+vl.pos*S.cw}px;height:${H}px`;
    el.innerHTML=`<div class="vllbl">${vl.pos}s</div>`;
    el.addEventListener('mousedown',e=>{
      e.stopPropagation();e.preventDefault();
      const ox=e.clientX,op=vl.pos;
      const mv=ev=>{const np=Math.max(0,Math.min(S.tt,op+Math.round((ev.clientX-ox)/S.cw)));vl.pos=np;el.style.left=(sw+np*S.cw)+'px';el.querySelector('.vllbl').textContent=np+'s';ss('세로바: '+np+'s');};
      const up=()=>{sh();render();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });
    el.addEventListener('contextmenu',e=>{e.preventDefault();if(confirm('세로바를 삭제할까요?')){sh();S.vlines=S.vlines.filter(v=>v.id!==vl.id);render();}});
    document.getElementById('cWrap').appendChild(el);
  });
}

// ── BIND EVENTS ────────────────────────────────────────────────────────
function bindEv(){
  // Row number click → select/deselect row
  document.querySelectorAll('.rn').forEach(cell=>{
    cell.addEventListener('click',e=>{
      e.stopPropagation();
      const id=+cell.dataset.rowid;
      selRow=(selRow===id)?null:id;
      render();
    });
  });

  // Cell click → single=select, second click/dblclick=edit
  document.querySelectorAll('.cw').forEach(wrap=>{
    const disp=wrap.querySelector('.cd'),edit=wrap.querySelector('.ce');
    const rowId=+wrap.dataset.rowid,field=wrap.dataset.field;
    disp.addEventListener('mousedown',e=>e.stopPropagation());
    edit.addEventListener('mousedown',e=>e.stopPropagation());

    function enterEdit(){wrap.classList.add('ed');edit.focus();edit.select();}

    disp.addEventListener('click',e=>{
      e.stopPropagation();
      if(selCellWrap===wrap){
        // Second click on already-selected cell → edit
        enterEdit();
      } else {
        // First click → select
        if(selCellWrap){selCellWrap.querySelector('.cd').classList.remove('cellsel');}
        disp.classList.add('cellsel');
        selCellWrap=wrap;
      }
    });
    disp.addEventListener('dblclick',e=>{e.stopPropagation();enterEdit();});

    edit.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();edit.blur();}
      if(e.key==='Escape'){e.preventDefault();
        edit.value=disp.dataset.orig||'';wrap.classList.remove('ed');
        disp.classList.add('cellsel');selCellWrap=wrap;}
      if(e.key==='Tab'){e.preventDefault();edit.blur();
        const allWraps=[...document.querySelectorAll('.cw')];
        const ci=allWraps.indexOf(wrap);
        if(ci>=0&&allWraps[ci+1]){
          const nw=allWraps[ci+1];
          nw.querySelector('.cd').classList.add('cellsel');
          selCellWrap=nw;
        }
      }
    });
    edit.addEventListener('focus',()=>{disp.dataset.orig=edit.value;});
    edit.addEventListener('blur',()=>{
      wrap.classList.remove('ed');
      disp.classList.add('cellsel');selCellWrap=wrap;
      const row=S.rows.find(r=>r.id===rowId);
      if(row&&row[field]!==edit.value){
        sh();row[field]=edit.value;
        disp.textContent=edit.value||(field==='name'?'(소제목)':field==='sub'?'':'(대제목)');
        if(field==='unit'||field==='sub')render();
      }
    });
  });

  // Click outside cells → deselect
  document.getElementById('cWrap').addEventListener('click',e=>{
    if(!e.target.closest('.cw')&&selCellWrap){
      selCellWrap.querySelector('.cd').classList.remove('cellsel');selCellWrap=null;
    }
  },{capture:false});

  // Row action buttons
  document.querySelectorAll('.abtn[data-act]').forEach(btn=>{
    btn.addEventListener('mousedown',e=>e.stopPropagation());
    btn.addEventListener('click',()=>{
      const act=btn.dataset.act,id=+btn.dataset.rowid;
      if(act==='del')delRow(id);else dupRow(id);
    });
  });

  // Bar delete
  document.querySelectorAll('.bar-x').forEach(x=>{
    x.addEventListener('mousedown',e=>e.stopPropagation());
    x.addEventListener('click',e=>{
      e.stopPropagation();
      const bar=x.closest('.bar'),rid=+bar.dataset.rowid,bid=+bar.dataset.bid;
      sh();const row=S.rows.find(r=>r.id===rid);
      if(row)row.bars=row.bars.filter(b=>b.id!==bid);
      S.arrows=S.arrows.filter(a=>!(a.fr===rid&&a.fb===bid)&&!(a.tr===rid&&a.tb===bid));
      if(S.sel?.b===bid)S.sel=null;render();
    });
  });

  // Column resize via right-edge detection on th headers
  document.querySelectorAll('.th-hdr').forEach(th=>{
    let near=false;
    th.addEventListener('mousemove',e=>{
      const r=th.getBoundingClientRect();
      near=e.clientX>r.right-7;
      th.style.cursor=near?'col-resize':'';
    });
    th.addEventListener('mouseleave',()=>{near=false;th.style.cursor='';});
    th.addEventListener('mousedown',e=>{
      if(!near)return;
      e.stopPropagation();e.preventDefault();
      const col=th.dataset.col,startX=e.clientX,origW=S[col];
      const ciMap={wu:1,ws:2,wn:3};
      const mv=ev=>{
        S[col]=Math.max(60,origW+(ev.clientX-startX));
        const cols=document.getElementById('CG').children;
        if(cols[ciMap[col]])cols[ciMap[col]].style.width=S[col]+'px';
        // Update th width live
        th.style.width=S[col]+'px';
      };
      const up=()=>{sh();render();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });
  });
}

// ── DRAG ────────────────────────────────────────────────────────────────
document.getElementById('cWrap').addEventListener('mousedown',e=>{
  if(colDrag)return;
  const bEl=e.target.closest('.bar'),rhEl=e.target.closest('.bar-rh'),xEl=e.target.closest('.bar-x'),ovl=e.target.closest('.tovl');
  if(xEl)return;
  if(bEl&&aMode){e.stopPropagation();e.preventDefault();clickArrow(+bEl.dataset.rowid,+bEl.dataset.bid);return;}
  if(rhEl&&!aMode){
    e.stopPropagation();e.preventDefault();
    const rid=+bEl.dataset.rowid,bid=+bEl.dataset.bid;
    const row=S.rows.find(r=>r.id===rid),b=row?.bars.find(b=>b.id===bid);if(!b)return;
    drag={type:'rs',rid,bid,oS:b.s,oD:b.d,x0:e.clientX};moved=false;return;
  }
  if(bEl&&!aMode){
    e.stopPropagation();e.preventDefault();
    const rid=+bEl.dataset.rowid,bid=+bEl.dataset.bid;
    const row=S.rows.find(r=>r.id===rid),b=row?.bars.find(b=>b.id===bid);if(!b)return;
    drag={type:'mv',rid,bid,oS:b.s,oD:b.d,x0:e.clientX};moved=false;return;
  }
  if(ovl&&!aMode){
    e.preventDefault();
    const rid=+ovl.dataset.rowid,row=S.rows.find(r=>r.id===rid);if(!row)return;
    const trk=ovl.parentElement,rect=trk.getBoundingClientRect();
    const sc=Math.max(0,Math.min(S.tt-1,snp(Math.floor((e.clientX-rect.left)/S.cw))));
    const ghost=document.createElement('div');
    ghost.className='bgh';ghost.style.background=S.ac;ghost.style.left=(sc*S.cw)+'px';ghost.style.width=(S.cw-2)+'px';
    trk.appendChild(ghost);drag={type:'cr',row,sc,cc:sc,rect,ghost,trk};moved=false;
  }
},true);

document.addEventListener('mousemove',e=>{
  if(!drag)return;moved=true;
  if(drag.type==='cr'){
    const x=e.clientX-drag.rect.left;drag.cc=Math.max(0,Math.min(S.tt-1,snp(Math.floor(x/S.cw))));
    const s=Math.min(drag.sc,drag.cc),d=Math.abs(drag.cc-drag.sc)+1;
    drag.ghost.style.left=(s*S.cw)+'px';drag.ghost.style.width=(d*S.cw-2)+'px';ss(`시작:${s+1}s 길이:${d}s 종료:${s+d}s`);
  } else {
    const dx=snp(Math.round((e.clientX-drag.x0)/S.cw));
    const row=S.rows.find(r=>r.id===drag.rid),b=row?.bars.find(b=>b.id===drag.bid);if(!b)return;
    if(drag.type==='mv')b.s=Math.max(0,Math.min(S.tt-b.d,drag.oS+dx));
    else b.d=Math.max(1,Math.min(S.tt-drag.oS,drag.oD+dx));
    const el=document.querySelector(`.bar[data-rowid="${drag.rid}"][data-bid="${drag.bid}"]`);
    if(el){el.style.left=(b.s*S.cw)+'px';el.style.width=Math.max(b.d*S.cw-2,6)+'px';
      const sp=el.querySelector('span');if(sp)sp.textContent=b.d>=2?b.d+'s':'';}
    ss(drag.type==='mv'?`이동 시작:${b.s+1}s 종료:${b.s+b.d}s`:`크기 길이:${b.d}s`);
  }
});

document.addEventListener('mouseup',()=>{
  if(!drag)return;
  if(drag.type==='cr'){
    drag.ghost.remove();
    if(moved){const s=Math.min(drag.sc,drag.cc),d=Math.abs(drag.cc-drag.sc)+1;if(s<S.tt){sh();drag.row.bars.push(mkB(s,Math.min(d,S.tt-s),S.ac));}render();}
  } else if(!moved&&drag.type==='mv'){
    S.sel=(S.sel&&S.sel.r===drag.rid&&S.sel.b===drag.bid)?null:{r:drag.rid,b:drag.bid};render();
  } else {sh();render();}
  drag=null;moved=false;
});

// ── ARROW MODE ──────────────────────────────────────────────────────────
function toggleArrow(){
  aMode=!aMode;aSrc=null;
  document.getElementById('AB').classList.toggle('on',aMode);
  document.getElementById('arrowHint').style.display=aMode?'block':'none';
  if(!aMode)render();
  ss(aMode?'화살표 모드: 출발 바 클릭 → 도착 바 클릭 (ESC: 취소)':'드래그: 바 생성');
}
function clickArrow(rid,bid){
  if(!aSrc){
    aSrc={rid,bid};
    document.querySelectorAll('.bar').forEach(b=>b.classList.toggle('asrc',+b.dataset.rowid===rid&&+b.dataset.bid===bid));
    ss('도착 바를 클릭하세요 (같은 바 재클릭: 취소)');
  } else {
    if(aSrc.rid===rid&&aSrc.bid===bid){aSrc=null;render();return;}
    sh();S.arrows.push({id:nA++,fr:aSrc.rid,fb:aSrc.bid,tr:rid,tb:bid});
    aSrc=null;aMode=false;document.getElementById('AB').classList.remove('on');document.getElementById('arrowHint').style.display='none';
    render();ss('화살표 추가됨 | 화살표 클릭: 삭제');
  }
}

// ── PASTE from Excel ──────────────────────────────────────────────────────
document.addEventListener('paste',e=>{
  // Works when a cell is selected OR in edit mode
  const fw=document.querySelector('.cw.ed')||selCellWrap;
  if(!fw)return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');if(!txt)return;
  e.preventDefault();
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  const rowId=+fw.dataset.rowid,field=fw.dataset.field;
  const startIdx=S.rows.findIndex(r=>r.id===rowId);if(startIdx<0)return;
  sh();
  lines.forEach((line,i)=>{
    const row=S.rows[startIdx+i];if(!row)return;
    const cols=line.split('\t');
    if(cols.length===1)row[field]=cols[0].trim();
    else if(cols.length===2){row.sub=cols[0].trim();row.name=cols[1].trim();}
    else if(cols.length>=3){row.unit=cols[0].trim();row.sub=cols[1].trim();row.name=cols[2].trim();}
  });
  render();ss(`Excel ${lines.length}행 붙여넣기 완료`);
});

// ── ROW OPERATIONS ──────────────────────────────────────────────────────
function addRow(){
  const last=S.rows[S.rows.length-1]||{unit:'',sub:''};
  sh();S.rows.push(mkR(last.unit,last.sub,'새 항목',[]));render();
}
function addGroup(){
  sh();S.rows.push(mkR('새 대제목','새 중제목','새 소제목',[]));render();
}
function insRow(){
  if(!selRow){ss('❗ # 열을 클릭해서 행을 먼저 선택하세요');return;}
  const idx=S.rows.findIndex(r=>r.id===selRow);if(idx<0)return;
  sh();const ref=S.rows[idx];
  S.rows.splice(idx,0,mkR(ref.unit,ref.sub,'새 항목',[]));
  render();ss('행 삽입됨');
}
function delSelRow(){
  if(!selRow){ss('❗ # 열을 클릭해서 행을 먼저 선택하세요');return;}
  if(S.rows.length<=1){alert('최소 1개 필요');return;}
  if(!confirm('선택한 행을 삭제할까요?'))return;
  sh();S.rows=S.rows.filter(r=>r.id!==selRow);
  S.arrows=S.arrows.filter(a=>a.fr!==selRow&&a.tr!==selRow);
  if(S.sel?.r===selRow)S.sel=null;selRow=null;render();ss('행 삭제됨');
}
function delRow(id){if(S.rows.length<=1){alert('최소 1개 필요');return;}if(!confirm('삭제?'))return;sh();S.rows=S.rows.filter(r=>r.id!==id);S.arrows=S.arrows.filter(a=>a.fr!==id&&a.tr!==id);if(S.sel?.r===id)S.sel=null;if(selRow===id)selRow=null;render();}
function dupRow(id){const orig=S.rows.find(r=>r.id===id);if(!orig)return;sh();const idx=S.rows.indexOf(orig);S.rows.splice(idx+1,0,mkR(orig.unit,orig.sub,orig.name+'(복사)',orig.bars.map(b=>mkB(b.s,b.d,b.c))));render();}
function clearBars(){if(!confirm('모든 바를 삭제?'))return;sh();S.rows.forEach(r=>r.bars=[]);S.arrows=[];S.sel=null;render();}
function addVL(){sh();S.vlines.push({id:nV++,pos:Math.min(10,S.tt)});render();}

// ── TOOLBAR ─────────────────────────────────────────────────────────────
const swc=document.getElementById('SWS');
COLORS.forEach(c=>{
  const s=document.createElement('div');s.className='sw';s.dataset.c=c;s.style.background=c;
  s.classList.toggle('on',c===S.ac);
  s.addEventListener('click',()=>{
    if(S.sel){const row=S.rows.find(r=>r.id===S.sel.r),b=row?.bars.find(b=>b.id===S.sel.b);if(b){sh();b.c=c;render();return;}}
    S.ac=c;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.dataset.c===c));
  });
  swc.appendChild(s);
});

document.getElementById('TI').addEventListener('input',e=>S.title=e.target.value);
document.getElementById('TT').addEventListener('change',e=>{sh();S.tt=Math.max(5,Math.min(180,+e.target.value||30));render();});
document.getElementById('CW').addEventListener('change',e=>{sh();S.cw=Math.max(16,Math.min(100,+e.target.value||34));render();});

// ── SAVE / LOAD ─────────────────────────────────────────────────────────
function saveLS(){try{localStorage.setItem('tc6',JSON.stringify({S,nR,nB,nA,nV}));ss('✔ 저장됨 (새로고침 후에도 유지)');}catch{ss('저장 실패');}}
function expJSON(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify({S,nR,nB,nA,nV},null,2));a.download=(S.title||'tc')+'.json';a.click();}
function expXLSX(){
  if(typeof XLSX==='undefined'){alert('SheetJS 로드 중입니다. 잠시 후 다시 시도하세요.');return;}
  const wb=XLSX.utils.book_new();
  const hdr=['대제목','중제목','소제목'];
  for(let t=1;t<=S.tt;t++)hdr.push(String(t));
  const aoa=[hdr];
  S.rows.forEach(row=>{
    const r=[row.unit,row.sub,row.name];
    for(let t=0;t<S.tt;t++){
      const hasBar=row.bars.some(b=>t>=b.s&&t<b.s+b.d);
      r.push(hasBar?'■':'');
    }
    aoa.push(r);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:15},{wch:15},{wch:20},...Array(S.tt).fill({wch:4})];
  XLSX.utils.book_append_sheet(wb,ws,S.title||'Sheet1');
  XLSX.writeFile(wb,(S.title||'timing_chart')+'.xlsx');
  ss('Excel 다운로드 완료');
}
document.getElementById('FI').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.S?.rows)throw 0;sh();S=d.S;nR=d.nR||200;nB=d.nB||500;nA=d.nA||50;nV=d.nV||20;
    // migrate old format (time field removal)
    if(S.rows[0]?.time!==undefined)S.rows.forEach(r=>{delete r.time;});
    render();ss('JSON 불러오기 완료');}catch{alert('파일 오류');}};
  r.readAsText(f);e.target.value='';
});
function tryLS(){
  try{const d=JSON.parse(localStorage.getItem('tc6')||'null');if(!d?.S?.rows)return false;
    S=d.S;nR=d.nR||200;nB=d.nB||500;nA=d.nA||50;nV=d.nV||20;return true;}catch{return false;}
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='z'){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo();}
  if(e.key==='Escape'){aMode=false;aSrc=null;S.sel=null;document.getElementById('AB').classList.remove('on');document.getElementById('arrowHint').style.display='none';render();}
  if(e.key==='Delete'&&S.sel&&!e.target.closest('.cw')){
    const row=S.rows.find(r=>r.id===S.sel.r);if(row){sh();row.bars=row.bars.filter(b=>b.id!==S.sel.b);S.sel=null;render();}
  }
});

// ── INIT ─────────────────────────────────────────────────────────────────
if(!tryLS())initData();
sh();render();
</script>
