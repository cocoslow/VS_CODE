<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서식 관리 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat (ES 모듈 대신 글로벌 변수 사용) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 전역 설정 및 초기화 ---
    let firebaseConfig = null;
    if (typeof __firebase_config !== 'undefined') {
      try {
        firebaseConfig = JSON.parse(__firebase_config);
      } catch (e) { console.error(e); }
    }

    let app = null;
    let auth = null;
    let db = null;

    if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey.trim() !== "" && firebaseConfig.apiKey !== "dummy-key") {
      try {
        app = firebase.apps.length === 0 ? firebase.initializeApp(firebaseConfig) : firebase.app();
        auth = app.auth();
        db = app.firestore();
      } catch (e) {
        console.error("Firebase 초기화 에러:", e);
      }
    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // --- 인라인 SVG 아이콘 컴포넌트 ---
    const Icon = {
      Plus: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Trash: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Upload: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
      ),
      Download: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      ),
      File: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      ),
      Settings: () => (
        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      X: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      ),
      Save: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
        </svg>
      ),
      Pencil: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
      )
    };

    function App() {
      const [user, setUser] = useState(null);
      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem('my-cards');
        return saved ? JSON.parse(saved) : [];
      });
      const [topics, setTopics] = useState(() => {
        const saved = localStorage.getItem('my-topics');
        return saved ? JSON.parse(saved) : ['엑셀', 'PPT', 'WORD', 'PLC', 'ETC'];
      });
      const [activeTopic, setActiveTopic] = useState('전체');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newCard, setNewCard] = useState({ title: '', topic: topics[0] || '엑셀', fileName: '' });
      const [isLoading, setIsLoading] = useState(true);

      const [isTabModalOpen, setIsTabModalOpen] = useState(false);
      const [tempTopics, setTempTopics] = useState([]);
      const [newTopicName, setNewTopicName] = useState('');

      useEffect(() => {
        localStorage.setItem('my-topics', JSON.stringify(topics));
      }, [topics]);

      useEffect(() => {
        if (!db) {
          localStorage.setItem('my-cards', JSON.stringify(cards));
        }
      }, [cards]);

      // 알림 및 확인창 상태
      const [notification, setNotification] = useState(null);
      const [confirmData, setConfirmData] = useState(null);

      // Firebase 컬렉션 참조 헬퍼
      const getCardsCollection = () => {
        if (!db) return null;
        return db.collection('artifacts').doc(appId).collection('public').doc('data').collection('cards');
      };

      // 1. 인증 처리
      useEffect(() => {
        const initAuth = async () => {
          if (!auth) {
            setUser({ uid: 'local-user' });
            setIsLoading(false);
            return;
          }
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await auth.signInWithCustomToken(__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
          } catch (err) {
            console.error("인증 오류:", err);
            setUser({ uid: 'local-user' });
            setIsLoading(false);
          }
        };
        initAuth();

        if (auth) {
          const unsubscribe = auth.onAuthStateChanged((u) => {
            if (u) setUser(u);
            else setUser({ uid: 'local-user' });
          });
          return () => unsubscribe();
        }
      }, []);

      // 2. 데이터 불러오기
      useEffect(() => {
        if (!db) {
          setIsLoading(false);
          return;
        }

        const cardsCollection = getCardsCollection();
        if (!user || !cardsCollection) {
          setIsLoading(false);
          return;
        }

        const unsubscribe = cardsCollection.onSnapshot(
          (snapshot) => {
            setCards(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            setIsLoading(false);
          },
          (error) => {
            console.error("데이터 로드 오류:", error);
            setIsLoading(false);
          }
        );
        return () => unsubscribe();
      }, [user]);

      // 알림 표시
      const showNotification = (message) => {
        setNotification(message);
        setTimeout(() => setNotification(null), 3000);
      };

      // 3. 주요 기능
      const handleAddCard = async () => {
        if (!newCard.title.trim() || !user) return;

        const cardData = {
          ...newCard,
          createdAt: new Date().toISOString(),
          userId: user.uid
        };

        if (!db) {
          setCards([...cards, { id: Date.now().toString(), ...cardData }]);
          setIsModalOpen(false);
          setNewCard({ title: '', topic: activeTopic === '전체' ? (topics[0] || '') : activeTopic, fileName: '' });
          showNotification("카드가 추가되었습니다. (로컬 모드)");
          return;
        }

        const cardsCollection = getCardsCollection();
        if (!cardsCollection) return showNotification("DB 연결 오류");

        try {
          await cardsCollection.add(cardData);
          setIsModalOpen(false);
          setNewCard({ title: '', topic: activeTopic === '전체' ? (topics[0] || '') : activeTopic, fileName: '' });
          showNotification("카드가 추가되었습니다.");
        } catch (err) {
          console.error(err);
          showNotification("오류가 발생했습니다.");
        }
      };

      const requestDelete = (id) => {
        setConfirmData({
          title: "카드 삭제",
          message: "정말 이 카드를 삭제하시겠습니까?",
          onConfirm: async () => {
            if (!db) {
              setCards(cards.filter(c => c.id !== id));
              showNotification("카드가 삭제되었습니다. (로컬 모드)");
            } else {
              const cardsCollection = getCardsCollection();
              if (cardsCollection) {
                await cardsCollection.doc(id).delete();
                showNotification("카드가 삭제되었습니다.");
              }
            }
            setConfirmData(null);
          }
        });
      };

      const handleLinkBlur = async (id, newLink) => {
        if (!db) {
          setCards(cards.map(c => c.id === id ? { ...c, fileLink: newLink } : c));
          showNotification("링크가 저장되었습니다.");
          return;
        }
        const cardsCollection = getCardsCollection();
        if (cardsCollection) {
          try {
            await cardsCollection.doc(id).update({ fileLink: newLink });
            showNotification("링크가 저장되었습니다.");
          } catch (err) {
            console.error(err);
          }
        }
      };

      const handleMemoBlur = async (id, newMemo) => {
        if (!db) {
          setCards(cards.map(c => c.id === id ? { ...c, memo: newMemo } : c));
          return;
        }
        const cardsCollection = getCardsCollection();
        if (cardsCollection) {
          try {
            await cardsCollection.doc(id).update({ memo: newMemo });
          } catch (err) {
            console.error(err);
          }
        }
      };

      const openTabModal = () => {
        setTempTopics(topics.map(t => ({ originalName: t, currentName: t, isDeleted: false })));
        setNewTopicName('');
        setIsTabModalOpen(true);
      };

      const handleAddTempTopic = () => {
        const name = newTopicName.trim();
        if (name && !tempTopics.some(t => !t.isDeleted && t.currentName === name)) {
          setTempTopics([...tempTopics, { originalName: null, currentName: name, isDeleted: false }]);
          setNewTopicName('');
        }
      };

      const handleSaveTopics = async () => {
        const finalTopics = [];
        const renames = [];

        for (const t of tempTopics) {
          if (!t.isDeleted && t.currentName.trim()) {
            finalTopics.push(t.currentName.trim());
            if (t.originalName && t.originalName !== t.currentName.trim()) {
              renames.push({ oldName: t.originalName, newName: t.currentName.trim() });
            }
          }
        }

        if (finalTopics.length === 0) {
          return showNotification("최소 1개의 탭은 있어야 합니다.");
        }

        if (renames.length > 0) {
          if (!db) {
            setCards(cards.map(c => {
              const rename = renames.find(r => r.oldName === c.topic);
              if (rename) return { ...c, topic: rename.newName };
              return c;
            }));
          } else {
            const cardsCollection = getCardsCollection();
            if (cardsCollection) {
              for (const card of cards) {
                const rename = renames.find(r => r.oldName === card.topic);
                if (rename) {
                  try {
                    await cardsCollection.doc(card.id).update({ topic: rename.newName });
                  } catch (err) { console.error(err); }
                }
              }
            }
          }
        }

        setTopics(finalTopics);
        if (!finalTopics.includes(activeTopic)) {
          setActiveTopic(finalTopics[0]);
        }
        setIsTabModalOpen(false);
        showNotification("탭이 저장되었습니다.");
      };

      const filteredCards = activeTopic === '전체' ? cards : cards.filter(card => card.topic === activeTopic);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans p-4 md:p-8">
          {/* 토스트 알림 */}
          {notification && (
            <div
              className="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl z-[100] animate-bounce">
              {notification}
            </div>
          )}

          {/* 헤더 */}
          <header className="max-w-[1600px] mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-800 flex items-center gap-2">
                <Icon.Settings /> 서식 관리 시스템
              </h1>
              <p className="text-gray-500 mt-1 text-sm">주제별 카드를 관리하고 파일을 업로드/다운로드 하세요.</p>
            </div>
            <div className="flex gap-2">
              <a href="https://drive.google.com/drive/folders/1Fevf1vPbEwhJdKXIrp06tow_HtRNw9C3?usp=drive_link"
                target="_blank"
                rel="noopener noreferrer"
                className="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg active:scale-95"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
                드라이브 열기
              </a>
              <button onClick={() => {
                setNewCard({ title: '', topic: activeTopic === '전체' ? (topics[0] || '') : activeTopic, fileName: '' });
                setIsModalOpen(true);
              }}
                className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold flex items-center
                justify-center gap-2 transition-all shadow-lg active:scale-95"
              >
                <Icon.Plus /> 카드 추가하기
              </button>
            </div>
          </header>

          {!db && (
            <div className="max-w-[1600px] mx-auto mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
              <strong>경고:</strong> Firebase 설정이 비어있어 데이터베이스에 연결할 수 없습니다. 정상적인 사용을 위해 설정을 확인해주세요.
            </div>
          )}

          {/* 탭 메뉴 */}
          <nav className="max-w-[1600px] mx-auto mb-8 flex overflow-x-auto gap-2 pb-2 items-center">
            <button onClick={() => setActiveTopic('전체')}
              className={`px-6 py-2.5 rounded-full font-bold whitespace-nowrap transition-all ${activeTopic === '전체'
                ? 'bg-blue-600 text-white shadow-md'
                : 'bg-white text-gray-500 hover:bg-gray-200 border border-gray-200'
                }`}
            >
              전체
            </button>
            {topics.map(topic => (
              <button key={topic} onClick={() => setActiveTopic(topic)}
                className={`px-6 py-2.5 rounded-full font-bold whitespace-nowrap transition-all ${activeTopic === topic
                  ? 'bg-gray-800 text-white shadow-md'
                  : 'bg-white text-gray-500 hover:bg-gray-200 border border-gray-200'
                  }`}
              >
                {topic}
              </button>
            ))}
            <button onClick={openTabModal} className="px-4 py-2.5 rounded-full font-bold whitespace-nowrap transition-all bg-gray-100 text-gray-500 hover:bg-gray-200 border border-gray-200 flex items-center gap-1 ml-auto">
              <Icon.Pencil /> 편집
            </button>
          </nav>

          {/* 카드 리스트 */}
          <main className="max-w-[1600px] mx-auto">
            {isLoading ? (
              <div className="text-center py-20 text-gray-400 font-medium">데이터를 불러오는 중...</div>
            ) : filteredCards.length > 0 ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6">
                {filteredCards.map(card => (
                  <div key={card.id}
                    className="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-4">
                        <div className={`p-2 rounded-lg ${card.topic === '엑셀' ? 'bg-green-100 text-green-700' : card.topic === 'PPT'
                          ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                          <Icon.File />
                        </div>
                        <button onClick={() => requestDelete(card.id)} className="text-gray-300 hover:text-red-500
                      transition-colors">
                          <Icon.Trash />
                        </button>
                      </div>
                      <h3 className="text-xl font-bold text-gray-800 mb-1">{card.title}</h3>
                      <textarea
                        className="w-full text-sm text-gray-600 bg-gray-50 border border-gray-100 rounded-lg p-2 resize-none outline-none focus:ring-1 focus:ring-blue-400 h-20 mb-4"
                        placeholder="메모를 입력하세요..."
                        defaultValue={card.memo || ''}
                        onBlur={(e) => handleMemoBlur(card.id, e.target.value)}
                      />
                    </div>
                    <div className="flex flex-col gap-2 mt-auto">
                      <input
                        type="text"
                        placeholder="🔗 공유 링크 붙여넣기"
                        className="w-full text-xs border border-gray-200 rounded-lg px-3 py-2 outline-none focus:ring-1 focus:ring-blue-400 bg-gray-50"
                        defaultValue={card.fileLink || ''}
                        onBlur={(e) => handleLinkBlur(card.id, e.target.value)}
                      />
                      {card.fileLink ? (
                        <a href={card.fileLink.startsWith('http') ? card.fileLink : `https://${card.fileLink}`} target="_blank" rel="noopener noreferrer" className="w-full bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 rounded-lg flex items-center justify-center gap-2 transition-colors text-sm font-semibold border border-blue-100">
                          <Icon.Download /> 파일 열기
                        </a>
                      ) : (
                        <button disabled className="w-full bg-gray-50 text-gray-400 py-2 rounded-lg flex items-center justify-center gap-2 text-sm font-semibold border border-gray-100 cursor-not-allowed">
                          <Icon.Download /> 링크를 입력하세요
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center py-20 bg-white border-2 border-dashed border-gray-200 rounded-3xl text-gray-400">
                등록된 카드가 없습니다.
              </div>
            )}
          </main>

          {/* 추가 모달 */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-[90]">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl">
                <div className="p-6 border-b flex justify-between items-center">
                  <h2 className="text-xl font-bold">새 카드 추가</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-900">
                    <Icon.X />
                  </button>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">주제</label>
                    <select value={newCard.topic} onChange={(e) => setNewCard({ ...newCard, topic: e.target.value })}
                      className="w-full border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2
                    focus:ring-blue-500"
                    >
                      {topics.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">제목</label>
                    <input type="text" placeholder="예: 프로젝트 보고서 양식" value={newCard.title} onChange={(e) => setNewCard({
                      ...newCard,
                      title: e.target.value
                    })}
                      className="w-full border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                </div>
                <div className="p-6 bg-gray-50 flex gap-3">
                  <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 text-gray-500 font-bold hover:bg-gray-200
                  rounded-xl transition-all">취소</button>
                  <button onClick={handleAddCard}
                    className="flex-1 bg-blue-600 text-white py-3 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg hover:bg-blue-700 transition-all">
                    <Icon.Save /> 저장하기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 커스텀 확인 모달 */}
          {confirmData && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[100] backdrop-blur-sm">
              <div
                className="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-in fade-in zoom-in duration-200">
                <h2 className="text-2xl font-bold mb-4">{confirmData.title}</h2>
                <p className="text-gray-600 mb-8">{confirmData.message}</p>
                <div className="flex gap-4">
                  <button onClick={() => setConfirmData(null)} className="flex-1 py-3 bg-gray-100 rounded-xl font-bold
                  text-gray-500 hover:bg-gray-200 transition-all">취소</button>
                  <button onClick={confirmData.onConfirm}
                    className="flex-1 py-3 bg-red-500 rounded-xl font-bold text-white hover:bg-red-600 transition-all">삭제</button>
                </div>
              </div>
            </div>
          )}

          {/* 탭 편집 모달 */}
          {isTabModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-[90]">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[80vh]">
                <div className="p-6 border-b flex justify-between items-center">
                  <h2 className="text-xl font-bold">탭 편집</h2>
                  <button onClick={() => setIsTabModalOpen(false)} className="text-gray-400 hover:text-gray-900">
                    <Icon.X />
                  </button>
                </div>
                <div className="p-6 space-y-4 overflow-y-auto">
                  <div className="space-y-3">
                    {tempTopics.map((t, idx) => !t.isDeleted && (
                      <div key={idx} className="flex gap-2 items-center">
                        <input
                          type="text"
                          value={t.currentName}
                          onChange={(e) => {
                            const updated = [...tempTopics];
                            updated[idx].currentName = e.target.value;
                            setTempTopics(updated);
                          }}
                          className="flex-1 border border-gray-200 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                        />
                        <button onClick={() => {
                          const updated = [...tempTopics];
                          updated[idx].isDeleted = true;
                          setTempTopics(updated);
                        }} className="p-2 text-gray-400 hover:text-red-500 transition-colors">
                          <Icon.Trash />
                        </button>
                      </div>
                    ))}
                  </div>

                  <hr className="my-4" />

                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">새 탭 추가</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="새 탭 이름"
                        value={newTopicName}
                        onChange={(e) => setNewTopicName(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleAddTempTopic()}
                        className="flex-1 border border-gray-200 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                      />
                      <button onClick={handleAddTempTopic} className="bg-gray-100 hover:bg-gray-200 px-4 rounded-xl font-bold transition-colors">추가</button>
                    </div>
                  </div>
                </div>
                <div className="p-6 bg-gray-50 flex gap-3 border-t">
                  <button onClick={() => setIsTabModalOpen(false)} className="flex-1 py-3 text-gray-500 font-bold hover:bg-gray-200 rounded-xl transition-all">취소</button>
                  <button onClick={handleSaveTopics} className="flex-1 bg-blue-600 text-white py-3 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg hover:bg-blue-700 transition-all">
                    <Icon.Save /> 저장하기
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="max-w-[1600px] mx-auto mt-12 text-[10px] text-gray-400 border-t pt-8 flex justify-between">
            <div>App ID: {appId}</div>
            <div>User ID: {user?.uid || '인증 중...'}</div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
