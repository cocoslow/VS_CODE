er: 2px solid #334155;\r\n            border-radius: 16px;\r\n            padding: 20px;\r\n            color: #f8fafc;\r\n            font-size: 1rem;\r\n            line-height: 1.7;\r\n            outline: none;\r\n            resize: none;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .memo-textarea:focus {\r\n            border-color: #2563eb;\r\n            background: #0f172a;\r\n        }\r\n\r\n        .save-indicator {\r\n            font-size: 0.65rem;\r\n            color: #22c55e;\r\n            font-weight: bold;\r\n            opacity: 0;\r\n            transition: opacity 0.3s;\r\n        }\r\n\r\n        .save-indicator.show {\r\n            opacity: 1;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar {\r\n            width: 6px;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar-thumb {\r\n            background: #cbd5e1;\r\n            border-radius: 10px;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4 h-screen flex flex-col overflow-hidden\">\r\n\r\n    <!-- Header -->\r\n    <div class=\"zodd-card p-4 flex justify-between items-center mb-4\">\r\n        <div class=\"flex items-center gap-4\">\r\n            <div class=\"bg-blue-600 p-2 rounded-xl text-white shadow-lg\"><i data-lucide=\"grid-3x3\" size=\"30\"><\/i><\/div>\r\n            <div>\r\n                <h1 class=\"text-3xl font-black uppercase tracking-tighter text-slate-800\">\r\n                    <span class=\"text-blue-600\">MTR<\/span>-매트릭스 입력 제어\r\n                <\/h1>\r\n                <p class=\"text-xs font-bold text-slate-400 uppercase tracking-widest text-blue-600\">다중 입력 스캔 시뮬레이션<\/p>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"pointer-box px-8 py-3 text-center border-4 border-black min-w-[220px]\">\r\n            <span class=\"text-[0.6rem] font-black block opacity-70 uppercase tracking-tight\">활성 스캔 라인 (Y)<\/span>\r\n            <span id=\"scan-label\" class=\"text-2xl font-black text-white text-emerald-400\">Y00<\/span>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- 4-Column Layout -->\r\n    <div class=\"flex-1 flex gap-4 overflow-hidden\">\r\n\r\n        <!-- Col 1: Controls (18%) -->\r\n        <div class=\"w-[18%] flex flex-col gap-4\">\r\n            <div class=\"zodd-card p-6 flex flex-col h-full shadow-[6px_6px_0px_#000]\">\r\n                <h3 class=\"text-xs font-black text-slate-400 uppercase mb-5 border-b-2 pb-2 flex items-center gap-2\">\r\n                    <i data-lucide=\"zap\" size=\"16\"><\/i> 명령어 선택\r\n                <\/h3>\r\n                <div class=\"space-y-3 flex-1 overflow-y-auto custom-scrollbar\">\r\n                    <button class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between active\">\r\n                        <div><span class=\"btn-main-label\">MTR<\/span><span class=\"btn-sub-label\">(매트릭스 입력)<\/span><\/div>\r\n                        <i data-lucide=\"chevron-right\"><\/i>\r\n                    <\/button>\r\n                    <div class=\"p-5 bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl text-center\">\r\n                        <span\r\n                            class=\"text-[0.6rem] font-black text-blue-400 uppercase tracking-widest leading-relaxed\">키패드\r\n                            스캔<br />시스템 모드<\/span>\r\n                    <\/div>\r\n                <\/div>\r\n                <div class=\"flex flex-col gap-2\">\r\n                    <button onclick=\"toggleScan()\" id=\"scan-btn\"\r\n                        class=\"bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl border-2 border-black font-black text-sm uppercase tracking-widest shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2\">\r\n                        <i data-lucide=\"play\" id=\"scan-icon\" size=\"16\"><\/i> <span id=\"scan-text\">스캔 중지<\/span>\r\n                    <\/button>\r\n                    <button onclick=\"clearKeys()\"\r\n                        class=\"mt-2 text-slate-400 font-black text-xs uppercase tracking-widest hover:text-red-600\">모든 키\r\n                        해제<\/button>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 2: Live Monitor (32%) -->\r\n        <div class=\"w-[32%] flex flex-col gap-4 relative\">\r\n            <div class=\"zodd-card p-6 flex-1 flex flex-col shadow-[10px_10px_0px_#000] overflow-hidden relative\">\r\n                <div class=\"flex justify-between items-end mb-6\">\r\n                    <div>\r\n                        <span class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest block\">시뮬레이션\r\n                            화면<\/span>\r\n                        <h2 id=\"status-display\" class=\"text-3xl font-black text-slate-800 tracking-tighter uppercase\">\r\n                            스캔 중...<\/h2>\r\n                    <\/div>\r\n                    <div class=\"text-right\">\r\n                        <span class=\"text-[0.6rem] font-black text-slate-500 uppercase block mb-1\">감지된 포인트<\/span>\r\n                        <span id=\"hit-count\" class=\"text-2xl font-black text-blue-600\">0<\/span>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <!-- Matrix UI -->\r\n                <div class=\"flex gap-2 flex-1\">\r\n                    <!-- Left: Y Labels -->\r\n                    <div class=\"flex flex-col justify-between py-5 text-[0.6rem] font-black text-slate-400\">\r\n                        <span>Y0<\/span><span>Y1<\/span><span>Y2<\/span><span>Y3<\/span><span>Y4<\/span><span>Y5<\/span><span>Y6<\/span><span>Y7<\/span>\r\n                    <\/div>\r\n                    <div class=\"flex-1 flex flex-col gap-2\">\r\n                        <!-- Top: X Labels -->\r\n                        <div class=\"flex justify-around px-2 text-[0.6rem] font-black text-slate-400\">\r\n                            <span>X0<\/span><span>X1<\/span><span>X2<\/span><span>X3<\/span><span>X4<\/span><span>X5<\/span><span>X6<\/span><span>X7<\/span>\r\n                        <\/div>\r\n                        <!-- Grid -->\r\n                        <div id=\"mtr-grid\" class=\"mtr-grid flex-1\">\r\n                            <!-- JS Dynamic Keys -->\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"mt-6 p-5 bg-black rounded-2xl flex justify-between items-center text-white\">\r\n                    <div>\r\n                        <div class=\"text-[0.6rem] text-slate-400 font-bold uppercase mb-1\">저장 시작 디바이스<\/div>\r\n                        <div class=\"text-2xl font-black text-yellow-400\">M0 ~ M63<\/div>\r\n                    <\/div>\r\n                    <div class=\"text-right\">\r\n                        <div class=\"text-[0.6rem] text-slate-400 font-bold uppercase mb-1\">현재 감지된 위치<\/div>\r\n                        <div class=\"text-lg font-black text-blue-400\" id=\"current-hit-addr\">없음<\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 3: Handbook (25%) -->\r\n        <div class=\"w-[25%] flex flex-col overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] overflow-hidden border-2 border-slate-700\">\r\n                <div class=\"flex items-center gap-3 mb-6 border-b border-slate-700 pb-4\">\r\n                    <i data-lucide=\"book-open\" class=\"text-pink-500\"><\/i>\r\n                    <h3 class=\"text-xl font-black uppercase tracking-widest\">기술 가이드<\/h3>\r\n                    <div id=\"save-status\" class=\"save-indicator ml-auto\">저장 완료!<\/div>\r\n                <\/div>\r\n\r\n                <div class=\"space-y-6 flex-1 overflow-y-auto custom-scrollbar pr-2\">\r\n                    <div class=\"bg-slate-800/80 p-6 rounded-3xl border-2 border-slate-700 shadow-inner\">\r\n                        <h4 class=\"text-2xl font-black text-blue-400 mb-2\">MTR (Matrix Input)<\/h4>\r\n                        <div class=\"st-syntax-large text-emerald-400\">MTR(s, n, d, n2);<\/div>\r\n                        <p class=\"text-sm font-bold text-slate-300 leading-relaxed mb-4\">\r\n                            입력 s로부터 8*n개의 스위치 상태를 읽어 d에 저장합니다.<\/p>\r\n\r\n                        <div class=\"mt-2\">\r\n                            <span\r\n                                class=\"text-[0.7rem] font-black text-slate-500 uppercase tracking-widest block mb-3 border-b border-slate-700 pb-1\">피연산자(오퍼랜드)\r\n                                사양<\/span>\r\n                            <table class=\"operand-table\">\r\n                                <thead>\r\n                                    <tr>\r\n                                        <th>피연산자<\/th>\r\n                                        <th>설명<\/th>\r\n                                    <\/tr>\r\n                                <\/thead>\r\n                                <tbody>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(s)<\/span><\/td>\r\n                                        <td>입력 선두 번호 (X0)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(n)<\/span><\/td>\r\n                                        <td>매트릭스 열 수 (8)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(d)<\/span><\/td>\r\n                                        <td>출력 선두 번호 (Y0)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(n2)<\/span><\/td>\r\n                                        <td>결과 저장 선두 (M0)<\/td>\r\n                                    <\/tr>\r\n                                <\/tbody>\r\n                            <\/table>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"p-5 bg-black/50 border border-slate-700 rounded-2xl\">\r\n                        <span\r\n                            class=\"text-[0.7rem] font-black text-slate-500 uppercase block mb-3 flex items-center gap-2\">\r\n                            <i data-lucide=\"code\" size=\"14\"><\/i> ST 프로그램 예제\r\n                        <\/span>\r\n                        <div class=\"st-code-box\">\r\n                            // 8x8 키패드 읽기<br>\r\n                            // X0~X7 입력, Y0~Y7 출력<br>\r\n                            // M0~M63 에 결과 저장<br>\r\n                            MTR(X0, 8, Y0, M0);\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"mt-6 p-5 bg-blue-900/40 border-2 border-blue-500/50 rounded-2xl italic\">\r\n                    <p class=\"text-xs font-bold text-blue-100 leading-relaxed flex items-center gap-2\">\r\n                        <i data-lucide=\"award\" size=\"16\"><\/i>\r\n                        \"MTR은 스캔 방식이므로 속도가 중요할 경우 스캔 타임을 고려해야 합니다.\"\r\n                    <\/p>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 4: Notepads (25%) -->\r\n        <div class=\"w-[25%] flex flex-col gap-4 overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] border-emerald-500\">\r\n                <div\r\n                    class=\"memo-section-header flex justify-between items-center border-b border-emerald-900/50 pb-4 mb-4\">\r\n                    <div class=\"flex items-center gap-3 text-emerald-400\">\r\n                        <i data-lucide=\"clipboard-list\"><\/i>\r\n                        <h3 class=\"text-lg font-black uppercase\">전체 메모<\/h3>\r\n                    <\/div>\r\n                <\/div>\r\n                <textarea id=\"global-memo\" class=\"memo-textarea flex-1 border-emerald-900/50 mb-6\"\r\n                    placeholder=\"프로젝트 전체 특이사항 기록...\"><\/textarea>\r\n\r\n                <div class=\"flex items-center gap-3 mb-4 text-blue-400 border-t border-slate-800 pt-6\">\r\n                    <i data-lucide=\"pencil-line\"><\/i>\r\n                    <h3 class=\"text-lg font-black uppercase\">MTR 메모<\/h3>\r\n                <\/div>\r\n                <textarea id=\"op-memo\" class=\"memo-textarea flex-1 border-blue-900/50\"\r\n                    placeholder=\"MTR 명령어 개별 기록...\"><\/textarea>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let currentScanY = 0;\r\n        let isScanning = true;\r\n        let scanInterval = null;\r\n        let pressedKeys = new Set(); // \"y-x\" format\r\n        let memoData = { MTR: '', global: '' };\r\n\r\n        function init() {\r\n            renderMatrix();\r\n            startScan();\r\n            initMemos();\r\n            lucide.createIcons();\r\n        }\r\n\r\n        function renderMatrix() {\r\n            const grid = document.getElementById('mtr-grid');\r\n            grid.innerHTML = '';\r\n            for (let y = 0; y < 8; y++) {\r\n                for (let x = 0; x < 8; x++) {\r\n                    const key = document.createElement('div');\r\n                    key.className = 'mtr-key';\r\n                    key.id = `key-${y}-${x}`;\r\n                    key.innerHTML = `\r\n                        <span class=\"addr-tag\">M${y * 8 + x}<\/span>\r\n                        <span class=\"bit-val\">0<\/span>\r\n                    `;\r\n                    key.onclick = () => toggleKey(y, x);\r\n                    grid.appendChild(key);\r\n                }\r\n            }\r\n        }\r\n\r\n        function toggleKey(y, x) {\r\n            const keyStr = `${y}-${x}`;\r\n            if (pressedKeys.has(keyStr)) pressedKeys.delete(keyStr);\r\n            else pressedKeys.add(keyStr);\r\n\r\n            const el = document.getElementById(`key-${y}-${x}`);\r\n            el.classList.toggle('pressed');\r\n            updateHits();\r\n        }\r\n\r\n        function clearKeys() {\r\n            pressedKeys.clear();\r\n            document.querySelectorAll('.mtr-key').forEach(el => {\r\n                el.classList.remove('pressed', 'active-hit');\r\n                el.querySelector('.bit-val').innerText = \"0\";\r\n            });\r\n            updateHits();\r\n        }\r\n\r\n        function startScan() {\r\n            if (scanInterval) clearInterval(scanInterval);\r\n            scanInterval = setInterval(() => {\r\n                // 이전 스캔 라인 제거\r\n                document.querySelectorAll('.mtr-key').forEach(el => {\r\n                    el.classList.remove('scanning', 'active-hit');\r\n                    if (!pressedKeys.has(el.id.replace('key-', ''))) {\r\n                        el.querySelector('.bit-val').innerText = \"0\";\r\n                    }\r\n                });\r\n\r\n                // 현재 스캔 라인 이동\r\n                currentScanY = (currentScanY + 1) % 8;\r\n                document.getElementById('scan-label').innerText = `Y0${currentScanY}`;\r\n\r\n                // 현재 행(Row)의 모든 키에 스캔 표시\r\n                for (let x = 0; x < 8; x++) {\r\n                    const el = document.getElementById(`key-${currentScanY}-${x}`);\r\n                    el.classList.add('scanning');\r\n\r\n                    // 만약 해당 키가 눌려있다면 (물리적 접점 형성) -> 비트 ON!\r\n                    if (pressedKeys.has(`${currentScanY}-${x}`)) {\r\n                        el.classList.add('active-hit');\r\n                        el.querySelector('.bit-val').innerText = \"1\";\r\n                        document.getElementById('current-hit-addr').innerText = `M${currentScanY * 8 + x} (X${x})`;\r\n                    }\r\n                }\r\n            }, 300); // 0.3초마다 한 줄씩 스캔\r\n        }\r\n\r\n        function toggleScan() {\r\n            isScanning = !isScanning;\r\n            const btn = document.getElementById('scan-btn');\r\n            const text = document.getElementById('scan-text');\r\n            const status = document.getElementById('status-display');\r\n\r\n            if (isScanning) {\r\n                startScan();\r\n                btn.className = btn.className.replace('bg-emerald-500', 'bg-blue-600');\r\n                text.innerText = \"스캔 중지\";\r\n                status.innerText = \"스캔 중...\";\r\n                status.className = \"text-3xl font-black text-slate-800 tracking-tighter uppercase\";\r\n            } else {\r\n                clearInterval(scanInterval);\r\n                btn.className = btn.className.replace('bg-blue-600', 'bg-emerald-500');\r\n                text.innerText = \"스캔 시작\";\r\n                status.innerText = \"정지됨\";\r\n                status.className = \"text-3xl font-black text-red-500 tracking-tighter uppercase\";\r\n                document.querySelectorAll('.mtr-key').forEach(el => el.classList.remove('scanning'));\r\n            }\r\n            lucide.createIcons();\r\n        }\r\n\r\n        function updateHits() {\r\n            document.getElementById('hit-count').innerText = pressedKeys.size;\r\n            if (pressedKeys.size === 0) document.getElementById('current-hit-addr').innerText = \"없음\";\r\n        }\r\n\r\n        function initMemos() {\r\n            const saved = localStorage.getItem('zodd_mtr_memos');\r\n            if (saved) {\r\n                memoData = JSON.parse(saved);\r\n                document.getElementById('global-memo').value = memoData.global || '';\r\n                document.getElementById('op-memo').value = memoData.MTR || '';\r\n            }\r\n            document.getElementById('global-memo').oninput = (e) => { memoData.global = e.target.value; saveMemos(); };\r\n            document.getElementById('op-memo').oninput = (e) => { memoData.MTR = e.target.value; saveMemos(); };\r\n        }\r\n\r\n        function saveMemos() {\r\n            localStorage.setItem('zodd_mtr_memos', JSON.stringify(memoData));\r\n            const ind = document.getElementById('save-status'); ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1000);\r\n        }\r\n\r\n        window.onload = init;\r\n    <\/script>\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p1","label":"BAND불감대영역","title":"PLC BAND 실무 예제 시뮬레이터","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-BAND%EB%B6%88%EA%B0%90%EB%8C%80%EC%98%81%EC%97%AD.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC BAND 실무 예제 시뮬레이터<\/title>\r\n    <style>\r\n        :root {\r\n            --primary: #2563eb;\r\n            --deadzone: #ef4444;\r\n            --bg: #f1f5f9;\r\n            --panel: #ffffff;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Malgun Gothic', sans-serif;\r\n            background-color: var(--bg);\r\n            padding: 20px;\r\n            color: #334155;\r\n        }\r\n\r\n        .container {\r\n            max-width: 800px;\r\n            margin: 0 auto;\r\n            background: var(--panel);\r\n            padding: 2rem;\r\n            border-radius: 16px;\r\n            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);\r\n        }\r\n\r\n        h2 {\r\n            border-bottom: 2px solid var(--primary);\r\n            padding-bottom: 10px;\r\n            color: #1e293b;\r\n        }\r\n\r\n        /* 예제 선택 버튼 섹션 */\r\n        .example-grid {\r\n            display: grid;\r\n            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));\r\n            gap: 10px;\r\n            margin-bottom: 2rem;\r\n        }\r\n\r\n        .ex-btn {\r\n            background: #f8fafc;\r\n            border: 1px solid #cbd5e1;\r\n            padding: 10px;\r\n            border-radius: 8px;\r\n            cursor: pointer;\r\n            font-size: 0.85rem;\r\n            transition: all 0.2s;\r\n            text-align: center;\r\n        }\r\n\r\n        .ex-btn:hover {\r\n            background: #e2e8f0;\r\n            border-color: var(--primary);\r\n        }\r\n\r\n        .ex-btn.active {\r\n            background: var(--primary);\r\n            color: white;\r\n            border-color: var(--primary);\r\n        }\r\n\r\n        /* 시나리오 설명 */\r\n        #scenario-desc {\r\n            background: #f0f9ff;\r\n            padding: 15px;\r\n            border-left: 4px solid var(--primary);\r\n            margin-bottom: 20px;\r\n            font-size: 0.95rem;\r\n            line-height: 1.5;\r\n        }\r\n\r\n        /* 컨트롤러 */\r\n        .control-panel {\r\n            background: #f8fafc;\r\n            padding: 20px;\r\n            border-radius: 12px;\r\n            margin-bottom: 20px;\r\n        }\r\n\r\n        .slider-row {\r\n            margin-bottom: 15px;\r\n        }\r\n\r\n        label {\r\n            display: block;\r\n            font-size: 0.9rem;\r\n            font-weight: bold;\r\n            margin-bottom: 5px;\r\n        }\r\n\r\n        input[type=\"range\"] {\r\n            width: 100%;\r\n            margin-bottom: 10px;\r\n        }\r\n\r\n        .input-group {\r\n            display: flex;\r\n            align-items: center;\r\n            gap: 10px;\r\n        }\r\n\r\n        .input-group input[type=\"range\"] {\r\n            flex-grow: 1;\r\n            margin-bottom: 0;\r\n        }\r\n\r\n        .btn-group {\r\n            display: flex;\r\n            gap: 5px;\r\n        }\r\n\r\n        .adj-btn {\r\n            background: #e2e8f0;\r\n            border: 1px solid #cbd5e1;\r\n            border-radius: 4px;\r\n            padding: 4px 10px;\r\n            cursor: pointer;\r\n            font-size: 0.8rem;\r\n            color: #334155;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .adj-btn:hover {\r\n            background: #cbd5e1;\r\n            border-color: #94a3b8;\r\n        }\r\n\r\n        /* 비주얼라이저 & 눈금 */\r\n        .visualizer-container {\r\n            position: relative;\r\n            margin: 60px 0 30px;\r\n            padding: 0 10px;\r\n        }\r\n\r\n        .bar-bg {\r\n            height: 50px;\r\n            background: #e2e8f0;\r\n            border-radius: 25px;\r\n            position: relative;\r\n            overflow: visible;\r\n        }\r\n\r\n        .dead-band {\r\n            position: absolute;\r\n            height: 100%;\r\n            background: rgba(239, 68, 68, 0.2);\r\n            border-left: 2px dashed var(--deadzone);\r\n            border-right: 2px dashed var(--deadzone);\r\n            transition: all 0.3s;\r\n        }\r\n\r\n        .pointer {\r\n            position: absolute;\r\n            width: 3px;\r\n            height: 60px;\r\n            background: var(--primary);\r\n            top: -5px;\r\n            z-index: 5;\r\n        }\r\n\r\n        .band-label {\r\n            position: absolute;\r\n            top: 50%;\r\n            font-size: 0.85rem;\r\n            font-weight: bold;\r\n            color: var(--deadzone);\r\n            white-space: nowrap;\r\n        }\r\n\r\n        .band-label.left {\r\n            left: -8px;\r\n            transform: translate(-100%, -50%);\r\n        }\r\n\r\n        .band-label.right {\r\n            right: -8px;\r\n            transform: translate(100%, -50%);\r\n        }\r\n\r\n        .ptr-label {\r\n            position: absolute;\r\n            top: -28px;\r\n            left: 50%;\r\n            transform: translateX(-50%);\r\n            font-weight: bold;\r\n            color: var(--primary);\r\n            font-size: 0.95rem;\r\n            white-space: nowrap;\r\n        }\r\n\r\n        /* 눈금 스타일 */\r\n        .scale {\r\n            position: relative;\r\n            width: 100%;\r\n            height: 20px;\r\n            margin-top: 10px;\r\n        }\r\n\r\n        .tick {\r\n            position: absolute;\r\n            width: 1px;\r\n            height: 8px;\r\n            background: #94a3b8;\r\n            top: 0;\r\n        }\r\n\r\n        .tick-label {\r\n            position: absolute;\r\n            top: 12px;\r\n            font-size: 0.7rem;\r\n            transform: translateX(-50%);\r\n            color: #64748b;\r\n        }\r\n\r\n        /* 결과 출력 */\r\n        .result-display {\r\n            display: flex;\r\n            justify-content: space-around;\r\n            align-items: center;\r\n            background: #1e293b;\r\n            color: white;\r\n            padding: 20px;\r\n            border-radius: 12px;\r\n            text-align: center;\r\n        }\r\n\r\n        .res-item .val {\r\n            font-size: 1.8rem;\r\n            font-weight: bold;\r\n            color: #fbbf24;\r\n            display: block;\r\n        }\r\n\r\n        .res-item .unit {\r\n            font-size: 0.8rem;\r\n            color: #94a3b8;\r\n        }\r\n\r\n        /* 탭 버튼 스타일 */\r\n        .tabs {\r\n            display: flex;\r\n            gap: 10px;\r\n            margin-bottom: 20px;\r\n            border-bottom: 2px solid #e2e8f0;\r\n            padding-bottom: 10px;\r\n        }\r\n\r\n        .tab-btn {\r\n            background: none;\r\n            border: none;\r\n            padding: 10px 20px;\r\n            font-size: 1.1rem;\r\n            font-weight: bold;\r\n            color: #64748b;\r\n            cursor: pointer;\r\n            border-radius: 8px 8px 0 0;\r\n            transition: all 0.3s;\r\n        }\r\n\r\n        .tab-btn:hover {\r\n            color: var(--primary);\r\n            background: #f8fafc;\r\n        }\r\n\r\n        .tab-btn.active {\r\n            color: var(--primary);\r\n            border-bottom: 3px solid var(--primary);\r\n            margin-bottom: -12px;\r\n        }\r\n\r\n        .tab-content {\r\n            display: none;\r\n        }\r\n\r\n        .tab-content.active {\r\n            display: block;\r\n        }\r\n\r\n        /* 존 제어 전용 스타일 */\r\n        .logic-box {\r\n            background: #1e293b;\r\n            color: #f8fafc;\r\n            padding: 15px;\r\n            border-radius: 8px;\r\n            margin-bottom: 20px;\r\n            font-family: monospace;\r\n        }\r\n\r\n        .dead-zone-area {\r\n            position: absolute;\r\n            height: 100%;\r\n            background: rgba(220, 38, 38, 0.2);\r\n            border-left: 2px solid var(--deadzone);\r\n            border-right: 2px solid var(--deadzone);\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            color: var(--deadzone);\r\n            font-weight: bold;\r\n            font-size: 0.8rem;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body>\r\n\r\n    <div class=\"container\">\r\n        <div class=\"tabs\">\r\n            <button class=\"tab-btn active\" onclick=\"switchTab('band', this)\">BAND (불감대)<\/button>\r\n            <button class=\"tab-btn\" onclick=\"switchTab('zone', this)\">ZONE (존 제어)<\/button>\r\n        <\/div>\r\n\r\n        <!-- BAND 탭 내용 -->\r\n        <div id=\"tab-band\" class=\"tab-content active\">\r\n            <h2>BAND 명령어 실무 시뮬레이션<\/h2>\r\n\r\n            <p>어떤 상황에서 쓰는지 궁금하지? 아래 예제를 클릭해봐!<\/p>\r\n            <div class=\"example-grid\">\r\n                <button class=\"ex-btn active\" onclick=\"loadEx(1, this)\">1. 센서 노이즈<\/button>\r\n                <button class=\"ex-btn\" onclick=\"loadEx(2, this)\">2. 조이스틱 중립<\/button>\r\n                <button class=\"ex-btn\" onclick=\"loadEx(3, this)\">3. 서보 헌팅방지<\/button>\r\n                <button class=\"ex-btn\" onclick=\"loadEx(4, this)\">4. 로드셀 영점<\/button>\r\n                <button class=\"ex-btn\" onclick=\"loadEx(5, this)\">5. 텐션 완충<\/button>\r\n                <button class=\"ex-btn\" onclick=\"loadEx(6, this)\">🎲 랜덤(심화)<\/button>\r\n            <\/div>\r\n\r\n            <div id=\"scenario-desc\">\r\n                <strong>시나리오:<\/strong> <span id=\"desc-text\">센서값이 ±3 정도 미세하게 떨릴 때, 이 노이즈를 0으로 무시합니다.<\/span>\r\n            <\/div>\r\n\r\n            <div class=\"control-panel\">\r\n                <div class=\"slider-row\">\r\n                    <label>Min (하한값): <span id=\"s1-txt\">-3<\/span><\/label>\r\n                    <input type=\"range\" id=\"s1\" min=\"-100\" max=\"100\" value=\"-3\" oninput=\"sync()\">\r\n                <\/div>\r\n                <div class=\"slider-row\">\r\n                    <label>Max (상한값): <span id=\"s2-txt\">3<\/span><\/label>\r\n                    <input type=\"range\" id=\"s2\" min=\"-100\" max=\"100\" value=\"3\" oninput=\"sync()\">\r\n                <\/div>\r\n                <div class=\"slider-row\">\r\n                    <label>In (입력값): <span id=\"s3-txt\">2<\/span><\/label>\r\n                    <div class=\"input-group\">\r\n                        <input type=\"range\" id=\"s3\" min=\"-100\" max=\"100\" value=\"2\" oninput=\"sync()\">\r\n                        <div class=\"btn-group\">\r\n                            <button class=\"adj-btn\" onclick=\"adjustValue('s3', -1)\">▼<\/button>\r\n                            <button class=\"adj-btn\" onclick=\"adjustValue('s3', 1)\">▲<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <div class=\"visualizer-container\">\r\n                <div class=\"bar-bg\">\r\n                    <div id=\"band\" class=\"dead-band\">\r\n                        <div id=\"band-min-label\" class=\"band-label left\">Min: -3<\/div>\r\n                        <div id=\"band-max-label\" class=\"band-label right\">Max: 3<\/div>\r\n                    <\/div>\r\n                    <div id=\"ptr\" class=\"pointer\">\r\n                        <div id=\"ptr-label\" class=\"ptr-label\">In: 2<\/div>\r\n                    <\/div>\r\n                <\/div>\r\n                <div class=\"scale\" id=\"ruler\"><\/div>\r\n            <\/div>\r\n\r\n            <div class=\"result-display\">\r\n                <div class=\"res-item\">\r\n                    <span class=\"unit\">입력(In)<\/span>\r\n                    <span class=\"val\" id=\"res-s3\">2<\/span>\r\n                <\/div>\r\n                <div style=\"font-size: 2rem;\">→<\/div>\r\n                <div class=\"res-item\">\r\n                    <span class=\"unit\">결과(d)<\/span>\r\n                    <span class=\"val\" id=\"res-d\">0<\/span>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div> <!-- // BAND 탭 끝 -->\r\n\r\n        <!-- ZONE 탭 내용 -->\r\n        <div id=\"tab-zone\" class=\"tab-content\">\r\n            <h2>DZONE(EN, s1, s2, s3, d) 시뮬레이터<\/h2>\r\n            <div class=\"logic-box\">\r\n                IF s3 < s1 THEN d=s3 <br>\r\n                    ELSIF s1 <= s3 <=s2 THEN d=0 <br>\r\n                        ELSE d = s3\r\n            <\/div>\r\n\r\n            <div class=\"control-panel\">\r\n                <div class=\"slider-row\">\r\n                    <label>Min(s1, 하한): <span id=\"z-s1-t\">-30<\/span><\/label>\r\n                    <input type=\"range\" id=\"z-s1\" min=\"-100\" max=\"100\" value=\"-30\" oninput=\"syncZone()\">\r\n                <\/div>\r\n                <div class=\"slider-row\">\r\n                    <label>Max(s2, 상한): <span id=\"z-s2-t\">30<\/span><\/label>\r\n                    <input type=\"range\" id=\"z-s2\" min=\"-100\" max=\"100\" value=\"30\" oninput=\"syncZone()\">\r\n                <\/div>\r\n                <div class=\"slider-row\">\r\n                    <label>In(s3, 입력): <span id=\"z-s3-t\">50<\/span><\/label>\r\n                    <div class=\"input-group\">\r\n                        <input type=\"range\" id=\"z-s3\" min=\"-100\" max=\"100\" value=\"50\" oninput=\"syncZone()\">\r\n                        <div class=\"btn-group\">\r\n                            <button class=\"adj-btn\" onclick=\"adjustZoneValue('z-s3', -1)\">▼<\/button>\r\n                            <button class=\"adj-btn\" onclick=\"adjustZoneValue('z-s3', 1)\">▲<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <div class=\"visualizer-container\">\r\n                <div class=\"bar-bg\">\r\n                    <div id=\"z-dz\" class=\"dead-zone-area\">\r\n                        <div id=\"z-band-min-label\" class=\"band-label left\">Min: -30<\/div>\r\n                        ZERO ZONE\r\n                        <div id=\"z-band-max-label\" class=\"band-label right\">Max: 30<\/div>\r\n                    <\/div>\r\n                    <div id=\"z-ptr\" class=\"pointer\">\r\n                        <div id=\"z-ptr-label\" class=\"ptr-label\">In: 50<\/div>\r\n                    <\/div>\r\n                <\/div>\r\n                <div class=\"scale\" id=\"z-ruler\"><\/div>\r\n            <\/div>\r\n\r\n            <div class=\"result-display\">\r\n                <div class=\"res-item\">\r\n                    <span class=\"unit\">입력(s3)<\/span>\r\n                    <span class=\"val\" id=\"z-res-s3\">50<\/span>\r\n                <\/div>\r\n                <div style=\"font-size: 2rem;\">→<\/div>\r\n                <div class=\"res-item\">\r\n                    <span class=\"unit\">결과(d)<\/span>\r\n                    <span class=\"val\" id=\"z-res-d\">50<\/span>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div> <!-- // ZONE 탭 끝 -->\r\n    <\/div>\r\n\r\n    <script>\r\n        const examples = {\r\n            1: { s1: -3, s2: 3, s3: 2, desc: \"<b>센서 노이즈 제거:<\/b> 센서가 가만히 있어도 -2~2 사이를 떨고 있습니다. 불감대를 3으로 설정하면, 실제 큰 변화가 생기기 전까지 출력(d)은 0을 유지하여 시스템이 안정됩니다.\" },\r\n            2: { s1: -15, s2: 15, s3: 5, desc: \"<b>조이스틱 중립 구간:<\/b> 조이스틱을 놓아도 물리적 마모로 인해 5라는 값이 들어옵니다. ±15를 불감대로 잡으면 사용자가 손을 뗐을 때 장비가 움직이지 않습니다.\" },\r\n            3: { s1: -1, s2: 1, s3: 0.5, desc: \"<b>서보 헌팅 방지:<\/b> 위치 오차가 0.5인데 모터가 미세하게 떨립니다. ±1 이내의 오차는 0으로 간주하여 서보가 정지 상태를 유지하게 합니다.\" },\r\n            4: { s1: 0, s2: 8, s3: 4, desc: \"<b>로드셀 영점:<\/b> 빈 컨베이어의 진동으로 4g이 찍힙니다. 0~8g 구간을 불감대로 설정하면, 진짜 물건(8g 이상)이 올라올 때만 무게 측정을 시작합니다.\" },\r\n            5: { s1: -10, s2: 10, s3: 12, desc: \"<b>텐션 보정:<\/b> 장력이 조금 변할 때마다 속도를 바꾸면 필름이 끊어질 수 있습니다. ±10 범위를 넘을 때만 보정값(d)을 계산해 부드럽게 제어합니다.\" },\r\n            6: { s1: -50, s2: 20, s3: -60, desc: \"<b>랜덤/심화:<\/b> 불감대를 비대칭(-50 ~ 20)으로 설정할 수도 있습니다. 이 경우 하한선을 넘으면 음수 방향으로 제어값이 발생합니다.\" }\r\n        };\r\n\r\n        let currentExId = 1;\r\n\r\n        function loadEx(id, btn) {\r\n            document.querySelectorAll('.ex-btn').forEach(b => b.classList.remove('active'));\r\n            btn.classList.add('active');\r\n\r\n            currentExId = id;\r\n            const ex = examples[id];\r\n            document.getElementById('s1').value = ex.s1;\r\n            document.getElementById('s2').value = ex.s2;\r\n            document.getElementById('s3').value = ex.s3;\r\n            document.getElementById('desc-text').innerHTML = ex.desc;\r\n            sync();\r\n        }\r\n\r\n        function createRuler() {\r\n            const ruler = document.getElementById('ruler');\r\n            for (let i = -100; i <= 100; i += 20) {\r\n                const left = (i + 100) / 2;\r\n                ruler.innerHTML += `<div class=\"tick\" style=\"left: ${left}%\"><\/div>\r\n                               <div class=\"tick-label\" style=\"left: ${left}%\">${i}<\/div>`;\r\n            }\r\n        }\r\n\r\n        function adjustValue(id, delta) {\r\n            const input = document.getElementById(id);\r\n            let newVal = parseInt(input.value) + delta;\r\n            const min = parseInt(input.min);\r\n            const max = parseInt(input.max);\r\n\r\n            if (newVal < min) newVal = min;\r\n            if (newVal > max) newVal = max;\r\n\r\n            input.value = newVal;\r\n            sync();\r\n        }\r\n\r\n        function sync() {\r\n            const s1 = parseInt(document.getElementById('s1').value);\r\n            const s2 = parseInt(document.getElementById('s2').value);\r\n            const s3 = parseInt(document.getElementById('s3').value);\r\n\r\n            // 사용자가 설정한 값을 저장 (탭 변경 시 유지용)\r\n            examples[currentExId].s1 = s1;\r\n            examples[currentExId].s2 = s2;\r\n            examples[currentExId].s3 = s3;\r\n\r\n            document.getElementById('s1-txt').innerText = s1;\r\n            document.getElementById('s2-txt').innerText = s2;\r\n            document.getElementById('s3-txt').innerText = s3;\r\n            document.getElementById('res-s3').innerText = s3;\r\n\r\n            let d = 0;\r\n            if (s3 < s1) d = s3 - s1;\r\n            else if (s3 > s2) d = s3 - s2;\r\n            else d = 0;\r\n\r\n            document.getElementById('res-d').innerText = d;\r\n\r\n            // Visual Update\r\n            const toPct = (v) => (v + 100) / 2;\r\n            const band = document.getElementById('band');\r\n            band.style.left = toPct(s1) + \"%\";\r\n            band.style.width = Math.max(0, toPct(s2) - toPct(s1)) + \"%\";\r\n            document.getElementById('ptr').style.left = toPct(s3) + \"%\";\r\n\r\n            // Label Update\r\n            document.getElementById('band-min-label').innerText = `Min: ${s1}`;\r\n            document.getElementById('band-max-label').innerText = `Max: ${s2}`;\r\n            document.getElementById('ptr-label').innerText = `In: ${s3}`;\r\n        }\r\n\r\n        createRuler();\r\n        sync();\r\n\r\n        // ==========================================\r\n        // 탭 전환 로직\r\n        // ==========================================\r\n        function switchTab(tabId, btn) {\r\n            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));\r\n            btn.classList.add('active');\r\n\r\n            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));\r\n            document.getElementById('tab-' + tabId).classList.add('active');\r\n        }\r\n\r\n        // ==========================================\r\n        // ZONE 제어 로직\r\n        // ==========================================\r\n        function adjustZoneValue(id, delta) {\r\n            const input = document.getElementById(id);\r\n            let newVal = parseInt(input.value) + delta;\r\n            const min = parseInt(input.min);\r\n            const max = parseInt(input.max);\r\n\r\n            if (newVal < min) newVal = min;\r\n            if (newVal > max) newVal = max;\r\n\r\n            input.value = newVal;\r\n            syncZone();\r\n        }\r\n\r\n        function syncZone() {\r\n            const s1 = parseInt(document.getElementById('z-s1').value);\r\n            const s2 = parseInt(document.getElementById('z-s2').value);\r\n            const s3 = parseInt(document.getElementById('z-s3').value);\r\n\r\n            document.getElementById('z-s1-t').innerText = s1;\r\n            document.getElementById('z-s2-t').innerText = s2;\r\n            document.getElementById('z-s3-t').innerText = s3;\r\n            document.getElementById('z-res-s3').innerText = s3;\r\n\r\n            let d = (s3 >= s1 && s3 <= s2) ? 0 : s3;\r\n            document.getElementById('z-res-d').innerText = d;\r\n\r\n            const toPct = v => (v + 100) / 2;\r\n            const dz = document.getElementById('z-dz');\r\n            dz.style.left = toPct(s1) + \"%\";\r\n            dz.style.width = Math.max(0, toPct(s2) - toPct(s1)) + \"%\";\r\n            document.getElementById('z-ptr').style.left = toPct(s3) + \"%\";\r\n\r\n            document.getElementById('z-band-min-label').innerText = `Min: ${s1}`;\r\n            document.getElementById('z-band-max-label').innerText = `Max: ${s2}`;\r\n            document.getElementById('z-ptr-label').innerText = `In: ${s3}`;\r\n        }\r\n\r\n        function createZoneRuler() {\r\n            const ruler = document.getElementById('z-ruler');\r\n            for (let i = -100; i <= 100; i += 20) {\r\n                const left = (i + 100) / 2;\r\n                ruler.innerHTML += `<div class=\"tick\" style=\"left: ${left}%\"><\/div>\r\n                               <div class=\"tick-label\" style=\"left: ${left}%\">${i}<\/div>`;\r\n            }\r\n        }\r\n\r\n        createZoneRuler();\r\n        syncZone();\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p2","label":"BON(비트판정)","title":"PLC BON 명령어 비트 판정","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-BON(%EB%B9%84%ED%8A%B8%ED%8C%90%EC%A0%95).html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC BON 명령어 비트 판정 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        /* 검은색 테두리 테마 */\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.9);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.8rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 10px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n        }\r\n\r\n        .bit-cell {\r\n            transition: all 0.2s;\r\n            cursor: pointer;\r\n            border: 2px solid #000000;\r\n        }\r\n\r\n        .bit-cell.on {\r\n            background-color: #2563eb;\r\n            color: white;\r\n        }\r\n\r\n        .bit-cell.target {\r\n            background-color: #fbbf24;\r\n            border: 4px solid #000000;\r\n            transform: scale(1.05);\r\n            z-index: 10;\r\n        }\r\n\r\n        .bit-cell.target.on {\r\n            background-color: #ef4444;\r\n            /* 타겟 비트가 ON일 때 강조 */\r\n        }\r\n\r\n        .result-display {\r\n            background-color: #ffffff;\r\n            border: 4px solid #000000;\r\n            box-shadow: 8px 8px 0px #000000;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        input[type=\"number\"] {\r\n            border: 3px solid #000000;\r\n            outline: none;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-7xl mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header: BON 명령어 카드 -->\r\n        <div class=\"glass-header p-6 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-3xl font-black text-black\">BON(P) 비트 판정<\/h1>\r\n                <p class=\"text-sm font-bold text-slate-600 mt-1\">지정한 데이터(s)의 n번째 비트가 ON인지 체크하여 결과(d)에 저장<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-10 py-6 flex items-center gap-6 font-mono text-3xl\">\r\n                <span class=\"text-slate-400 font-black\">BON(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">1<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">대상(s)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"target-n-label\">5<\/span>\r\n                    <span class=\"param-label\">위치(n)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">M0<\/span>\r\n                    <span class=\"param-label\">결과(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Grid -->\r\n        <div class=\"flex-1 flex p-6 gap-6 overflow-hidden\">\r\n\r\n            <!-- Left: Bit Simulator -->\r\n            <div class=\"w-2/3 flex flex-col gap-6\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-6 flex-1 flex flex-col\">\r\n                    <div class=\"flex justify-between items-center mb-6\">\r\n                        <h3 class=\"text-xl font-black text-black flex items-center gap-3\">\r\n                            <div class=\"w-4 h-4 bg-blue-600 border-2 border-black rounded-full\"><\/div>\r\n                            D10 데이터 비트 모니터링\r\n                        <\/h3>\r\n                        <div class=\"flex items-center gap-4\">\r\n                            <label class=\"font-black text-sm text-slate-700\">판정할 비트 번호 (n):<\/label>\r\n                            <input type=\"number\" id=\"n-input\" value=\"5\" min=\"0\" max=\"15\" oninput=\"update()\"\r\n                                class=\"w-20 py-2 text-center text-xl font-black rounded-lg\">\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <!-- 16-Bit Grid -->\r\n                    <div id=\"bit-grid\" class=\"grid grid-cols-8 gap-4 flex-1 content-center\">\r\n                        <!-- JS Dynamic bits -->\r\n                    <\/div>\r\n\r\n                    <div class=\"mt-6 flex justify-between items-center bg-black p-5 rounded-xl\">\r\n                        <div>\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1\">Decimal Value<\/div>\r\n                            <div class=\"text-3xl font-black text-white\" id=\"dec-val\">0<\/div>\r\n                        <\/div>\r\n                        <div class=\"text-right\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1\">Target Status<\/div>\r\n                            <div class=\"text-2xl font-black text-yellow-400\" id=\"target-status\">D10.5 = OFF<\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right: Test Result & Code -->\r\n            <div class=\"w-1/3 flex flex-col gap-6\">\r\n\r\n                <!-- Result Panel -->\r\n                <div\r\n                    class=\"result-display rounded-2xl p-8 flex-1 flex flex-col items-center justify-center text-center\">\r\n                    <h3 class=\"text-slate-500 font-black text-sm uppercase tracking-widest mb-4\">판정 결과 (M0)<\/h3>\r\n                    <div id=\"res-lamp\"\r\n                        class=\"w-32 h-32 rounded-full border-8 border-black shadow-inner flex items-center justify-center mb-6 bg-slate-200\">\r\n                        <span id=\"res-text\" class=\"text-2xl font-black text-slate-400\">OFF<\/span>\r\n                    <\/div>\r\n                    <div class=\"text-4xl font-black text-black\" id=\"res-binary\">M0 = 0<\/div>\r\n                <\/div>\r\n\r\n                <!-- ST Code Section -->\r\n                <div class=\"code-block rounded-2xl p-6 flex-1 shadow-lg\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">BON(P)<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[1.05rem] leading-relaxed text-blue-100\">\r\n<span class=\"comment\">// D10의 <span id=\"code-n\">5<\/span>번째 비트 확인<\/span>\r\n<span class=\"var\">D10<\/span> := <span id=\"code-dec\">0<\/span>;\r\n\r\n<span class=\"comment\">// 비트 ON 판정 실행<\/span>\r\nBON(1, <span class=\"var\">D10<\/span>, <span id=\"code-n2\">5<\/span>, <span class=\"var\">M0<\/span>);\r\n\r\n<span class=\"comment\">// 결과 확인<\/span>\r\n<span class=\"comment\">// IF M0 THEN ...<\/span>\r\n                <\/pre>\r\n                <\/div>\r\n            <\/div>\r\n\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let bits = new Array(16).fill(0);\r\n\r\n        function init() {\r\n            const grid = document.getElementById('bit-grid');\r\n            grid.innerHTML = '';\r\n            for (let i = 15; i >= 0; i--) {\r\n                const div = document.createElement('div');\r\n                div.className = `bit-cell bg-white rounded-xl h-20 flex flex-col items-center justify-center font-black`;\r\n                div.id = `bit-${i}`;\r\n                div.onclick = () => { bits[i] = bits[i] ? 0 : 1; update(); };\r\n                div.innerHTML = `<span class=\"text-[0.65rem] text-slate-400 mb-1\">b${i}<\/span><span class=\"text-2xl val\">0<\/span>`;\r\n                grid.appendChild(div);\r\n            }\r\n            update();\r\n        }\r\n\r\n        function update() {\r\n            const nInput = document.getElementById('n-input');\r\n            let n = parseInt(nInput.value);\r\n            if (n < 0) n = 0; if (n > 15) n = 15;\r\n            nInput.value = n;\r\n\r\n            document.getElementById('target-n-label').innerText = n;\r\n            document.getElementById('code-n').innerText = n;\r\n            document.getElementById('code-n2').innerText = n;\r\n\r\n            let decimal = 0;\r\n            for (let i = 0; i < 16; i++) {\r\n                const el = document.getElementById(`bit-${i}`);\r\n                el.classList.remove('on', 'target');\r\n                el.querySelector('.val').innerText = bits[i];\r\n\r\n                if (bits[i]) {\r\n                    el.classList.add('on');\r\n                    decimal += Math.pow(2, i);\r\n                }\r\n                if (i === n) el.classList.add('target');\r\n            }\r\n\r\n            const isTargetOn = bits[n] === 1;\r\n            const lamp = document.getElementById('res-lamp');\r\n            const resText = document.getElementById('res-text');\r\n            const resBinary = document.getElementById('res-binary');\r\n            const statusText = document.getElementById('target-status');\r\n\r\n            if (isTargetOn) {\r\n                lamp.style.backgroundColor = '#ef4444';\r\n                lamp.style.boxShadow = '0 0 20px rgba(239, 68, 68, 0.6)';\r\n                resText.innerText = 'ON';\r\n                resText.style.color = '#ffffff';\r\n                resBinary.innerText = 'M0 = 1';\r\n                statusText.innerText = `D10.${n} = ON`;\r\n                statusText.style.color = '#ef4444';\r\n            } else {\r\n                lamp.style.backgroundColor = '#e2e8f0';\r\n                lamp.style.boxShadow = 'none';\r\n                resText.innerText = 'OFF';\r\n                resText.style.color = '#94a3b8';\r\n                resBinary.innerText = 'M0 = 0';\r\n                statusText.innerText = `D10.${n} = OFF`;\r\n                statusText.style.color = '#fbbf24';\r\n            }\r\n\r\n            document.getElementById('dec-val').innerText = decimal.toLocaleString();\r\n            document.getElementById('code-dec').innerText = decimal;\r\n        }\r\n\r\n        window.onload = init;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p3","label":"DATE&TIME","title":"DATE & TIME-PLC 시간 제어 마스터","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-DATE%26TIME.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>DATE & TIME-PLC 시간 제어 마스터 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <script src=\"https://unpkg.com/lucide@latest\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');\r\n        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap');\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #f1f5f9;\r\n        }\r\n\r\n        .zodd-card {\r\n            background: white;\r\n            border: 4px solid #000;\r\n            border-radius: 24px;\r\n            box-shadow: 8px 8px 0px #000;\r\n        }\r\n\r\n        .pointer-box {\r\n            background: #1e293b;\r\n            color: #3b82f6;\r\n            border: 3px solid #3b82f6;\r\n            border-radius: 12px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n        }\r\n\r\n        .tab-btn {\r\n            border-bottom: 4px solid transparent;\r\n            transition: 0.2s;\r\n            white-space: nowrap;\r\n            font-size: 0.9rem;\r\n            padding: 8px 12px;\r\n        }\r\n\r\n        .tab-btn.active {\r\n            border-bottom-color: #2563eb;\r\n            color: #2563eb;\r\n            font-weight: 900;\r\n            background: rgba(37, 99, 235, 0.05);\r\n        }\r\n\r\n        .op-select-btn {\r\n            border: 3px solid #000;\r\n            transition: all 0.2s;\r\n            position: relative;\r\n            overflow: hidden;\r\n            height: 72px;\r\n            text-align: left;\r\n            padding: 0 15px;\r\n            cursor: pointer;\r\n        }\r\n\r\n        .op-select-btn .btn-main-label {\r\n            font-size: 1.15rem;\r\n            font-weight: 900;\r\n            display: block;\r\n        }\r\n\r\n        .op-select-btn .btn-sub-label {\r\n            font-size: 0.75rem;\r\n            font-weight: 700;\r\n            opacity: 0.6;\r\n        }\r\n\r\n        .op-select-btn.active {\r\n            background: #2563eb !important;\r\n            color: white !important;\r\n            transform: scale(1.02);\r\n            z-index: 20;\r\n            box-shadow: 4px 4px 0px #000;\r\n        }\r\n\r\n        .op-select-btn.active .btn-sub-label {\r\n            color: rgba(255, 255, 255, 0.85);\r\n        }\r\n\r\n        .clock-display {\r\n            background: #0f172a;\r\n            border: 4px solid #334155;\r\n            border-radius: 20px;\r\n            padding: 16px 20px;\r\n            color: #60a5fa;\r\n            text-align: center;\r\n            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);\r\n        }\r\n\r\n        .clock-time {\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 2.5rem;\r\n            font-weight: 800;\r\n            text-shadow: 0 0 15px rgba(96, 165, 250, 0.5);\r\n            line-height: 1.1;\r\n        }\r\n\r\n        .clock-date {\r\n            font-size: 0.85rem;\r\n            color: #94a3b8;\r\n            font-weight: 700;\r\n            margin-bottom: 4px;\r\n            letter-spacing: 0.05em;\r\n        }\r\n\r\n        .data-input {\r\n            width: 100%;\r\n            background: transparent;\r\n            text-align: center;\r\n            font-weight: 900;\r\n            font-size: 1.3rem;\r\n            outline: none;\r\n            border: none;\r\n            color: #1e293b;\r\n        }\r\n\r\n        input::-webkit-outer-spin-button,\r\n        input::-webkit-inner-spin-button {\r\n            -webkit-appearance: none;\r\n            margin: 0;\r\n        }\r\n\r\n        .ud-btn {\r\n            background: #000;\r\n            color: #fff;\r\n            width: 30px;\r\n            height: 26px;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            border-radius: 6px;\r\n            font-size: 0.7rem;\r\n            transition: all 0.1s;\r\n            cursor: pointer;\r\n            user-select: none;\r\n        }\r\n\r\n        .ud-btn:hover {\r\n            background: #334155;\r\n        }\r\n\r\n        .ud-btn:active {\r\n            transform: scale(0.92);\r\n        }\r\n\r\n        .st-syntax-large {\r\n            background: #020617;\r\n            border-left: 8px solid #2563eb;\r\n            padding: 16px;\r\n            border-radius: 14px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 1.35rem;\r\n            font-weight: 800;\r\n            color: #38bdf8;\r\n            margin-bottom: 16px;\r\n            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);\r\n            line-height: 1.3;\r\n            word-break: break-all;\r\n        }\r\n\r\n        .st-code-box {\r\n            background: #000;\r\n            border: 1px solid #334155;\r\n            padding: 14px;\r\n            border-radius: 12px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 0.85rem;\r\n            color: #f472b6;\r\n            line-height: 1.6;\r\n        }\r\n\r\n        .lamp {\r\n            width: 18px;\r\n            height: 18px;\r\n            border-radius: 50%;\r\n            border: 2px solid #000;\r\n            background: #cbd5e1;\r\n            transition: all 0.2s;\r\n            display: inline-block;\r\n        }\r\n\r\n        .lamp.on {\r\n            background: #22c55e;\r\n            box-shadow: 0 0 12px #22c55e;\r\n        }\r\n\r\n        .lamp.red {\r\n            background: #ef4444;\r\n            box-shadow: 0 0 12px #ef4444;\r\n        }\r\n\r\n        .lamp.yellow {\r\n            background: #eab308;\r\n            box-shadow: 0 0 12px #eab308;\r\n        }\r\n\r\n        .memo-textarea {\r\n            width: 100%;\r\n            background: #1e293b;\r\n            border: 2px solid #334155;\r\n            border-radius: 16px;\r\n            padding: 16px;\r\n            color: #f8fafc;\r\n            font-size: 0.95rem;\r\n            line-height: 1.6;\r\n            outline: none;\r\n            resize: none;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .memo-textarea:focus {\r\n            border-color: #2563eb;\r\n            background: #0f172a;\r\n        }\r\n\r\n        .save-indicator {\r\n            font-size: 0.7rem;\r\n            color: #22c55e;\r\n            font-weight: 800;\r\n            opacity: 0;\r\n            transition: opacity 0.3s;\r\n        }\r\n\r\n        .save-indicator.show {\r\n            opacity: 1;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar {\r\n            width: 6px;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar-thumb {\r\n            background: #cbd5e1;\r\n            border-radius: 10px;\r\n        }\r\n\r\n        .pulse-view {\r\n            height: 60px;\r\n            background: #1e293b;\r\n            border-radius: 12px;\r\n            border: 3px solid #000;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            position: relative;\r\n            overflow: hidden;\r\n            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);\r\n        }\r\n\r\n        .pulse-bar {\r\n            position: absolute;\r\n            left: 0;\r\n            top: 0;\r\n            bottom: 0;\r\n            background: linear-gradient(90deg, #2563eb, #38bdf8);\r\n            transition: width 0.15s linear;\r\n        }\r\n\r\n        .reg-highlight {\r\n            animation: highlightPulse 1.2s ease-out;\r\n        }\r\n\r\n        @keyframes highlightPulse {\r\n            0% {\r\n                transform: scale(1.02);\r\n                background-color: #dbeafe;\r\n                border-color: #2563eb;\r\n            }\r\n\r\n            100% {\r\n                transform: scale(1);\r\n                background-color: white;\r\n                border-color: black;\r\n            }\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4 h-screen flex flex-col overflow-hidden\">\r\n\r\n    <!-- Header -->\r\n    <div class=\"zodd-card p-4 flex justify-between items-center mb-4\">\r\n        <div class=\"flex items-center gap-4\">\r\n            <div class=\"bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg border-2 border-black\">\r\n                <i data-lucide=\"clock\" size=\"30\"><\/i>\r\n            <\/div>\r\n            <div>\r\n                <h1 class=\"text-3xl font-black uppercase tracking-tighter text-slate-800\">\r\n                    PLC <span class=\"text-blue-600\">날짜 & 시간<\/span> 마스터\r\n                <\/h1>\r\n                <p class=\"text-xs font-bold text-slate-400 uppercase tracking-widest text-blue-600\">\r\n                    통합 RTC 및 시간 연산 엔진 (Zodd Ver.)\r\n                <\/p>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"flex items-center gap-4\">\r\n            <div\r\n                class=\"pointer-box px-6 py-2.5 text-center border-4 border-black min-w-[260px] shadow-[4px_4px_0px_#000]\">\r\n                <span class=\"text-[0.65rem] font-black block opacity-70 uppercase tracking-tight text-slate-300\">\r\n                    PLC 시스템 실시간 모니터 (RTC)\r\n                <\/span>\r\n                <span id=\"header-clock\" class=\"text-xl font-black text-cyan-400 uppercase tracking-tight font-mono\">\r\n                    2026.00.00 00:00:00 (일)\r\n                <\/span>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- 4-Column Layout -->\r\n    <div class=\"flex-1 flex gap-4 overflow-hidden\">\r\n\r\n        <!-- Col 1: Command Selection (18%) -->\r\n        <div class=\"w-[18%] flex flex-col gap-4\">\r\n            <div class=\"zodd-card p-5 flex flex-col h-full shadow-[6px_6px_0px_#000]\">\r\n                <h3 class=\"text-xs font-black text-slate-400 uppercase mb-3 border-b-2 pb-2 flex items-center gap-2\">\r\n                    <i data-lucide=\"zap\" size=\"14\"><\/i> 명령어 선택\r\n                <\/h3>\r\n                <div class=\"space-y-2 flex-1 overflow-y-auto custom-scrollbar pr-1\">\r\n                    <button onclick=\"selectOp('DATERD')\" id=\"btn-DATERD\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between active\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">DATERD<\/span>\r\n                            <span class=\"btn-sub-label\">시계 데이터 읽기<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('DATEWR')\" id=\"btn-DATEWR\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">DATEWR<\/span>\r\n                            <span class=\"btn-sub-label\">시계 데이터 쓰기<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('TIME2SEC')\" id=\"btn-TIME2SEC\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">TIME2SEC<\/span>\r\n                            <span class=\"btn-sub-label\">시분초 → 초 변환<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('SEC2TIME')\" id=\"btn-SEC2TIME\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">SEC2TIME<\/span>\r\n                            <span class=\"btn-sub-label\">초 → 시분초 역변환<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('TCMP')\" id=\"btn-TCMP\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">TCMP<\/span>\r\n                            <span class=\"btn-sub-label\">시간 데이터 비교<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('DUTY')\" id=\"btn-DUTY\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">DUTY<\/span>\r\n                            <span class=\"btn-sub-label\">타이밍 펄스 발생<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('TIMCHK')\" id=\"btn-TIMCHK\"\r\n                        class=\"op-select-btn bg-white w-full rounded-xl flex items-center justify-between\">\r\n                        <div>\r\n                            <span class=\"btn-main-label\">TIMCHK<\/span>\r\n                            <span class=\"btn-sub-label\">시간 계측 / 타이머<\/span>\r\n                        <\/div>\r\n                    <\/button>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 2: Live Monitor (32%) -->\r\n        <div class=\"w-[32%] flex flex-col gap-4 relative\">\r\n            <div class=\"zodd-card p-6 flex-1 flex flex-col shadow-[10px_10px_0px_#000] overflow-hidden relative\">\r\n                <div class=\"flex justify-between items-end mb-4 border-b-2 border-slate-100 pb-3\">\r\n                    <div>\r\n                        <span class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest block\">상태\r\n                            모니터<\/span>\r\n                        <h2 id=\"status-display\" class=\"text-2xl font-black text-slate-800 tracking-tight\">\r\n                            DATERD 대기 중\r\n                        <\/h2>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div id=\"sim-content\" class=\"flex-1 flex flex-col gap-4 overflow-y-auto custom-scrollbar pr-2\">\r\n                    <!-- Dynamic Content will be injected here -->\r\n                <\/div>\r\n\r\n                <div class=\"mt-4 flex gap-3\">\r\n                    <button type=\"button\" onclick=\"undo()\"\r\n                        class=\"flex-1 bg-slate-800 hover:bg-black text-white h-14 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-base flex items-center justify-center gap-2 transition-all\">\r\n                        <i data-lucide=\"rotate-ccw\" size=\"18\"><\/i> 되돌리기\r\n                    <\/button>\r\n                    <button type=\"button\" onclick=\"executeAction()\" id=\"exec-btn\"\r\n                        class=\"flex-[1.5] bg-blue-600 hover:bg-blue-700 text-white h-14 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-lg flex items-center justify-center gap-2 transition-all\">\r\n                        <i data-lucide=\"play-circle\" size=\"22\" fill=\"white\"><\/i> <span id=\"exec-text\">실행<\/span>\r\n                    <\/button>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 3: Handbook (25%) -->\r\n        <div class=\"w-[25%] flex flex-col overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-6 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] overflow-hidden border-2 border-slate-700\">\r\n                <div class=\"flex items-center gap-3 mb-4 border-b border-slate-700 pb-3\">\r\n                    <i data-lucide=\"book-open\" class=\"text-pink-500\"><\/i>\r\n                    <h3 class=\"text-lg font-black uppercase tracking-widest\">기술 매뉴얼<\/h3>\r\n                    <div id=\"save-status\" class=\"save-indicator ml-auto\">저장 완료!<\/div>\r\n                <\/div>\r\n\r\n                <div id=\"hb-content\" class=\"space-y-4 flex-1 overflow-y-auto custom-scrollbar pr-2\"><\/div>\r\n\r\n                <div class=\"mt-4 p-4 bg-blue-950/60 border-2 border-blue-500/40 rounded-2xl\">\r\n                    <p class=\"text-xs font-bold text-blue-200 leading-relaxed flex items-start gap-2\">\r\n                        <i data-lucide=\"award\" size=\"16\" class=\"text-yellow-400 shrink-0 mt-0.5\"><\/i>\r\n                        <span id=\"hb-tip\">PLC 내부의 RTC 정보를 다루는 명령어입니다.<\/span>\r\n                    <\/p>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 4: Notepads (25%) -->\r\n        <div class=\"w-[25%] flex flex-col gap-4 overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-6 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] border-emerald-500\">\r\n                <div class=\"mb-4 flex-1 flex flex-col\">\r\n                    <div class=\"flex items-center gap-2 mb-2 text-emerald-400 border-b border-emerald-900/50 pb-2\">\r\n                        <i data-lucide=\"clipboard-list\" size=\"18\"><\/i>\r\n                        <h3 class=\"text-base font-black uppercase\">전체 메모<\/h3>\r\n                    <\/div>\r\n                    <textarea id=\"global-memo\" class=\"memo-textarea flex-1 border-emerald-900/50\"\r\n                        placeholder=\"프로젝트 전체 시간 제어 특이사항...\"><\/textarea>\r\n                <\/div>\r\n                <div class=\"flex-1 flex flex-col pt-3 border-t border-slate-800\">\r\n                    <div class=\"flex items-center gap-2 mb-2 text-blue-400\">\r\n                        <i data-lucide=\"pencil-line\" size=\"18\"><\/i>\r\n                        <h3 id=\"memo-title\" class=\"text-base font-black uppercase\">DATERD 메모<\/h3>\r\n                    <\/div>\r\n                    <textarea id=\"op-memo\" class=\"memo-textarea flex-1 border-blue-900/50\"\r\n                        placeholder=\"명령어 개별 기록...\"><\/textarea>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        // 요일 한국어 명칭\r\n        const DOW_NAMES = ['일', '월', '화', '수', '목', '금', '토'];\r\n\r\n        let currentOp = 'DATERD';\r\n\r\n        // 시뮬레이션용 PLC 내부 RTC 오프셋 (DATEWR로 시간 설정 시 반영)\r\n        let clockOffsetMs = 0;\r\n\r\n        function getSimulatedTime() {\r\n            return new Date(Date.now() + clockOffsetMs);\r\n        }\r\n\r\n        // DATERD: 읽기 저장 레지스터 D10 ~ D16\r\n        let rtcMemory = { year: 2026, month: 10, day: 22, hour: 17, min: 30, sec: 0, dow: 4 };\r\n\r\n        // DATEWR: 설정 데이터 레지스터 D20 ~ D26\r\n        let editRTC = { year: 2026, month: 10, day: 22, hour: 12, min: 0, sec: 0 };\r\n\r\n        // TIME2SEC 입력\r\n        let time2secInput = { hour: 15, min: 30, sec: 45 };\r\n\r\n        // SEC2TIME 입력\r\n        let totalSeconds = 55845;\r\n\r\n        // TCMP 목표 시간\r\n        let tcmpTime = { hour: 18, min: 0, sec: 0 };\r\n\r\n        // DUTY 펄스 설정\r\n        let dutySettings = { on: 5, total: 10 };\r\n        let dutyPhase = 0;\r\n        let isDutyRunning = false;\r\n\r\n        // TIMCHK 시간 계측 설정\r\n        let timchkStart = null;\r\n        let timchkElapsed = 0; // 0.1초 (100ms) 단위 카운트\r\n        let isTimerRunning = false;\r\n\r\n        // 실행 취소 히스토리\r\n        let history = [];\r\n\r\n        // 메모 데이터\r\n        let memoData = {\r\n            DATERD: '',\r\n            DATEWR: '',\r\n            TIME2SEC: '',\r\n            SEC2TIME: '',\r\n            TCMP: '',\r\n            DUTY: '',\r\n            TIMCHK: '',\r\n            global: ''\r\n        };\r\n\r\n        const manual = {\r\n            DATERD: {\r\n                title: \"DATERD (Read Clock Data)\",\r\n                syntax: \"DATERD(EN, d);\",\r\n                desc: \"PLC CPU 내장 시계(RTC)로부터 현재 연, 월, 일, 시, 분, 초, 요일을 읽어 지정된 레지스터(d)에 7워드로 저장합니다.\",\r\n                operands: \"(d): 읽기 결과 저장 선두 (D10~D16: 연/월/일/시/분/초/요일)\",\r\n                st: \"DATERD(SM400, D10); // 상시 읽기 실행\",\r\n                tip: \"실행(EN) 시점의 시스템 시계를 레지스터(D10~D16)로 캡처하여 저장합니다.\"\r\n            },\r\n            DATEWR: {\r\n                title: \"DATEWR (Write Clock Data)\",\r\n                syntax: \"DATEWR(EN, s);\",\r\n                desc: \"지정된 7워드 레지스터(s)의 연, 월, 일, 시, 분, 초 데이터를 PLC 내장 시계(RTC)에 강제 설정합니다.\",\r\n                operands: \"(s): 설정 데이터 선두 (D20~D26: 연/월/일/시/분/초/요일)\",\r\n                st: \"DATEWR(M0, D20); // M0 펄스 시 시계 동기화 쓰기\",\r\n                tip: \"HMI 등에서 수정한 설정값을 PLC 내장 시계(RTC)에 즉시 덮어씁니다.\"\r\n            },\r\n            TIME2SEC: {\r\n                title: \"TIME2SEC (Time to Seconds)\",\r\n                syntax: \"TIME2SEC(EN, s, d);\",\r\n                desc: \"연속된 3워드(시, 분, 초) 시간 데이터를 32비트 누적 초(Total Seconds)로 변환합니다.\",\r\n                operands: \"(s): 시분초 입력 선두 / (d): 32비트 초 출력 (D40)\",\r\n                st: \"TIME2SEC(SM400, D10, D40); // D10(시), D11(분), D12(초) → D40(초)\",\r\n                tip: \"공정 가동 시간 비교 또는 주기 계산 시 초 단위로 환산하여 활용합니다.\"\r\n            },\r\n            SEC2TIME: {\r\n                title: \"SEC2TIME (Seconds to Time)\",\r\n                syntax: \"SEC2TIME(EN, s, d);\",\r\n                desc: \"누적 초(Seconds) 데이터를 시(Hour), 분(Min), 초(Sec) 3워드로 역변환합니다.\",\r\n                operands: \"(s): 누적 초 입력 (D100) / (d): 시분초 저장 선두 (D10~D12)\",\r\n                st: \"SEC2TIME(SM400, D100, D10); // D100(초) → D10(시), D11(분), D12(초)\",\r\n                tip: \"초 단위로 누적된 카운터를 HMI 화면에 시:분:초 형태로 표시할 때 사용합니다.\"\r\n            },\r\n            TCMP: {\r\n                title: \"TCMP (Time Compare)\",\r\n                syntax: \"TCMP(EN, s1, s2, s3, s, d);\",\r\n                desc: \"목표 시각(s1:시, s2:분, s3:초)과 기준 시각(s)을 비교하여 3개 연속 비트(d+0: 작음, d+1: 일치, d+2: 큼)를 출력합니다.\",\r\n                operands: \"(s1~s3): 목표 시분초 / (s): 현재 시각 선두 / (d): 결과 비트 (M10~M12)\",\r\n                st: \"TCMP(SM400, 18, 0, 0, D13, M10); // 18:00:00 비교 결과 M10, M11, M12\",\r\n                tip: \"목표 시간 도래 여부(M10: 지남, M11: 일치, M12: 도래전)를 비트로 자동 판정합니다.\"\r\n            },\r\n            DUTY: {\r\n                title: \"DUTY (Timing Pulse Generator)\",\r\n                syntax: \"DUTY(EN, n1, n2, d);\",\r\n                desc: \"지정된 ON 시간(n1)과 1사이클 전체 주기(n2)에 맞추어 주기적인 타이밍 펄스를 출력합니다.\",\r\n                operands: \"(n1): ON 시간 / (n2): 전체 주기 / (d): 출력 비트 (M20)\",\r\n                st: \"DUTY(SM400, 5, 10, M20); // 5초 ON, 5초 OFF (10초 주기)\",\r\n                tip: \"플리커 타이머 대신 한 줄로 듀티비(점멸비)를 손쉽게 구현합니다.\"\r\n            },\r\n            TIMCHK: {\r\n                title: \"TIMCHK (Time Check / Measurement)\",\r\n                syntax: \"TIMCHK(EN, s, d);\",\r\n                desc: \"기준 신호 발생 이후 경과된 시간을 0.1초(100ms) 단위로 측정하여 레지스터(d)에 저장합니다.\",\r\n                operands: \"(s): 기준 데이터 / (d): 경과 시간 저장 (D200, 0.1초 단위)\",\r\n                st: \"TIMCHK(M0, D10, D200); // M0 기동 후 경과시간 측정\",\r\n                tip: \"센서 감지 구간 또는 실린더 전/후진 이동 시간을 정밀하게 계측합니다.\"\r\n            }\r\n        };\r\n\r\n        // 안전한 Lucide 아이콘 렌더링\r\n        function safeCreateIcons() {\r\n            if (window.lucide && typeof lucide.createIcons === 'function') {\r\n                lucide.createIcons();\r\n            }\r\n        }\r\n\r\n        function selectOp(op) {\r\n            currentOp = op;\r\n            document.querySelectorAll('.op-select-btn').forEach(b => b.classList.remove('active'));\r\n            const btn = document.getElementById(`btn-${op}`);\r\n            if (btn) btn.classList.add('active');\r\n\r\n            const status = document.getElementById('status-display');\r\n            if (status) status.innerText = `${op} 대기 중`;\r\n\r\n            const memoTitle = document.getElementById('memo-title');\r\n            if (memoTitle) memoTitle.innerText = `${op} 메모`;\r\n\r\n            const opMemo = document.getElementById('op-memo');\r\n            if (opMemo) opMemo.value = memoData[op] || '';\r\n\r\n            // 버튼 텍스트 설정\r\n            const execText = document.getElementById('exec-text');\r\n            if (execText) {\r\n                if (op === 'DUTY') execText.innerText = isDutyRunning ? \"펄스 중지\" : \"펄스 시작\";\r\n                else if (op === 'TIMCHK') execText.innerText = isTimerRunning ? \"타이머 중지\" : \"타이머 시작\";\r\n                else execText.innerText = \"실행\";\r\n            }\r\n\r\n            updateHandbook();\r\n            renderSimulation();\r\n        }\r\n\r\n        // --- 시뮬레이션 영역 렌더링 ---\r\n        function renderSimulation() {\r\n            const container = document.getElementById('sim-content');\r\n            if (!container) return;\r\n\r\n            const now = getSimulatedTime();\r\n            let html = '';\r\n\r\n            switch (currentOp) {\r\n                case 'DATERD':\r\n                    html = `\r\n                        <div class=\"clock-display\">\r\n                            <div class=\"clock-date\">PLC 내장 RTC 실시간 시계<\/div>\r\n                            <div id=\"sim-live-time\" class=\"clock-time text-yellow-400\">\r\n                                ${formatDate(now)}<br/>\r\n                                <span class=\"text-3xl text-cyan-400\">${formatTime(now)}<\/span>\r\n                                <span class=\"text-lg text-slate-400 ml-2\">(${DOW_NAMES[now.getDay()]}요일)<\/span>\r\n                            <\/div>\r\n                        <\/div>\r\n\r\n                        <div class=\"p-3 bg-blue-50 border-2 border-dashed border-blue-400 rounded-xl flex items-center justify-between text-xs font-bold text-blue-900\">\r\n                            <span>⬇️ [실행] 버튼 클릭 시 현재 RTC → D10~D16 레지스터로 읽어옵니다.<\/span>\r\n                            <span class=\"bg-blue-600 text-white px-2 py-0.5 rounded\">DATERD<\/span>\r\n                        <\/div>\r\n\r\n                        <div>\r\n                            <div class=\"flex justify-between items-center mb-2 px-1\">\r\n                                <span class=\"text-xs font-black text-slate-500 uppercase\">읽기 데이터 레지스터 (D10~D16)<\/span>\r\n                                <span class=\"text-[0.7rem] font-bold text-slate-400\">7워드 저장<\/span>\r\n                            <\/div>\r\n                            <div class=\"grid grid-cols-2 gap-3\" id=\"daterd-regs\">\r\n                                ${renderReadOnlyReg(10, '연도 (Year)', rtcMemory.year)}\r\n                                ${renderReadOnlyReg(13, '시 (Hour)', pad(rtcMemory.hour))}\r\n                                ${renderReadOnlyReg(11, '월 (Month)', pad(rtcMemory.month))}\r\n
