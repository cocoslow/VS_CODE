-black rounded-lg\">START (X0\r\n                                ON)<\/button>\r\n                            <button onclick=\"resetRamp()\"\r\n                                class=\"btn-action bg-white text-black px-6 py-2 font-black rounded-lg\">RESET<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <!-- SVG Graph Area -->\r\n                    <div class=\"flex-1 bg-white border-2 border-black rounded-xl relative overflow-hidden\">\r\n                        <svg id=\"ramp-graph\" width=\"100%\" height=\"100%\" viewBox=\"0 0 500 300\"\r\n                            preserveAspectRatio=\"none\">\r\n                            <line x1=\"0\" y1=\"250\" x2=\"500\" y2=\"250\" stroke=\"#e2e8f0\" stroke-width=\"1\" />\r\n                            <line x1=\"50\" y1=\"0\" x2=\"50\" y2=\"300\" stroke=\"#e2e8f0\" stroke-width=\"1\" />\r\n                            <path id=\"ramp-path\" d=\"M 50,250 L 450,50\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"4\"\r\n                                stroke-dasharray=\"10,5\" />\r\n                            <path id=\"active-path\" d=\"M 50,250\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"6\" />\r\n                            <circle id=\"ramp-dot\" cx=\"50\" cy=\"250\" r=\"10\" fill=\"#ef4444\" stroke=\"#000\"\r\n                                stroke-width=\"3\" />\r\n                            <text x=\"30\" y=\"275\" font-weight=\"900\" font-size=\"14\">D0 (Start)<\/text>\r\n                            <text x=\"430\" y=\"35\" font-weight=\"900\" font-size=\"14\">D2 (End)<\/text>\r\n                        <\/svg>\r\n                    <\/div>\r\n\r\n                    <!-- NEW: Time to Steps Calculator -->\r\n                    <div\r\n                        class=\"bg-indigo-50 border-2 border-indigo-200 rounded-xl p-4 mt-4 flex items-center justify-between\">\r\n                        <div class=\"flex items-center gap-3\">\r\n                            <span class=\"calc-badge\">TIME CALC<\/span>\r\n                            <div class=\"flex flex-col\">\r\n                                <span class=\"text-[0.6rem] font-black text-indigo-400 uppercase tracking-tighter\">Target\r\n                                    Reach Time<\/span>\r\n                                <div class=\"flex items-center gap-1\">\r\n                                    <input type=\"number\" id=\"calc-sec\" value=\"3\" oninput=\"calculateSteps()\"\r\n                                        class=\"w-12 bg-transparent text-xl font-black text-indigo-700 focus:outline-none\">\r\n                                    <span class=\"font-black text-indigo-700\">초 동안 상승<\/span>\r\n                                <\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                        <div class=\"text-indigo-300 font-black\">X<\/div>\r\n                        <div class=\"flex flex-col items-center\">\r\n                            <span class=\"text-[0.6rem] font-black text-indigo-400 uppercase\">Scan Time<\/span>\r\n                            <span class=\"text-sm font-black text-indigo-700\">10ms (고정)<\/span>\r\n                        <\/div>\r\n                        <div class=\"text-indigo-300 font-black\">=<\/div>\r\n                        <div class=\"flex flex-col items-end\">\r\n                            <span class=\"text-[0.6rem] font-black text-indigo-400 uppercase\">Set n to:<\/span>\r\n                            <span id=\"calc-result\" class=\"text-2xl font-black text-indigo-700\">300<\/span>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"grid grid-cols-3 gap-4 mt-4\">\r\n                        <div class=\"bg-white p-3 rounded-lg border-2 border-black\">\r\n                            <label class=\"text-[0.65rem] font-bold text-slate-400 uppercase\">Start (s1)<\/label>\r\n                            <input type=\"number\" id=\"input-s1\" value=\"0\"\r\n                                class=\"text-2xl font-black w-full outline-none\">\r\n                        <\/div>\r\n                        <div class=\"bg-white p-3 rounded-lg border-2 border-black\">\r\n                            <label class=\"text-[0.65rem] font-bold text-slate-400 uppercase\">End (s2)<\/label>\r\n                            <input type=\"number\" id=\"input-s2\" value=\"1000\"\r\n                                class=\"text-2xl font-black w-full outline-none\">\r\n                        <\/div>\r\n                        <div class=\"bg-white p-3 rounded-lg border-2 border-black border-indigo-500\">\r\n                            <label class=\"text-[0.65rem] font-bold text-indigo-400 uppercase\">Steps (n)<\/label>\r\n                            <input type=\"number\" id=\"input-n\" value=\"300\" oninput=\"updateLabels()\"\r\n                                class=\"text-2xl font-black w-full outline-none text-indigo-600\">\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right: Results -->\r\n            <div class=\"w-2/5 flex flex-col gap-4\">\r\n                <div class=\"result-display rounded-2xl p-6 flex flex-col\">\r\n                    <h3 class=\"text-sm font-black text-slate-500 uppercase mb-5 tracking-widest\">Device Monitoring<\/h3>\r\n                    <div class=\"space-y-4\">\r\n                        <div class=\"flex justify-between items-center bg-slate-50 p-4 rounded-xl border-2 border-black\">\r\n                            <span class=\"font-black text-slate-700\">출력값 [D10]<\/span>\r\n                            <span id=\"curr-val\" class=\"text-4xl font-black text-blue-600\">0<\/span>\r\n                        <\/div>\r\n                        <div class=\"flex justify-between items-center bg-slate-50 p-4 rounded-xl border-2 border-black\">\r\n                            <span class=\"font-black text-slate-700\">현재 스캔 [(d1)+1]<\/span>\r\n                            <span id=\"curr-step\" class=\"text-2xl font-black text-slate-600\">0<\/span>\r\n                        <\/div>\r\n                        <div class=\"flex justify-between items-center p-4 rounded-xl border-2 border-black\"\r\n                            id=\"comp-box\">\r\n                            <span class=\"font-black text-slate-700\">완료 비트 [M0]<\/span>\r\n                            <span id=\"comp-bit\" class=\"text-2xl font-black text-slate-400\">OFF<\/span>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"bg-blue-50 rounded-2xl p-6 border-2 border-blue-200 flex-1\">\r\n                    <h3 class=\"text-sm font-black text-blue-800 uppercase mb-3 tracking-widest flex items-center gap-2\">\r\n                        <span class=\"text-xl\">🦾<\/span> 시간 제어 핵심 정리\r\n                    <\/h3>\r\n                    <p class=\"text-[0.8rem] font-bold text-blue-900 leading-relaxed\">\r\n                        조드님, 이 명령어는 <span class=\"text-red-600\">\"시간\"<\/span>이 아니라 <span class=\"text-red-600\">\"스캔\r\n                            횟수\"<\/span>로 동작해요!<br><br>\r\n                        1. <b>10ms 스캔 기준<\/b>으로 계산하세요.<br>\r\n                        2. <b>1초<\/b>를 원하면 n = <b>100<\/b><br>\r\n                        3. <b>3초<\/b>를 원하면 n = <b>300<\/b><br>\r\n                        4. <b>10초<\/b>를 원하면 n = <b>1000<\/b><br><br>\r\n                        이렇게 넣으면 기계가 부드럽게 가속합니다.\r\n                    <\/p>\r\n                <\/div>\r\n\r\n                <!-- Code Block -->\r\n                <div class=\"code-block rounded-2xl p-5 shadow-lg flex flex-col\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">RAMPQ<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[0.8rem] leading-relaxed text-blue-100\">\r\n<span class=\"comment\">// 3초 동안 0에서 1000까지 증가 (스캔 10ms 기준)<\/span>\r\nRAMPQ(<span class=\"var\">X0<\/span>, 0, 1000, <span class=\"var\">D10<\/span>, 300, <span class=\"var\">M0<\/span>);<\/pre>\r\n                <\/div>\r\n            <\/div>\r\n\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let isRunning = false;\r\n        let currentStep = 0;\r\n        let timer = null;\r\n\r\n        function calculateSteps() {\r\n            const sec = parseFloat(document.getElementById('calc-sec').value) || 0;\r\n            // PLC 스캔 타임 10ms 가정: 1초당 100스캔\r\n            const steps = Math.round(sec * 100);\r\n            document.getElementById('calc-result').innerText = steps;\r\n            document.getElementById('input-n').value = steps;\r\n            updateLabels();\r\n        }\r\n\r\n        function updateLabels() {\r\n            const n = document.getElementById('input-n').value;\r\n            document.getElementById('label-n').innerText = n;\r\n            resetRamp();\r\n        }\r\n\r\n        function startRamp() {\r\n            if (isRunning) return;\r\n            resetRamp();\r\n            isRunning = true;\r\n\r\n            const s1 = parseInt(document.getElementById('input-s1').value) || 0;\r\n            const s2 = parseInt(document.getElementById('input-s2').value) || 0;\r\n            const n = parseInt(document.getElementById('input-n').value) || 1;\r\n\r\n            const stepVal = (s2 - s1) / n;\r\n            const dot = document.getElementById('ramp-dot');\r\n            const activePath = document.getElementById('active-path');\r\n            const compBox = document.getElementById('comp-box');\r\n            const compBit = document.getElementById('comp-bit');\r\n\r\n            // 실제 PLC 스캔타임(10ms)을 흉내내어 10ms마다 갱신\r\n            timer = setInterval(() => {\r\n                currentStep++;\r\n                let currentVal = s1 + (stepVal * currentStep);\r\n\r\n                if (currentStep >= n) {\r\n                    currentVal = s2;\r\n                    clearInterval(timer);\r\n                    isRunning = false;\r\n                    compBox.style.backgroundColor = '#ecfdf5';\r\n                    compBox.style.borderColor = '#10b981';\r\n                    compBit.innerText = \"ON (DONE)\";\r\n                    compBit.style.color = \"#059669\";\r\n                }\r\n\r\n                document.getElementById('curr-val').innerText = Math.round(currentVal);\r\n                document.getElementById('curr-step').innerText = currentStep;\r\n\r\n                const x = 50 + (currentStep / n) * 400;\r\n                const y = 250 - ((currentVal - s1) / (s2 - s1)) * 200;\r\n                dot.setAttribute('cx', x);\r\n                dot.setAttribute('cy', y);\r\n\r\n                const d = activePath.getAttribute('d');\r\n                activePath.setAttribute('d', `${d} L ${x},${y}`);\r\n\r\n            }, 10);\r\n        }\r\n\r\n        function resetRamp() {\r\n            clearInterval(timer);\r\n            isRunning = false;\r\n            currentStep = 0;\r\n            document.getElementById('curr-val').innerText = document.getElementById('input-s1').value;\r\n            document.getElementById('curr-step').innerText = \"0\";\r\n            document.getElementById('comp-box').style.backgroundColor = 'transparent';\r\n            document.getElementById('comp-box').style.borderColor = '#000';\r\n            document.getElementById('comp-bit').innerText = \"OFF\";\r\n            document.getElementById('comp-bit').style.color = \"#94a3b8\";\r\n\r\n            const dot = document.getElementById('ramp-dot');\r\n            dot.setAttribute('cx', 50);\r\n            dot.setAttribute('cy', 250);\r\n            document.getElementById('active-path').setAttribute('d', 'M 50,250');\r\n        }\r\n\r\n        window.onload = calculateSteps;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p9","label":"ROR n비트 우 로테이션","title":"PLC ROR 명령어 비트 로테이션","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-ROR_n%EB%B9%84%ED%8A%B8_%EC%9A%B0_%EB%A1%9C%ED%85%8C%EC%9D%B4%EC%85%98.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC ROR 명령어 비트 로테이션 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.95);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.8rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 10px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n            border: 1px solid #000000;\r\n        }\r\n\r\n        /* 비트 박스 스타일 (SFR 스타일 계승) */\r\n        .bit-group-container {\r\n            display: flex;\r\n            gap: 0;\r\n            border: 3px solid #000;\r\n            background: #fff;\r\n            width: fit-content;\r\n            position: relative;\r\n        }\r\n\r\n        .nibble-group {\r\n            display: flex;\r\n            border-right: 3px solid #000;\r\n        }\r\n\r\n        .nibble-group:last-child {\r\n            border-right: none;\r\n        }\r\n\r\n        .unit-box {\r\n            width: 52px;\r\n            height: 65px;\r\n            display: flex;\r\n            flex-direction: column;\r\n            align-items: center;\r\n            justify-content: center;\r\n            position: relative;\r\n            border-left: 2px dashed #94a3b8;\r\n            z-index: 10;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .unit-box:first-child {\r\n            border-left: none;\r\n        }\r\n\r\n        .unit-label {\r\n            position: absolute;\r\n            top: -28px;\r\n            left: 50%;\r\n            transform: translateX(-50%);\r\n            font-size: 0.75rem;\r\n            font-weight: 800;\r\n            color: #64748b;\r\n            white-space: nowrap;\r\n        }\r\n\r\n        .unit-value {\r\n            font-size: 1.6rem;\r\n            font-weight: 900;\r\n            user-select: none;\r\n        }\r\n\r\n        .interactive .unit-box:hover {\r\n            background: #f8fafc;\r\n            cursor: pointer;\r\n        }\r\n\r\n        .interactive .unit-box.on {\r\n            background: #eff6ff;\r\n            color: #2563eb;\r\n        }\r\n\r\n        .result-view .unit-box {\r\n            background: #f8fafc;\r\n            opacity: 0.7;\r\n        }\r\n\r\n        .result-view .unit-box.on {\r\n            color: #94a3b8;\r\n            border-bottom: 4px solid #cbd5e1;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        .btn-shift {\r\n            border: 3px solid #000;\r\n            box-shadow: 4px 4px 0px #000;\r\n            transition: all 0.1s;\r\n            cursor: pointer;\r\n        }\r\n\r\n        .btn-shift:active {\r\n            transform: translate(2px, 2px);\r\n            box-shadow: 1px 1px 0px #000;\r\n        }\r\n\r\n        /* 화살표 SVG 레이어 */\r\n        #shift-overlay {\r\n            position: absolute;\r\n            top: 0;\r\n            left: 0;\r\n            width: 100%;\r\n            height: 100%;\r\n            pointer-events: none;\r\n            z-index: 100;\r\n        }\r\n\r\n        .shift-arrow-path {\r\n            fill: none;\r\n            stroke: #2563eb;\r\n            stroke-width: 2;\r\n            stroke-dasharray: 4, 4;\r\n            animation: dash 15s linear infinite;\r\n            opacity: 0.5;\r\n            transition: d 0.4s cubic-bezier(0.4, 0, 0.2, 1);\r\n        }\r\n\r\n        .arrow-to-carry {\r\n            stroke: #ef4444;\r\n            stroke-width: 2.5;\r\n            opacity: 0.8;\r\n        }\r\n\r\n        @keyframes dash {\r\n            to {\r\n                stroke-dashoffset: -1000;\r\n            }\r\n        }\r\n\r\n        .sm700-box {\r\n            border: 4px solid #ef4444;\r\n            background: #fef2f2;\r\n            box-shadow: 4px 4px 0px #ef4444;\r\n            transition: all 0.3s;\r\n        }\r\n\r\n        .ud-btn {\r\n            background: #fff;\r\n            border: 2px solid #000;\r\n            padding: 1px 6px;\r\n            font-weight: bold;\r\n            transition: 0.1s;\r\n            line-height: 1;\r\n            font-size: 0.6rem;\r\n        }\r\n\r\n        .ud-btn:hover {\r\n            background: #000;\r\n            color: #fff;\r\n        }\r\n\r\n        .view-area {\r\n            width: 100%;\r\n            padding-top: 35px;\r\n            display: flex;\r\n            justify-content: center;\r\n            position: relative;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-[1450px] mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header: RORP(EN, n, d) -->\r\n        <div class=\"glass-header p-6 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-3xl font-black text-black\">ROR(P) n비트 오른쪽 로테이션<\/h1>\r\n                <p class=\"text-sm font-bold text-slate-600 mt-1\">데이터(d)를 오른쪽으로 n비트 회전시키고, 마지막 비트를 SM700에 저장<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-10 py-6 flex items-center gap-6 font-mono text-2xl\">\r\n                <span class=\"text-slate-400 font-black\">ROR(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">1<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"label-n\">1<\/span>\r\n                    <span class=\"param-label\">개수(n)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">대상(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content -->\r\n        <div class=\"flex-1 flex p-6 gap-6 overflow-hidden relative\">\r\n\r\n            <!-- Left: Simulator -->\r\n            <div class=\"w-[68%] flex flex-col gap-6 justify-center\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-8 flex flex-col items-center flex-1 relative\">\r\n                    <div class=\"w-full flex justify-between items-center mb-8\">\r\n                        <h3 class=\"text-xl font-black text-black flex items-center gap-3\">\r\n                            <div class=\"w-4 h-4 bg-blue-600 border-2 border-black rounded-full\"><\/div>\r\n                            D10 비트 로테이션 동적 추적\r\n                        <\/h3>\r\n                        <div class=\"flex items-center gap-4\">\r\n                            <div class=\"flex items-center gap-3 bg-white px-3 py-1 border-2 border-black rounded-xl\">\r\n                                <label class=\"text-[0.6rem] font-black text-slate-400 uppercase\">Rotate (n):<\/label>\r\n                                <input type=\"number\" id=\"n-input\" value=\"1\" min=\"0\" max=\"15\" oninput=\"updateLabels()\"\r\n                                    class=\"w-12 text-center text-xl font-black outline-none text-blue-600\">\r\n                                <div class=\"flex flex-col gap-1\">\r\n                                    <button onclick=\"stepN(1)\" class=\"ud-btn\">▲<\/button>\r\n                                    <button onclick=\"stepN(-1)\" class=\"ud-btn\">▼<\/button>\r\n                                <\/div>\r\n                            <\/div>\r\n                            <button onclick=\"executeRotate()\"\r\n                                class=\"btn-shift bg-blue-600 text-white px-8 py-3 font-black rounded-lg uppercase\">Rotate<\/button>\r\n                            <button onclick=\"resetBits()\"\r\n                                class=\"btn-shift bg-white text-black px-8 py-3 font-black rounded-lg\">초기화<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"flex-1 w-full flex flex-col justify-center gap-12 relative\" id=\"simulator-viewport\">\r\n                        <svg id=\"shift-overlay\">\r\n                            <defs>\r\n                                <marker id=\"arrowhead-blue\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\"\r\n                                    orient=\"auto\">\r\n                                    <polygon points=\"0 0, 8 3, 0 6\" fill=\"#2563eb\" />\r\n                                <\/marker>\r\n                                <marker id=\"arrowhead-red\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\"\r\n                                    orient=\"auto\">\r\n                                    <polygon points=\"0 0, 8 3, 0 6\" fill=\"#ef4444\" />\r\n                                <\/marker>\r\n                            <\/defs>\r\n                            <g id=\"arrows-container\"><\/g>\r\n                        <\/svg>\r\n\r\n                        <!-- Original Row -->\r\n                        <div class=\"flex flex-col items-center w-full\">\r\n                            <div class=\"text-[0.6rem] font-black text-slate-400 uppercase mb-4 tracking-widest\">Original\r\n                                Data [D10] (Click Bits)<\/div>\r\n                            <div class=\"view-area\">\r\n                                <div id=\"grid-before\" class=\"bit-group-container interactive\"><\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n\r\n                        <div class=\"flex justify-center h-4\">\r\n                            <div class=\"text-3xl text-slate-200\">⬇️<\/div>\r\n                        <\/div>\r\n\r\n                        <!-- Result Row -->\r\n                        <div class=\"flex flex-col items-center w-full\">\r\n                            <div class=\"text-[0.6rem] font-black text-blue-300 uppercase mb-4 tracking-widest\">Rotated\r\n                                Result (Expected)<\/div>\r\n                            <div class=\"view-area\">\r\n                                <div id=\"grid-after\" class=\"bit-group-container result-view\"><\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"mt-8 w-full flex justify-between items-center bg-black p-5 rounded-xl\">\r\n                        <div class=\"text-white\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1\">Decimal Value<\/div>\r\n                            <div class=\"text-3xl font-black\" id=\"dec-val\">0<\/div>\r\n                        <\/div>\r\n                        <div class=\"text-right\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1\">Rotate Type<\/div>\r\n                            <div class=\"text-2xl font-black text-yellow-400 uppercase\">Circular Right Rotate<\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right Column -->\r\n            <div class=\"w-[32%] flex flex-col gap-6\">\r\n                <div id=\"sm700-card\"\r\n                    class=\"sm700-box rounded-2xl p-8 flex flex-col items-center justify-center text-center\">\r\n                    <h3 class=\"text-red-600 font-black text-sm uppercase tracking-widest mb-4\">마지막 로테이션 비트 (SM700)<\/h3>\r\n                    <div id=\"carry-lamp\"\r\n                        class=\"w-36 h-36 rounded-2xl border-4 border-black flex items-center justify-center bg-white mb-6\">\r\n                        <span id=\"carry-val\" class=\"text-7xl font-black text-slate-200\">0<\/span>\r\n                    <\/div>\r\n                    <p class=\"text-slate-600 font-bold text-sm leading-relaxed\">회전되어 넘어간 비트 중<br><span\r\n                            class=\"text-red-600 font-black\">가장 마지막 비트<\/span>가 저장됩니다.<\/p>\r\n                <\/div>\r\n\r\n                <div class=\"code-block rounded-2xl p-6 flex-1 shadow-lg flex flex-col\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">ROR(P)<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[1rem] leading-relaxed text-blue-100 flex-1 overflow-y-auto\">\r\n<span class=\"comment\">// D10을 오른쪽으로 <span id=\"code-n\">1<\/span>비트 회전<\/span>\r\n<span class=\"var\">D10<\/span> := <span id=\"code-dec\">0<\/span>;\r\n\r\n<span class=\"comment\">// 로테이션 실행<\/span>\r\nRORP(1, <span id=\"code-n2\">1<\/span>, <span class=\"var\">D10<\/span>);\r\n\r\n<span class=\"comment\">// 결과 확인:\r\n// b0 데이터가 b15로 이동됨\r\n// 마지막 이동 비트 -> SM700<\/span><\/pre>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let bits = new Array(16).fill(0);\r\n        // 초기 샘플: b0, b13 ON\r\n        bits[0] = 1; bits[13] = 1;\r\n\r\n        function init() {\r\n            renderGrid('grid-before', bits, true);\r\n            renderGrid('grid-after', new Array(16).fill(0), false);\r\n            updateLabels();\r\n            updateDecimal();\r\n            setTimeout(drawAllArrows, 200);\r\n        }\r\n\r\n        function renderGrid(targetId, bitArray, interactive) {\r\n            const container = document.getElementById(targetId);\r\n            container.innerHTML = '';\r\n            for (let group = 3; group >= 0; group--) {\r\n                const groupDiv = document.createElement('div');\r\n                groupDiv.className = 'nibble-group';\r\n                for (let b = 3; b >= 0; b--) {\r\n                    const bitIdx = group * 4 + b;\r\n                    const div = document.createElement('div');\r\n                    div.className = `unit-box bit-node-${bitIdx} ${bitArray[bitIdx] ? 'on' : ''}`;\r\n                    div.innerHTML = `<span class=\"unit-label\">b${bitIdx}<\/span><span class=\"unit-value\">${bitArray[bitIdx]}<\/span>`;\r\n                    if (interactive) {\r\n                        div.onclick = () => {\r\n                            bits[bitIdx] = bits[bitIdx] ? 0 : 1;\r\n                            renderGrid('grid-before', bits, true);\r\n                            updateDecimal();\r\n                            drawAllArrows();\r\n                        };\r\n                    }\r\n                    groupDiv.appendChild(div);\r\n                }\r\n                container.appendChild(groupDiv);\r\n            }\r\n        }\r\n\r\n        function stepN(delta) {\r\n            const input = document.getElementById('n-input');\r\n            let val = parseInt(input.value) + delta;\r\n            if (val < 0) val = 15; if (val > 15) val = 0;\r\n            input.value = val;\r\n            updateLabels();\r\n        }\r\n\r\n        function drawAllArrows() {\r\n            const n = parseInt(document.getElementById('n-input').value) || 0;\r\n            const container = document.getElementById('arrows-container');\r\n            const overlay = document.getElementById('shift-overlay');\r\n            const sm700 = document.getElementById('carry-lamp');\r\n            container.innerHTML = '';\r\n            const rectOverlay = overlay.getBoundingClientRect();\r\n            const sm700Rect = sm700.getBoundingClientRect();\r\n\r\n            bits.forEach((on, i) => {\r\n                if (!on) return;\r\n                const fromEl = document.querySelector(`#grid-before .bit-node-${i}`);\r\n                if (!fromEl) return;\r\n                const fromRect = fromEl.getBoundingClientRect();\r\n                const x1 = fromRect.left + fromRect.width / 2 - rectOverlay.left;\r\n                const y1 = fromRect.top + fromRect.height / 2 - rectOverlay.top;\r\n\r\n                // 목적지 인덱스 계산 (오른쪽으로 n칸 회전)\r\n                const targetIdx = (i - n + 16) % 16;\r\n                const toEl = document.querySelector(`#grid-after .bit-node-${targetIdx}`);\r\n                if (!toEl) return;\r\n                const toRect = toEl.getBoundingClientRect();\r\n                const x2 = toRect.left + toRect.width / 2 - rectOverlay.left;\r\n                const y2 = toRect.top + toRect.height / 2 - rectOverlay.top;\r\n\r\n                // 일반 경로 (파란색)\r\n                const path = document.createElementNS(\"http://www.w3.org/2000/svg\", \"path\");\r\n                path.className.baseVal = \"shift-arrow-path\";\r\n                const cpY = y1 + (y2 - y1) * (targetIdx > i ? 0.8 : 0.5); // 넘아가는 경로면 더 굽게\r\n                const d = `M ${x1},${y1} C ${x1},${cpY} ${x2},${cpY} ${x2},${y2}`;\r\n                path.setAttribute('d', d);\r\n                path.setAttribute('marker-end', 'url(#arrowhead-blue)');\r\n                container.appendChild(path);\r\n\r\n                // 캐리 플래그 경로 (n번째 회전 비트가 SM700으로 감)\r\n                // n=1일때 b0, n=6일때 b5 가 SM700\r\n                if (i === (n - 1 + 16) % 16 && n > 0) {\r\n                    const cPath = document.createElementNS(\"http://www.w3.org/2000/svg\", \"path\");\r\n                    cPath.className.baseVal = \"shift-arrow-path arrow-to-carry\";\r\n                    const cx2 = sm700Rect.left + sm700Rect.width / 2 - rectOverlay.left;\r\n                    const cy2 = sm700Rect.top + sm700Rect.height / 2 - rectOverlay.top;\r\n                    cPath.setAttribute('d', `M ${x1},${y1} Q ${x1},${cy2} ${cx2},${cy2}`);\r\n                    cPath.setAttribute('marker-end', 'url(#arrowhead-red)');\r\n                    container.appendChild(cPath);\r\n                }\r\n            });\r\n        }\r\n\r\n        function executeRotate() {\r\n            const n = parseInt(document.getElementById('n-input').value) || 0;\r\n            // 로테이션 로직\r\n            const newBits = new Array(16);\r\n            for (let i = 0; i < 16; i++) {\r\n                newBits[(i - n + 16) % 16] = bits[i];\r\n            }\r\n\r\n            // SM700 판정 (가장 마지막에 넘어간 비트 = 원래 위치 b(n-1))\r\n            const carry = n > 0 ? bits[n - 1] : 0;\r\n\r\n            renderGrid('grid-after', newBits, false);\r\n\r\n            const carryLamp = document.getElementById('carry-lamp');\r\n            const carryVal = document.getElementById('carry-val');\r\n            carryVal.innerText = carry;\r\n            if (carry) {\r\n                carryLamp.style.backgroundColor = '#ef4444';\r\n                carryVal.style.color = '#ffffff';\r\n            } else {\r\n                carryLamp.style.backgroundColor = '#ffffff';\r\n                carryVal.style.color = '#cbd5e1';\r\n            }\r\n        }\r\n\r\n        function updateLabels() {\r\n            const nInput = document.getElementById('n-input');\r\n            let n = parseInt(nInput.value);\r\n            if (isNaN(n)) n = 0; if (n > 15) n = 15; if (n < 0) n = 0;\r\n            nInput.value = n;\r\n            document.getElementById('label-n').innerText = n;\r\n            document.getElementById('code-n').innerText = n;\r\n            document.getElementById('code-n2').innerText = n;\r\n            drawAllArrows();\r\n        }\r\n\r\n        function updateDecimal() {\r\n            let dec = 0;\r\n            for (let i = 0; i < 16; i++) { if (bits[i]) dec += Math.pow(2, i); }\r\n            document.getElementById('dec-val').innerText = dec;\r\n            document.getElementById('code-dec').innerText = dec;\r\n        }\r\n\r\n        function resetBits() {\r\n            bits = new Array(16).fill(0);\r\n            init();\r\n            const carryLamp = document.getElementById('carry-lamp');\r\n            carryLamp.style.backgroundColor = '#ffffff';\r\n            document.getElementById('carry-val').innerText = \"0\";\r\n            document.getElementById('carry-val').style.color = '#cbd5e1';\r\n        }\r\n\r\n        window.onload = init;\r\n        window.onresize = drawAllArrows;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p10","label":"ROTC 로터리 테이블","title":"PLC ROTC 명령어 로터리 테이블 제어","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-ROTC_%EB%A1%9C%ED%84%B0%EB%A6%AC_%ED%85%8C%EC%9D%B4%EB%B8%94.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC ROTC 명령어 로터리 테이블 제어 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        /* 조드 스타일: 검은색 테두리 강렬한 테마 */\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.95);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.75rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 8px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n            border: 1px solid #000000;\r\n            white-space: nowrap;\r\n        }\r\n\r\n        /* 테이블 애니메이션 속도 조절 (3.0s) */\r\n        .rotary-table {\r\n            transition: transform 3s cubic-bezier(0.34, 1.56, 0.64, 1);\r\n            transform-origin: center;\r\n        }\r\n\r\n        .lamp {\r\n            width: 20px;\r\n            height: 20px;\r\n            border: 2px solid #000000;\r\n            border-radius: 50%;\r\n            background: #e2e8f0;\r\n        }\r\n\r\n        .lamp.on {\r\n            background: #22c55e;\r\n            box-shadow: 0 0 10px #22c55e;\r\n        }\r\n\r\n        .lamp.on.red {\r\n            background: #ef4444;\r\n            box-shadow: 0 0 10px #ef4444;\r\n        }\r\n\r\n        .result-display {\r\n            background-color: #ffffff;\r\n            border: 4px solid #000000;\r\n            box-shadow: 8px 8px 0px #000000;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        /* 가이드 뱃지 */\r\n        .guide-badge {\r\n            font-size: 0.65rem;\r\n            font-weight: 900;\r\n            padding: 2px 6px;\r\n            border-radius: 4px;\r\n            border: 1px solid #000;\r\n        }\r\n\r\n        /* 업/다운 버튼 스타일 */\r\n        .ud-btn {\r\n            border: 2px solid #000;\r\n            background: #fff;\r\n            padding: 2px 8px;\r\n            font-size: 0.7rem;\r\n            font-weight: bold;\r\n            transition: 0.1s;\r\n        }\r\n\r\n        .ud-btn:active {\r\n            background: #000;\r\n            color: #fff;\r\n        }\r\n\r\n        /* 숫자 버튼 그리드 스타일 */\r\n        .num-btn {\r\n            border: 1px solid #000;\r\n            background: #fff;\r\n            font-size: 0.7rem;\r\n            font-weight: 900;\r\n            padding: 4px 0;\r\n            border-radius: 4px;\r\n            transition: 0.1s;\r\n        }\r\n\r\n        .num-btn.active {\r\n            background: #7c3aed;\r\n            color: #fff;\r\n            border-width: 2px;\r\n        }\r\n\r\n        .num-btn:hover:not(.active) {\r\n            background: #f3f4f6;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-7xl mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header: ROTC 명령어 카드 -->\r\n        <div class=\"glass-header p-5 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-2xl font-black text-black\">ROTC(P) 로터리 테이블 제어<\/h1>\r\n                <p class=\"text-[0.8rem] font-bold text-slate-600 mt-1\">목표 위치까지 근거리(가장 빠른 방향)를 자동 판정하여 제어<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-8 py-4 flex items-center gap-4 font-mono text-xl\">\r\n                <span class=\"text-slate-400 font-black\">ROTC(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">1<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">테이블정보(s)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"label-n1\">10<\/span>\r\n                    <span class=\"param-label\">분할수(n1)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"label-n2\">2<\/span>\r\n                    <span class=\"param-label\">저속구간(n2)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">M10<\/span>\r\n                    <span class=\"param-label\">출력신호(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content: 레이아웃 비율 조정 (원판 크기를 위해 왼쪽을 더 넓게 6:4) -->\r\n        <div class=\"flex-1 flex p-4 gap-6 overflow-hidden\">\r\n\r\n            <!-- Left Column: 시각적 설명 (60%) -->\r\n            <div class=\"w-[60%] flex flex-col gap-4\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-4 flex-1 flex flex-col items-center\">\r\n                    <div class=\"w-full flex justify-between items-center mb-2\">\r\n                        <h3 class=\"text-lg font-black text-black\">물리적 구조 이해 (확대 모드)<\/h3>\r\n                    <\/div>\r\n\r\n                    <!-- SVG Rotary Table (크기 2배 확대: viewBox 400x400) -->\r\n                    <div class=\"flex-1 flex items-center justify-center relative w-full h-full\">\r\n                        <svg width=\"450\" height=\"450\" viewBox=\"0 0 400 400\" class=\"max-w-full max-h-full\">\r\n                            <g id=\"stations-layer\"><\/g>\r\n                            <!-- 타겟 표시 프레임 -->\r\n                            <rect id=\"active-station-rect\" x=\"180\" y=\"5\" width=\"40\" height=\"40\" fill=\"none\"\r\n                                stroke=\"#ef4444\" stroke-width=\"4\" stroke-dasharray=\"4,2\" />\r\n\r\n                            <!-- 회전 원판 (Radii doubled) -->\r\n                            <g id=\"table-group\" class=\"rotary-table\">\r\n                                <circle cx=\"200\" cy=\"200\" r=\"150\" fill=\"#f8fafc\" stroke=\"#000\" stroke-width=\"4\" />\r\n                                <g id=\"table-items\"><\/g>\r\n                            <\/g>\r\n                            <circle cx=\"200\" cy=\"200\" r=\"10\" fill=\"#000\" />\r\n                        <\/svg>\r\n                    <\/div>\r\n\r\n                    <!-- 개념 정리 카드 -->\r\n                    <div class=\"grid grid-cols-2 gap-4 mt-4 w-full\">\r\n                        <div class=\"bg-blue-50 p-3 rounded-xl border-2 border-blue-200\">\r\n                            <div class=\"flex items-center gap-2 mb-2\">\r\n                                <span class=\"guide-badge bg-blue-600 text-white\">s+1<\/span>\r\n                                <span class=\"font-black text-xs\">창구 번호 (목적지)<\/span>\r\n                            <\/div>\r\n                            <div class=\"flex items-center gap-2\">\r\n                                <input type=\"number\" id=\"target-station\" value=\"0\" min=\"0\" max=\"9\" readonly\r\n                                    class=\"text-3xl font-black w-1/2 bg-transparent outline-none\">\r\n                                <div class=\"flex flex-col gap-1\">\r\n                                    <button onclick=\"changeStation(1)\" class=\"ud-btn text-lg\">▲<\/button>\r\n                                    <button onclick=\"changeStation(-1)\" class=\"ud-btn text-lg\">▼<\/button>\r\n                                <\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n\r\n                        <div class=\"bg-purple-50 p-3 rounded-xl border-2 border-purple-200\">\r\n                            <div class=\"flex items-center gap-2 mb-2\">\r\n                                <span class=\"guide-badge bg-purple-600 text-white\">s+2<\/span>\r\n                                <span class=\"font-black text-xs\">물품 번호 (이름표)<\/span>\r\n                            <\/div>\r\n                            <div id=\"item-btn-grid\" class=\"grid grid-cols-5 gap-1.5\">\r\n                                <!-- 0-9 버튼 동적 생성 -->\r\n                            <\/div>\r\n                            <input type=\"hidden\" id=\"target-item\" value=\"5\">\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right Column: 로직 및 코드 (40%) -->\r\n            <div class=\"w-[40%] flex flex-col gap-4\">\r\n                <div class=\"result-display rounded-2xl p-6 flex flex-col\">\r\n                    <h3 class=\"text-sm font-black text-slate-500 uppercase mb-4 tracking-widest flex justify-between\">\r\n                        제어 신호 상태 <span>D10 현재: <b id=\"curr-pos-val\" class=\"text-blue-600\">0<\/b><\/span>\r\n                    <\/h3>\r\n                    <div class=\"grid grid-cols-1 gap-3\">\r\n                        <div\r\n                            class=\"flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200\">\r\n                            <span class=\"text-xs font-bold\">회전 방향 판정 (근거리)<\/span>\r\n                            <span id=\"dir-text\" class=\"text-base font-black text-blue-600\">정지<\/span>\r\n                        <\/div>\r\n                        <div class=\"grid grid-cols-1 gap-3\">\r\n                            <div class=\"flex items-center justify-between border-b pb-2\">\r\n                                <span class=\"text-[0.75rem] font-bold\">고속 정회전<\/span>\r\n                                <div id=\"lamp-m13\" class=\"lamp\"><\/div>\r\n                            <\/div>\r\n                            <div class=\"flex items-center justify-between border-b pb-2\">\r\n                                <span class=\"text-[0.75rem] font-bold\">정지 상태<\/span>\r\n                                <div id=\"lamp-m15\" class=\"lamp on\"><\/div>\r\n                            <\/div>\r\n                            <div class=\"flex items-center justify-between border-b pb-2\">\r\n                                <span class=\"text-[0.75rem] font-bold\">고속 역회전<\/span>\r\n                                <div id=\"lamp-m17\" class=\"lamp\"><\/div>\r\n                            <\/div>\r\n                            <div class=\"flex items-center justify-between border-b pb-2\">\r\n                                <span class=\"text-[0.75rem] font-bold text-red-600\">0점 (Home)<\/span>\r\n                                <div id=\"lamp-m12\" class=\"lamp red\"><\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <!-- Code Block -->\r\n                <div class=\"code-block rounded-2xl p-6 flex-1 shadow-lg overflow-hidden flex flex-col\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">ROTC Control<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[1rem] leading-relaxed text-blue-100 flex-1 overflow-y-auto\">\r\n<span class=\"comment\">// s+1: 목적지 창구 번호<\/span>\r\n<span class=\"var\">D11<\/span> := <span id=\"code-s1\">0<\/span>; \r\n\r\n<span class=\"comment\">// s+2: 옮길 물품 번호<\/span>\r\n<span class=\"var\">D12<\/span> := <span id=\"code-s2\">5<\/span>; \r\n\r\n<span class=\"comment\">// 자동 근거리 제어 실행<\/span>\r\nROTC(1, <span class=\"var\">D10<\/span>, 10, 2, <span class=\"var\">M10<\/span>);\r\n                <\/pre>\r\n                <\/div>\r\n            <\/div>\r\n\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        const n1 = 10;\r\n        let currentItem = 5;\r\n\r\n        function init() {\r\n            const tableItems = document.getElementById('table-items');\r\n            const stationsLayer = document.getElementById('stations-layer');\r\n            const itemBtnGrid = document.getElementById('item-btn-grid');\r\n\r\n            // 창구 레이어 (ST0~ST9) - 좌표값 조정 (r=180)\r\n            for (let i = 0; i < n1; i++) {\r\n                const angle = (i * 360) / n1;\r\n                const rad = (angle - 90) * Math.PI / 180;\r\n                const x = 200 + 180 * Math.cos(rad);\r\n                const y = 200 + 180 * Math.sin(rad);\r\n                stationsLayer.innerHTML += `<text x=\"${x}\" y=\"${y}\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"900\" fill=\"#cbd5e1\">ST${i}<\/text>`;\r\n            }\r\n\r\n            // 물품 레이어 - 좌표값 조정 (r=120)\r\n            for (let i = 0; i < n1; i++) {\r\n                const angle = (i * 360) / n1;\r\n                const rad = (angle - 90) * Math.PI / 180;\r\n                const x = 200 + 120 * Math.cos(rad);\r\n                const y = 200 + 120 * Math.sin(rad);\r\n                tableItems.innerHTML += `\r\n                <line x1=\"200\" y1=\"200\" x2=\"${200 + 150 * Math.cos(rad)}\" y2=\"${200 + 150 * Math.sin(rad)}\" stroke=\"#e2e8f0\" stroke-width=\"2\" />\r\n                <circle cx=\"${x}\" cy=\"${y}\" r=\"16\" fill=\"white\" stroke=\"#000\" stroke-width=\"2\" />\r\n                <text x=\"${x}\" y=\"${y + 5}\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"900\">${i}<\/text>\r\n            `;\r\n            }\r\n\r\n            // 물품 번호 버튼 그리드 생성 (0~9)\r\n            for (let i = 0; i < 10; i++) {\r\n                const btn = document.createElement('button');\r\n                btn.className = `num-btn ${i === currentItem ? 'active' : ''}`;\r\n                btn.innerText = i;\r\n                btn.onclick = () => selectItem(i);\r\n                btn.id = `btn-item-${i}`;\r\n                itemBtnGrid.appendChild(btn);\r\n            }\r\n\r\n            updateAll();\r\n        }\r\n\r\n        function changeStation(delta) {\r\n            const el = document.getElementById('target-station');\r\n            let val = parseInt(el.value) + delta;\r\n            if (val < 0) val = 9;\r\n            if (val > 9) val = 0;\r\n            el.value = val;\r\n            updateAll();\r\n        }\r\n\r\n        function selectItem(num) {\r\n            currentItem = num;\r\n            document.getElementById('target-item').value = num;\r\n            document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('active'));\r\n            document.getElementById(`btn-item-${num}`).classList.add('active');\r\n            updateAll();\r\n        }\r\n\r\n        function updateAll() {\r\n            const s1 = parseInt(document.getElementById('target-station').value) || 0;\r\n            const s2 = currentItem;\r\n\r\n            document.getElementById('code-s1').innerText = s1;\r\n            document.getElementById('code-s2').innerText = s2;\r\n\r\n            // 타겟 스테이션 표시기 이동 (r=176)\r\n            const stAngle = (s1 * 360) / n1;\r\n            const stRad = (stAngle - 90) * Math.PI / 180;\r\n            const rect = document.getElementById('active-station-rect');\r\n            rect.setAttribute('x', 200 + 176 * Math.cos(stRad) - 20);\r\n            rect.setAttribute('y', 200 + 176 * Math.sin(stRad) - 20);\r\n            rect.setAttribute('transform', `rotate(${stAngle}, ${200 + 176 * Math.cos(stRad)}, ${200 + 176 * Math.sin(stRad)})`);\r\n\r\n            // 테이블 회전 로직\r\n            const rotationAngle = (s1 - s2) * (360 / n1);\r\n            document.getElementById('table-group').style.transform = `rotate(${rotationAngle}deg)`;\r\n\r\n            // 램프 및 상태 업데이트\r\n            document.querySelectorAll('.lamp').forEach(l => l.classList.remove('on'));\r\n            const dirText = document.getElementById('dir-text');\r\n\r\n            const diff = (s1 - s2 + n1) % n1;\r\n            if (diff === 0) {\r\n                document.getElementById('lamp-m15').classList.add('on');\r\n                document.getElementById('lamp-m12').classList.add('on');\r\n                dirText.innerText = \"목표 도착 (정지)\";\r\n                dirText.className = \"text-base font-black text-green-600\";\r\n            } else if (diff <= 5) {\r\n                document.getElementById('lamp-m13').classList.add('on');\r\n                dirText.innerText = \"시계 회전 (CW)\";\r\n                dirText.className = \"text-base font-black text-blue-600\";\r\n            } else {\r\n                document.getElementById('lamp-m17').classList.add('on');\r\n                dirText.innerText = \"반시계 회전 (CCW)\";\r\n                dirText.className = \"text-base font-black text-red-600\";\r\n            }\r\n        }\r\n\r\n        window.onload = init;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p11","label":"SCL-스케일링","title":"PLC 핵심 명령어 시뮬레이터 ()","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-SCL-%EC%8A%A4%EC%BC%80%EC%9D%BC%EB%A7%81.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC 핵심 명령어 시뮬레이터 (Zodd Ver.)<\/title>\r\n    <style>\r\n        :root {\r\n            --primary: #2563eb;    /* 조드 비례식 파랑 */\r\n            --secondary: #6366f1;  /* 미쓰비시 보라 */\r\n            --success: #f59e0b;\r\n            --bg: #f1f5f9;\r\n            --panel: #ffffff;\r\n            --code-bg: #1e293b;\r\n            --addr-text: #475569;\r\n            --variable: #ff79c6;   /* 핑크색 변수 */\r\n        }\r\n        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: var(--bg); padding: 15px; color: #334155; margin: 0; }\r\n        \r\n        .container { max-width: 950px; margin: 0 auto; background: var(--panel); padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); box-sizing: border-box; }\r\n        \r\n        /* 탭 디자인 */\r\n        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; }\r\n        .tab-btn { padding: 12px 25px; border: none; background: none; cursor: pointer; font-weight: bold; color: #64748b; border-bottom: 4px solid transparent; transition: all 0.2s; font-size: 1rem; }\r\n        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }\r\n        .tab-btn.mitsu.active { color: var(--secondary); border-bottom-color: var(--secondary); }\r\n        .tab-content { display: none; }\r\n        .tab-content.active { display: block; }\r\n\r\n        h2 { border-left: 6px solid var(--primary); padding-left: 12px; margin-bottom: 25px; font-size: 1.25rem; }\r\n        #mitsu h2 { border-left-color: var(--secondary); }\r\n        \r\n        .section-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }\r\n        .section-title.input { color: var(--primary); }\r\n        .section-title.m-input { color: var(--secondary); }\r\n        .section-title.result { color: #b45309; }\r\n\r\n        .input-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }\r\n        @media (min-width: 768px) { .input-grid { grid-template-columns: 1fr 1fr; } }\r\n\r\n        .input-box { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; position: relative; }\r\n        .input-box label { font-size: 0.85rem; font-weight: bold; color: #64748b; margin-bottom: 12px; display: block; }\r\n        \r\n        .range-inputs { display: flex; align-items: center; gap: 10px; }\r\n        .input-field { flex: 1; display: flex; flex-direction: column; gap: 4px; }\r\n        .input-field input { width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; font-weight: bold; color: var(--primary); box-sizing: border-box; }\r\n        #mitsu .input-field input { color: var(--secondary); }\r\n        .input-field .addr-label { font-family: monospace; font-size: 0.75rem; color: #64748b; text-align: center; background: #f8fafc; border-radius: 4px; padding: 2px 0; border: 1px solid #e2e8f0; }\r\n\r\n        .slider-section { background: #eff6ff; padding: 20px; border-radius: 12px; border: 1px solid #bfdbfe; margin-bottom: 20px; }\r\n        #mitsu .slider-section { background: #f5f3ff; border-color: #ddd6fe; }\r\n        .slider-section label { color: var(--primary); font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.9rem; }\r\n        #mitsu .slider-section label { color: var(--secondary); }\r\n        .slider-section input[type=\"range\"] { width: 100%; height: 8px; border-radius: 5px; cursor: pointer; accent-color: var(--primary); margin: 15px 0; }\r\n        #mitsu .slider-section input[type=\"range\"] { accent-color: var(--secondary); }\r\n        \r\n        .control-group { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px auto 0; max-width: 420px; }\r\n        .action-btn { flex: 1; background-color: white; border: 1.5px solid var(--primary); color: var(--primary); padding: 6px 0; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center; min-width: 70px; }\r\n        #mitsu .action-btn { border-color: var(--secondary); color: var(--secondary); }\r\n        .action-btn:hover { background-color: var(--primary); color: white; }\r\n        #mitsu .action-btn:hover { background-color: var(--secondary); color: white; }\r\n\r\n        .direct-input { width: 110px; padding: 6px; border: 2px solid var(--primary); border-radius: 6px; text-align: center; font-size: 1.1rem; font-weight: bold; color: var(--primary); }\r\n        #mitsu .direct-input { border-color: var(--secondary); color: var(--secondary); }\r\n\r\n        .formula-container { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 20px 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-family: 'Consolas', monospace; font-size: 1rem; color: #475569; display: flex; justify-content: center; align-items: center; gap: 4px; overflow-x: auto; min-height: 90px; }\r\n        .formula-term { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; vertical-align: middle; }\r\n        .formula-term b { color: var(--primary); font-size: 1.1rem; }\r\n        #mitsu .formula-term b { color: var(--secondary); }\r\n        .formula-term i { color: #d97706; font-style: normal; font-weight: bold; font-size: 1.1rem; }\r\n        .formula-term span { font-weight: bold; }\r\n        .formula-term small { font-size: 0.65rem; color: #94a3b8; font-weight: normal; background: #f1f5f9; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }\r\n        .formula-op { font-size: 1.2rem; font-weight: bold; color: #94a3b8; padding: 0 2px; margin-bottom: 18px; }\r\n\r\n        .result-card { display: flex; justify-content: space-around; align-items: center; background: #fdfaff; padding: 30px; border-radius: 15px; border: 2px solid #ddd6fe; text-align: center; }\r\n        .res-item { flex: 1; }\r\n        .res-item .val { font-size: 3rem; font-weight: 900; display: block; }\r\n        .res-item.input .val { color: var(--primary); }\r\n        #mitsu .res-item.input .val { color: var(--secondary); }\r\n        .res-item.output .val { color: #d97706; }\r\n        .res-item .unit { font-size: 0.85rem; font-weight: bold; color: #4338ca; text-transform: uppercase; margin-bottom: 8px; display: block; }\r\n        .arrow { font-size: 2.5rem; color: #818cf8; font-weight: bold; }\r\n\r\n        .code-container { margin-top: 25px; }\r\n        .code-header { background: #334155; color: white; padding: 10px 15px; border-radius: 8px 8px 0 0; font-size: 0.8rem; font-weight: bold; display: flex; justify-content: space-between; }\r\n        .code-block { background: var(--code-bg); color: #e2e8f0; padding: 20px; border-radius: 0 0 8px 8px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.9rem; white-space: pre; overflow-x: auto; line-height: 1.6; border-left: 5px solid var(--primary); }\r\n        #mitsu .code-block { border-left-color: var(--secondary); }\r\n        \r\n        .var { color: var(--variable); font-weight: bold; }\r\n        .comment { color: #6272a4; font-style: italic; }\r\n\r\n        @media (max-width: 600px) {\r\n            .result-card { flex-direction: column; gap: 15px; }\r\n            .arrow { transform: rotate(90deg); margin: 5px 0; }\r\n        }\r\n    <\/style>\r\n<\/head>\r\n<body>\r\n\r\n<div class=\"container\">\r\n    <div class=\"tabs\">\r\n        <button class=\"tab-btn active\" id=\"btn-std\" onclick=\"switchTab('std')\">탭 1: 조드 비례식 (DSCL)<\/button>\r\n        <button class=\"tab-btn mitsu\" id=\"btn-mitsu\" onclick=\"switchTab('mitsu')\">탭 2: 미쓰비시 SCL (좌표 포인트)<\/button>\r\n    <\/div>\r\n\r\n    <!-- 탭 1: 기존 비례식 -->\r\n    <div id=\"std\" class=\"tab-content active\">\r\n        <h2>탭 1: 2포인트 비례식 시뮬레이터 (DSCL)<\/h2>\r\n        <div class=\"section-title input\">● 범위 설정 (설정 데이터 s1)<\/div>\r\n        <div class=\"input-grid\">\r\n            <div class=\"input-box\">\r\n                <label>SOURCE (원본 범위)<\/label>\r\n                <div class=\"range-inputs\">\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D100 [st_ScaleData]<\/div>\r\n                        <input type=\"number\" id=\"s-sMin\" value=\"0\" oninput=\"updateStd()\">\r\n                    <\/div>\r\n                    <span style=\"color:#cbd5e1; font-weight:bold;\">~<\/span>\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D102 (Max)<\/div>\r\n                        <input type=\"number\" id=\"s-sMax\" value=\"8000\" oninput=\"updateStd()\">\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n            <div class=\"input-box\">\r\n                <label>DESTINATION (결과 범위)<\/label>\r\n                <div class=\"range-inputs\">\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D104 (Min)<\/div>\r\n                        <input type=\"number\" id=\"s-dMin\" value=\"0\" oninput=\"updateStd()\">\r\n                    <\/div>\r\n                    <span style=\"color:#cbd5e1; font-weight:bold;\">~<\/span>\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D106 (Max)<\/div>\r\n                        <input type=\"number\" id=\"s-dMax\" value=\"300\" oninput=\"updateStd()\">\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"slider-section\">\r\n            <label>\r\n                <span>현재 입력값 (s2) <span style=\"color:var(--primary); font-size:0.8rem;\">[D10 / i_Analog_Value]<\/span><\/span>\r\n                <input type=\"number\" id=\"s-in-num\" class=\"direct-input\" value=\"2000\" oninput=\"syncStdFromNum()\">\r\n            <\/label>\r\n            <input type=\"range\" id=\"s-in\" min=\"0\" max=\"8000\" value=\"2000\" oninput=\"syncStdFromSlider()\">\r\n            <div class=\"control-group\">\r\n                <button class=\"action-btn\" onclick=\"stdSetMin()\">MIN<\/button>\r\n                <button class=\"action-btn\" onclick=\"stdSetMid()\">중앙값<\/button>\r\n                <button class=\"action-btn\" onclick=\"stdSetZero()\">0 리셋<\/button>\r\n                <button class=\"action-btn\" onclick=\"stdSetMax()\">MAX<\/button>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"section-title result\">● 변환 결과 (DINT 비례 연산)<\/div>\r\n        <div class=\"formula-container\" id=\"std-formula\"><\/div>\r\n        <div class=\"result-card\">\r\n            <div class=\"res-item input\">\r\n                <span class=\"unit\">Input (s2) <span style=\"color:var(--primary); font-size:0.8rem; margin-left:4px;\">[D10]<\/span><\/span>\r\n                <span class=\"val\" id=\"std-res-in\">2000<\/span>\r\n            <\/div>\r\n            <div class=\"arrow\">▶<\/div>\r\n            <div class=\"res-item output\">\r\n                <span class=\"unit\">Scaled (d) <span style=\"color:#d97706; font-size:0.8rem; margin-left:4px;\">[D20]<\/span><\/span>\r\n                <span class=\"val\" id=\"std-res-out\">75<\/span>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"code-container\">\r\n            <div class=\"code-header\"><span>GX Works3 ST Example (DSCL)<\/span><\/div>\r\n            <div class=\"code-block\" id=\"std-code\"><\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- 탭 2: 미쓰비시 포인트 방식 -->\r\n    <div id=\"mitsu\" class=\"tab-content\">\r\n        <h2>탭 2: 미쓰비시 iQ-R 좌표 포인트 스케일링 (2포인트)<\/h2>\r\n        <div class=\"section-title m-input\">● 좌표 포인트 설정 (s2 주소 시작: D22 [st_Table])<\/div>\r\n        <div class=\"input-grid\">\r\n            <div class=\"input-box\" style=\"border-color: var(--secondary);\">\r\n                <label>Point 1 (시작점 Min)<\/label>\r\n                <div class=\"range-inputs\">\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D24 [st_Table[2]]<\/div>\r\n                        <label>X (입력 Min)<\/label>\r\n                        <input type=\"number\" id=\"p1x\" value=\"0\" oninput=\"updateMitsu()\">\r\n                    <\/div>\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D26 [st_Table[4]]<\/div>\r\n                        <label>Y (출력 Min)<\/label>\r\n                        <input type=\"number\" id=\"p1y\" value=\"0\" oninput=\"updateMitsu()\">\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n            <div class=\"input-box\" style=\"border-color: var(--secondary);\">\r\n                <label>Point 2 (종료점 Max)<\/label>\r\n                <div class=\"range-inputs\">\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D28 [st_Table[6]]<\/div>\r\n                        <label>X (입력 Max)<\/label>\r\n                        <input type=\"number\" id=\"p2x\" value=\"4000\" oninput=\"updateMitsu()\">\r\n                    <\/div>\r\n                    <div class=\"input-field\">\r\n                        <div class=\"addr-label\">D30 [st_Table[8]]<\/div>\r\n                        <label>Y (출력 Max)<\/label>\r\n                        <input type=\"number\" id=\"p2y\" value=\"100\" oninput=\"updateMitsu()\">\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"slider-section\">\r\n            <label>\r\n                <span>현재 입력값 (s1) <span style=\"color:var(--secondary); font-size:0.8rem;\">[D10 / i_Raw_Value]<\/span><\/span>\r\n                <input type=\"number\" id=\"m-in-num\" class=\"direct-input\" value=\"2000\" oninput=\"syncMitsuFromNum()\">\r\n            <\/label>\r\n            <input type=\"range\" id=\"m-in\" min=\"0\" max=\"4000\" value=\"2000\" oninput=\"syncMitsuFromSlider()\">\r\n            <div class=\"control-group\">\r\n                <button class=\"action-btn\" onclick=\"mitsuSetMin()\">MIN<\/button>\r\n                <button class=\"action-btn\" onclick=\"mitsuSetMid()\">중앙값<\/button>\r\n                <button class=\"action-btn\" onclick=\"mitsuSetZero()\">0 리셋<\/button>\r\n                <button class=\"action-btn\" onclick=\"mitsuSetMax()\">MAX<\/button>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"section-title result\">● 변환 결과 (좌표 추종 연산)<\/div>\r\n        <div class=\"formula-container\" id=\"mitsu-formula\"><\/div>\r\n        <div class=\"result-card\" style=\"border-color: #ddd6fe; background: #faf5ff;\">\r\n            <div class=\"res-item input\">\r\n                <span class=\"unit\" style=\"color:var(--secondary);\">Input (s1) [D10]<\/span>\r\n                <span class=\"val\" id=\"m-res-in\" style=\"color:var(--secondary);\">2000<\/span>\r\n            <\/div>\r\n            <div class=\"arrow\" style=\"color:var(--secondary);\">▶<\/div>\r\n            <div class=\"res-item output\">\r\n                <span class=\"unit\" style=\"color:#4338ca;\">Result (d) [D20]<\/span>\r\n                <span class=\"val\" id=\"m-res-out\" style=\"color: #4338ca;\">50<\/span>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"code-container\">\r\n            <div class=\"code-header\" style=\"background: var(--secondary);\"><span>GX Works3 ST Example (DSCL Point)<\/span><\/div>\r\n            <div class=\"code-block\" id=\"mitsu-code\"><\/div>\r\n        <\/div>\r\n    <\/div>\r\n<\/div>\r\n\r\n<script>\r\n    function switchTab(tabId) {\r\n        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));\r\n        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));\r\n        document.getElementById(tabId).classList.add('active');\r\n        document.getElementById('btn-' + tabId).classList.add('active');\r\n        if(tabId === 'std') updateStd(); else updateMitsu();\r\n    }\r\n\r\n    const pink = (t) => `<span class=\"var\">${t}<\/span>`;\r\n    const comm = (t) => `<span class=\"comment\">${t}<\/span>`;\r\n    const term = (v, l, t='span') => `<div class=\"formula-term\"><${t}>${v}<\/${t}><small>${l}<\/small><\/div>`;\r\n    const op = (s) => `<div class=\"formula-op\">${s}<\/div>`;\r\n\r\n    function updateStd() {\r\n        const sMin = parseFloat(document.getElementById('s-sMin').value) || 0;\r\n        const sMax = parseFloat(document.getElementById('s-sMax').value) || 0;\r\n        const dMin = parseFloat(document.getElementById('s-dMin').value) || 0;\r\n        const dMax = parseFloat(document.getElementById('s-dMax').value) || 0;\r\n        const slider = document.getElementById('s-in');\r\n        slider.min = Math.min(sMin, sMax);\r\n        slider.max = Math.max(sMin, sMax);\r\n        const input = parseFloat(slider.value);\r\n        document.getElementById('s-in-num').value = input;\r\n        document.getElementById('std-res-in').innerText = input;\r\n\r\n        let res = (sMax !== sMin) ? ((input - sMin) * (dMax - dMin) / (sMax - sMin)) + dMin : dMin;\r\n        const finalRes = Math.round(res);\r\n        document.getElementById('std-res-out').innerText = finalRes;\r\n\r\n        document.getElementById('std-formula').innerHTML = `${op('((')}${term(input,'입력','b')}${op('-')}${term(sMin,'sMin')}${op(')')}${op('*')}${op('(')}${term(dMax,'dMax')}${op('-')}${term(dMin,'dMin')}${op(')')}${op('/')}${op('(')}${term(sMax,'sMax')}${op('-')}${term(sMin,'sMin')}${op(')')}${op(')')}${op('+')}${term(dMin,'dMin')}${op('=')}${term(finalRes,'결과','i')}`;\r\n\r\n        document.getElementById('std-code').innerHTML = `${comm('// [Label] st_ScaleData: DINT[4]')}\\n${pink('st_ScaleData')}[0] := ${sMin};\\n${pink('st_ScaleData')}[2] := ${sMax};\\n${pink('st_ScaleData')}[4] := ${dMin};\\n${pink('st_ScaleData')}[6] := ${dMax};\\n\\nDSCL(SM400, ${pink('st_ScaleData')}[0], ${pink('i_Analog_Value')}, ${pink('o_Result')});`;\r\n    }\r\n\r\n    function updateMitsu() {\r\n        const p1x = parseFloat(document.getElementById('p1x').value) || 0;\r\n        const p1y = parseFloat(document.getElementById('p1y').value) || 0;\r\n        const p2x = parseFloat(document.getElementById('p2x').value) || 0;\r\n        const p2y = parseFloat(document.getElementById('p2y').value) || 0;\r\n        const slider = document.getElementById('m-in');\r\n        slider.min = Math.min(p1x, p2x);\r\n        slider.max = Math.max(p1x, p2x);\r\n        const input = parseFloat(slider.value);\r\n        document.getElementById('m-in-num').value = input;\r\n        document.getElementById('m-res-in').innerText = input;\r\n\r\n        let res = (p2x !== p1x) ? ((input - p1x) * (p2y - p1y) / (p2x - p1x)) + p1y : p1y;\r\n        const finalRes = Math.round(res);\r\n        document.getElementById('m-res-out').innerText = finalRes;\r\n\r\n        document.getElementById('mitsu-formula').innerHTML = `${op('(')}${term(input,'입력','b')}${op('-')}${term(p1x,'P1 X')}${op(')')}${op('*')}${op('(')}${term(p2y,'P2 Y')}${op('-')}${term(p1y,'P1 Y')}${op(')')}${op('/')}${op('(')}${term(p2x,'P2 X')}${op('-')}${term(p1x,'P1 X')}${op(')')}${op('+')}${term(p1y,'P1 Y')}${op('=')}${term(finalRes,'결과','i')}`;\r\n\r\n        document.getElementById('mitsu-code').innerHTML = `${comm('// [Label] st_Table: DINT[10]')}\\n${pink('st_Table')}[0] := 2; ${comm('// 포인트 수 (D22)')}\\n${pink('st_Table')}[2] := ${p1x}; ${pink('st_Table')}[4] := ${p1y}; ${comm('// D24, D26')}\\n${pink('st_Table')}[6] := ${p2x}; ${pink('st_Table')}[8] := ${p2y}; ${comm('// D28, D30')}\\n\\nDSCL(SM400, ${pink('i_Level_Raw')}, ${pink('st_Table')}[0], ${pink('o_Result')});`;\r\n    }\r\n\r\n    // 버튼 핸들러\r\n    function syncStdFromNum(){ document.getElementById('s-in').value = document.getElementById('s-in-num').value; updateStd(); }\r\n    function syncStdFromSlider(){ updateStd(); }\r\n    function stdSetMin(){ document.getElementById('s-in').value = document.getElementById('s-sMin').value; updateStd(); }\r\n    function stdSetMax(){ document.getElementById('s-in').value = document.getElementById('s-sMax').value; updateStd(); }\r\n    function stdSetZero(){ document.getElementById('s-in').value = 0; updateStd(); }\r\n    function stdSetMid(){ const mn = parseFloat(document.getElementById('s-sMin').value), mx = parseFloat(document.getElementById('s-sMax').value); document.getElementById('s-in').value = (mn+mx)/2; updateStd(); }\r\n\r\n    function syncMitsuFromNum(){ document.getElementById('m-in').value = document.getElementById('m-in-num').value; updateMitsu(); }\r\n    function syncMitsuFromSlider(){ updateMitsu(); }\r\n    function mitsuSetMin(){ document.getElementById('m-in').value = document.getElementById('p1x').value; updateMitsu(); }\r\n    function mitsuSetMax(){ document.getElementById('m-in').value = document.getElementById('p2x').value; updateMitsu(); }\r\n    function mitsuSetZero(){ document.getElementById('m-in').value = 0; updateMitsu(); }\r\n    function mitsuSetMid(){ const mn = parseFloat(document.getElementById('p1x').value), mx = parseFloat(document.getElementById('p2x').value); document.getElementById('m-in').value = (mn+mx)/2; updateMitsu(); }\r\n\r\n    window.onload = () => { updateStd(); updateMitsu(); };\r\n<\/script>\r\n<\/body>\r\n<\/html>"},{"id":"p12","label":"SERDATA 데이터검색","title":"PLC SERDATA 명령어 데이터 검색","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-SERDATA_%EB%8D%B0%EC%9D%B4%ED%84%B0%EA%B2%80%EC%83%89.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC SERDATA 명령어 데이터 검색 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n        \r\n        /* 스크롤 방지 및 전체 화면 높이 고정 */\r\n        html, body { height: 100vh; overflow: hidden; }\r\n        body { font-family: 'Inter', 'Malgun Gothic', sans-serif; background-color: #e2e8f0; }\r\n        \r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.7);\r\n            backdrop-filter: blur(10px);\r\n            border: 1px solid rgba(255, 255, 255, 0.3);\r\n            box-shadow: 0 4px 15px rgba(31, 38, 135, 0.05);\r\n        }\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 1px solid #cbd5e1;\r\n        }\r\n        .param-label {\r\n            font-size: 0.7rem;\r\n            background: #cbd5e1;\r\n            color: #475569;\r\n            padding: 1px 6px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n        }\r\n        .input-card {\r\n            border: 1px solid #cbd5e1;\r\n            transition: all 0.2s;\r\n        }\r\n        .data-cell {\r\n            background: #f8fafc;\r\n            border: 1px solid #cbd5e1;\r\n            transition: all 0.2s;\r\n        }\r\n        .data-cell.match {\r\n            background-color: #fde68a;\r\n            border-color: #f59e0b;\r\n        }\r\n        .first-tag {\r\n            color: #d97706;\r\n            font-size: 0.75rem;\r\n            font-weight: 800;\r\n            position: absolute;\r\n            top: -16px;\r\n            left: 50%;\r\n            transform: translateX(-50%);\r\n        }\r\n        .result-card {\r\n            background-color: #ecfdf5;\r\n            border: 1px solid #10b981;\r\n        }\r\n        .code-block {\r\n            background: #1e293b;\r\n            border-left: 4px solid #3b82f6;\r\n            height: 100%;\r\n        }\r\n        \r\n        .no-wrap { white-space: nowrap; }\r\n    <\/style>\r\n<\/head>\r\n<body class=\"p-4\">\r\n\r\n<div class=\"max-w-7xl mx-auto h-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-white\">\r\n    \r\n    <!-- Header: 상단 고정 (폰트 확대) -->\r\n    <div class=\"p-5 pb-3\">\r\n        <div class=\"glass-header rounded-xl p-5 border-l-8 border-blue-600 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-2xl font-extrabold text-slate-700 leading-tight\">SERDATA(P) 데이터 검색<\/h1>\r\n                <p class=\"text-[0.8rem] text-slate-500 mt-1 font-bold\">iQ-R 시리즈 BIN16 데이터 탐색 명령어<\/p>\r\n            <\/div>\r\n            \r\n            <div class=\"cmd-box rounded-lg px-6 py-4 flex items-center gap-3 font-mono text-xl\">\r\n                <span class=\"text-slate-400 font-bold\">SERDATA(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-slate-800\">1<\/span>\r\n                    <span class=\"param-label mt-1 uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-slate-800\">D10<\/span>\r\n                    <span class=\"param-label mt-1\">키워드(s1)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-slate-800\">D100<\/span>\r\n                    <span class=\"param-label mt-1\">대상시작(s2)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-slate-800\">D20<\/span>\r\n                    <span class=\"param-label mt-1\">개수(n)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-slate-800\">D30<\/span>\r\n                    <span class=\"param-label mt-1\">결과(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-bold\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- Main Content: 좌우 2단 구성 -->\r\n    <div class=\"flex-1 px-5 pb-5 overflow-hidden flex gap-5\">\r\n        \r\n        <!-- Left Column: 설정 및 결과 -->\r\n        <div class=\"w-1/3 flex flex-col gap-4\">\r\n            \r\n            <!-- Info Tip -->\r\n            <div class=\"bg-amber-50 border border-amber-100 rounded-xl p-4 flex gap-3\">\r\n                <span class=\"text-2xl\">💡<\/span>\r\n                <p class=\"text-[0.85rem] text-amber-800 leading-snug\">\r\n                    <span class=\"font-bold\">포인트:<\/span> (s1)을 (s2)부터 (n)개 범위에서 검색.<br>\r\n                    <span class=\"font-bold text-amber-900\"
