                           ${renderReadOnlyReg(14, '분 (Minute)', pad(rtcMemory.min))}\r\n                                ${renderReadOnlyReg(12, '일 (Day)', pad(rtcMemory.day))}\r\n                                ${renderReadOnlyReg(15, '초 (Second)', pad(rtcMemory.sec))}\r\n                            <\/div>\r\n                            <div class=\"mt-3 p-3 bg-white rounded-xl border-2 border-black flex items-center justify-between\">\r\n                                <span class=\"text-xs font-black text-slate-600\">D16 [요일 (Day of Week)]<\/span>\r\n                                <span class=\"font-mono font-black text-lg text-blue-600\">${rtcMemory.dow} (${DOW_NAMES[rtcMemory.dow]}요일)<\/span>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n\r\n                case 'DATEWR':\r\n                    html = `\r\n                        <div class=\"clock-display\">\r\n                            <div class=\"clock-date\">현재 PLC 내장 RTC 상태<\/div>\r\n                            <div id=\"sim-live-time\" class=\"clock-time text-cyan-400\">\r\n                                ${formatDate(now)}<br/>\r\n                                <span class=\"text-3xl\">${formatTime(now)}<\/span>\r\n                                <span class=\"text-lg text-slate-400 ml-2\">(${DOW_NAMES[now.getDay()]}요일)<\/span>\r\n                            <\/div>\r\n                        <\/div>\r\n\r\n                        <div>\r\n                            <div class=\"flex justify-between items-center mb-2 px-1\">\r\n                                <span class=\"text-xs font-black text-slate-700 uppercase\">설정할 시계 데이터 (D20~D25)<\/span>\r\n                                <span class=\"text-[0.7rem] font-bold text-blue-600\">▲/▼ 또는 직접 입력<\/span>\r\n                            <\/div>\r\n                            <div class=\"grid grid-cols-2 gap-3\">\r\n                                ${renderEditableReg(20, '연도 (Year)', editRTC.year, 'year', 'changeEditRTC')}\r\n                                ${renderEditableReg(23, '시 (Hour)', editRTC.hour, 'hour', 'changeEditRTC')}\r\n                                ${renderEditableReg(21, '월 (Month)', editRTC.month, 'month', 'changeEditRTC')}\r\n                                ${renderEditableReg(24, '분 (Minute)', editRTC.min, 'min', 'changeEditRTC')}\r\n                                ${renderEditableReg(22, '일 (Day)', editRTC.day, 'day', 'changeEditRTC')}\r\n                                ${renderEditableReg(25, '초 (Second)', editRTC.sec, 'sec', 'changeEditRTC')}\r\n                            <\/div>\r\n                            <div class=\"mt-3 p-3 bg-emerald-50 border-2 border-emerald-500 rounded-xl text-center\">\r\n                                <span class=\"text-xs font-black text-emerald-800\">\r\n                                    [실행] 클릭 시 위 설정값이 PLC 내부 시계(RTC)에 즉시 적용됩니다.\r\n                                <\/span>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n\r\n                case 'TIME2SEC':\r\n                    const totalSec = time2secInput.hour * 3600 + time2secInput.min * 60 + time2secInput.sec;\r\n                    html = `\r\n                        <div class=\"bg-white p-5 rounded-2xl border-3 border-black shadow-[4px_4px_0px_#000] space-y-4\">\r\n                            <span class=\"text-xs font-black text-slate-500 uppercase block mb-1\">입력 시분초 (D10, D11, D12)<\/span>\r\n                            <div class=\"flex justify-around items-center bg-slate-50 p-4 rounded-xl border-2 border-black\">\r\n                                ${renderInputColumn('HH (시)', time2secInput.hour, 'hour', 'changeTime2Sec')}\r\n                                <span class=\"text-3xl font-black text-slate-400\">:<\/span>\r\n                                ${renderInputColumn('MM (분)', time2secInput.min, 'min', 'changeTime2Sec')}\r\n                                <span class=\"text-3xl font-black text-slate-400\">:<\/span>\r\n                                ${renderInputColumn('SS (초)', time2secInput.sec, 'sec', 'changeTime2Sec')}\r\n                            <\/div>\r\n                            <div class=\"text-center text-2xl text-blue-500 font-bold\">⬇️ (HH×3600) + (MM×60) + SS<\/div>\r\n                            <div class=\"bg-blue-900 p-5 rounded-2xl text-center text-white border-4 border-black shadow-[4px_4px_0px_#000]\">\r\n                                <span class=\"text-[0.7rem] block uppercase tracking-wider text-blue-300 font-bold\">32비트 누적 초 변환 결과 (D40)<\/span>\r\n                                <div class=\"text-4xl font-black text-cyan-300 font-mono mt-1\">${totalSec.toLocaleString()} <span class=\"text-lg text-white\">초 (sec)<\/span><\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n\r\n                case 'SEC2TIME':\r\n                    const h = Math.floor(totalSeconds / 3600);\r\n                    const m = Math.floor((totalSeconds % 3600) / 60);\r\n                    const s = totalSeconds % 60;\r\n                    html = `\r\n                        <div class=\"bg-white p-5 rounded-2xl border-3 border-black shadow-[4px_4px_0px_#000] space-y-4\">\r\n                            <div class=\"bg-indigo-950 p-5 rounded-2xl text-white border-4 border-black shadow-[4px_4px_0px_#000] flex items-center justify-between\">\r\n                                <div class=\"flex-1 text-center\">\r\n                                    <span class=\"text-[0.7rem] block uppercase tracking-wider text-indigo-300 font-bold mb-1\">입력 누적 초 (D100)<\/span>\r\n                                    <input type=\"number\" min=\"0\" value=\"${totalSeconds}\"\r\n                                        class=\"bg-transparent text-3xl font-black text-cyan-300 w-full text-center outline-none font-mono\"\r\n                                        onchange=\"updateTotalSeconds(this.value)\">\r\n                                <\/div>\r\n                                <div class=\"flex flex-col gap-1 ml-4\">\r\n                                    <button type=\"button\" onclick=\"adjustTotalSeconds(3600)\" class=\"ud-btn !w-14 text-[0.65rem]\">+1시간<\/button>\r\n                                    <button type=\"button\" onclick=\"adjustTotalSeconds(60)\" class=\"ud-btn !w-14 text-[0.65rem]\">+1분<\/button>\r\n                                    <button type=\"button\" onclick=\"adjustTotalSeconds(-60)\" class=\"ud-btn !w-14 text-[0.65rem]\">-1분<\/button>\r\n                                <\/div>\r\n                            <\/div>\r\n                            <div class=\"text-center text-2xl text-indigo-600 font-bold\">⬇️ 시 / 분 / 초 역변환<\/div>\r\n                            <div class=\"flex justify-around text-center bg-slate-50 p-4 rounded-xl border-2 border-black\">\r\n                                <div class=\"p-2\">\r\n                                    <span class=\"text-xs font-bold text-slate-500 block uppercase\">시 (D10)<\/span>\r\n                                    <b class=\"text-3xl font-mono text-slate-800 font-black\">${pad(h)}<\/b>\r\n                                <\/div>\r\n                                <span class=\"text-3xl font-black text-slate-300 self-center\">:<\/span>\r\n                                <div class=\"p-2\">\r\n                                    <span class=\"text-xs font-bold text-slate-500 block uppercase\">분 (D11)<\/span>\r\n                                    <b class=\"text-3xl font-mono text-slate-800 font-black\">${pad(m)}<\/b>\r\n                                <\/div>\r\n                                <span class=\"text-3xl font-black text-slate-300 self-center\">:<\/span>\r\n                                <div class=\"p-2\">\r\n                                    <span class=\"text-xs font-bold text-slate-500 block uppercase\">초 (D12)<\/span>\r\n                                    <b class=\"text-3xl font-mono text-slate-800 font-black\">${pad(s)}<\/b>\r\n                                <\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n\r\n                case 'TCMP':\r\n                    const nowH = now.getHours();\r\n                    const nowM = now.getMinutes();\r\n                    const nowS = now.getSeconds();\r\n\r\n                    const targetVal = tcmpTime.hour * 3600 + tcmpTime.min * 60 + tcmpTime.sec;\r\n                    const currVal = nowH * 3600 + nowM * 60 + nowS;\r\n\r\n                    const isLess = targetVal < currVal;\r\n                    const isEqual = targetVal === currVal;\r\n                    const isGreater = targetVal > currVal;\r\n\r\n                    html = `\r\n                        <div class=\"bg-white p-5 rounded-2xl border-3 border-black shadow-[4px_4px_0px_#000] space-y-4\">\r\n                            <div>\r\n                                <span class=\"text-xs font-black text-slate-500 uppercase block mb-1\">목표 시각 설정 (s1:시, s2:분, s3:초)<\/span>\r\n                                <div class=\"flex justify-around bg-slate-50 p-4 rounded-xl border-2 border-black\">\r\n                                    ${renderInputColumn('목표 시', tcmpTime.hour, 'hour', 'changeTCMP')}\r\n                                    <span class=\"text-3xl font-black text-slate-300\">:<\/span>\r\n                                    ${renderInputColumn('목표 분', tcmpTime.min, 'min', 'changeTCMP')}\r\n                                    <span class=\"text-3xl font-black text-slate-300\">:<\/span>\r\n                                    ${renderInputColumn('목표 초', tcmpTime.sec, 'sec', 'changeTCMP')}\r\n                                <\/div>\r\n                            <\/div>\r\n\r\n                            <div class=\"p-3 bg-slate-900 rounded-xl text-center border-2 border-black\">\r\n                                <span class=\"text-[0.65rem] text-slate-400 block uppercase font-bold mb-0.5\">PLC 현재 실시간 시각 (RTC)<\/span>\r\n                                <div id=\"tcmp-current-time\" class=\"text-2xl font-black text-yellow-400 font-mono\">\r\n                                    ${formatTime(now)}\r\n                                <\/div>\r\n                            <\/div>\r\n\r\n                            <div class=\"space-y-2 pt-1\">\r\n                                <span class=\"text-xs font-black text-slate-500 uppercase block\">비교 판정 결과 (d: M10, M11, M12)<\/span>\r\n                                <div class=\"grid grid-cols-3 gap-2\">\r\n                                    <div class=\"p-3 bg-slate-100 rounded-xl border-2 border-black flex flex-col items-center gap-1.5 text-center\">\r\n                                        <div id=\"lamp-m10\" class=\"lamp ${isLess ? 'on' : ''}\"><\/div>\r\n                                        <span class=\"text-xs font-black\">M10<\/span>\r\n                                        <span class=\"text-[0.65rem] text-slate-500 font-bold\">목표 &lt; 현재<br/>(지남)<\/span>\r\n                                    <\/div>\r\n                                    <div class=\"p-3 bg-slate-100 rounded-xl border-2 border-black flex flex-col items-center gap-1.5 text-center\">\r\n                                        <div id=\"lamp-m11\" class=\"lamp yellow ${isEqual ? 'on' : ''}\"><\/div>\r\n                                        <span class=\"text-xs font-black\">M11<\/span>\r\n                                        <span class=\"text-[0.65rem] text-slate-500 font-bold\">목표 == 현재<br/>(일치)<\/span>\r\n                                    <\/div>\r\n                                    <div class=\"p-3 bg-slate-100 rounded-xl border-2 border-black flex flex-col items-center gap-1.5 text-center\">\r\n                                        <div id=\"lamp-m12\" class=\"lamp ${isGreater ? 'on' : ''}\"><\/div>\r\n                                        <span class=\"text-xs font-black\">M12<\/span>\r\n                                        <span class=\"text-[0.65rem] text-slate-500 font-bold\">목표 &gt; 현재<br/>(이전)<\/span>\r\n                                    <\/div>\r\n                                <\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n\r\n                case 'DUTY':\r\n                    const isLampOn = isDutyRunning && dutyPhase < dutySettings.on;\r\n                    const cyclePct = dutySettings.total > 0 ? (dutyPhase / dutySettings.total) * 100 : 0;\r\n                    html = `\r\n                        <div class=\"bg-white p-5 rounded-2xl border-3 border-black shadow-[4px_4px_0px_#000] space-y-4\">\r\n                            <div class=\"flex justify-between items-center bg-slate-900 p-4 rounded-xl border-b-4 border-blue-600\">\r\n                                <div class=\"flex items-center gap-2\">\r\n                                    <span class=\"text-xs text-slate-400 uppercase font-black\">출력 비트 (d):<\/span>\r\n                                    <span class=\"text-white font-mono font-black text-sm bg-blue-600 px-2.5 py-0.5 rounded\">M20<\/span>\r\n                                <\/div>\r\n                                <div class=\"flex items-center gap-3\">\r\n                                    <span class=\"text-xs font-bold text-slate-300\">${isLampOn ? 'ON' : 'OFF'}<\/span>\r\n                                    <div id=\"duty-lamp\" class=\"lamp ${isLampOn ? 'on' : ''} !w-6 !h-6\"><\/div>\r\n                                <\/div>\r\n                            <\/div>\r\n\r\n                            <div class=\"grid grid-cols-2 gap-3\">\r\n                                <div class=\"p-3 border-2 border-black rounded-xl flex items-center justify-between bg-slate-50\">\r\n                                    <div>\r\n                                        <label class=\"text-[0.65rem] block font-black text-slate-400\">ON 시간 (n1, 초)<\/label>\r\n                                        <input type=\"number\" min=\"1\" value=\"${dutySettings.on}\"\r\n                                            class=\"font-black text-xl w-14 text-center bg-transparent outline-none font-mono\"\r\n                                            onchange=\"updateDutySetting('on', this.value)\">\r\n                                    <\/div>\r\n                                    <div class=\"flex flex-col gap-1\">\r\n                                        <button type=\"button\" onclick=\"adjustDutySetting('on', 1)\" class=\"ud-btn\">▲<\/button>\r\n                                        <button type=\"button\" onclick=\"adjustDutySetting('on', -1)\" class=\"ud-btn\">▼<\/button>\r\n                                    <\/div>\r\n                                <\/div>\r\n                                <div class=\"p-3 border-2 border-black rounded-xl flex items-center justify-between bg-slate-50\">\r\n                                    <div>\r\n                                        <label class=\"text-[0.65rem] block font-black text-slate-400\">전체 주기 (n2, 초)<\/label>\r\n                                        <input type=\"number\" min=\"2\" value=\"${dutySettings.total}\"\r\n                                            class=\"font-black text-xl w-14 text-center bg-transparent outline-none font-mono\"\r\n                                            onchange=\"updateDutySetting('total', this.value)\">\r\n                                    <\/div>\r\n                                    <div class=\"flex flex-col gap-1\">\r\n                                        <button type=\"button\" onclick=\"adjustDutySetting('total', 1)\" class=\"ud-btn\">▲<\/button>\r\n                                        <button type=\"button\" onclick=\"adjustDutySetting('total', -1)\" class=\"ud-btn\">▼<\/button>\r\n                                    <\/div>\r\n                                <\/div>\r\n                            <\/div>\r\n\r\n                            <div class=\"pulse-view\">\r\n                                <div id=\"duty-bar\" class=\"pulse-bar\" style=\"width: ${isDutyRunning ? cyclePct : 0}%\"><\/div>\r\n                                <span id=\"duty-phase-text\" class=\"relative z-10 text-xs font-black text-white mix-blend-difference uppercase font-mono\">\r\n                                    주기 진행: ${isDutyRunning ? dutyPhase : 0}s / ${dutySettings.total}s (${isDutyRunning ? (isLampOn ? 'ON 구간' : 'OFF 구간') : '정지'})\r\n                                <\/span>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n\r\n                case 'TIMCHK':\r\n                    html = `\r\n                        <div class=\"bg-white p-5 rounded-2xl border-3 border-black shadow-[4px_4px_0px_#000] flex flex-col items-center gap-5\">\r\n                            <div class=\"text-center\">\r\n                                <span class=\"text-xs font-black text-slate-400 uppercase tracking-widest block mb-1\">경과 시간 (초)<\/span>\r\n                                <div class=\"text-6xl font-black font-mono text-slate-800\">\r\n                                    <span id=\"timchk-sec-text\">${(timchkElapsed / 10).toFixed(1)}<\/span>\r\n                                    <span class=\"text-2xl ml-1 text-slate-400\">s<\/span>\r\n                                <\/div>\r\n                            <\/div>\r\n\r\n                            <div class=\"flex gap-4 w-full\">\r\n                                <div class=\"flex-1 bg-slate-900 p-4 rounded-xl text-center border-b-4 border-emerald-500 border-2 border-black\">\r\n                                    <span class=\"text-[0.65rem] text-slate-400 uppercase block font-black mb-1\">측정 레지스터 (D200)<\/span>\r\n                                    <div class=\"text-3xl font-black text-emerald-400 font-mono\">\r\n                                        <span id=\"timchk-d200-text\">${timchkElapsed}<\/span>\r\n                                        <span class=\"text-xs text-slate-400 font-bold ml-1\">(100ms 단위)<\/span>\r\n                                    <\/div>\r\n                                <\/div>\r\n                                <div class=\"w-24 flex flex-col items-center justify-center gap-1 bg-slate-100 p-2 rounded-xl border-2 border-black\">\r\n                                    <span class=\"text-[0.65rem] font-black text-slate-500\">${isTimerRunning ? '측정 중' : '정지'}<\/span>\r\n                                    <div id=\"timchk-lamp\" class=\"lamp ${isTimerRunning ? 'on red' : ''} !w-9 !h-9\"><\/div>\r\n                                <\/div>\r\n                            <\/div>\r\n\r\n                            <div class=\"w-full flex justify-end\">\r\n                                <button type=\"button\" onclick=\"resetTimchk()\" class=\"text-xs font-bold text-slate-500 hover:text-black underline\">\r\n                                    타이머 리셋 (0으로 초기화)\r\n                                <\/button>\r\n                            <\/div>\r\n                        <\/div>\r\n                    `;\r\n                    break;\r\n            }\r\n\r\n            container.innerHTML = html;\r\n            safeCreateIcons();\r\n        }\r\n\r\n        // --- 헬퍼 렌더러 함수들 ---\r\n\r\n        function renderReadOnlyReg(addr, label, val) {\r\n            return `\r\n                <div class=\"bg-white p-3 rounded-xl border-2 border-black flex items-center justify-between shadow-[2px_2px_0px_#000]\">\r\n                    <div class=\"flex flex-col\">\r\n                        <span class=\"text-[0.65rem] font-bold text-slate-400 uppercase tracking-tight\">D${addr} [${label}]<\/span>\r\n                        <span class=\"text-xl font-black text-slate-800 font-mono\">${val}<\/span>\r\n                    <\/div>\r\n                    <span class=\"text-[0.6rem] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-mono font-bold\">READ<\/span>\r\n                <\/div>\r\n            `;\r\n        }\r\n\r\n        function renderEditableReg(addr, label, val, key, funcName) {\r\n            return `\r\n                <div class=\"bg-white p-3 rounded-xl border-2 border-black flex items-center justify-between shadow-[2px_2px_0px_#000]\">\r\n                    <div class=\"flex flex-col\">\r\n                        <span class=\"text-[0.65rem] font-bold text-slate-400 uppercase tracking-tight\">D${addr} [${label}]<\/span>\r\n                        <input type=\"number\" value=\"${val}\"\r\n                            class=\"text-xl font-black w-24 bg-transparent outline-none font-mono text-slate-800\"\r\n                            onchange=\"${funcName}('${key}', this.value)\">\r\n                    <\/div>\r\n                    <div class=\"flex flex-col gap-1\">\r\n                        <button type=\"button\" onclick=\"${funcName}('${key}', ${val + 1})\" class=\"ud-btn\">▲<\/button>\r\n                        <button type=\"button\" onclick=\"${funcName}('${key}', ${val - 1})\" class=\"ud-btn\">▼<\/button>\r\n                    <\/div>\r\n                <\/div>\r\n            `;\r\n        }\r\n\r\n        function renderInputColumn(label, val, key, funcName) {\r\n            return `\r\n                <div class=\"flex flex-col items-center gap-1\">\r\n                    <label class=\"text-[0.65rem] font-bold text-slate-400 uppercase\">${label}<\/label>\r\n                    <input type=\"number\" value=\"${val}\"\r\n                        class=\"text-2xl font-black w-14 text-center bg-transparent outline-none font-mono text-slate-800\"\r\n                        onchange=\"${funcName}('${key}', this.value)\">\r\n                    <div class=\"flex gap-1 mt-1\">\r\n                        <button type=\"button\" onclick=\"${funcName}('${key}', ${val + 1})\" class=\"ud-btn !w-6\">▲<\/button>\r\n                        <button type=\"button\" onclick=\"${funcName}('${key}', ${val - 1})\" class=\"ud-btn !w-6\">▼<\/button>\r\n                    <\/div>\r\n                <\/div>\r\n            `;\r\n        }\r\n\r\n        // --- 입력 변경 및 상태 조작 함수들 ---\r\n\r\n        function changeEditRTC(key, val) {\r\n            saveHistory();\r\n            val = parseInt(val) || 0;\r\n            if (key === 'year') val = Math.max(1990, Math.min(2099, val));\r\n            if (key === 'month') val = Math.max(1, Math.min(12, val));\r\n            if (key === 'day') val = Math.max(1, Math.min(31, val));\r\n            if (key === 'hour') val = Math.max(0, Math.min(23, val));\r\n            if (key === 'min' || key === 'sec') val = Math.max(0, Math.min(59, val));\r\n            editRTC[key] = val;\r\n            renderSimulation();\r\n        }\r\n\r\n        function changeTime2Sec(key, val) {\r\n            saveHistory();\r\n            val = parseInt(val) || 0;\r\n            if (key === 'hour') val = Math.max(0, val);\r\n            if (key === 'min' || key === 'sec') val = Math.max(0, Math.min(59, val));\r\n            time2secInput[key] = val;\r\n            renderSimulation();\r\n        }\r\n\r\n        function updateTotalSeconds(val) {\r\n            saveHistory();\r\n            totalSeconds = Math.max(0, parseInt(val) || 0);\r\n            renderSimulation();\r\n        }\r\n\r\n        function adjustTotalSeconds(delta) {\r\n            saveHistory();\r\n            totalSeconds = Math.max(0, totalSeconds + delta);\r\n            renderSimulation();\r\n        }\r\n\r\n        function changeTCMP(key, val) {\r\n            saveHistory();\r\n            val = parseInt(val) || 0;\r\n            if (key === 'hour') val = Math.max(0, Math.min(23, val));\r\n            if (key === 'min' || key === 'sec') val = Math.max(0, Math.min(59, val));\r\n            tcmpTime[key] = val;\r\n            renderSimulation();\r\n        }\r\n\r\n        function updateDutySetting(key, val) {\r\n            saveHistory();\r\n            val = Math.max(1, parseInt(val) || 1);\r\n            dutySettings[key] = val;\r\n            if (key === 'on' && dutySettings.on > dutySettings.total) {\r\n                dutySettings.total = dutySettings.on;\r\n            }\r\n            if (key === 'total' && dutySettings.total < dutySettings.on) {\r\n                dutySettings.on = dutySettings.total;\r\n            }\r\n            renderSimulation();\r\n        }\r\n\r\n        function adjustDutySetting(key, delta) {\r\n            updateDutySetting(key, (dutySettings[key] || 0) + delta);\r\n        }\r\n\r\n        function resetTimchk() {\r\n            saveHistory();\r\n            timchkElapsed = 0;\r\n            if (isTimerRunning) {\r\n                timchkStart = Date.now();\r\n            }\r\n            renderSimulation();\r\n        }\r\n\r\n        // --- 실행 (EXECUTE) 핸들러 ---\r\n        function executeAction() {\r\n            const btn = document.getElementById('exec-btn');\r\n            if (btn) {\r\n                btn.classList.add('bg-emerald-500');\r\n                setTimeout(() => btn.classList.remove('bg-emerald-500'), 250);\r\n            }\r\n\r\n            saveHistory();\r\n            const status = document.getElementById('status-display');\r\n\r\n            switch (currentOp) {\r\n                case 'DATERD': {\r\n                    // 현재 PLC RTC를 읽어 rtcMemory에 저장\r\n                    const now = getSimulatedTime();\r\n                    rtcMemory = {\r\n                        year: now.getFullYear(),\r\n                        month: now.getMonth() + 1,\r\n                        day: now.getDate(),\r\n                        hour: now.getHours(),\r\n                        min: now.getMinutes(),\r\n                        sec: now.getSeconds(),\r\n                        dow: now.getDay()\r\n                    };\r\n                    if (status) status.innerText = `DATERD 실행 완료 (RTC → D10~D16 저장)`;\r\n                    renderSimulation();\r\n\r\n                    // 레지스터 깜빡임 애니메이션 효과\r\n                    const regs = document.getElementById('daterd-regs');\r\n                    if (regs) {\r\n                        regs.classList.add('reg-highlight');\r\n                        setTimeout(() => regs.classList.remove('reg-highlight'), 1200);\r\n                    }\r\n                    break;\r\n                }\r\n\r\n                case 'DATEWR': {\r\n                    // editRTC 값을 PLC RTC에 강제 쓰기 적용\r\n                    const targetDate = new Date(editRTC.year, editRTC.month - 1, editRTC.day, editRTC.hour, editRTC.min, editRTC.sec);\r\n                    clockOffsetMs = targetDate.getTime() - Date.now();\r\n                    if (status) status.innerText = `DATEWR 실행 완료 (PLC 시계 쓰기 성공!)`;\r\n                    renderSimulation();\r\n                    break;\r\n                }\r\n\r\n                case 'TIME2SEC': {\r\n                    const total = time2secInput.hour * 3600 + time2secInput.min * 60 + time2secInput.sec;\r\n                    if (status) status.innerText = `TIME2SEC 실행 완료 (D40 = ${total.toLocaleString()}초)`;\r\n                    renderSimulation();\r\n                    break;\r\n                }\r\n\r\n                case 'SEC2TIME': {\r\n                    const h = Math.floor(totalSeconds / 3600);\r\n                    const m = Math.floor((totalSeconds % 3600) / 60);\r\n                    const s = totalSeconds % 60;\r\n                    if (status) status.innerText = `SEC2TIME 실행 완료 (${h}시 ${m}분 ${s}초)`;\r\n                    renderSimulation();\r\n                    break;\r\n                }\r\n\r\n                case 'TCMP': {\r\n                    if (status) status.innerText = `TCMP 시간 비교 실행 완료`;\r\n                    renderSimulation();\r\n                    break;\r\n                }\r\n\r\n                case 'DUTY': {\r\n                    isDutyRunning = !isDutyRunning;\r\n                    dutyPhase = 0;\r\n                    const execText = document.getElementById('exec-text');\r\n                    if (execText) execText.innerText = isDutyRunning ? \"펄스 중지\" : \"펄스 시작\";\r\n                    if (status) status.innerText = isDutyRunning ? \"DUTY 펄스 생성 중 (RUN)\" : \"DUTY 대기 중\";\r\n                    renderSimulation();\r\n                    break;\r\n                }\r\n\r\n                case 'TIMCHK': {\r\n                    isTimerRunning = !isTimerRunning;\r\n                    if (isTimerRunning) {\r\n                        timchkStart = Date.now() - (timchkElapsed * 100);\r\n                    }\r\n                    const execText = document.getElementById('exec-text');\r\n                    if (execText) execText.innerText = isTimerRunning ? \"타이머 중지\" : \"타이머 시작\";\r\n                    if (status) status.innerText = isTimerRunning ? \"TIMCHK 시간 계측 중...\" : \"TIMCHK 계측 정지\";\r\n                    renderSimulation();\r\n                    break;\r\n                }\r\n            }\r\n        }\r\n\r\n        // --- 히스토리 되돌리기 (UNDO) ---\r\n        function saveHistory() {\r\n            history.push({\r\n                op: currentOp,\r\n                clockOffsetMs,\r\n                rtcMemory: { ...rtcMemory },\r\n                editRTC: { ...editRTC },\r\n                time2secInput: { ...time2secInput },\r\n                totalSeconds,\r\n                tcmpTime: { ...tcmpTime },\r\n                dutySettings: { ...dutySettings },\r\n                dutyPhase,\r\n                timchkElapsed\r\n            });\r\n            if (history.length > 25) history.shift();\r\n        }\r\n\r\n        function undo() {\r\n            if (history.length === 0) return;\r\n            const prev = history.pop();\r\n            clockOffsetMs = prev.clockOffsetMs;\r\n            rtcMemory = prev.rtcMemory;\r\n            editRTC = prev.editRTC;\r\n            time2secInput = prev.time2secInput;\r\n            totalSeconds = prev.totalSeconds;\r\n            tcmpTime = prev.tcmpTime;\r\n            dutySettings = prev.dutySettings;\r\n            dutyPhase = prev.dutyPhase;\r\n            timchkElapsed = prev.timchkElapsed;\r\n\r\n            const status = document.getElementById('status-display');\r\n            if (status) status.innerText = \"이전 상태로 되돌림\";\r\n            renderSimulation();\r\n        }\r\n\r\n        // --- 기술 핸드북 업데이트 ---\r\n        function updateHandbook() {\r\n            const data = manual[currentOp];\r\n            const content = document.getElementById('hb-content');\r\n            if (!content || !data) return;\r\n\r\n            content.innerHTML = `\r\n                <div class=\"bg-slate-800/80 p-5 rounded-2xl border-2 border-slate-700 shadow-inner\">\r\n                    <h4 class=\"text-xl font-black text-blue-400 mb-2\">${data.title}<\/h4>\r\n                    <div class=\"st-syntax-large text-emerald-400\">${data.syntax}<\/div>\r\n                    <p class=\"text-xs font-bold text-slate-300 leading-relaxed mb-3\">${data.desc}<\/p>\r\n                    <div class=\"p-3 bg-black/60 rounded-xl border border-slate-700 text-xs text-slate-300\">\r\n                        <b class=\"text-blue-400 uppercase\">피연산자:<\/b> ${data.operands}\r\n                    <\/div>\r\n                <\/div>\r\n                <div class=\"p-4 bg-black/60 border border-slate-700 rounded-2xl\">\r\n                    <span class=\"text-[0.7rem] font-black text-slate-400 uppercase block mb-2 flex items-center gap-1.5\">\r\n                        <i data-lucide=\"code\" size=\"14\"><\/i> ST 프로그램 예제\r\n                    <\/span>\r\n                    <div class=\"st-code-box\">${data.st}<\/div>\r\n                <\/div>\r\n            `;\r\n            const tipEl = document.getElementById('hb-tip');\r\n            if (tipEl) tipEl.innerText = data.tip;\r\n            safeCreateIcons();\r\n        }\r\n\r\n        // --- 메모 로컬스토리지 관리 ---\r\n        function initMemos() {\r\n            try {\r\n                const saved = localStorage.getItem('zodd_datetime_manual_v1');\r\n                if (saved) {\r\n                    const parsed = JSON.parse(saved);\r\n                    memoData = Object.assign(memoData, parsed);\r\n                }\r\n            } catch (e) {\r\n                console.warn('메모 데이터 로드 실패:', e);\r\n            }\r\n\r\n            const globalMemo = document.getElementById('global-memo');\r\n            if (globalMemo) {\r\n                globalMemo.value = memoData.global || '';\r\n                globalMemo.oninput = (e) => {\r\n                    memoData.global = e.target.value;\r\n                    saveMemos();\r\n                };\r\n            }\r\n\r\n            const opMemo = document.getElementById('op-memo');\r\n            if (opMemo) {\r\n                opMemo.value = memoData[currentOp] || '';\r\n                opMemo.oninput = (e) => {\r\n                    memoData[currentOp] = e.target.value;\r\n                    saveMemos();\r\n                };\r\n            }\r\n        }\r\n\r\n        function saveMemos() {\r\n            try {\r\n                localStorage.setItem('zodd_datetime_manual_v1', JSON.stringify(memoData));\r\n                const ind = document.getElementById('save-status');\r\n                if (ind) {\r\n                    ind.classList.add('show');\r\n                    setTimeout(() => ind.classList.remove('show'), 1000);\r\n                }\r\n            } catch (e) {\r\n                console.warn('메모 저장 실패:', e);\r\n            }\r\n        }\r\n\r\n        // --- 유틸리티 포맷 함수 ---\r\n        function pad(n) {\r\n            return String(n).padStart(2, '0');\r\n        }\r\n\r\n        function formatDate(d) {\r\n            return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;\r\n        }\r\n\r\n        function formatTime(d) {\r\n            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;\r\n        }\r\n\r\n        // --- 고성능 백그라운드 갱신 루프 (입력 포커스 유지 & 깜빡임 방지) ---\r\n        let lastSecondLogged = -1;\r\n\r\n        setInterval(() => {\r\n            const now = getSimulatedTime();\r\n            const currentSecond = now.getSeconds();\r\n\r\n            // 1. 100ms 정밀 계측: TIMCHK 타이머 전용 직접 DOM 갱신\r\n            if (isTimerRunning && currentOp === 'TIMCHK') {\r\n                timchkElapsed = Math.floor((Date.now() - timchkStart) / 100);\r\n                const secEl = document.getElementById('timchk-sec-text');\r\n                const d200El = document.getElementById('timchk-d200-text');\r\n                if (secEl) secEl.innerText = (timchkElapsed / 10).toFixed(1);\r\n                if (d200El) d200El.innerText = timchkElapsed;\r\n            }\r\n\r\n            // 2. 1초 주기 갱신\r\n            if (currentSecond !== lastSecondLogged) {\r\n                lastSecondLogged = currentSecond;\r\n\r\n                // 헤더 RTC 시계\r\n                const headerClock = document.getElementById('header-clock');\r\n                if (headerClock) {\r\n                    headerClock.innerText = `${formatDate(now)} ${formatTime(now)} (${DOW_NAMES[now.getDay()]})`;\r\n                }\r\n\r\n                // DATERD / DATEWR 상단 실시간 RTC 시계\r\n                const liveEl = document.getElementById('sim-live-time');\r\n                if (liveEl && (currentOp === 'DATERD' || currentOp === 'DATEWR')) {\r\n                    const colorClass = currentOp === 'DATERD' ? 'text-yellow-400' : 'text-cyan-400';\r\n                    liveEl.innerHTML = `\r\n                        ${formatDate(now)}<br/>\r\n                        <span class=\"text-3xl ${colorClass}\">${formatTime(now)}<\/span>\r\n                        <span class=\"text-lg text-slate-400 ml-2\">(${DOW_NAMES[now.getDay()]}요일)<\/span>\r\n                    `;\r\n                }\r\n\r\n                // DUTY 펄스 연산 및 뷰 갱신\r\n                if (isDutyRunning && currentOp === 'DUTY') {\r\n                    dutyPhase = (dutyPhase + 1) % (dutySettings.total || 1);\r\n                    const isLampOn = dutyPhase < dutySettings.on;\r\n                    const pct = dutySettings.total > 0 ? (dutyPhase / dutySettings.total) * 100 : 0;\r\n\r\n                    const bar = document.getElementById('duty-bar');\r\n                    if (bar) bar.style.width = `${pct}%`;\r\n\r\n                    const phaseText = document.getElementById('duty-phase-text');\r\n                    if (phaseText) {\r\n                        phaseText.innerText = `주기 진행: ${dutyPhase}s / ${dutySettings.total}s (${isLampOn ? 'ON 구간' : 'OFF 구간'})`;\r\n                    }\r\n\r\n                    const lamp = document.getElementById('duty-lamp');\r\n                    if (lamp) {\r\n                        if (isLampOn) lamp.classList.add('on');\r\n                        else lamp.classList.remove('on');\r\n                    }\r\n                }\r\n\r\n                // TCMP 현재 시각 및 판정 램프 갱신\r\n                if (currentOp === 'TCMP') {\r\n                    const tcmpLive = document.getElementById('tcmp-current-time');\r\n                    if (tcmpLive) tcmpLive.innerText = formatTime(now);\r\n\r\n                    const targetVal = tcmpTime.hour * 3600 + tcmpTime.min * 60 + tcmpTime.sec;\r\n                    const currVal = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();\r\n\r\n                    const lM10 = document.getElementById('lamp-m10');\r\n                    const lM11 = document.getElementById('lamp-m11');\r\n                    const lM12 = document.getElementById('lamp-m12');\r\n\r\n                    if (lM10) lM10.className = `lamp ${targetVal < currVal ? 'on' : ''}`;\r\n                    if (lM11) lM11.className = `lamp yellow ${targetVal === currVal ? 'on' : ''}`;\r\n                    if (lM12) lM12.className = `lamp ${targetVal > currVal ? 'on' : ''}`;\r\n                }\r\n            }\r\n        }, 100);\r\n\r\n        // 초기화\r\n        window.onload = () => {\r\n            const now = getSimulatedTime();\r\n            rtcMemory = {\r\n                year: now.getFullYear(),\r\n                month: now.getMonth() + 1,\r\n                day: now.getDate(),\r\n                hour: now.getHours(),\r\n                min: now.getMinutes(),\r\n                sec: now.getSeconds(),\r\n                dow: now.getDay()\r\n            };\r\n            editRTC = {\r\n                year: now.getFullYear(),\r\n                month: now.getMonth() + 1,\r\n                day: now.getDate(),\r\n                hour: 12,\r\n                min: 0,\r\n                sec: 0\r\n            };\r\n\r\n            initMemos();\r\n            selectOp('DATERD');\r\n            safeCreateIcons();\r\n        };\r\n    <\/script>\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p4","label":"DSFR 워드  시프트","title":"PLC DSFR 명령어 워드 시프트","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-DSFR_%EC%9B%8C%EB%93%9C_%20%EC%8B%9C%ED%94%84%ED%8A%B8.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC DSFR 명령어 워드 시프트 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.95);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.8rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 10px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n            border: 1px solid #000000;\r\n        }\r\n\r\n        /* 워드 박스 스타일 (SFR 스타일 계승) */\r\n        .bit-group-container {\r\n            display: grid;\r\n            grid-template-columns: repeat(10, 1fr);\r\n            gap: 4px;\r\n            background: #fff;\r\n            padding: 8px;\r\n            border: 3px solid #000;\r\n            width: 100%;\r\n            max-width: 900px;\r\n        }\r\n\r\n        .unit-box {\r\n            height: 52px;\r\n            display: flex;\r\n            flex-direction: column;\r\n            align-items: center;\r\n            justify-content: center;\r\n            position: relative;\r\n            border: 1px solid #cbd5e1;\r\n            z-index: 10;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .unit-label {\r\n            font-size: 0.55rem;\r\n            font-weight: 800;\r\n            color: #64748b;\r\n            margin-bottom: 1px;\r\n        }\r\n\r\n        .unit-value {\r\n            font-size: 0.85rem;\r\n            font-weight: 900;\r\n            width: 100%;\r\n            text-align: center;\r\n            background: transparent;\r\n            outline: none;\r\n            border: none;\r\n            color: #1e293b;\r\n        }\r\n\r\n        .interactive .unit-box:hover {\r\n            background: #f8fafc;\r\n            border-color: #000;\r\n            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.1);\r\n        }\r\n\r\n        .result-view .unit-box {\r\n            background: #f8fafc;\r\n            opacity: 0.8;\r\n        }\r\n\r\n        .result-view .unit-box.new-zero {\r\n            background: #f1f5f9;\r\n            color: #cbd5e1;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        .btn-shift {\r\n            border: 3px solid #000;\r\n            box-shadow: 4px 4px 0px #000;\r\n            transition: all 0.1s;\r\n            cursor: pointer;\r\n        }\r\n\r\n        .btn-shift:active {\r\n            transform: translate(2px, 2px);\r\n            box-shadow: 1px 1px 0px #000;\r\n        }\r\n\r\n        /* 시프트 화살표 SVG */\r\n        #shift-overlay {\r\n            position: absolute;\r\n            top: 0;\r\n            left: 0;\r\n            width: 100%;\r\n            height: 100%;\r\n            pointer-events: none;\r\n            z-index: 100;\r\n        }\r\n\r\n        .shift-arrow-path {\r\n            fill: none;\r\n            stroke: #2563eb;\r\n            stroke-width: 1.2;\r\n            stroke-dasharray: 4, 4;\r\n            animation: dash 20s linear infinite;\r\n            opacity: 0.35;\r\n            transition: d 0.4s cubic-bezier(0.4, 0, 0.2, 1);\r\n        }\r\n\r\n        .arrow-to-lost {\r\n            stroke: #ef4444;\r\n            opacity: 0.6;\r\n            stroke-width: 2;\r\n        }\r\n\r\n        @keyframes dash {\r\n            to {\r\n                stroke-dashoffset: -1000;\r\n            }\r\n        }\r\n\r\n        .lost-zone {\r\n            width: 65px;\r\n            height: 65px;\r\n            border: 4px dashed #ef4444;\r\n            background: #fef2f2;\r\n            border-radius: 0.75rem;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            color: #ef4444;\r\n            font-weight: 900;\r\n            font-size: 0.9rem;\r\n            transition: transform 0.2s;\r\n        }\r\n\r\n        /* 업/다운 버튼 디자인 */\r\n        .ud-btn {\r\n            background: #fff;\r\n            border: 2px solid #000;\r\n            padding: 2px 8px;\r\n            font-weight: bold;\r\n            transition: 0.1s;\r\n            line-height: 1;\r\n        }\r\n\r\n        .ud-btn:hover {\r\n            background: #000;\r\n            color: #fff;\r\n        }\r\n\r\n        .ud-btn:active {\r\n            transform: scale(0.9);\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-[1450px] mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header: DSFR(EN, n, d) 순서 반영 -->\r\n        <div class=\"glass-header p-6 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-3xl font-black text-black uppercase tracking-tight\">DSFR(P) 워드 시프트 시뮬레이터<\/h1>\r\n                <p class=\"text-sm font-bold text-slate-500 mt-1 uppercase\">Word Data 1-Station Right Shift (Max 100)<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-10 py-6 flex items-center gap-6 font-mono text-2xl\">\r\n                <span class=\"text-slate-400 font-black\">DSFR(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">1<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <!-- 순서 변경: n이 먼저 옴 -->\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"label-n\">7<\/span>\r\n                    <span class=\"param-label\">개수(n)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">대상(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content -->\r\n        <div class=\"flex-1 flex p-6 gap-6 overflow-hidden relative\">\r\n\r\n            <!-- Left: Simulator Area -->\r\n            <div class=\"w-[72%] flex flex-col gap-4 justify-center\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-6 flex flex-col items-center flex-1 relative\">\r\n                    <div class=\"w-full flex justify-between items-center mb-6\">\r\n                        <h3 class=\"text-xl font-black text-black flex items-center gap-3\">\r\n                            <div class=\"w-4 h-4 bg-blue-600 border-2 border-black rounded-full\"><\/div>\r\n                            DATA BLOCK VISUALIZATION (MAX 100)\r\n                        <\/h3>\r\n                        <div class=\"flex items-center gap-4\">\r\n                            <!-- n 조절 업/다운 버튼 -->\r\n                            <div class=\"flex items-center gap-3 bg-white px-4 py-2 border-2 border-black rounded-xl\">\r\n                                <label class=\"text-[0.65rem] font-black text-slate-400 uppercase\">Shift Range\r\n                                    (n):<\/label>\r\n                                <input type=\"number\" id=\"n-input\" value=\"7\" min=\"2\" max=\"100\" oninput=\"changeN()\"\r\n                                    class=\"w-16 text-center text-2xl font-black outline-none text-blue-600\">\r\n                                <div class=\"flex flex-col gap-1\">\r\n                                    <button onclick=\"stepN(1)\" class=\"ud-btn text-[0.7rem]\">▲<\/button>\r\n                                    <button onclick=\"stepN(-1)\" class=\"ud-btn text-[0.7rem]\">▼<\/button>\r\n                                <\/div>\r\n                            <\/div>\r\n                            <button onclick=\"executeShift()\"\r\n                                class=\"btn-shift bg-blue-600 text-white px-10 py-3 font-black rounded-lg uppercase text-lg\">Shift<\/button>\r\n                            <button onclick=\"resetData()\"\r\n                                class=\"btn-shift bg-white text-black px-10 py-3 font-black rounded-lg text-lg\">초기화<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"flex-1 w-full flex flex-col justify-center gap-8 relative overflow-y-auto pr-3\"\r\n                        id=\"simulator-viewport\">\r\n                        <!-- Dynamic Path Layer -->\r\n                        <svg id=\"shift-overlay\">\r\n                            <g id=\"arrows-container\"><\/g>\r\n                        <\/svg>\r\n\r\n                        <!-- Source Data Row -->\r\n                        <div class=\"flex flex-col items-center w-full\">\r\n                            <div\r\n                                class=\"text-[0.6rem] font-black text-slate-400 uppercase mb-3 tracking-widest border-b border-slate-200 w-full text-center pb-1\">\r\n                                Source Data Block (D10 Start)<\/div>\r\n                            <div id=\"grid-before\" class=\"bit-group-container interactive\"><\/div>\r\n                        <\/div>\r\n\r\n                        <div class=\"flex justify-center text-slate-200 text-3xl font-black\">⬇️<\/div>\r\n\r\n                        <!-- Result Data Row -->\r\n                        <div class=\"flex flex-col items-center w-full\">\r\n                            <div\r\n                                class=\"text-[0.6rem] font-black text-blue-400 uppercase mb-3 tracking-widest border-b border-blue-100 w-full text-center pb-1\">\r\n                                Shifted Result (Expected State)<\/div>\r\n                            <div class=\"flex items-start w-full justify-center\">\r\n                                <div id=\"grid-after\" class=\"bit-group-container result-view\"><\/div>\r\n                                <!-- Discarded Zone -->\r\n                                <div class=\"ml-6 flex flex-col items-center\">\r\n                                    <div id=\"lost-box\" class=\"lost-zone\">X<\/div>\r\n                                    <span\r\n                                        class=\"text-[0.6rem] font-black mt-2 text-red-500 uppercase tracking-tighter\">Lost\r\n                                        (D10)<\/span>\r\n                                <\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"mt-4 w-full flex justify-between items-center bg-black p-5 rounded-xl shadow-lg\">\r\n                        <div class=\"text-white\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1 tracking-wider\">Device\r\n                                Address Range<\/div>\r\n                            <div class=\"text-2xl font-black\" id=\"range-text\">D10 ~ D16<\/div>\r\n                        <\/div>\r\n                        <div class=\"text-right\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1 tracking-wider\">Words\r\n                                Counted<\/div>\r\n                            <div class=\"text-2xl font-black text-yellow-400\" id=\"stat-n\">7 Words<\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right: Description & Code -->\r\n            <div class=\"w-[28%] flex flex-col gap-6\">\r\n                <div class=\"bg-blue-900 rounded-3xl p-8 flex flex-col text-white shadow-2xl\">\r\n                    <h3 class=\"text-blue-300 font-black text-sm uppercase tracking-widest mb-6\">DSFR 동작 메커니즘<\/h3>\r\n                    <ul class=\"space-y-4 text-[0.85rem] font-bold\">\r\n                        <li class=\"flex gap-3 items-start\"><span class=\"text-blue-400\">●<\/span><span>데이터가 낮은 주소 방향(D10\r\n                                쪽)으로 1워드 통째로 밀립니다.<\/span><\/li>\r\n                        <li class=\"flex gap-3 items-start\"><span class=\"text-blue-400\">●<\/span><span>가장 끝(D10)에 있던 데이터는\r\n                                밖으로 소멸됩니다.<\/span><\/li>\r\n                        <li class=\"flex gap-3 items-start\"><span class=\"text-blue-400\">●<\/span><span>데이터가 빠져나간 최상위 주소\r\n                                빈자리는 0으로 채워집니다.<\/span><\/li>\r\n                    <\/ul>\r\n                <\/div>\r\n\r\n                <div class=\"code-block rounded-3xl p-8 flex-1 shadow-2xl flex flex-col\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">DSFR<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[1.1rem] leading-relaxed text-blue-100 flex-1 overflow-y-auto\">\r\n<span class=\"comment\">// DSFR(EN, n, d) 순서 적용<\/span>\r\n<span class=\"comment\">// D10부터 <span id=\"code-n\">7<\/span>개 워드 시프트<\/span>\r\n\r\nDSFRP(1, <span id=\"code-n2\">7<\/span>, <span class=\"var\">D10<\/span>);\r\n\r\n<span class=\"comment\">// [결과 분석]<\/span>\r\n<span class=\"comment\">// D11 ➔ D10 (이동)<\/span>\r\n<span class=\"comment\" id=\"code-move-max\">// D16 ➔ D15 (이동)<\/span>\r\n<span class=\"comment\" id=\"code-fill\">// 0   ➔ D16 (채움)<\/span><\/pre>\r\n                <\/div>\r\n            <\/div>\r\n\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let n = 7;\r\n        const startAddr = 10;\r\n        // 100개 데이터 초기화\r\n        let wordData = Array.from({ length: 100 }, (_, i) => Math.floor(Math.random() * 999));\r\n\r\n        function init() {\r\n            renderGrid('grid-before', true);\r\n            renderGrid('grid-after', false);\r\n            updateUI();\r\n            setTimeout(drawAllArrows, 300);\r\n        }\r\n\r\n        function renderGrid(targetId, interactive) {\r\n            const container = document.getElementById(targetId);\r\n            container.innerHTML = '';\r\n\r\n            // 10개씩 줄바꿈되는 그리드 생성\r\n            for (let i = 0; i < n; i++) {\r\n                const addr = startAddr + i;\r\n                const div = document.createElement('div');\r\n                div.className = `unit-box word-node-${i} ${interactive ? 'interactive' : ''}`;\r\n\r\n                const val = wordData[i] || 0;\r\n                div.innerHTML = `\r\n                <span class=\"unit-label\">D${addr}<\/span>\r\n                <input type=\"number\" value=\"${val}\" class=\"unit-value\" ${interactive ? '' : 'disabled'} oninput=\"updateData(${i}, this.value)\">\r\n            `;\r\n                container.appendChild(div);\r\n            }\r\n        }\r\n\r\n        function stepN(delta) {\r\n            const input = document.getElementById('n-input');\r\n            let val = parseInt(input.value) + delta;\r\n            if (val < 2) val = 2;\r\n            if (val > 100) val = 100;\r\n            input.value = val;\r\n            changeN();\r\n        }\r\n\r\n        function changeN() {\r\n            const input = document.getElementById('n-input');\r\n            let val = parseInt(input.value) || 2;\r\n            if (val > 100) val = 100;\r\n            n = val;\r\n            init();\r\n        }\r\n\r\n        function updateData(idx, val) {\r\n            wordData[idx] = parseInt(val) || 0;\r\n            drawAllArrows();\r\n        }\r\n\r\n        function drawAllArrows() {\r\n            const container = document.getElementById('arrows-container');\r\n            const overlay = document.getElementById('shift-overlay');\r\n            const lostBox = document.getElementById('lost-box');\r\n            container.innerHTML = '';\r\n\r\n            const rectOverlay = overlay.getBoundingClientRect();\r\n            const lostRect = lostBox.getBoundingClientRect();\r\n\r\n            // 화살표 그리기 (성능 및 시각적 조절을 위해 n이 많으면 투명도 조절)\r\n            for (let i = 0; i < n; i++) {\r\n                const fromEl = document.querySelector(`#grid-before .word-node-${i}`);\r\n                if (!fromEl) continue;\r\n\r\n                const fromRect = fromEl.getBoundingClientRect();\r\n                const x1 = fromRect.left + fromRect.width / 2 - rectOverlay.left;\r\n                const y1 = fromRect.top + fromRect.height / 2 - rectOverlay.top;\r\n\r\n                let x2, y2, isLost = false;\r\n\r\n                if (i > 0) {\r\n                    const toEl = document.querySelector(`#grid-after .word-node-${i - 1}`);\r\n                    if (toEl) {\r\n                        const toRect = toEl.getBoundingClientRect();\r\n                        x2 = toRect.left + toRect.width / 2 - rectOverlay.left;\r\n                        y2 = toRect.top + toRect.height / 2 - rectOverlay.top;\r\n                    }\r\n                } else {\r\n                    x2 = lostRect.left + lostRect.width / 2 - rectOverlay.left;\r\n                    y2 = lostRect.top + lostRect.height / 2 - rectOverlay.top;\r\n                    isLost = true;\r\n                }\r\n\r\n                if (x1 && x2) {\r\n                    const path = document.createElementNS(\"http://www.w3.org/2000/svg\", \"path\");\r\n                    path.setAttribute('class', `shift-arrow-path ${isLost ? 'arrow-to-lost' : ''}`);\r\n\r\n                    const cp1y = y1 + (y2 - y1) * 0.45;\r\n                    const cp2y = y1 + (y2 - y1) * 0.55;\r\n                    const d = `M ${x1},${y1} C ${x1},${cp1y} ${x2},${cp2y} ${x2},${y2}`;\r\n\r\n                    path.setAttribute('d', d);\r\n                    container.appendChild(path);\r\n                }\r\n            }\r\n        }\r\n\r\n        function executeShift() {\r\n            const lostVal = wordData[0];\r\n            const lostBox = document.getElementById('lost-box');\r\n            lostBox.innerText = lostVal;\r\n            lostBox.style.transform = \"scale(1.1)\";\r\n            setTimeout(() => lostBox.style.transform = \"scale(1)\", 200);\r\n\r\n            // 실제 데이터 이동 로직\r\n            for (let i = 0; i < n - 1; i++) {\r\n                wordData[i] = wordData[i + 1];\r\n            }\r\n            wordData[n - 1] = 0;\r\n\r\n            init();\r\n        }\r\n\r\n        function updateUI() {\r\n            document.getElementById('label-n').innerText = n;\r\n            document.getElementById('code-n').innerText = n;\r\n            document.getElementById('code-n2').innerText = n;\r\n            document.getElementById('stat-n').innerText = n + \" Words\";\r\n            document.getElementById('range-text').innerText = `D${startAddr} ~ D${startAddr + n - 1}`;\r\n            document.getElementById('code-move-max').innerText = `// D${startAddr + n - 1} ➔ D${startAddr + n - 2}`;\r\n            document.getElementById('code-fill').innerText = `// 0 ➔ D${startAddr + n - 1}`;\r\n        }\r\n\r\n        function resetData() {\r\n            wordData = Array.from({ length: 100 }, (_, i) => Math.floor(Math.random() * 999));\r\n            document.getElementById('lost-box').innerText = \"X\";\r\n            init();\r\n        }\r\n\r\n        window.onload = init;\r\n        window.onresize = drawAllArrows;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p5","label":"DSORTD 정렬","title":"DSORTD-32비트 데이터 정렬","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-DSORTD_%EC%A0%95%EB%A0%AC.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>DSORTD-32비트 데이터 정렬 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <script src=\"https://unpkg.com/lucide@latest\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #f1f5f9;\r\n        }\r\n\r\n        .zodd-card {\r\n            background: white;\r\n            border: 4px solid #000;\r\n            border-radius: 24px;\r\n            box-shadow: 8px 8px 0px #000;\r\n        }\r\n\r\n        .pointer-box {\r\n            background: #1e293b;\r\n            color: #3b82f6;\r\n            border: 3px solid #3b82f6;\r\n            border-radius: 12px;\r\n            font-family: monospace;\r\n        }\r\n\r\n        /* 탭 스타일 */\r\n        .tab-btn {\r\n            border-bottom: 4px solid transparent;\r\n            transition: 0.2s;\r\n            white-space: nowrap;\r\n            font-size: 1.1rem;\r\n            padding: 10px 14px;\r\n        }\r\n\r\n        .tab-btn.active {\r\n            border-bottom-color: #2563eb;\r\n            color: #2563eb;\r\n            font-weight: 900;\r\n            background: rgba(37, 99, 235, 0.05);\r\n        }\r\n\r\n        /* 명령어 버튼 액티브 상태 */\r\n        .op-select-btn {\r\n            border: 3px solid #000;\r\n            transition: all 0.2s;\r\n            position: relative;\r\n            overflow: hidden;\r\n            height: 85px;\r\n            text-align: left;\r\n            padding: 0 20px;\r\n        }\r\n\r\n        .op-select-btn .btn-main-label {\r\n            font-size: 1.5rem;\r\n            font-weight: 900;\r\n            display: block;\r\n        }\r\n\r\n        .op-select-btn .btn-sub-label {\r\n            font-size: 0.9rem;\r\n            font-weight: 700;\r\n            opacity: 0.6;\r\n        }\r\n\r\n        .op-select-btn.active {\r\n            background: #2563eb !important;\r\n            color: white !important;\r\n            transform: scale(1.02);\r\n            z-index: 20;\r\n            box-shadow: 4px 4px 0px #000;\r\n        }\r\n\r\n        .op-select-btn.active i {\r\n            color: white !important;\r\n        }\r\n\r\n        .data-input {\r\n            width: 100%;\r\n            background: transparent;\r\n            text-align: center;\r\n            font-weight: 900;\r\n            font-size: 1.8rem;\r\n            outline: none;\r\n            border: none;\r\n            color: #1e293b;\r\n        }\r\n\r\n        input::-webkit-outer-spin-button,\r\n        input::-webkit-inner-spin-button {\r\n            -webkit-appearance: none;\r\n            margin: 0;\r\n        }\r\n\r\n        /* 업/다운 버튼 */\r\n        .ud-btn {\r\n            background: #000;\r\n            color: #fff;\r\n            width: 36px;\r\n            height: 32px;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            border-radius: 8px;\r\n            font-size: 0.75rem;\r\n            transition: all 0.1s;\r\n        }\r\n\r\n        .ud-btn:hover {\r\n            background: #334155;\r\n        }\r\n\r\n        .ud-btn:active {\r\n            transform: scale(0.9);\r\n        }\r\n\r\n        /* ST 구문 초대형 폰트 */\r\n        .st-syntax-large {\r\n            background: #020617;\r\n            border-left: 10px solid #2563eb;\r\n            padding: 25px;\r\n            border-radius: 16px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 2.2rem;\r\n            font-weight: 800;\r\n            color: #38bdf8;\r\n            margin-bottom: 25px;\r\n            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);\r\n            line-height: 1.2;\r\n        }\r\n\r\n        .st-code-box {\r\n            background: #000;\r\n            border: 1px solid #334155;\r\n            padding: 16px;\r\n            border-radius: 12px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 0.95rem;\r\n            color: #ec4899;\r\n            line-height: 1.5;\r\n        }\r\n\r\n        /* 오퍼랜드 표 폰트 확대 */\r\n        .operand-table {\r\n            width: 100%;\r\n            border-collapse: collapse;\r\n            margin-top: 10px;\r\n        }\r\n\r\n        .operand-table th {\r\n            background: #334155;\r\n            color: #94a3b8;\r\n            font-size: 0.9rem;\r\n            text-align: left;\r\n            padding: 8px 12px;\r\n            border: 1px solid #1e293b;\r\n        }\r\n\r\n        .operand-table td {\r\n            font-size: 1rem;\r\n            padding: 12px;\r\n            border: 1px solid #334155;\r\n            color: #e2e8f0;\r\n            font-weight: 600;\r\n            line-height: 1.4;\r\n        }\r\n\r\n        .op-tag {\r\n            font-weight: 800;\r\n            color: #3b82f6;\r\n            background: #1e293b;\r\n            padding: 2px 6px;\r\n            border-radius: 4px;\r\n        }\r\n\r\n        /* 메모장 스타일 */\r\n        .memo-textarea {\r\n            width: 100%;\r\n            background: #1e293b;\r\n            border: 2px solid #334155;\r\n            border-radius: 16px;\r\n            padding: 20px;\r\n            color: #f8fafc;\r\n            font-size: 1rem;\r\n            line-height: 1.7;\r\n            outline: none;\r\n            resize: none;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .memo-textarea:focus {\r\n            border-color: #2563eb;\r\n            background: #0f172a;\r\n        }\r\n\r\n        .save-indicator {\r\n            font-size: 0.65rem;\r\n            color: #22c55e;\r\n            font-weight: bold;\r\n            opacity: 0;\r\n            transition: opacity 0.3s;\r\n        }\r\n\r\n        .save-indicator.show {\r\n            opacity: 1;\r\n        }\r\n\r\n        /* 스위치 스타일 (SM703) */\r\n        .toggle-switch {\r\n            position: relative;\r\n            display: inline-block;\r\n            width: 50px;\r\n            height: 26px;\r\n        }\r\n\r\n        .toggle-switch input {\r\n            opacity: 0;\r\n            width: 0;\r\n            height: 0;\r\n        }\r\n\r\n        .slider {\r\n            position: absolute;\r\n            cursor: pointer;\r\n            top: 0;\r\n            left: 0;\r\n            right: 0;\r\n            bottom: 0;\r\n            background-color: #ccc;\r\n            transition: .4s;\r\n            border-radius: 34px;\r\n            border: 2px solid #000;\r\n        }\r\n\r\n        .slider:before {\r\n            position: absolute;\r\n            content: \"\";\r\n            height: 18px;\r\n            width: 18px;\r\n            left: 2px;\r\n            bottom: 2px;\r\n            background-color: white;\r\n            transition: .4s;\r\n            border-radius: 50%;\r\n            border: 1px solid #000;\r\n        }\r\n\r\n        input:checked+.slider {\r\n            background-color: #2563eb;\r\n        }\r\n\r\n        input:checked+.slider:before {\r\n            transform: translateX(24px);\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar {\r\n            width: 6px;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar-thumb {\r\n            background: #cbd5e1;\r\n            border-radius: 10px;\r\n        }\r\n\r\n        /* 램프 스타일 */\r\n        .status-lamp {\r\n            width: 12px;\r\n            height: 12px;\r\n            border-radius: 50%;\r\n            border: 1px solid #000;\r\n            display: inline-block;\r\n            margin-right: 6px;\r\n        }\r\n\r\n        .lamp-off {\r\n            background: #94a3b8;\r\n            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);\r\n        }\r\n\r\n        .lamp-on {\r\n            background: #22c55e;\r\n            box-shadow: 0 0 8px #22c55e;\r\n        }\r\n\r\n        .lamp-on-rose {\r\n            background: #ef4444;\r\n            box-shadow: 0 0 8px #ef4444;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4 h-screen flex flex-col overflow-hidden\">\r\n\r\n    <!-- Header: 제목 수정 반영 -->\r\n    <div class=\"zodd-card p-4 flex justify-between items-center mb-4\">\r\n        <div class=\"flex items-center gap-4\">\r\n            <div class=\"bg-blue-600 p-2 rounded-xl text-white shadow-lg\"><i data-lucide=\"shuffle\" size=\"30\"><\/i><\/div>\r\n            <div>\r\n                <h1 class=\"text-3xl font-black uppercase tracking-tighter text-slate-800\">\r\n                    <span class=\"text-blue-600\">DSORTD<\/span>-32비트 데이터 정렬\r\n                <\/h1>\r\n                <p class=\"text-xs font-bold text-slate-400 uppercase tracking-widest text-blue-600\">32비트 부호 있는 데이터 정렬 시뮬레이션 엔진<\/p>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"flex items-center gap-4\">\r\n            <div class=\"pointer-box px-8 py-3 text-center border-4 border-black min-w-[160px]\">\r\n                <span class=\"text-[0.6rem] font-black block opacity-70 uppercase tracking-tight\">정렬 완료 (M0)<\/span>\r\n                <span id=\"done-bit\" class=\"text-2xl font-black text-white\">OFF<\/span>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- 4-Column Layout -->\r\n    <div class=\"flex-1 flex gap-4 overflow-hidden\">\r\n\r\n        <!-- Col 1: Logic Buttons (18%) -->\r\n        <div class=\"w-[18%] flex flex-col gap-4\">\r\n            <div class=\"zodd-card p-6 flex flex-col h-full shadow-[6px_6px_0px_#000]\">\r\n                <h3 class=\"text-xs font-black text-slate-400 uppercase mb-5 border-b-2 pb-2 flex items-center gap-2\">\r\n                    <i data-lucide=\"zap\" size=\"16\"><\/i> 명령어 선택\r\n                <\/h3>\r\n                <div class=\"space-y-3 flex-1 overflow-y-auto custom-scrollbar\">\r\n                    <button class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between active\">\r\n                        <div><span class=\"btn-main-label\">DSORTD<\/span><span class=\"btn-sub-label\">(32비트 데이터 정렬)<\/span>\r\n                        <\/div>\r\n                        <i data-lucide=\"chevron-right\"><\/i>\r\n                    <\/button>\r\n                    <div class=\"p-5 bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl text-center\">\r\n                        <span\r\n                            class=\"text-[0.65rem] font-black text-blue-400 uppercase tracking-widest leading-relaxed\">멀티 워드 로직<br />활성화됨<\/span>\r\n                    <\/div>\r\n                <\/div>\r\n                <div class=\"flex flex-col gap-2\">\r\n                    <button onclick=\"randomizeTable()\"\r\n                        class=\"bg-emerald-500 hover:bg-emerald-600 text-white p-3 rounded-xl border-2 border-black font-black text-xs uppercase tracking-widest shadow-[3px_3px_0px_#000] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2\">\r\n                        <i data-lucide=\"refresh-cw\" size=\"14\"><\/i> 랜덤 데이터 생성\r\n                    <\/button>\r\n                    <button onclick=\"resetTable()\"\r\n                        class=\"mt-2 text-slate-400 font-black text-xs uppercase tracking-widest hover:text-red-600\">메모리 초기화<\/button>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 2: Live Monitor (32%) -->\r\n        <div class=\"w-[32%] flex flex-col gap-4 relative\">\r\n            <div class=\"zodd-card p-6 flex-1 flex flex-col shadow-[10px_10px_0px_#000] overflow-hidden relative\">\r\n                <div class=\"flex justify-between items-end mb-6\">\r\n                    <div>\r\n                        <span class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest block\">실행 모드<\/span>\r\n                        <h2 id=\"status-display\" class=\"text-3xl font-black text-slate-800 tracking-tighter uppercase\">\r\n                            대기 중<\/h2>\r\n                    <\/div>\r\n\r\n                    <div\r\n                        class=\"flex flex-col items-end gap-2 bg-slate-100 p-3 rounded-2xl border-2 border-black shadow-sm\">\r\n                        <span class=\"text-[0.6rem] font-black text-slate-500 uppercase\">SM703 (정렬 순서)<\/span>\r\n                        <div class=\"flex items-center gap-3\">\r\n                            <div class=\"flex items-center gap-1.5\">\r\n                                <div id=\"sm703-lamp\" class=\"status-lamp lamp-off\"><\/div>\r\n                                <span id=\"sm703-label\" class=\"text-[0.75rem] font-black text-blue-600 uppercase\">OFF (오름)<\/span>\r\n                            <\/div>\r\n                            <label class=\"toggle-switch\">\r\n                                <input type=\"checkbox\" id=\"sm703-toggle\" onchange=\"updateSortMode()\">\r\n                                <span class=\"slider\"><\/span>\r\n                            <\/label>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"grid grid-cols-2 gap-4 mb-6\">\r\n                    <div class=\"bg-slate-50 p-4 rounded-3xl border-2 border-black flex items-center justify-between\">\r\n                        <div class=\"flex-1\">\r\n                            <label class=\"text-[0.65rem] font-black text-slate-500 uppercase block mb-1\">데이터 수 (N)<\/label>\r\n                            <input type=\"number\" id=\"input-n\" value=\"6\" min=\"2\" max=\"10\"\r\n                                class=\"data-input text-blue-600\" onchange=\"renderTable()\">\r\n                        <\/div>\r\n                        <div class=\"flex flex-col gap-1 ml-3\">\r\n                            <button onclick=\"stepN(1)\" class=\"ud-btn\">▲<\/button>\r\n                            <button onclick=\"stepN(-1)\" class=\"ud-btn\">▼<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                    <div class=\"bg-slate-50 p-4 rounded-3xl border-2 border-black flex items-center justify-between\">\r\n                        <div class=\"flex-1\">\r\n                            <label class=\"text-[0.65rem] font-black text-slate-500 uppercase block mb-1\">정렬 속도 (S2)<\/label>\r\n                            <input type=\"number\" id=\"input-s2\" value=\"2\" min=\"1\" max=\"10\"\r\n                                class=\"data-input text-orange-600\">\r\n                        <\/div>\r\n                        <div class=\"flex flex-col gap-1 ml-3\">\r\n                            <button onclick=\"stepS2(1)\" class=\"ud-btn\">▲<\/button>\r\n                            <button onclick=\"stepS2(-1)\" class=\"ud-btn\">▼<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"flex gap-3 mb-6\">\r\n                    <button onclick=\"undo()\" id=\"undo-btn\"\r\n                        class=\"flex-1 bg-slate-800 hover:bg-black text-white h-20 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-xl flex items-center justify-center gap-3 transition-all\">\r\n                        <i data-lucide=\"rotate-ccw\"><\/i> 되돌리기\r\n                    <\/button>\r\n                    <button onclick=\"runSort()\" id=\"exec-btn\"\r\n                        class=\"flex-[1.5] bg-blue-600 hover:bg-blue-700 text-white h-20 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-2xl flex items-center justify-center gap-3 transition-all\">\r\n                        <i data-lucide=\"play-circle\" fill=\"white\"><\/i> 정렬 시작\r\n                    <\/button>\r\n                <\/div>\r\n\r\n                <div class=\"flex-1 overflow-y-auto custom-scrollbar pr-2 relative\">\r\n                    <div\r\n                        class=\"grid grid-cols-[100px_1fr_60px] gap-4 mb-4 px-2 italic font-black text-slate-300 text-[0.7rem] uppercase tracking-widest\">\r\n                        <div>디바이스 주소 (2W)<\/div>\r\n                        <div class=\"text-center\">32비트 부호 있는 데이터<\/div>\r\n                        <div class=\"text-right\">인덱스<\/div>\r\n                    <\/div>\r\n                    <div id=\"table-body\" class=\"space-y-3 pb-10\"><\/div>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 3: Technical Handbook (25%) -->\r\n        <div class=\"w-[25%] flex flex-col overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] overflow-hidden border-2 border-slate-700\">\r\n                <div class=\"flex items-center gap-3 mb-6 border-b border-slate-700 pb-4\">\r\n                    <i data-lucide=\"book-open\" class=\"text-pink-500\"><\/i>\r\n                    <h3 class=\"text-xl font-black uppercase tracking-widest\">기술 가이드<\/h3>\r\n                    <div id=\"save-status\" class=\"save-indicator ml-auto\">저장 완료!<\/div>\r\n                <\/div>\r\n\r\n                <div class=\"space-y-6 flex-1 overflow-y-auto custom-scrollbar pr-2\">\r\n                    <div class=\"bg-slate-800/80 p-6 rounded-3xl border-2 border-slate-700 shadow-inner\">\r\n                        <h4 class=\"text-2xl font-black text-blue-400 mb-2\">DSORTD (32-bit Sort)<\/h4>\r\n                        <div class=\"st-syntax-large text-emerald-400\">DSORTD(EN, s1, n, s2, d1, d2);<\/div>\r\n                        <p class=\"text-sm font-bold text-slate-300 leading-relaxed mb-4\">\r\n                            (s1)부터 시작하는 BIN32(32비트) 데이터 (n)개를 오름차순/내림차순 정렬합니다.<\/p>\r\n\r\n                        <div class=\"mt-2\">\r\n                            <span\r\n                                class=\"text-[0.7rem] font-black text-slate-500 uppercase tracking-widest block mb-3 border-b border-slate-700 pb-1\">피연산자 사양<\/span>\r\n                            <table class=\"operand-table\">\r\n                                <thead>\r\n                                    <tr>\r\n                                        <th>피연산자<\/th>\r\n                                        <th>설명<\/th>\r\n                                    <\/tr>\r\n                                <\/thead>\r\n                                <tbody>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(s1)<\/span><\/td>\r\n                                        <td>테이블 선두 디바이스 (D100)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(n)<\/span><\/td>\r\n                                        <td>정렬 데이터 수 (2~10)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(s2)<\/span><\/td>\r\n                                        <td>1회 비교 데이터 수<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(d1)<\/span><\/td>\r\n                                        <td>정렬 완료 비트 (M0)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n
