>(d)<\/span> 최초 위치 / <span class=\"font-bold text-amber-900\">(d)+1<\/span> 총 개수 저장\r\n                <\/p>\r\n            <\/div>\r\n\r\n            <!-- Inputs (폰트 확대) -->\r\n            <div class=\"space-y-4\">\r\n                <div class=\"input-card rounded-xl p-5 bg-slate-50\">\r\n                    <h3 class=\"text-blue-700 text-sm font-extrabold flex items-center gap-2 mb-2\">검색 키워드 (s1)<\/h3>\r\n                    <div class=\"text-center text-[0.7rem] text-slate-400 font-mono mb-1\">D10 [st_KeyData]<\/div>\r\n                    <input type=\"number\" id=\"s1-val\" value=\"123\" oninput=\"runSearch()\" \r\n                           class=\"w-full bg-transparent text-center text-4xl font-black text-blue-600 outline-none\">\r\n                <\/div>\r\n\r\n                <div class=\"input-card rounded-xl p-5 bg-slate-50\">\r\n                    <h3 class=\"text-slate-700 text-sm font-extrabold flex items-center gap-2 mb-2\">검색 개수 (n)<\/h3>\r\n                    <div class=\"text-center text-[0.7rem] text-slate-400 font-mono mb-1\">D20 [n_Count]<\/div>\r\n                    <input type=\"number\" id=\"n-val\" value=\"10\" min=\"1\" max=\"20\" oninput=\"initArray()\" \r\n                           class=\"w-full bg-transparent text-center text-4xl font-black text-slate-600 outline-none\">\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Results (폰트 확대) -->\r\n            <div class=\"flex-1 flex flex-col\">\r\n                <h3 class=\"text-emerald-800 text-sm font-extrabold flex items-center gap-2 mb-2 uppercase\">검색 결과 (d)<\/h3>\r\n                <div class=\"grid grid-cols-1 gap-4 flex-1\">\r\n                    <div class=\"result-card rounded-xl p-5 flex flex-col justify-center text-center\" id=\"res-pos-card\">\r\n                        <div class=\"text-slate-500 font-bold text-[0.8rem] mb-2\">최초 일치 위치 [D30]<\/div>\r\n                        <div class=\"text-5xl font-black text-emerald-700\" id=\"res-pos\">0<\/div>\r\n                        <div class=\"text-emerald-600/70 text-[0.7rem] mt-2 font-bold\">(순번)<\/div>\r\n                    <\/div>\r\n                    <div class=\"result-card rounded-xl p-5 flex flex-col justify-center text-center\" id=\"res-cnt-card\">\r\n                        <div class=\"text-slate-500 font-bold text-[0.8rem] mb-2\">일치 개수 [D31]<\/div>\r\n                        <div class=\"text-5xl font-black text-emerald-700\" id=\"res-cnt\">0<\/div>\r\n                        <div class=\"text-emerald-600/70 text-[0.7rem] mt-2 font-bold\">(총 수량)<\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Right Column: 데이터 그리드 및 코드 -->\r\n        <div class=\"flex-1 flex flex-col gap-4\">\r\n            \r\n            <!-- Data Grid Area -->\r\n            <div class=\"bg-slate-50 rounded-xl p-5 border border-slate-200 flex flex-col h-1/2\">\r\n                <div class=\"flex justify-between items-center mb-4\">\r\n                    <h3 class=\"text-blue-800 text-sm font-extrabold\">검색 대상 데이터 (D100~)<\/h3>\r\n                    <div class=\"flex gap-3\">\r\n                        <button onclick=\"randomizeData()\" class=\"px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-[0.8rem] font-bold rounded-lg transition-colors\">랜덤 생성<\/button>\r\n                        <button onclick=\"clearData()\" class=\"px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-[0.8rem] font-bold rounded-lg transition-colors\">리셋<\/button>\r\n                        <button onclick=\"runSearch()\" class=\"px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white text-[0.8rem] font-bold rounded-lg shadow-md shadow-blue-200\">검색 실행<\/button>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div id=\"data-grid-ui\" class=\"grid grid-cols-5 gap-3 content-start overflow-y-auto pr-1\">\r\n                    <!-- JS dynamic content -->\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Code Block (폰트 확대) -->\r\n            <div class=\"flex-1 flex flex-col rounded-xl overflow-hidden shadow-inner\">\r\n                <div class=\"px-5 py-3 bg-slate-700 flex justify-between items-center text-white text-[0.7rem] font-bold tracking-widest uppercase\">\r\n                    <span>GX Works3 ST Example<\/span>\r\n                    <span>SERDATA<\/span>\r\n                <\/div>\r\n                <pre class=\"code-block p-5 text-blue-100 font-mono text-[0.85rem] overflow-y-auto leading-relaxed\" id=\"st-code\"><\/pre>\r\n            <\/div>\r\n        <\/div>\r\n\r\n    <\/div>\r\n<\/div>\r\n\r\n<script>\r\n    let dataArray = [122, 10, 500, 123, -123, 20, 123, 123, 50, 100];\r\n\r\n    function initArray() {\r\n        const nInput = document.getElementById('n-val');\r\n        let n = parseInt(nInput.value) || 1;\r\n        if (n > 20) n = 20; \r\n        nInput.value = n;\r\n        \r\n        const grid = document.getElementById('data-grid-ui');\r\n        grid.innerHTML = '';\r\n\r\n        for (let i = 0; i < n; i++) {\r\n            const val = dataArray[i] !== undefined ? dataArray[i] : 0;\r\n            const div = document.createElement('div');\r\n            div.className = 'relative flex flex-col pt-4';\r\n            div.innerHTML = `\r\n                <div class=\"text-center text-[0.65rem] text-slate-400 font-mono mb-1 font-bold\">D${100 + i}<\/div>\r\n                <input type=\"number\" value=\"${val}\" id=\"data-${i}\" oninput=\"updateArrayValue(${i}, this.value)\"\r\n                       class=\"data-cell w-full py-3 rounded-md text-center text-base font-black text-slate-700 outline-none focus:border-blue-500 border-2\">\r\n                <div id=\"tag-${i}\" class=\"first-tag hidden\">First!<\/div>\r\n            `;\r\n            grid.appendChild(div);\r\n        }\r\n        runSearch();\r\n    }\r\n\r\n    function updateArrayValue(idx, val) {\r\n        dataArray[idx] = parseInt(val) || 0;\r\n        runSearch();\r\n    }\r\n\r\n    function randomizeData() {\r\n        const n = parseInt(document.getElementById('n-val').value) || 10;\r\n        const key = parseInt(document.getElementById('s1-val').value);\r\n        for (let i = 0; i < n; i++) {\r\n            dataArray[i] = Math.random() > 0.7 ? key : Math.floor(Math.random() * 200) - 50;\r\n        }\r\n        initArray();\r\n    }\r\n\r\n    function clearData() {\r\n        dataArray = dataArray.map(() => 0);\r\n        initArray();\r\n    }\r\n\r\n    function runSearch() {\r\n        const key = parseInt(document.getElementById('s1-val').value) || 0;\r\n        const n = parseInt(document.getElementById('n-val').value) || 0;\r\n        \r\n        let firstMatchIdx = -1;\r\n        let matchCount = 0;\r\n\r\n        for (let i = 0; i < n; i++) {\r\n            const inputEl = document.getElementById(`data-${i}`);\r\n            const tagEl = document.getElementById(`tag-${i}`);\r\n            if (!inputEl) continue;\r\n\r\n            inputEl.classList.remove('match');\r\n            tagEl.classList.add('hidden');\r\n\r\n            const val = parseInt(inputEl.value) || 0;\r\n            if (val === key) {\r\n                matchCount++;\r\n                inputEl.classList.add('match');\r\n                if (firstMatchIdx === -1) {\r\n                    firstMatchIdx = i + 1; // 1-based\r\n                    tagEl.classList.remove('hidden');\r\n                }\r\n            }\r\n        }\r\n\r\n        const posVal = firstMatchIdx === -1 ? 0 : firstMatchIdx;\r\n        document.getElementById('res-pos').innerText = posVal;\r\n        document.getElementById('res-cnt').innerText = matchCount;\r\n\r\n        updateCode(key, n, posVal, matchCount);\r\n    }\r\n\r\n    function updateCode(key, n, pos, cnt) {\r\n        const codeBlock = document.getElementById('st-code');\r\n        const pink = (t) => `<span style=\"color:#ff79c6\">${t}<\/span>`;\r\n        const gray = (t) => `<span style=\"color:#6272a4\">${t}<\/span>`;\r\n\r\n        codeBlock.innerHTML = \r\n`${gray('// SERDATA(EN, s1, s2, n, d)')}\\n` +\r\n`${pink('D10')} := ${key}; ${gray('// 검색값')}\\n` +\r\n`${pink('D20')} := ${n};   ${gray('// 검색 범위')}\\n\\n` +\r\n`SERDATA(1, ${pink('D10')}, ${pink('D100')}, ${pink('D20')}, ${pink('D30')});\\n\\n` +\r\n`${gray('// D30 = ' + pos + ' (최초 위치)')}\\n` +\r\n`${gray('// D31 = ' + cnt + ' (총 개수)')}`;\r\n    }\r\n\r\n    window.onload = initArray;\r\n<\/script>\r\n\r\n<\/body>\r\n<\/html>"},{"id":"p13","label":"SFR n비트 우 시프트","title":"PLC SFR 명령어 비트 시프트","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-SFR_n%EB%B9%84%ED%8A%B8_%EC%9A%B0_%EC%8B%9C%ED%94%84%ED%8A%B8.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC SFR 명령어 비트 시프트 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.95);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.8rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 10px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n            border: 1px solid #000000;\r\n        }\r\n\r\n        .bit-group-container {\r\n            display: flex;\r\n            gap: 0;\r\n            border: 3px solid #000;\r\n            background: #fff;\r\n            width: fit-content;\r\n            position: relative;\r\n        }\r\n\r\n        .nibble-group {\r\n            display: flex;\r\n            border-right: 3px solid #000;\r\n        }\r\n\r\n        .nibble-group:last-child {\r\n            border-right: none;\r\n        }\r\n\r\n        .bit-unit {\r\n            width: 52px;\r\n            height: 65px;\r\n            display: flex;\r\n            flex-direction: column;\r\n            align-items: center;\r\n            justify-content: center;\r\n            position: relative;\r\n            border-left: 2px dashed #94a3b8;\r\n            z-index: 10;\r\n        }\r\n\r\n        .bit-unit:first-child {\r\n            border-left: none;\r\n        }\r\n\r\n        .bit-label {\r\n            position: absolute;\r\n            top: -28px;\r\n            left: 50%;\r\n            transform: translateX(-50%);\r\n            font-size: 0.75rem;\r\n            font-weight: 800;\r\n            color: #64748b;\r\n        }\r\n\r\n        .bit-value {\r\n            font-size: 1.8rem;\r\n            font-weight: 900;\r\n        }\r\n\r\n        .interactive .bit-unit.on {\r\n            background: #eff6ff;\r\n            color: #2563eb;\r\n        }\r\n\r\n        .result-view .bit-unit.on {\r\n            background: #f8fafc;\r\n            color: #94a3b8;\r\n            border-bottom: 4px solid #cbd5e1;\r\n        }\r\n\r\n        .result-view .bit-unit.on .bit-value {\r\n            color: #93c5fd;\r\n        }\r\n\r\n        .result-view .bit-unit.shifted-zero {\r\n            color: #e2e8f0;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        .btn-shift {\r\n            border: 3px solid #000;\r\n            box-shadow: 4px 4px 0px #000;\r\n            transition: all 0.1s;\r\n            cursor: pointer;\r\n        }\r\n\r\n        .btn-shift:active {\r\n            transform: translate(2px, 2px);\r\n            box-shadow: 1px 1px 0px #000;\r\n        }\r\n\r\n        .sm700-box {\r\n            border: 4px solid #ef4444;\r\n            background: #fef2f2;\r\n            box-shadow: 4px 4px 0px #ef4444;\r\n            transition: all 0.3s;\r\n        }\r\n\r\n        .view-area {\r\n            width: 100%;\r\n            padding-top: 35px;\r\n            display: flex;\r\n            justify-content: center;\r\n            position: relative;\r\n        }\r\n\r\n        /* 시프트 화살표 SVG 레이어 */\r\n        #shift-overlay {\r\n            position: absolute;\r\n            top: 0;\r\n            left: 0;\r\n            width: 100%;\r\n            height: 100%;\r\n            pointer-events: none;\r\n            z-index: 100;\r\n        }\r\n\r\n        .shift-arrow-path {\r\n            fill: none;\r\n            stroke: #2563eb;\r\n            stroke-width: 2;\r\n            stroke-dasharray: 4, 4;\r\n            animation: dash 15s linear infinite;\r\n            opacity: 0.6;\r\n            transition: d 0.3s cubic-bezier(0.4, 0, 0.2, 1);\r\n        }\r\n\r\n        .arrow-to-carry {\r\n            stroke: #ef4444;\r\n            stroke-dasharray: 4, 2;\r\n        }\r\n\r\n        @keyframes dash {\r\n            to {\r\n                stroke-dashoffset: -1000;\r\n            }\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-[1450px] mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header -->\r\n        <div class=\"glass-header p-6 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-3xl font-black text-black\">SFR(P) n비트 오른쪽 시프트<\/h1>\r\n                <p class=\"text-sm font-bold text-slate-600 mt-1\">데이터(d)를 오른쪽으로 n비트 이동시키고, 마지막 비트를 SM700에 저장<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-10 py-6 flex items-center gap-6 font-mono text-3xl\">\r\n                <span class=\"text-slate-400 font-black\">SFR(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">1<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">대상(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"label-n\">6<\/span>\r\n                    <span class=\"param-label\">비트수(n)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content -->\r\n        <div class=\"flex-1 flex p-6 gap-6 overflow-hidden relative\">\r\n\r\n            <!-- Left: Simulator Area -->\r\n            <div class=\"w-[68%] flex flex-col gap-6 justify-center\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-8 flex flex-col items-center flex-1 relative\">\r\n                    <div class=\"w-full flex justify-between items-center mb-8\">\r\n                        <h3 class=\"text-xl font-black text-black flex items-center gap-3\">\r\n                            <div class=\"w-4 h-4 bg-blue-600 border-2 border-black rounded-full\"><\/div>\r\n                            D10 비트 데이터 동적 추적\r\n                        <\/h3>\r\n                        <div class=\"flex items-center gap-4\">\r\n                            <label class=\"font-black text-sm text-slate-700\">시프트 수 (n):<\/label>\r\n                            <input type=\"number\" id=\"n-input\" value=\"6\" min=\"0\" max=\"15\" oninput=\"updateLabels()\"\r\n                                class=\"w-20 py-2 text-center text-xl font-black rounded-lg border-2 border-black\">\r\n                            <button onclick=\"executeShift()\"\r\n                                class=\"btn-shift bg-blue-600 text-white px-8 py-3 font-black rounded-lg uppercase\">Shift<\/button>\r\n                            <button onclick=\"resetBits()\"\r\n                                class=\"btn-shift bg-white text-black px-8 py-3 font-black rounded-lg\">초기화<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"flex-1 w-full flex flex-col justify-center gap-10 relative\" id=\"simulator-viewport\">\r\n                        <!-- Dynamic Arrows Layer -->\r\n                        <svg id=\"shift-overlay\">\r\n                            <defs>\r\n                                <marker id=\"arrowhead-blue\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\"\r\n                                    orient=\"auto\">\r\n                                    <polygon points=\"0 0, 8 3, 0 6\" fill=\"#2563eb\" />\r\n                                <\/marker>\r\n                                <marker id=\"arrowhead-red\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\"\r\n                                    orient=\"auto\">\r\n                                    <polygon points=\"0 0, 8 3, 0 6\" fill=\"#ef4444\" />\r\n                                <\/marker>\r\n                            <\/defs>\r\n                            <g id=\"arrows-container\"><\/g>\r\n                        <\/svg>\r\n\r\n                        <!-- Original Data -->\r\n                        <div class=\"flex flex-col items-center w-full\">\r\n                            <div class=\"text-[0.6rem] font-black text-slate-400 uppercase mb-4 tracking-widest\">Original\r\n                                Data [D10] (Click Bits)<\/div>\r\n                            <div class=\"view-area\">\r\n                                <div id=\"grid-before\" class=\"bit-group-container interactive\"><\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n\r\n                        <div class=\"flex justify-center\">\r\n                            <div class=\"text-3xl text-slate-200\">⬇️<\/div>\r\n                        <\/div>\r\n\r\n                        <!-- Result Data -->\r\n                        <div class=\"flex flex-col items-center w-full\">\r\n                            <div class=\"text-[0.6rem] font-black text-blue-300 uppercase mb-4 tracking-widest\">Shifted\r\n                                Result [D10] (Expected)<\/div>\r\n                            <div class=\"view-area\">\r\n                                <div id=\"grid-after\" class=\"bit-group-container result-view opacity-40\"><\/div>\r\n                            <\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"mt-8 w-full flex justify-between items-center bg-black p-5 rounded-xl\">\r\n                        <div class=\"text-white\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1\">Decimal Value<\/div>\r\n                            <div class=\"text-3xl font-black\" id=\"dec-val\">0<\/div>\r\n                        <\/div>\r\n                        <div class=\"text-right\">\r\n                            <div class=\"text-[0.7rem] text-slate-400 font-bold uppercase mb-1\">Shift Type<\/div>\r\n                            <div class=\"text-2xl font-black text-yellow-400 uppercase\">Right Shift (0-Fill)<\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right Column -->\r\n            <div class=\"w-[32%] flex flex-col gap-6\">\r\n                <div id=\"sm700-card\"\r\n                    class=\"sm700-box rounded-2xl p-8 flex flex-col items-center justify-center text-center\">\r\n                    <h3 class=\"text-red-600 font-black text-sm uppercase tracking-widest mb-4\">마지막 시프트 비트 (SM700)<\/h3>\r\n                    <div id=\"carry-lamp\"\r\n                        class=\"w-36 h-36 rounded-2xl border-4 border-black flex items-center justify-center bg-white mb-6\">\r\n                        <span id=\"carry-val\" class=\"text-7xl font-black text-slate-200\">0<\/span>\r\n                    <\/div>\r\n                    <p class=\"text-slate-600 font-bold text-sm leading-relaxed\">오른쪽으로 밀려 나간 비트 중<br><span\r\n                            class=\"text-red-600 font-black\">가장 마지막 비트<\/span>가 저장됩니다.<\/p>\r\n                <\/div>\r\n\r\n                <div class=\"code-block rounded-2xl p-6 flex-1 shadow-lg flex flex-col\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">SFR(P)<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[1rem] leading-relaxed text-blue-100 flex-1\">\r\n<span class=\"comment\">// D10을 오른쪽으로 <span id=\"code-n\">6<\/span>비트 시프트<\/span>\r\n<span class=\"var\">D10<\/span> := <span id=\"code-dec\">0<\/span>;\r\n\r\n<span class=\"comment\">// 시프트 실행 (Rising Edge)<\/span>\r\nSFR(1, <span class=\"var\">D10<\/span>, <span id=\"code-n2\">6<\/span>);\r\n\r\n<span class=\"comment\">// D10 값과 SM700 상태 확인<\/span><\/pre>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let bits = new Array(16).fill(0);\r\n        // 초기 샘플: b13, b8 ON\r\n        bits[13] = 1; bits[8] = 1;\r\n        let shiftedBits = new Array(16).fill(0);\r\n\r\n        function init() {\r\n            renderManualGrid('grid-before', bits, true);\r\n            renderManualGrid('grid-after', shiftedBits, false);\r\n            updateLabels();\r\n            updateDecimal();\r\n            setTimeout(drawAllArrows, 100);\r\n        }\r\n\r\n        function renderManualGrid(targetId, bitArray, interactive) {\r\n            const container = document.getElementById(targetId);\r\n            container.innerHTML = '';\r\n            const n = parseInt(document.getElementById('n-input').value) || 0;\r\n\r\n            for (let group = 3; group >= 0; group--) {\r\n                const groupDiv = document.createElement('div');\r\n                groupDiv.className = 'nibble-group';\r\n                for (let b = 3; b >= 0; b--) {\r\n                    const bitIdx = group * 4 + b;\r\n                    const bitUnit = document.createElement('div');\r\n                    bitUnit.className = `bit-unit bit-node-${bitIdx} ${bitArray[bitIdx] ? 'on' : ''}`;\r\n                    if (!interactive && bitIdx >= (16 - n)) bitUnit.classList.add('shifted-zero');\r\n\r\n                    bitUnit.innerHTML = `<span class=\"bit-label\">b${bitIdx}<\/span><span class=\"bit-value\">${bitArray[bitIdx]}<\/span>`;\r\n                    if (interactive) {\r\n                        bitUnit.onclick = () => {\r\n                            bits[bitIdx] = bits[bitIdx] ? 0 : 1;\r\n                            renderManualGrid('grid-before', bits, true);\r\n                            updateDecimal();\r\n                            drawAllArrows();\r\n                        };\r\n                    }\r\n                    groupDiv.appendChild(bitUnit);\r\n                }\r\n                container.appendChild(groupDiv);\r\n            }\r\n        }\r\n\r\n        function drawAllArrows() {\r\n            const n = parseInt(document.getElementById('n-input').value) || 0;\r\n            const container = document.getElementById('arrows-container');\r\n            const overlay = document.getElementById('shift-overlay');\r\n            const sm700 = document.getElementById('carry-lamp');\r\n\r\n            container.innerHTML = '';\r\n            const rectOverlay = overlay.getBoundingClientRect();\r\n            const sm700Rect = sm700.getBoundingClientRect();\r\n\r\n            bits.forEach((on, i) => {\r\n                if (!on) return;\r\n\r\n                const fromEl = document.querySelector(`#grid-before .bit-node-${i}`);\r\n                if (!fromEl) return;\r\n\r\n                const fromRect = fromEl.getBoundingClientRect();\r\n                const x1 = fromRect.left + fromRect.width / 2 - rectOverlay.left;\r\n                const y1 = fromRect.top + fromRect.height / 2 - rectOverlay.top;\r\n\r\n                const targetIdx = i - n;\r\n                let x2, y2, isOut = false;\r\n\r\n                if (targetIdx >= 0) {\r\n                    // 데이터 내 이동\r\n                    const toEl = document.querySelector(`#grid-after .bit-node-${targetIdx}`);\r\n                    if (toEl) {\r\n                        const toRect = toEl.getBoundingClientRect();\r\n                        x2 = toRect.left + toRect.width / 2 - rectOverlay.left;\r\n                        y2 = toRect.top + toRect.height / 2 - rectOverlay.top;\r\n                    }\r\n                } else {\r\n                    // 밖으로 밀려남 (SM700 방향)\r\n                    x2 = sm700Rect.left + sm700Rect.width / 2 - rectOverlay.left;\r\n                    y2 = sm700Rect.top + sm700Rect.height / 2 - rectOverlay.top;\r\n                    isOut = true;\r\n                }\r\n\r\n                if (x1 && x2) {\r\n                    const path = document.createElementNS(\"http://www.w3.org/2000/svg\", \"path\");\r\n                    path.className.baseVal = `shift-arrow-path ${isOut ? 'arrow-to-carry' : ''}`;\r\n\r\n                    // 베지어 곡선 제어점 설정\r\n                    const cp1y = y1 + (y2 - y1) * 0.4;\r\n                    const cp2y = y1 + (y2 - y1) * 0.6;\r\n                    const d = `M ${x1},${y1} C ${x1},${cp1y} ${x2},${cp2y} ${x2},${y2}`;\r\n\r\n                    path.setAttribute('d', d);\r\n                    path.setAttribute('marker-end', `url(#arrowhead-${isOut ? 'red' : 'blue'})`);\r\n                    container.appendChild(path);\r\n                }\r\n            });\r\n        }\r\n\r\n        function updateLabels() {\r\n            const nInput = document.getElementById('n-input');\r\n            let n = parseInt(nInput.value);\r\n            if (isNaN(n)) n = 0; if (n > 15) n = 15; if (n < 0) n = 0;\r\n            nInput.value = n;\r\n\r\n            document.getElementById('label-n').innerText = n;\r\n            document.getElementById('code-n').innerText = n;\r\n            document.getElementById('code-n2').innerText = n;\r\n\r\n            if (!document.getElementById('grid-after').classList.contains('opacity-40')) {\r\n                executeShift();\r\n            }\r\n            drawAllArrows();\r\n        }\r\n\r\n        function updateDecimal() {\r\n            let dec = 0;\r\n            for (let i = 0; i < 16; i++) { if (bits[i]) dec += Math.pow(2, i); }\r\n            document.getElementById('dec-val').innerText = dec;\r\n            document.getElementById('code-dec').innerText = dec;\r\n        }\r\n\r\n        function executeShift() {\r\n            const n = parseInt(document.getElementById('n-input').value) || 0;\r\n            document.getElementById('grid-after').classList.remove('opacity-40');\r\n\r\n            let carry = 0;\r\n            if (n > 0) carry = bits[n - 1];\r\n\r\n            shiftedBits = new Array(16).fill(0);\r\n            for (let i = 0; i < 16 - n; i++) shiftedBits[i] = bits[i + n];\r\n\r\n            renderManualGrid('grid-after', shiftedBits, false);\r\n\r\n            const carryLamp = document.getElementById('carry-lamp');\r\n            const carryVal = document.getElementById('carry-val');\r\n            const sm700Card = document.getElementById('sm700-card');\r\n\r\n            carryVal.innerText = carry;\r\n            if (carry) {\r\n                carryLamp.style.backgroundColor = '#ef4444';\r\n                carryVal.style.color = '#ffffff';\r\n                sm700Card.style.transform = 'scale(1.02)';\r\n            } else {\r\n                carryLamp.style.backgroundColor = '#ffffff';\r\n                carryVal.style.color = '#cbd5e1';\r\n                sm700Card.style.transform = 'scale(1)';\r\n            }\r\n            drawAllArrows();\r\n        }\r\n\r\n        function resetBits() {\r\n            bits = new Array(16).fill(0);\r\n            shiftedBits = new Array(16).fill(0);\r\n            renderManualGrid('grid-before', bits, true);\r\n            renderManualGrid('grid-after', shiftedBits, false);\r\n            document.getElementById('grid-after').classList.add('opacity-40');\r\n            updateDecimal();\r\n            const carryLamp = document.getElementById('carry-lamp');\r\n            carryLamp.style.backgroundColor = '#ffffff';\r\n            document.getElementById('carry-val').innerText = \"0\";\r\n            document.getElementById('carry-val').style.color = '#cbd5e1';\r\n            drawAllArrows();\r\n        }\r\n\r\n        window.onload = init;\r\n        window.onresize = drawAllArrows;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p14","label":"SUM 비트체크","title":"PLC SUM 명령어 비트 체크","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-SUM_%EB%B9%84%ED%8A%B8%EC%B2%B4%ED%81%AC.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC SUM 명령어 비트 체크 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.7);\r\n            backdrop-filter: blur(10px);\r\n            border: 2px solid #000000;\r\n            /* 검은색 테두리 */\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 2px solid #000000;\r\n            /* 검은색 테두리 */\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.75rem;\r\n            background: #e2e8f0;\r\n            color: #000000;\r\n            padding: 2px 8px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            border: 1px solid #000000;\r\n        }\r\n\r\n        .bit-box {\r\n            transition: all 0.2s;\r\n            cursor: pointer;\r\n            user-select: none;\r\n            border: 2px solid #000000;\r\n            /* 검은색 테두리 */\r\n        }\r\n\r\n        .bit-box.on {\r\n            background-color: #2563eb;\r\n            color: white;\r\n            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);\r\n        }\r\n\r\n        .bit-box.off {\r\n            background-color: #f1f5f9;\r\n            color: #94a3b8;\r\n        }\r\n\r\n        .result-card {\r\n            background-color: #ecfdf5;\r\n            border: 2px solid #000000;\r\n            /* 검은색 테두리 */\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border-left: 5px solid #3b82f6;\r\n            border-top: 2px solid #000000;\r\n            border-right: 2px solid #000000;\r\n            border-bottom: 2px solid #000000;\r\n        }\r\n\r\n        .info-panel {\r\n            border: 2px solid #000000;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div\r\n        class=\"max-w-6xl mx-auto h-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col border-4 border-black\">\r\n\r\n        <!-- Header: 명령어 카드 (Command Card Style) -->\r\n        <div class=\"p-6 pb-4\">\r\n            <div\r\n                class=\"glass-header rounded-2xl p-6 border-l-[12px] border-l-blue-600 flex justify-between items-center\">\r\n                <div>\r\n                    <h1 class=\"text-2xl font-extrabold text-slate-800 leading-tight\">SUM(P) 비트 체크<\/h1>\r\n                    <p class=\"text-[0.85rem] text-slate-600 mt-1 font-bold\">BIN 16비트 데이터 중 1(ON)인 비트 개수를 합산<\/p>\r\n                <\/div>\r\n\r\n                <div class=\"cmd-box rounded-xl px-8 py-5 flex items-center gap-4 font-mono text-2xl shadow-md\">\r\n                    <span class=\"text-slate-500 font-black\">SUM(<\/span>\r\n                    <div class=\"flex flex-col items-center\">\r\n                        <span class=\"font-black text-slate-800\">1<\/span>\r\n                        <span class=\"param-label mt-1 uppercase\">EN<\/span>\r\n                    <\/div>\r\n                    <span class=\"text-slate-500\">,<\/span>\r\n                    <div class=\"flex flex-col items-center\">\r\n                        <span class=\"font-black text-slate-800\">D10<\/span>\r\n                        <span class=\"param-label mt-1\">대상(s)<\/span>\r\n                    <\/div>\r\n                    <span class=\"text-slate-500\">,<\/span>\r\n                    <div class=\"flex flex-col items-center\">\r\n                        <span class=\"font-black text-slate-800\">D20<\/span>\r\n                        <span class=\"param-label mt-1\">결과(d)<\/span>\r\n                    <\/div>\r\n                    <span class=\"text-slate-500 font-black\">);<\/span>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content -->\r\n        <div class=\"flex-1 px-6 pb-6 overflow-hidden flex gap-6\">\r\n\r\n            <!-- Left: 비트 시뮬레이터 (테스트 결과물) -->\r\n            <div class=\"w-3/5 flex flex-col gap-4\">\r\n                <div class=\"info-panel bg-slate-50 rounded-2xl p-6 flex-1 flex flex-col\">\r\n                    <div class=\"flex justify-between items-center mb-6\">\r\n                        <h3 class=\"text-blue-900 text-base font-extrabold flex items-center gap-2\">\r\n                            <div class=\"w-3 h-3 bg-blue-600 rounded-full border border-black\"><\/div>\r\n                            D10 비트 모니터링 (16-Bit Word)\r\n                        <\/h3>\r\n                        <div\r\n                            class=\"text-xs font-bold text-white bg-black px-3 py-1 rounded-full uppercase tracking-tighter\">\r\n                            Click to Toggle Bits<\/div>\r\n                    <\/div>\r\n\r\n                    <!-- 16비트 그리드 -->\r\n                    <div id=\"bit-grid\" class=\"grid grid-cols-8 gap-3 flex-1 content-center\">\r\n                        <!-- JS로 비트 생성 (b15 ~ b0) -->\r\n                    <\/div>\r\n\r\n                    <div\r\n                        class=\"mt-6 flex justify-between items-end bg-white p-4 rounded-xl border-2 border-black shadow-sm\">\r\n                        <div>\r\n                            <div class=\"text-[0.65rem] text-slate-500 font-bold mb-1 uppercase\">Decimal Value<\/div>\r\n                            <div class=\"text-3xl font-black text-slate-900\" id=\"dec-val\">0<\/div>\r\n                        <\/div>\r\n                        <div class=\"text-right\">\r\n                            <div class=\"text-[0.65rem] text-slate-500 font-bold mb-1 uppercase\">Binary Representation\r\n                            <\/div>\r\n                            <div class=\"text-lg font-mono font-bold text-blue-700\" id=\"bin-val\">0000 0000 0000 0000\r\n                            <\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right: 결과 및 코드 -->\r\n            <div class=\"w-2/5 flex flex-col gap-4\">\r\n\r\n                <!-- Result Summary -->\r\n                <div class=\"result-card rounded-2xl p-8 flex flex-col justify-center text-center flex-[0.6] shadow-lg\">\r\n                    <h3 class=\"text-emerald-900 text-sm font-extrabold mb-4 uppercase tracking-wider\">합계 결과 (D20)<\/h3>\r\n                    <div class=\"text-8xl font-black text-emerald-800 leading-none\" id=\"res-cnt\">0<\/div>\r\n                    <div class=\"text-emerald-700 text-sm mt-6 font-bold\">Total ON Bits Counted<\/div>\r\n                <\/div>\r\n\r\n                <!-- Code Example -->\r\n                <div class=\"flex-1 flex flex-col rounded-2xl overflow-hidden shadow-xl border-2 border-black\">\r\n                    <div\r\n                        class=\"px-5 py-3 bg-black flex justify-between items-center text-white text-[0.7rem] font-bold tracking-widest uppercase\">\r\n                        <span>GX WORKS3 ST EXAMPLE<\/span>\r\n                        <span>SUM<\/span>\r\n                    <\/div>\r\n                    <pre class=\"code-block p-6 text-blue-100 font-mono text-[0.95rem] flex-1 overflow-y-auto leading-relaxed\"\r\n                        id=\"st-code\">\r\n<span style=\"color:#6272a4\">// SUM(EN, s, d)<\/span>\r\n<span style=\"color:#ff79c6\">D10<\/span> := <span id=\"code-val\">0<\/span>; <span style=\"color:#6272a4\">// 입력값<\/span>\r\n\r\n<span style=\"color:#6272a4\">// 비트 개수 합산 실행<\/span>\r\nSUM(1, <span style=\"color:#ff79c6\">D10<\/span>, <span style=\"color:#ff79c6\">D20<\/span>);\r\n\r\n<span style=\"color:#6272a4\">// 결과: D20 에 <span id=\"code-res\">0<\/span> 저장됨<\/span><\/pre>\r\n                <\/div>\r\n            <\/div>\r\n\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let bits = new Array(16).fill(0);\r\n\r\n        function init() {\r\n            const grid = document.getElementById('bit-grid');\r\n            grid.innerHTML = '';\r\n\r\n            // b15부터 b0까지 생성\r\n            for (let i = 15; i >= 0; i--) {\r\n                const div = document.createElement('div');\r\n                div.className = `bit-box off rounded-xl h-16 flex flex-col items-center justify-center font-black`;\r\n                div.id = `bit-${i}`;\r\n                div.onclick = () => toggleBit(i);\r\n                div.innerHTML = `\r\n                <span class=\"text-xs text-slate-500 mb-1 font-bold\">b${i}<\/span>\r\n                <span class=\"text-xl bit-val\">0<\/span>\r\n            `;\r\n                grid.appendChild(div);\r\n            }\r\n            update();\r\n        }\r\n\r\n        function toggleBit(idx) {\r\n            bits[idx] = bits[idx] === 1 ? 0 : 1;\r\n            update();\r\n        }\r\n\r\n        function update() {\r\n            let onCount = 0;\r\n            let decimal = 0;\r\n            let binaryStr = \"\";\r\n\r\n            for (let i = 15; i >= 0; i--) {\r\n                const el = document.getElementById(`bit-${i}`);\r\n                const valSpan = el.querySelector('.bit-val');\r\n\r\n                if (bits[i] === 1) {\r\n                    el.classList.remove('off');\r\n                    el.classList.add('on');\r\n                    valSpan.innerText = \"1\";\r\n                    onCount++;\r\n                    decimal += Math.pow(2, i);\r\n                } else {\r\n                    el.classList.remove('on');\r\n                    el.classList.add('off');\r\n                    valSpan.innerText = \"0\";\r\n                }\r\n\r\n                binaryStr += bits[i];\r\n                if (i % 4 === 0 && i !== 0) binaryStr += \" \";\r\n            }\r\n\r\n            // UI 업데이트\r\n            document.getElementById('res-cnt').innerText = onCount;\r\n            document.getElementById('dec-val').innerText = decimal.toLocaleString();\r\n            document.getElementById('bin-val').innerText = binaryStr;\r\n\r\n            // 코드 섹션 업데이트\r\n            document.getElementById('code-val').innerText = decimal;\r\n            document.getElementById('code-res').innerText = onCount;\r\n        }\r\n\r\n        window.onload = init;\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p15","label":"TTMR특수 타이머","title":"PLC TTMR 명령어 특수 타이머","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-TTMR%ED%8A%B9%EC%88%98_%ED%83%80%EC%9D%B4%EB%A8%B8.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC TTMR 명령어 특수 타이머 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        /* 검은색 테두리 강렬한 테마 */\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.95);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.8rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 10px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n            border: 1px solid #000000;\r\n        }\r\n\r\n        .press-btn {\r\n            transition: all 0.1s;\r\n            border: 4px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n            user-select: none;\r\n        }\r\n\r\n        .press-btn:active {\r\n            transform: translate(3px, 3px);\r\n            box-shadow: 2px 2px 0px #000000;\r\n            background-color: #ef4444;\r\n            color: white;\r\n        }\r\n\r\n        .press-btn.active {\r\n            background-color: #ef4444;\r\n            color: white;\r\n        }\r\n\r\n        /* 승수 그룹화 스타일 */\r\n        .multiplier-group {\r\n            border: 2px solid #000000;\r\n            padding: 8px;\r\n            border-radius: 12px;\r\n            background: #ffffff;\r\n            position: relative;\r\n        }\r\n\r\n        .multiplier-label {\r\n            position: absolute;\r\n            top: -12px;\r\n            left: 12px;\r\n            background: #000000;\r\n            color: white;\r\n            padding: 0 8px;\r\n            font-size: 0.7rem;\r\n            font-weight: 900;\r\n            border-radius: 4px;\r\n        }\r\n\r\n        .multiplier-btn {\r\n            border: 2px solid #000000;\r\n            transition: all 0.2s;\r\n            background: #f8fafc;\r\n        }\r\n\r\n        .multiplier-btn.selected {\r\n            background-color: #2563eb;\r\n            color: white;\r\n            border-width: 3px;\r\n        }\r\n\r\n        .result-display {\r\n            background-color: #ffffff;\r\n            border: 4px solid #000000;\r\n            box-shadow: 8px 8px 0px #000000;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        .timer-ring {\r\n            transition: stroke-dashoffset 0.1s linear;\r\n        }\r\n\r\n        /* 범위 강조 뱃지 */\r\n        .range-badge {\r\n            font-size: 0.65rem;\r\n            color: #ef4444;\r\n            font-weight: 900;\r\n            background: #fee2e2;\r\n            padding: 1px 4px;\r\n            border-radius: 3px;\r\n            border: 1px solid #f87171;\r\n            margin-top: 2px;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-7xl mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header: TTMR 명령어 카드 (0..2 범위 추가) -->\r\n        <div class=\"glass-header p-6 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-3xl font-black text-black\">TTMR(P) 특수 타이머<\/h1>\r\n                <p class=\"text-sm font-bold text-slate-600 mt-1\">입력이 ON인 시간을 측정하여 승수를 곱한 뒤 데이터로 저장<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-10 py-6 flex items-center gap-6 font-mono text-3xl\">\r\n                <span class=\"text-slate-400 font-black\">TTMR(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">1<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <div class=\"flex flex-col items-center\">\r\n                        <span class=\"font-black text-black\" id=\"code-s-val\">0<\/span>\r\n                        <span class=\"range-badge\">0..2<\/span>\r\n                    <\/div>\r\n                    <span class=\"param-label\">승수(s)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">결과(d)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content Grid -->\r\n        <div class=\"flex-1 flex p-6 gap-6 overflow-hidden\">\r\n\r\n            <!-- Left: Simulator Area -->\r\n            <div class=\"w-1/2 flex flex-col gap-6\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-6 flex-1 flex flex-col\">\r\n                    <div class=\"flex justify-between items-start mb-6\">\r\n                        <h3 class=\"text-xl font-black text-black flex items-center gap-3\">\r\n                            <div class=\"w-4 h-4 bg-red-600 border-2 border-black rounded-full\"><\/div>\r\n                            티칭 타이머 테스트\r\n                        <\/h3>\r\n                        <!-- 승수 그룹화 및 범위 표기 -->\r\n                        <div class=\"multiplier-group flex gap-2\">\r\n                            <div class=\"multiplier-label\">승수 설정 (Range: 0..2)<\/div>\r\n                            <button onclick=\"setMultiplier(0)\" id=\"m0\"\r\n                                class=\"multiplier-btn selected px-3 py-1 rounded-md font-bold text-xs\">x1 (s=0)<\/button>\r\n                            <button onclick=\"setMultiplier(1)\" id=\"m1\"\r\n                                class=\"multiplier-btn px-3 py-1 rounded-md font-bold text-xs\">x10 (s=1)<\/button>\r\n                            <button onclick=\"setMultiplier(2)\" id=\"m2\"\r\n                                class=\"multiplier-btn px-3 py-1 rounded-md font-bold text-xs\">x100 (s=2)<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"flex-1 flex flex-col items-center justify-center gap-8\">\r\n                        <!-- 타이머 비주얼 -->\r\n                        <div class=\"relative w-48 h-48\">\r\n                            <svg class=\"w-full h-full transform -rotate-90\">\r\n                                <circle cx=\"96\" cy=\"96\" r=\"88\" stroke=\"#e2e8f0\" stroke-width=\"12\" fill=\"none\"\r\n                                    class=\"thick-border\" />\r\n                                <circle id=\"timer-progress\" cx=\"96\" cy=\"96\" r=\"88\" stroke=\"#ef4444\" stroke-width=\"12\"\r\n                                    fill=\"none\" stroke-dasharray=\"553\" stroke-dashoffset=\"553\" class=\"timer-ring\" />\r\n                            <\/svg>\r\n                            <div class=\"absolute inset-0 flex flex-col items-center justify-center\">\r\n                                <span id=\"live-timer\" class=\"text-4xl font-black text-black\">0.0s<\/span>\r\n                                <span id=\"measuring-tag\"\r\n                                    class=\"text-[0.6rem] font-bold text-slate-400 uppercase\">Ready<\/span>\r\n                            <\/div>\r\n                        <\/div>\r\n\r\n                        <!-- 입력 버튼 -->\r\n                        <button id=\"input-btn\"\r\n                            class=\"press-btn w-64 py-8 bg-white rounded-2xl text-2xl font-black text-black uppercase tracking-widest\">\r\n                            PRESS & HOLD\r\n                        <\/button>\r\n                    <\/div>\r\n\r\n                    <div class=\"mt-6 flex justify-between items-center bg-black p-5 rounded-xl\">\r\n                        <div class=\"text-white\">\r\n                            <div class=\"text-[0.65rem] text-slate-400 font-bold uppercase mb-1\">Raw Count (100ms unit)\r\n                            <\/div>\r\n                            <div class=\"text-3xl font-black\" id=\"raw-val\">0<\/div>\r\n                        <\/div>\r\n                        <div class=\"text-right\">\r\n                            <div class=\"text-[0.65rem] text-slate-400 font-bold uppercase mb-1\">Current Multiplier<\/div>\r\n                            <div class=\"text-2xl font-black text-yellow-400\" id=\"mult-label\">x 1<\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Right: Result & Code Area -->\r\n            <div class=\"w-1/2 flex flex-col gap-6\">\r\n\r\n                <!-- Result Panel -->\r\n                <div class=\"result-display rounded-2xl p-8 flex flex-col items-center justify-center text-center\">\r\n                    <h3 class=\"text-slate-500 font-black text-sm uppercase tracking-widest mb-6\">최종 측정 결과 (D10)<\/h3>\r\n                    <div class=\"flex items-baseline gap-2\">\r\n                        <div class=\"text-9xl font-black text-blue-700 leading-none\" id=\"final-res\">0<\/div>\r\n                    <\/div>\r\n                    <p class=\"text-slate-400 font-bold text-sm mt-8\">버튼을 누르고 있는 동안 실시간으로 계산됩니다.<\/p>\r\n\r\n                    <div class=\"mt-8 p-3 bg-red-50 border-2 border-red-200 rounded-lg flex items-center gap-3\">\r\n                        <span class=\"text-red-600 font-black\">⚠<\/span>\r\n                        <span class=\"text-[0.75rem] text-red-800 font-bold text-left\">\r\n                            <b>D11<\/b>은 시스템용으로 자동 점유됩니다.<br>다른 데이터와 겹치지 않게 주의하세요!\r\n                        <\/span>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <!-- Code Block -->\r\n                <div class=\"code-block rounded-2xl p-6 flex-1 shadow-lg flex flex-col\">\r\n                    <div\r\n                        class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-700 pb-2 flex justify-between\">\r\n                        <span>GX Works3 ST Example<\/span>\r\n                        <span class=\"text-blue-400\">TTMR(P)<\/span>\r\n                    <\/div>\r\n                    <pre class=\"font-mono text-[1.1rem] leading-relaxed text-blue-100 flex-1\">\r\n<span class=\"comment\">// s: 승수(0:x1, 1:x10, 2:x100)\r\n// d: 결과 저장(D10, D11 점유)<\/span>\r\n\r\n<span class=\"var\">D0<\/span> := <span id=\"code-s\">0<\/span>; <span class=\"comment\">// 승수 설정 (0~2)<\/span>\r\n\r\n<span class=\"comment\">// X0가 ON인 동안 시간 측정<\/span>\r\nTTMR(<span class=\"var\">X0<\/span>, <span class=\"var\">D0<\/span>, <span class=\"var\">D10<\/span>);\r\n\r\n<span class=\"comment\">// 결과 확인: D10 = 측정값 * 승수<\/span>\r\n                <\/pre>\r\n                <\/div>\r\n            <\/div>\r\n\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let multiplier = 0;\r\n        let startTime = 0;\r\n        let timerInterval = null;\r\n        let rawCount = 0;\r\n\r\n        const btn = document.getElementById('input-btn');\r\n        const liveTimer = document.getElementById('live-timer');\r\n        const progress = document.getElementById('timer-progress');\r\n        const rawDisp = document.getElementById('raw-val');\r\n        const finalRes = document.getElementById('final-res');\r\n        const measuringTag = document.getElementById('measuring-tag');\r\n\r\n        function setMultiplier(val) {\r\n            multiplier = val;\r\n            document.querySelectorAll('.multiplier-btn').forEach(b => b.classList.remove('selected'));\r\n            document.getElementById(`m${val}`).classList.add('selected');\r\n            document.getElementById('mult-label').innerText = `x ${val === 0 ? 1 : (val === 1 ? 10 : 100)}`;\r\n            document.getElementById('code-s').innerText = val;\r\n            document.getElementById('code-s-val').innerText = val;\r\n            updateRealtimeValue();\r\n        }\r\n\r\n        function updateRealtimeValue() {\r\n            const multFactor = multiplier === 0 ? 1 : (multiplier === 1 ? 10 : 100);\r\n            finalRes.innerText = rawCount * multFactor;\r\n        }\r\n\r\n        function startTimer() {\r\n            if (timerInterval) return;\r\n            startTime = Date.now();\r\n            btn.classList.add('active');\r\n            measuringTag.innerText = \"Measuring...\";\r\n            measuringTag.classList.remove('text-slate-400');\r\n            measuringTag.classList.add('text-red-500');\r\n\r\n            timerInterval = setInterval(() => {\r\n                const elapsed = (Date.now() - startTime) / 1000;\r\n                rawCount = Math.floor(elapsed * 10);\r\n                liveTimer.innerText = elapsed.toFixed(1) + 's';\r\n                rawDisp.innerText = rawCount;\r\n                updateRealtimeValue();\r\n                const offset = 553 - (Math.min(elapsed, 10) / 10) * 553;\r\n                progress.style.strokeDashoffset = offset;\r\n            }, 50);\r\n        }\r\n\r\n        function stopTimer() {\r\n            if (!timerInterval) return;\r\n            clearInterval(timerInterval);\r\n            timerInterval = null;\r\n            btn.classList.remove('active');\r\n            measuringTag.innerText = \"Ready\";\r\n            measuringTag.classList.add('text-slate-400');\r\n            measuringTag.classList.remove('text-red-500');\r\n            updateRealtimeValue();\r\n            progress.style.strokeDashoffset = 553;\r\n            liveTimer.innerText = '0.0s';\r\n        }\r\n\r\n        btn.addEventListener('mousedown', startTimer);\r\n        btn.addEventListener('mouseup', stopTimer);\r\n        btn.addEventListener('mouseleave', stopTimer);\r\n        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startTimer(); });\r\n        btn.addEventListener('touchend', (e) => { e.preventDefault(); stopTimer(); });\r\n\r\n        window.onload = () => setMultiplier(0);\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>"}];
const list=document.getElementById('list'),fr=document.getElementById('fr'),empty=document.getElementById('empty'),side=document.getElementById('side');
let ro=null;
function render(f){list.innerHTML='';DATA.filter(d=>!f||(d.label+' '+d.title).toLowerCase().includes(f)).forEach(d=>{const a=document.createElement('a');a.dataset.id=d.id;a.innerHTML=d.label+(d.title?'<small>'+d.title+'</small>':'');a.onclick=()=>open(d.id);list.appendChild(a)});mark()}
function mark(){const id=location.hash.slice(1);list.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===id))}
function fit(){try{const d=fr.contentDocument;if(!d||!d.body)return;fr.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){}}
function open(id){location.hash=id;side.classList.remove('open')}
function show(){const id=location.hash.slice(1),d=DATA.find(x=>x.id===id);mark();if(!d){fr.hidden=true;empty.hidden=false;document.title='PLC 명령어 통합 (Zodd Ver.)';return}
 empty.hidden=true;fr.hidden=false;document.title=d.label+' - PLC 통합';
 fr.onload=()=>{fit();try{if(ro)ro.disconnect();ro=new ResizeObserver(fit);ro.observe(fr.contentDocument.body);fr.contentDocument.addEventListener('click',()=>setTimeout(fit,60))}catch(e){}};
 fr.srcdoc=d.html;window.scrollTo(0,0)}
document.getElementById('q').oninput=e=>render(e.target.value.trim().toLowerCase());
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
window.addEventListener('hashchange',show);render('');show();
</script>
