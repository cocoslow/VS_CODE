                          <td><span class=\"op-tag\">(d2)<\/span><\/td>\r\n                                        <td>시스템 전용 디바이스 (D2000)<\/td>\r\n                                    <\/tr>\r\n                                <\/tbody>\r\n                            <\/table>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"p-5 bg-black/50 border border-slate-700 rounded-2xl\">\r\n                        <span\r\n                            class=\"text-[0.7rem] font-black text-slate-500 uppercase block mb-3 flex items-center gap-2\">\r\n                            <i data-lucide=\"code\" size=\"14\"><\/i> ST 프로그램 예제\r\n                        <\/span>\r\n                        <div class=\"st-code-box\">\r\n                            // D100부터 n개 데이터 정렬<br>\r\n                            // s2=2 (1스캔당 2개씩 비교)<br>\r\n                            DSORTD(SM400, D100, 6, 2, M0, D2000);\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"mt-6 p-5 bg-blue-900/40 border-2 border-blue-500/50 rounded-2xl italic\">\r\n                    <p class=\"text-xs font-bold text-blue-100 leading-relaxed flex items-center gap-2\">\r\n                        <i data-lucide=\"award\" size=\"16\"><\/i>\r\n                        \"32비트 데이터는 항상 2워드(D100+D101)를 한 쌍으로 처리합니다.\"\r\n                    <\/p>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 4: Notepads (25%) -->\r\n        <div class=\"w-[25%] flex flex-col gap-4 overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] border-emerald-500\">\r\n                <div\r\n                    class=\"memo-section-header flex justify-between items-center border-b border-emerald-900/50 pb-4 mb-4\">\r\n                    <div class=\"flex items-center gap-3 text-emerald-400\">\r\n                        <i data-lucide=\"clipboard-list\"><\/i>\r\n                        <h3 class=\"text-lg font-black uppercase\">전체 메모<\/h3>\r\n                    <\/div>\r\n                <\/div>\r\n                <textarea id=\"global-memo\" class=\"memo-textarea flex-1 border-emerald-900/50 mb-6\"\r\n                    placeholder=\"프로젝트 전체 특이사항 기록...\"><\/textarea>\r\n\r\n                <div class=\"flex items-center gap-3 mb-4 text-blue-400 border-t border-slate-800 pt-6\">\r\n                    <i data-lucide=\"pencil-line\"><\/i>\r\n                    <h3 class=\"text-lg font-black uppercase\">DSORTD 메모<\/h3>\r\n                <\/div>\r\n                <textarea id=\"op-memo\" class=\"memo-textarea flex-1 border-blue-900/50\"\r\n                    placeholder=\"명령어 개별 기록...\"><\/textarea>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let tableData = [35000, -1000, 500, -124, 9999, -5000, 200, -10, 0, 100];\r\n        let history = [];\r\n        let isSorting = false;\r\n        let memoData = { DSORTD: '', global: '' };\r\n        const startAddr = 100;\r\n\r\n        function renderTable() {\r\n            const body = document.getElementById('table-body');\r\n            const n = parseInt(document.getElementById('input-n').value);\r\n            body.innerHTML = '';\r\n\r\n            for (let i = 0; i < n; i++) {\r\n                const val = tableData[i] || 0;\r\n                const row = document.createElement('div');\r\n                row.className = `grid grid-cols-[100px_1fr_60px] gap-4 items-center transition-all duration-300`;\r\n\r\n                const addr1 = startAddr + i * 2;\r\n                const addr2 = addr1 + 1;\r\n\r\n                row.innerHTML = `\r\n                    <div class=\"text-[0.75rem] font-mono text-slate-500 font-black text-center leading-tight\">D${addr1}<br/>D${addr2}<\/div>\r\n                    <div class=\"h-16 rounded-xl border-[3px] border-black flex items-center px-6 bg-white shadow-[3px_3px_0px_#000] relative overflow-hidden\">\r\n                        <input type=\"number\" value=\"${val}\" class=\"data-input\" onchange=\"updateData(${i}, this.value)\" ${isSorting ? 'disabled' : ''}>\r\n                        <div class=\"absolute inset-0 bg-blue-500/5 pointer-events-none opacity-0 transition-opacity compare-highlight\"><\/div>\r\n                    <\/div>\r\n                    <div class=\"text-right font-mono text-[0.6rem] font-black text-slate-300 italic uppercase\">#${i}<\/div>`;\r\n                body.appendChild(row);\r\n            }\r\n        }\r\n\r\n        async function runSort() {\r\n            if (isSorting) return;\r\n            saveHistory();\r\n            isSorting = true;\r\n            document.getElementById('exec-btn').disabled = true;\r\n            document.getElementById('exec-btn').classList.add('opacity-50');\r\n            document.getElementById('done-bit').innerText = \"정렬 중\";\r\n            document.getElementById('done-bit').className = \"text-2xl font-black text-yellow-400 animate-pulse\";\r\n            document.getElementById('status-display').innerText = \"정렬 중...\";\r\n\r\n            const n = parseInt(document.getElementById('input-n').value);\r\n            const s2 = parseInt(document.getElementById('input-s2').value);\r\n            const isDesc = document.getElementById('sm703-toggle').checked;\r\n\r\n            let arr = tableData.slice(0, n);\r\n            for (let i = 0; i < arr.length; i++) {\r\n                for (let j = 0; j < arr.length - i - 1; j++) {\r\n                    let condition = isDesc ? (arr[j] < arr[j + 1]) : (arr[j] > arr[j + 1]);\r\n                    if (condition) {\r\n                        let temp = arr[j];\r\n                        arr[j] = arr[j + 1];\r\n                        arr[j + 1] = temp;\r\n                        tableData = [...arr, ...tableData.slice(n)];\r\n                        renderTable();\r\n                        await new Promise(r => setTimeout(r, 400 / s2));\r\n                    }\r\n                }\r\n            }\r\n\r\n            document.getElementById('status-display').innerText = \"정렬 완료\";\r\n            document.getElementById('done-bit').innerText = \"ON (완료)\";\r\n            document.getElementById('done-bit').className = \"text-2xl font-black text-emerald-400\";\r\n\r\n            setTimeout(() => {\r\n                isSorting = false;\r\n                document.getElementById('exec-btn').disabled = false;\r\n                document.getElementById('exec-btn').classList.remove('opacity-50');\r\n                document.getElementById('done-bit').innerText = \"OFF\";\r\n                document.getElementById('done-bit').className = \"text-2xl font-black text-white\";\r\n                document.getElementById('status-display').innerText = \"대기 중\";\r\n            }, 2500);\r\n        }\r\n\r\n        function updateData(idx, val) {\r\n            saveHistory();\r\n            tableData[idx] = parseInt(val) || 0;\r\n        }\r\n\r\n        function randomizeTable() {\r\n            saveHistory();\r\n            const n = parseInt(document.getElementById('input-n').value);\r\n            for (let i = 0; i < n; i++) {\r\n                tableData[i] = Math.floor(Math.random() * 200000) - 100000;\r\n            }\r\n            renderTable();\r\n        }\r\n\r\n        function stepN(d) {\r\n            let el = document.getElementById('input-n');\r\n            let val = parseInt(el.value) + d;\r\n            el.value = Math.max(2, Math.min(10, val));\r\n            renderTable();\r\n        }\r\n\r\n        function stepS2(d) {\r\n            let el = document.getElementById('input-s2');\r\n            let val = parseInt(el.value) + d;\r\n            el.value = Math.max(1, Math.min(10, val));\r\n        }\r\n\r\n        function updateSortMode() {\r\n            const isDesc = document.getElementById('sm703-toggle').checked;\r\n            const label = document.getElementById('sm703-label');\r\n            const lamp = document.getElementById('sm703-lamp');\r\n\r\n            if (isDesc) {\r\n                label.innerText = 'ON (내림)';\r\n                label.className = 'text-[0.75rem] font-black text-rose-500 uppercase';\r\n                lamp.className = 'status-lamp lamp-on-rose';\r\n            } else {\r\n                label.innerText = 'OFF (오름)';\r\n                label.className = 'text-[0.75rem] font-black text-blue-600 uppercase';\r\n                lamp.className = 'status-lamp lamp-off';\r\n            }\r\n        }\r\n\r\n        function saveHistory() { history.push([...tableData]); if (history.length > 20) history.shift(); }\r\n        function undo() { if (history.length > 0) { tableData = history.pop(); renderTable(); } }\r\n        function resetTable() { tableData = [35000, -1000, 500, -124, 9999, -5000, 200, -10, 0, 100]; renderTable(); }\r\n\r\n        function initMemos() {\r\n            const saved = localStorage.getItem('zodd_dsortd_final_v3');\r\n            if (saved) {\r\n                memoData = JSON.parse(saved);\r\n                document.getElementById('global-memo').value = memoData.global || '';\r\n                document.getElementById('op-memo').value = memoData.DSORTD || '';\r\n            }\r\n            document.getElementById('global-memo').oninput = (e) => { memoData.global = e.target.value; saveToLocal(); };\r\n            document.getElementById('op-memo').oninput = (e) => { memoData.DSORTD = e.target.value; saveToLocal(); };\r\n        }\r\n\r\n        function saveToLocal() {\r\n            localStorage.setItem('zodd_dsortd_final_v3', JSON.stringify(memoData));\r\n            const ind = document.getElementById('save-status'); ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1000);\r\n        }\r\n\r\n        window.onload = () => { lucide.createIcons(); initMemos(); renderTable(); updateSortMode(); };\r\n    <\/script>\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p6","label":"FIFW-선입선출","title":"PLC FIFO 통합 시뮬레이터","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-FIFW-%EC%84%A0%EC%9E%85%EC%84%A0%EC%B6%9C.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC FIFO 통합 시뮬레이터 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <script src=\"https://unpkg.com/lucide@latest\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #f1f5f9;\r\n        }\r\n\r\n        .zodd-card {\r\n            background: white;\r\n            border: 4px solid #000;\r\n            border-radius: 24px;\r\n            box-shadow: 8px 8px 0px #000;\r\n        }\r\n\r\n        .pointer-box {\r\n            background: #1e293b;\r\n            color: #3b82f6;\r\n            border: 3px solid #3b82f6;\r\n            border-radius: 12px;\r\n            font-family: monospace;\r\n        }\r\n\r\n        /* 탭 스타일 */\r\n        .tab-btn {\r\n            border-bottom: 4px solid transparent;\r\n            transition: 0.2s;\r\n            white-space: nowrap;\r\n            font-size: 1.1rem;\r\n            padding: 10px 14px;\r\n        }\r\n\r\n        .tab-btn.active {\r\n            border-bottom-color: #2563eb;\r\n            color: #2563eb;\r\n            font-weight: 900;\r\n            background: rgba(37, 99, 235, 0.05);\r\n        }\r\n\r\n        .tab-btn span.sub-label {\r\n            font-size: 0.85rem;\r\n            opacity: 0.6;\r\n            display: block;\r\n            margin-top: -2px;\r\n        }\r\n\r\n        /* 명령어 버튼 액티브 상태 */\r\n        .op-select-btn {\r\n            border: 3px solid #000;\r\n            transition: all 0.2s;\r\n            position: relative;\r\n            overflow: hidden;\r\n            height: 85px;\r\n            text-align: left;\r\n            padding: 0 20px;\r\n        }\r\n\r\n        .op-select-btn .btn-main-label {\r\n            font-size: 1.5rem;\r\n            font-weight: 900;\r\n            display: block;\r\n        }\r\n\r\n        .op-select-btn .btn-sub-label {\r\n            font-size: 0.9rem;\r\n            font-weight: 700;\r\n            opacity: 0.6;\r\n        }\r\n\r\n        .op-select-btn.active {\r\n            background: #2563eb !important;\r\n            color: white !important;\r\n            transform: scale(1.02);\r\n            z-index: 20;\r\n            box-shadow: 4px 4px 0px #000;\r\n        }\r\n\r\n        .op-select-btn.active i {\r\n            color: white !important;\r\n        }\r\n\r\n        .op-select-btn.active .btn-sub-label {\r\n            color: rgba(255, 255, 255, 0.8) !important;\r\n            opacity: 1;\r\n        }\r\n\r\n        /* 입력 필드 */\r\n        .data-input {\r\n            width: 100%;\r\n            background: transparent;\r\n            text-align: center;\r\n            font-weight: 900;\r\n            font-size: 1.8rem;\r\n            outline: none;\r\n            border: none;\r\n            color: #1e293b;\r\n        }\r\n\r\n        /* 스피너 제거 */\r\n        input::-webkit-outer-spin-button,\r\n        input::-webkit-inner-spin-button {\r\n            -webkit-appearance: none;\r\n            margin: 0;\r\n        }\r\n\r\n        #flow-overlay {\r\n            position: absolute;\r\n            top: 0;\r\n            left: 0;\r\n            width: 100%;\r\n            height: 100%;\r\n            pointer-events: none;\r\n            z-index: 100;\r\n        }\r\n\r\n        .flow-path {\r\n            fill: none;\r\n            stroke: #2563eb;\r\n            stroke-width: 3;\r\n            stroke-dasharray: 6, 4;\r\n            animation: dash 20s linear infinite;\r\n            opacity: 0.6;\r\n            transition: d 0.4s cubic-bezier(0.4, 0, 0.2, 1);\r\n        }\r\n\r\n        @keyframes dash {\r\n            to {\r\n                stroke-dashoffset: -1000;\r\n            }\r\n        }\r\n\r\n        /* 업/다운 버튼 스타일 */\r\n        .ud-btn {\r\n            background: #000;\r\n            color: #fff;\r\n            width: 36px;\r\n            height: 36px;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            border-radius: 8px;\r\n            font-size: 0.75rem;\r\n            transition: all 0.1s;\r\n        }\r\n\r\n        .ud-btn:hover {\r\n            background: #334155;\r\n        }\r\n\r\n        .ud-btn:active {\r\n            transform: scale(0.9);\r\n        }\r\n\r\n        .result-display-panel {\r\n            background: #0f172a;\r\n            border: 4px solid #334155;\r\n            border-radius: 16px;\r\n            height: 80px;\r\n            min-width: 180px;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);\r\n        }\r\n\r\n        .result-value-text {\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 2.8rem;\r\n            font-weight: 800;\r\n            color: #60a5fa;\r\n            text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);\r\n        }\r\n\r\n        .st-syntax-large {\r\n            background: #020617;\r\n            border-left: 10px solid #2563eb;\r\n            padding: 25px;\r\n            border-radius: 16px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 2.2rem;\r\n            font-weight: 800;\r\n            color: #38bdf8;\r\n            margin-bottom: 25px;\r\n            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);\r\n        }\r\n\r\n        .st-code-box {\r\n            background: #000;\r\n            border: 1px solid #334155;\r\n            padding: 18px;\r\n            border-radius: 12px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 0.9rem;\r\n            color: #ec4899;\r\n            line-height: 1.5;\r\n        }\r\n\r\n        .operand-table {\r\n            width: 100%;\r\n            border-collapse: collapse;\r\n            margin-top: 10px;\r\n        }\r\n\r\n        .operand-table th {\r\n            background: #334155;\r\n            color: #94a3b8;\r\n            font-size: 0.7rem;\r\n            text-align: left;\r\n            padding: 6px 10px;\r\n            border: 1px solid #1e293b;\r\n        }\r\n\r\n        .operand-table td {\r\n            font-size: 0.85rem;\r\n            padding: 10px;\r\n            border: 1px solid #334155;\r\n            color: #e2e8f0;\r\n        }\r\n\r\n        .memo-textarea {\r\n            width: 100%;\r\n            background: #1e293b;\r\n            border: 2px solid #334155;\r\n            border-radius: 16px;\r\n            padding: 20px;\r\n            color: #f8fafc;\r\n            font-size: 1rem;\r\n            line-height: 1.7;\r\n            outline: none;\r\n            resize: none;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .memo-textarea:focus {\r\n            border-color: #2563eb;\r\n            background: #0f172a;\r\n        }\r\n\r\n        .save-indicator {\r\n            font-size: 0.65rem;\r\n            color: #22c55e;\r\n            font-weight: bold;\r\n            opacity: 0;\r\n            transition: opacity 0.3s;\r\n        }\r\n\r\n        .save-indicator.show {\r\n            opacity: 1;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar {\r\n            width: 6px;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar-thumb {\r\n            background: #cbd5e1;\r\n            border-radius: 10px;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4 h-screen flex flex-col overflow-hidden\">\r\n\r\n    <!-- Header -->\r\n    <div class=\"zodd-card p-4 flex justify-between items-center mb-4\">\r\n        <div class=\"flex items-center gap-4\">\r\n            <div class=\"bg-blue-600 p-2 rounded-xl text-white shadow-lg\"><i data-lucide=\"layers\" size=\"30\"><\/i><\/div>\r\n            <div>\r\n                <h1 class=\"text-3xl font-black uppercase tracking-tighter\">PLC 데이터 테이블 마스터<\/h1>\r\n                <p class=\"text-xs font-bold text-slate-400 uppercase tracking-widest\">고급 명령어 시뮬레이션 연구소<\/p>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"pointer-box px-8 py-3 text-center border-4 border-black\">\r\n            <span class=\"text-[0.65rem] font-black block opacity-70 uppercase tracking-tight\">활성 데이터 수 (D100)<\/span>\r\n            <span id=\"ptr-val\" class=\"text-3xl font-black text-white\">0<\/span>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- 4-Column Layout -->\r\n    <div class=\"flex-1 flex gap-4 overflow-hidden\">\r\n\r\n        <!-- Col 1: Command Selection (20%) -->\r\n        <div class=\"w-[20%] flex flex-col gap-4\">\r\n            <div class=\"zodd-card p-6 flex flex-col h-full shadow-[6px_6px_0px_#000]\">\r\n                <h3 class=\"text-xs font-black text-slate-400 uppercase mb-5 border-b-2 pb-2 flex items-center gap-2\">\r\n                    <i data-lucide=\"zap\" size=\"16\"><\/i> 명령어 선택\r\n                <\/h3>\r\n\r\n                <div class=\"space-y-3 flex-1 overflow-y-auto pr-1 custom-scrollbar\">\r\n                    <button onclick=\"selectOp('FIFW')\" id=\"btn-FIFW\"\r\n                        class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between\">\r\n                        <div><span class=\"btn-main-label\">FIFW<\/span><span class=\"btn-sub-label\">(테이블 쓰기)<\/span><\/div>\r\n                        <i data-lucide=\"chevron-right\"><\/i>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('FIFR')\" id=\"btn-FIFR\"\r\n                        class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between\">\r\n                        <div><span class=\"btn-main-label\">FIFR<\/span><span class=\"btn-sub-label\">(선입 읽기)<\/span><\/div>\r\n                        <i data-lucide=\"log-out\" class=\"text-blue-600\"><\/i>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('FPOP')\" id=\"btn-FPOP\"\r\n                        class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between\">\r\n                        <div><span class=\"btn-main-label\">FPOP<\/span><span class=\"btn-sub-label\">(후입 읽기)<\/span><\/div>\r\n                        <i data-lucide=\"arrow-down-to-dot\" class=\"text-orange-600\"><\/i>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('FINS')\" id=\"btn-FINS\"\r\n                        class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between\">\r\n                        <div><span class=\"btn-main-label\">FINS<\/span><span class=\"btn-sub-label\">(데이터 삽입)<\/span><\/div>\r\n                        <i data-lucide=\"user-plus\" class=\"text-emerald-600\"><\/i>\r\n                    <\/button>\r\n                    <button onclick=\"selectOp('FDEL')\" id=\"btn-FDEL\"\r\n                        class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between\">\r\n                        <div><span class=\"btn-main-label\">FDEL<\/span><span class=\"btn-sub-label\">(데이터 삭제)<\/span><\/div>\r\n                        <i data-lucide=\"user-minus\" class=\"text-rose-600\"><\/i>\r\n                    <\/button>\r\n                <\/div>\r\n                <button onclick=\"resetTable()\"\r\n                    class=\"mt-4 text-slate-400 font-black text-xs uppercase tracking-widest hover:text-red-600 transition-colors\">모든 데이터 삭제<\/button>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 2: Live Monitor (30%) -->\r\n        <div class=\"w-[30%] flex flex-col gap-4 relative\">\r\n            <div class=\"zodd-card p-6 flex-1 flex flex-col shadow-[10px_10px_0px_#000] overflow-hidden relative\">\r\n                <div class=\"flex justify-between items-center mb-6\">\r\n                    <div class=\"flex items-center gap-4\">\r\n                        <div>\r\n                            <span\r\n                                class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest block\">상태<\/span>\r\n                            <h2 id=\"status-display\"\r\n                                class=\"text-3xl font-black text-slate-800 tracking-tighter uppercase\">대기 중<\/h2>\r\n                        <\/div>\r\n                        <div id=\"read-result-area\" class=\"invisible\">\r\n                            <span class=\"text-[0.7rem] font-black text-blue-600 uppercase block\">결과<\/span>\r\n                            <div class=\"result-display-panel\"><span id=\"extracted-val\"\r\n                                    class=\"result-value-text\">---<\/span><\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <!-- 업/다운 버튼 위치 조정 완료 (Flex 기반 우측 정렬) -->\r\n                <div class=\"grid grid-cols-2 gap-4 mb-8\">\r\n                    <div class=\"bg-slate-50 p-4 rounded-3xl border-2 border-black flex items-center justify-between\">\r\n                        <div class=\"flex-1\">\r\n                            <label class=\"text-[0.65rem] font-black text-slate-500 uppercase block mb-1\">소스 데이터 (S)<\/label>\r\n                            <input type=\"number\" id=\"input-s\" value=\"100\" class=\"data-input text-blue-600\">\r\n                        <\/div>\r\n                        <div class=\"flex flex-col gap-1 ml-3\">\r\n                            <button onclick=\"stepS(10)\" class=\"ud-btn\">▲<\/button>\r\n                            <button onclick=\"stepS(-10)\" class=\"ud-btn\">▼<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                    <div class=\"bg-slate-50 p-4 rounded-3xl border-2 border-black flex items-center justify-between\">\r\n                        <div class=\"flex-1\">\r\n                            <label class=\"text-[0.65rem] font-black text-slate-500 uppercase block mb-1\">인덱스 번호 (N)<\/label>\r\n                            <input type=\"number\" id=\"input-n\" value=\"0\" min=\"0\" max=\"14\"\r\n                                class=\"data-input text-orange-600\">\r\n                        <\/div>\r\n                        <div class=\"flex flex-col gap-1 ml-3\">\r\n                            <button onclick=\"stepN(1)\" class=\"ud-btn\">▲<\/button>\r\n                            <button onclick=\"stepN(-1)\" class=\"ud-btn\">▼<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"flex gap-3 mb-6\">\r\n                    <button onclick=\"undo()\"\r\n                        class=\"flex-1 bg-slate-800 hover:bg-black text-white h-20 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-xl flex items-center justify-center gap-3 transition-all\">\r\n                        <i data-lucide=\"rotate-ccw\"><\/i> 되돌리기\r\n                    <\/button>\r\n                    <button onclick=\"runExecution()\" id=\"exec-btn\"\r\n                        class=\"flex-[1.5] bg-blue-600 hover:bg-blue-700 text-white h-20 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-2xl flex items-center justify-center gap-3 transition-all\">\r\n                        <i data-lucide=\"play\" fill=\"white\"><\/i> 실행\r\n                    <\/button>\r\n                <\/div>\r\n\r\n                <div class=\"flex-1 overflow-y-auto custom-scrollbar pr-2 relative\" id=\"table-container\">\r\n                    <svg id=\"flow-overlay\">\r\n                        <g id=\"arrows-g\"><\/g>\r\n                    <\/svg>\r\n                    <div class=\"grid grid-cols-[80px_1fr_60px] gap-4 mb-4 items-center\" id=\"row-ptr\">\r\n                        <div class=\"bg-black text-white p-2 rounded-lg font-mono text-center font-bold text-xs\">D100\r\n                        <\/div>\r\n                        <div\r\n                            class=\"bg-blue-600 p-3 rounded-xl border-4 border-black flex justify-between items-center text-white\">\r\n                            <span id=\"ptr-center\" class=\"text-2xl font-black\">0<\/span><span\r\n                                class=\"text-[0.6rem] font-black uppercase\">데이터 수<\/span><\/div>\r\n                        <div class=\"text-xs font-black text-blue-300 italic uppercase\">포인터<\/div>\r\n                    <\/div>\r\n                    <div id=\"table-body\" class=\"space-y-2 pb-10\"><\/div>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 3: Handbook (25%) -->\r\n        <div class=\"w-[25%] flex flex-col overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] overflow-hidden\">\r\n                <div class=\"flex items-center gap-3 mb-6 border-b border-slate-700 pb-4\">\r\n                    <i data-lucide=\"book-open\" class=\"text-pink-500\"><\/i>\r\n                    <h3 class=\"text-xl font-black uppercase tracking-widest\">기술 매뉴얼<\/h3>\r\n                    <div id=\"save-status\" class=\"save-indicator ml-auto\">저장 완료!<\/div>\r\n                <\/div>\r\n\r\n                <div class=\"flex gap-1 mb-6 overflow-x-auto no-scrollbar border-b border-slate-800\">\r\n                    <button onclick=\"selectOp('FIFW')\" id=\"tab-FIFW\" class=\"tab-btn px-3 py-2 font-black\">FIFW<\/button>\r\n                    <button onclick=\"selectOp('FIFR')\" id=\"tab-FIFR\" class=\"tab-btn px-3 py-2 font-black\">FIFR<\/button>\r\n                    <button onclick=\"selectOp('FPOP')\" id=\"tab-FPOP\" class=\"tab-btn px-3 py-2 font-black\">FPOP<\/button>\r\n                    <button onclick=\"selectOp('FINS')\" id=\"tab-FINS\" class=\"tab-btn px-3 py-2 font-black\">FINS<\/button>\r\n                    <button onclick=\"selectOp('FDEL')\" id=\"tab-FDEL\" class=\"tab-btn px-3 py-2 font-black\">FDEL<\/button>\r\n                <\/div>\r\n\r\n                <div id=\"hb-content\" class=\"space-y-6 flex-1 overflow-y-auto custom-scrollbar pr-2\"><\/div>\r\n\r\n                <div class=\"mt-6 p-5 bg-blue-900/40 border-2 border-blue-500/50 rounded-2xl italic\">\r\n                    <p id=\"hb-tip\" class=\"text-xs font-bold text-blue-100 leading-relaxed\"><\/p>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 4: Notepads (25%) -->\r\n        <div class=\"w-[25%] flex flex-col gap-4 overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] border-emerald-500\">\r\n                <div class=\"mb-8 flex-1 flex flex-col\">\r\n                    <div class=\"flex items-center gap-3 mb-4 text-emerald-400 border-b border-emerald-900/50 pb-2\">\r\n                        <i data-lucide=\"clipboard-list\" size=\"20\"><\/i>\r\n                        <h3 class=\"text-lg font-black uppercase\">전체 메모<\/h3>\r\n                    <\/div>\r\n                    <textarea id=\"global-memo\" class=\"memo-textarea flex-1 border-emerald-900/50\"\r\n                        placeholder=\"프로젝트 전체 특이사항 기록...\"><\/textarea>\r\n                <\/div>\r\n                <div class=\"flex-1 flex flex-col pt-4 border-t border-slate-800\">\r\n                    <div class=\"flex items-center gap-3 mb-4 text-blue-400\">\r\n                        <i data-lucide=\"pencil-line\" size=\"20\"><\/i>\r\n                        <h3 id=\"memo-title\" class=\"text-lg font-black uppercase\">FIFW 메모<\/h3>\r\n                    <\/div>\r\n                    <textarea id=\"op-memo\" class=\"memo-textarea flex-1 border-blue-900/50\"\r\n                        placeholder=\"명령어 개별 메모 기록...\"><\/textarea>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let tableData = [10, 20, 30, 40, 50];\r\n        let history = [];\r\n        const maxSize = 15;\r\n        let currentOp = 'FIFW';\r\n        let memoData = { FIFW: '', FIFR: '', FPOP: '', FINS: '', FDEL: '', global: '' };\r\n\r\n        const manual = {\r\n            FIFW: {\r\n                title: \"FIFW (Write Last)\", syntax: \"FIFW(EN, s, d);\",\r\n                desc: \"데이터 테이블의 가장 마지막 빈 공간에 새로운 데이터를 추가합니다.\",\r\n                operands: [{ label: \"(s)\", content: \"쓰기 데이터 (D10)\" }, { label: \"(d)\", content: \"테이블 선두 디바이스 (D100)\" }],\r\n                flow: \"입력값(s) ➔ D(101 + Pointer)\", ptr: \"D100 값이 +1 증가합니다.\",\r\n                st: \"// s: 데이터, d: 테이블 선두\\nFIFW(SM400, D10, D100);\", tip: \"제품 입고 시 줄의 맨 뒤에 등록하는 표준 방식입니다.\"\r\n            },\r\n            FIFR: {\r\n                title: \"FIFR (Read First)\", syntax: \"FIFR(EN, s, d);\",\r\n                desc: \"가장 오래된 데이터(D101)를 추출하고 테이블을 당깁니다.\",\r\n                operands: [{ label: \"(s)\", content: \"테이블 선두 (D100)\" }, { label: \"(d)\", content: \"선입 데이터 저장 (D200)\" }],\r\n                flow: \"D101 추출 ➔ [D102→D101, D103→D102...]\", ptr: \"D100 값이 -1 감소합니다.\",\r\n                st: \"// s: 테이블 선두, d: 결과\\nFIFR(SM400, D100, D200);\", tip: \"먼저 들어온 부품을 먼저 투입(FIFO)할 때 필수입니다.\"\r\n            },\r\n            FPOP: {\r\n                title: \"FPOP (Read Last)\", syntax: \"FPOP(EN, s, d);\",\r\n                desc: \"가장 나중에 들어온 데이터를 꺼냅니다.\",\r\n                operands: [{ label: \"(s)\", content: \"테이블 선두 (D100)\" }, { label: \"(d)\", content: \"후입 데이터 저장 (D200)\" }],\r\n                flow: \"마지막 데이터 추출 ➔ 삭제 (나머지 이동 없음)\", ptr: \"D100 값이 -1 감소합니다.\",\r\n                st: \"// s: 테이블 선두, d: 결과\\nFPOP(SM400, D100, D200);\", tip: \"스택 방식. 방금 넣은 데이터를 다시 뺄 때 유리합니다.\"\r\n            },\r\n            FINS: {\r\n                title: \"FINS (Data Insert)\", syntax: \"FINS(EN, s, n, d);\",\r\n                desc: \"지정한 위치(n)에 데이터를 삽입합니다. 뒷 데이터는 밀려납니다.\",\r\n                operands: [{ label: \"(s)\", content: \"삽입 데이터\" }, { label: \"(n)\", content: \"삽입 위치 (0~n)\" }, { label: \"(d)\", content: \"테이블 선두\" }],\r\n                flow: \"n번 위치 ➔ 데이터 삽입 ➔ [기존 데이터] 한 칸씩 후퇴\", ptr: \"D100 값이 +1 증가합니다.\",\r\n                st: \"FINS(SM400, D10, D20, D100);\", tip: \"테이블 중간에 긴급 데이터를 끼워 넣을 때 사용합니다.\"\r\n            },\r\n            FDEL: {\r\n                title: \"FDEL (Data Delete)\", syntax: \"FDEL(EN, n, d);\",\r\n                desc: \"지정한 위치(n)를 삭제하고 빈자리를 메우기 위해 당깁니다.\",\r\n                operands: [{ label: \"(n)\", content: \"삭제 위치 (0~n)\" }, { label: \"(d)\", content: \"테이블 선두\" }],\r\n                flow: \"n번 데이터 삭제 ➔ [뒷 데이터들] 한 칸씩 전진\", ptr: \"D100 값이 -1 감소합니다.\",\r\n                st: \"FDEL(SM400, D20, D100);\", tip: \"중간의 불량 정보를 제거하고 테이블을 다시 압축합니다.\"\r\n            }\r\n        };\r\n\r\n        function renderTable() {\r\n            const body = document.getElementById('table-body'); body.innerHTML = '';\r\n            document.getElementById('ptr-val').innerText = tableData.length;\r\n            document.getElementById('ptr-center').innerText = tableData.length;\r\n            const n = parseInt(document.getElementById('input-n').value);\r\n            for (let i = 0; i < maxSize; i++) {\r\n                const val = tableData[i] !== undefined ? tableData[i] : null;\r\n                const row = document.createElement('div'); row.id = `row-${i}`;\r\n                let borderClass = 'border-black';\r\n                if ((currentOp === 'FINS' || currentOp === 'FDEL') && i === n) borderClass = 'border-orange-500 ring-4 ring-orange-200 ring-inset';\r\n                row.className = `grid grid-cols-[80px_1fr_60px] gap-4 items-center transition-all duration-300`;\r\n                row.innerHTML = `<div class=\"text-[0.65rem] font-mono text-slate-400 font-black text-center\">D${101 + i}<\/div>\r\n                    <div class=\"h-12 rounded-xl border-[3px] flex items-center px-4 relative transition-all ${val !== null ? 'bg-white ' + borderClass + ' shadow-[3px_3px_0px_#000]' : 'bg-slate-50 border-slate-200 border-dashed'}\">\r\n                        <input type=\"number\" value=\"${val !== null ? val : ''}\" class=\"data-input\" onchange=\"updateData(${i}, this.value)\" ${val === null && i > tableData.length ? 'disabled' : ''}>\r\n                    <\/div>\r\n                    <div class=\"text-right font-mono text-[0.6rem] font-black text-slate-300 italic uppercase\">#${i}<\/div>`;\r\n                body.appendChild(row);\r\n            }\r\n            drawFlow();\r\n        }\r\n\r\n        function selectOp(op) {\r\n            currentOp = op;\r\n            document.querySelectorAll('.op-select-btn').forEach(b => b.classList.remove('active'));\r\n            const activeBtn = document.getElementById(`btn-${op}`); if (activeBtn) activeBtn.classList.add('active');\r\n            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));\r\n            const activeTab = document.getElementById(`tab-${op}`); if (activeTab) activeTab.classList.add('active');\r\n            document.getElementById('status-display').innerText = `대기 중: ${op}`;\r\n            updateHandbook(op); renderTable();\r\n        }\r\n\r\n        function updateHandbook(name) {\r\n            const content = document.getElementById('hb-content');\r\n            const data = manual[name];\r\n            let operandHtml = `<table class=\"operand-table\"><thead><tr><th>피연산자<\/th><th>설명<\/th><\/tr><\/thead><tbody>`;\r\n            data.operands.forEach(o => { operandHtml += `<tr><td><span class=\"op-tag\">${o.label}<\/span><\/td><td>${o.content}<\/td><\/tr>`; });\r\n            operandHtml += `<\/tbody><\/table>`;\r\n            content.innerHTML = `<div class=\"bg-slate-800/80 p-6 rounded-3xl border-2 border-slate-700\">\r\n                    <h4 class=\"text-2xl font-black text-blue-400 mb-2\">${data.title}<\/h4>\r\n                    <div class=\"st-syntax-large\">${data.syntax}<\/div>\r\n                    <p class=\"text-sm font-bold text-slate-300 leading-relaxed\">${data.desc}<\/p>\r\n                    <div class=\"mt-6\">${operandHtml}<\/div>\r\n                <\/div>\r\n                <div class=\"space-y-6\">\r\n                    <div><span class=\"text-[0.7rem] font-black text-slate-500 uppercase block mb-2 tracking-widest flex items-center gap-2\"><i data-lucide=\"move\" size=\"14\"><\/i> 데이터 물리 이동<\/span>\r\n                        <div class=\"bg-black/50 p-4 rounded-xl border border-slate-700 text-xs text-orange-300 font-mono\">${data.flow}<\/div>\r\n                    <\/div>\r\n                    <div><span class=\"text-[0.7rem] font-black text-slate-500 uppercase block mb-2 tracking-widest flex items-center gap-2\"><i data-lucide=\"code\" size=\"14\"><\/i> ST 예제 코드<\/span>\r\n                        <div class=\"st-code-box\">${data.st}<\/div>\r\n                    <\/div>\r\n                <\/div>`;\r\n            document.getElementById('hb-tip').innerText = data.tip;\r\n            document.getElementById('memo-title').innerText = `${name} 메모`;\r\n            document.getElementById('op-memo').value = memoData[name] || '';\r\n            lucide.createIcons();\r\n        }\r\n\r\n        function drawFlow() {\r\n            const g = document.getElementById('arrows-g'); g.innerHTML = '';\r\n            const overlay = document.getElementById('flow-overlay'); const rectOverlay = overlay.getBoundingClientRect();\r\n            if (currentOp === 'FIFW') drawArrow('row-ptr', `row-${tableData.length}`, g, rectOverlay);\r\n            else if (currentOp === 'FIFR') drawArrow('row-0', 'read-result-area', g, rectOverlay);\r\n            else if (currentOp === 'FPOP' && tableData.length > 0) drawArrow(`row-${tableData.length - 1}`, 'read-result-area', g, rectOverlay);\r\n        }\r\n\r\n        function drawArrow(fromId, toId, g, offset) {\r\n            const f = document.getElementById(fromId); const t = document.getElementById(toId);\r\n            if (!f || !t) return;\r\n            const r1 = f.getBoundingClientRect(); const r2 = t.getBoundingClientRect();\r\n            const x1 = r1.left + r1.width / 2 - offset.left; const y1 = r1.top + r1.height / 2 - offset.top;\r\n            const x2 = r2.left + r2.width / 2 - offset.left; const y2 = r2.top + r2.height / 2 - offset.top;\r\n            const path = document.createElementNS(\"http://www.w3.org/2000/svg\", \"path\");\r\n            path.setAttribute('class', 'flow-path'); const cp = (y1 + y2) / 2;\r\n            path.setAttribute('d', `M ${x1},${y1} C ${x1 + 60},${cp} ${x2 + 60},${cp} ${x2},${y2}`);\r\n            path.setAttribute('marker-end', 'url(#arrowhead)'); g.appendChild(path);\r\n        }\r\n\r\n        function runExecution() {\r\n            saveHistory();\r\n            const s = parseInt(document.getElementById('input-s').value); const n = parseInt(document.getElementById('input-n').value);\r\n            let extracted = null;\r\n            const btn = document.getElementById('exec-btn'); btn.classList.add('bg-emerald-600'); setTimeout(() => btn.classList.remove('bg-emerald-600'), 300);\r\n            const resultArea = document.getElementById('read-result-area'); const resultVal = document.getElementById('extracted-val');\r\n            switch (currentOp) {\r\n                case 'FIFW': if (tableData.length < maxSize) { tableData.push(s); resultArea.classList.add('invisible'); } break;\r\n                case 'FIFR': if (tableData.length > 0) { extracted = tableData.shift(); resultArea.classList.remove('invisible'); resultVal.innerText = extracted; } break;\r\n                case 'FPOP': if (tableData.length > 0) { extracted = tableData.pop(); resultArea.classList.remove('invisible'); resultVal.innerText = extracted; } break;\r\n                case 'FINS': if (tableData.length < maxSize) { tableData.splice(Math.min(n, tableData.length), 0, s); resultArea.classList.add('invisible'); } break;\r\n                case 'FDEL': if (tableData.length > 0) { tableData.splice(Math.min(n, tableData.length - 1), 1); resultArea.classList.add('invisible'); } break;\r\n            }\r\n            renderTable();\r\n        }\r\n\r\n        function saveHistory() { history.push(JSON.parse(JSON.stringify(tableData))); if (history.length > 20) history.shift(); }\r\n        function undo() { if (history.length > 0) { tableData = history.pop(); document.getElementById('status-display').innerText = \"되돌리기: 성공\"; document.getElementById('read-result-area').classList.add('invisible'); renderTable(); } }\r\n        function updateData(idx, val) { saveHistory(); const num = parseInt(val); if (!isNaN(num)) { if (idx < tableData.length) tableData[idx] = num; else tableData.push(num); } else tableData.splice(idx, 1); renderTable(); }\r\n        function stepS(d) { document.getElementById('input-s').value = parseInt(document.getElementById('input-s').value) + d; renderTable(); }\r\n        function stepN(d) { let el = document.getElementById('input-n'); let val = parseInt(el.value) + d; el.value = Math.max(0, Math.min(14, val)); renderTable(); }\r\n        function resetTable() { saveHistory(); tableData = []; document.getElementById('read-result-area').classList.add('invisible'); renderTable(); }\r\n        function initMemos() {\r\n            const saved = localStorage.getItem('zodd_fifo_memos_v4');\r\n            if (saved) memoData = JSON.parse(saved);\r\n            document.getElementById('global-memo').value = memoData.global || '';\r\n            document.getElementById('op-memo').addEventListener('input', (e) => { memoData[currentOp] = e.target.value; saveToLocal(); });\r\n            document.getElementById('global-memo').addEventListener('input', (e) => { memoData.global = e.target.value; saveToLocal(); });\r\n        }\r\n        function saveToLocal() {\r\n            localStorage.setItem('zodd_fifo_memos_v4', JSON.stringify(memoData));\r\n            const ind = document.getElementById('save-status'); ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1000);\r\n        }\r\n\r\n        window.onload = () => {\r\n            document.body.innerHTML += '<svg style=\"width:0;height:0;position:absolute;\"><defs><marker id=\"arrowhead\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#2563eb\" /><\/marker><\/defs><\/svg>';\r\n            lucide.createIcons(); initMemos(); selectOp('FIFW'); renderTable();\r\n        };\r\n    <\/script>\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p7","label":"PWM 펄스폭","title":"PWM-펄스폭 변조 제어","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-PWM_%ED%8E%84%EC%8A%A4%ED%8F%AD.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PWM-펄스폭 변조 제어 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <script src=\"https://unpkg.com/lucide@latest\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #f1f5f9;\r\n        }\r\n\r\n        .zodd-card {\r\n            background: white;\r\n            border: 4px solid #000;\r\n            border-radius: 24px;\r\n            box-shadow: 8px 8px 0px #000;\r\n        }\r\n\r\n        .pointer-box {\r\n            background: #1e293b;\r\n            color: #3b82f6;\r\n            border: 3px solid #3b82f6;\r\n            border-radius: 12px;\r\n            font-family: monospace;\r\n        }\r\n\r\n        .op-select-btn {\r\n            border: 3px solid #000;\r\n            transition: all 0.2s;\r\n            position: relative;\r\n            overflow: hidden;\r\n            height: 85px;\r\n            text-align: left;\r\n            padding: 0 20px;\r\n        }\r\n\r\n        .op-select-btn .btn-main-label {\r\n            font-size: 1.5rem;\r\n            font-weight: 900;\r\n            display: block;\r\n        }\r\n\r\n        .op-select-btn .btn-sub-label {\r\n            font-size: 0.9rem;\r\n            font-weight: 700;\r\n            opacity: 0.6;\r\n        }\r\n\r\n        .op-select-btn.active {\r\n            background: #2563eb !important;\r\n            color: white !important;\r\n            transform: scale(1.02);\r\n            z-index: 20;\r\n            box-shadow: 4px 4px 0px #000;\r\n        }\r\n\r\n        .data-input {\r\n            width: 100%;\r\n            background: transparent;\r\n            text-align: center;\r\n            font-weight: 900;\r\n            font-size: 1.8rem;\r\n            outline: none;\r\n            border: none;\r\n            color: #1e293b;\r\n        }\r\n\r\n        input::-webkit-outer-spin-button,\r\n        input::-webkit-inner-spin-button {\r\n            -webkit-appearance: none;\r\n            margin: 0;\r\n        }\r\n\r\n        .ud-btn {\r\n            background: #000;\r\n            color: #fff;\r\n            width: 40px;\r\n            height: 36px;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            border-radius: 8px;\r\n            font-size: 0.75rem;\r\n            transition: all 0.1s;\r\n        }\r\n\r\n        .ud-btn:hover {\r\n            background: #334155;\r\n        }\r\n\r\n        .ud-btn:active {\r\n            transform: scale(0.9);\r\n        }\r\n\r\n        /* 파형 시뮬레이션 및 타임차트 */\r\n        .scope-container {\r\n            background: #fff;\r\n            border: 4px solid #000;\r\n            border-radius: 20px;\r\n            position: relative;\r\n            overflow: hidden;\r\n            height: 260px;\r\n            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);\r\n        }\r\n\r\n        .wave-path {\r\n            fill: #e2e8f0;\r\n            stroke: #475569;\r\n            stroke-width: 3;\r\n        }\r\n\r\n        .wave-path-active {\r\n            fill: none;\r\n            stroke: #2563eb;\r\n            stroke-width: 5;\r\n            filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.3));\r\n        }\r\n\r\n        /* 출력 램프 */\r\n        .output-lamp {\r\n            width: 60px;\r\n            height: 60px;\r\n            border-radius: 50%;\r\n            border: 4px solid #000;\r\n            background: #334155;\r\n            transition: all 0.05s;\r\n        }\r\n\r\n        .output-lamp.on {\r\n            background: #facc15;\r\n            box-shadow: 0 0 30px #eab308, inset 0 0 10px white;\r\n            border-color: #854d0e;\r\n        }\r\n\r\n        .st-syntax-large {\r\n            background: #020617;\r\n            border-left: 10px solid #2563eb;\r\n            padding: 25px;\r\n            border-radius: 16px;\r\n            font-family: 'JetBrains Mono', monospace;\r\n            font-size: 1.8rem;\r\n            font-weight: 800;\r\n            color: #38bdf8;\r\n            margin-bottom: 25px;\r\n            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);\r\n            line-height: 1.2;\r\n        }\r\n\r\n        .operand-table {\r\n            width: 100%;\r\n            border-collapse: collapse;\r\n            margin-top: 10px;\r\n        }\r\n\r\n        .operand-table th {\r\n            background: #334155;\r\n            color: #94a3b8;\r\n            font-size: 0.9rem;\r\n            text-align: left;\r\n            padding: 8px 12px;\r\n            border: 1px solid #1e293b;\r\n        }\r\n\r\n        .operand-table td {\r\n            font-size: 1rem;\r\n            padding: 12px;\r\n            border: 1px solid #334155;\r\n            color: #e2e8f0;\r\n            font-weight: 600;\r\n        }\r\n\r\n        .op-tag {\r\n            font-weight: 800;\r\n            color: #3b82f6;\r\n            background: #1e293b;\r\n            padding: 2px 6px;\r\n            border-radius: 4px;\r\n        }\r\n\r\n        .memo-textarea {\r\n            width: 100%;\r\n            background: #1e293b;\r\n            border: 2px solid #334155;\r\n            border-radius: 16px;\r\n            padding: 20px;\r\n            color: #f8fafc;\r\n            font-size: 1rem;\r\n            line-height: 1.7;\r\n            outline: none;\r\n            resize: none;\r\n            transition: all 0.2s;\r\n        }\r\n\r\n        .memo-textarea:focus {\r\n            border-color: #2563eb;\r\n            background: #0f172a;\r\n        }\r\n\r\n        .save-indicator {\r\n            font-size: 0.65rem;\r\n            color: #22c55e;\r\n            font-weight: bold;\r\n            opacity: 0;\r\n            transition: opacity 0.3s;\r\n        }\r\n\r\n        .save-indicator.show {\r\n            opacity: 1;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar {\r\n            width: 6px;\r\n        }\r\n\r\n        .custom-scrollbar::-webkit-scrollbar-thumb {\r\n            background: #cbd5e1;\r\n            border-radius: 10px;\r\n        }\r\n\r\n        .status-tag {\r\n            font-size: 0.7rem;\r\n            font-weight: 900;\r\n            padding: 2px 8px;\r\n            border-radius: 6px;\r\n            border: 2px solid #000;\r\n        }\r\n\r\n        /* 타임차트 텍스트 레이블 */\r\n        .chart-text {\r\n            font-family: 'Inter', sans-serif;\r\n            font-weight: 800;\r\n            font-size: 12px;\r\n            fill: #64748b;\r\n        }\r\n\r\n        .chart-label-main {\r\n            font-weight: 900;\r\n            font-size: 14px;\r\n            fill: #1e293b;\r\n        }\r\n\r\n        .dimension-line {\r\n            stroke: #94a3b8;\r\n            stroke-width: 1.5;\r\n            marker-start: url(#arrow-start);\r\n            marker-end: url(#arrow-end);\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4 h-screen flex flex-col overflow-hidden\">\r\n\r\n    <!-- Header -->\r\n    <div class=\"zodd-card p-4 flex justify-between items-center mb-4\">\r\n        <div class=\"flex items-center gap-4\">\r\n            <div class=\"bg-blue-600 p-2 rounded-xl text-white shadow-lg\"><i data-lucide=\"activity\" size=\"30\"><\/i><\/div>\r\n            <div>\r\n                <h1 class=\"text-3xl font-black uppercase tracking-tighter text-slate-800\">\r\n                    <span class=\"text-blue-600\">PWM<\/span>-펄스폭 변조 제어\r\n                <\/h1>\r\n                <p class=\"text-xs font-bold text-slate-400 uppercase tracking-widest text-blue-600\">Pulse Width\r\n                    Modulation Output Simulation<\/p>\r\n            <\/div>\r\n        <\/div>\r\n        <div class=\"pointer-box px-8 py-3 text-center border-4 border-black min-w-[200px]\">\r\n            <span class=\"text-[0.6rem] font-black block opacity-70 uppercase tracking-tight\">듀티 사이클 (s1/s2)<\/span>\r\n            <span id=\"duty-label\" class=\"text-2xl font-black text-white\">50%<\/span>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <!-- 4-Column Layout -->\r\n    <div class=\"flex-1 flex gap-4 overflow-hidden\">\r\n\r\n        <!-- Col 1: Logic Buttons (18%) -->\r\n        <div class=\"w-[18%] flex flex-col gap-4\">\r\n            <div class=\"zodd-card p-6 flex flex-col h-full shadow-[6px_6px_0px_#000]\">\r\n                <h3 class=\"text-xs font-black text-slate-400 uppercase mb-5 border-b-2 pb-2 flex items-center gap-2\">\r\n                    <i data-lucide=\"zap\" size=\"16\"><\/i> 명령어 선택\r\n                <\/h3>\r\n                <div class=\"space-y-3 flex-1 overflow-y-auto custom-scrollbar\">\r\n                    <button class=\"op-select-btn bg-white w-full rounded-2xl flex items-center justify-between active\">\r\n                        <div><span class=\"btn-main-label\">PWM<\/span><span class=\"btn-sub-label\">(펄스폭 변조)<\/span><\/div>\r\n                        <i data-lucide=\"chevron-right\"><\/i>\r\n                    <\/button>\r\n                    <div class=\"p-5 bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl text-center\">\r\n                        <span\r\n                            class=\"text-[0.6rem] font-black text-blue-400 uppercase tracking-widest leading-relaxed\">펄스 열<br />발생기<\/span>\r\n                    <\/div>\r\n                <\/div>\r\n                <div class=\"flex flex-col gap-2\">\r\n                    <button onclick=\"setFastPreset()\"\r\n                        class=\"bg-indigo-500 hover:bg-indigo-600 text-white p-3 rounded-xl border-2 border-black font-black text-xs uppercase tracking-widest shadow-[3px_3px_0px_#000] active:translate-y-1 active:shadow-none transition-all\">\r\n                        고속 모드 (20%)\r\n                    <\/button>\r\n                    <button onclick=\"resetTable()\"\r\n                        class=\"mt-2 text-slate-400 font-black text-xs uppercase tracking-widest hover:text-red-600\">초기 설정으로 리셋<\/button>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 2: Live Monitor (32%) -->\r\n        <div class=\"w-[32%] flex flex-col gap-4 relative\">\r\n            <div class=\"zodd-card p-6 flex-1 flex flex-col shadow-[10px_10px_0px_#000] overflow-hidden relative\">\r\n                <div class=\"flex justify-between items-end mb-6\">\r\n                    <div>\r\n                        <span class=\"text-[0.7rem] font-black text-slate-400 uppercase tracking-widest block\">출력 상태<\/span>\r\n                        <div class=\"flex items-center gap-3\">\r\n                            <h2 id=\"status-display\"\r\n                                class=\"text-3xl font-black text-slate-800 tracking-tighter uppercase\">동작 중<\/h2>\r\n                            <div id=\"output-lamp\" class=\"output-lamp\"><\/div>\r\n                        <\/div>\r\n                    <\/div>\r\n                    <div id=\"error-tag\" class=\"status-tag border-red-600 text-red-600 hidden uppercase\">오류: s1 ≥ s2\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"grid grid-cols-2 gap-4 mb-6\">\r\n                    <div class=\"bg-slate-50 p-4 rounded-3xl border-2 border-black flex items-center justify-between\">\r\n                        <div class=\"flex-1\">\r\n                            <label class=\"text-[0.65rem] font-black text-slate-500 uppercase block mb-1\">ON 시간 (s1)<\/label>\r\n                            <input type=\"number\" id=\"input-s1\" value=\"500\" min=\"1\" max=\"65535\"\r\n                                class=\"data-input text-blue-600\" onchange=\"updatePWM()\">\r\n                        <\/div>\r\n                        <div class=\"flex flex-col gap-1 ml-3\">\r\n                            <button onclick=\"stepS1(100)\" class=\"ud-btn\">▲<\/button>\r\n                            <button onclick=\"stepS1(-100)\" class=\"ud-btn\">▼<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                    <div class=\"bg-slate-50 p-4 rounded-3xl border-2 border-black flex items-center justify-between\">\r\n                        <div class=\"flex-1\">\r\n                            <label class=\"text-[0.65rem] font-black text-slate-500 uppercase block mb-1\">주기 시간 (s2)<\/label>\r\n                            <input type=\"number\" id=\"input-s2\" value=\"1000\" min=\"2\" max=\"65535\"\r\n                                class=\"data-input text-orange-600\" onchange=\"updatePWM()\">\r\n                        <\/div>\r\n                        <div class=\"flex flex-col gap-1 ml-3\">\r\n                            <button onclick=\"stepS2(100)\" class=\"ud-btn\">▲<\/button>\r\n                            <button onclick=\"stepS2(-100)\" class=\"ud-btn\">▼<\/button>\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <!-- 타임차트 영역 (매뉴얼 스타일) -->\r\n                <div class=\"scope-container mb-6 relative\">\r\n                    <svg width=\"100%\" height=\"100%\" viewBox=\"0 0 500 260\">\r\n                        <defs>\r\n                            <marker id=\"arrow-start\" markerWidth=\"10\" markerHeight=\"10\" refX=\"0\" refY=\"5\" orient=\"auto\">\r\n                                <path d=\"M 10 0 L 0 5 L 10 10 Z\" fill=\"#94a3b8\" />\r\n                            <\/marker>\r\n                            <marker id=\"arrow-end\" markerWidth=\"10\" markerHeight=\"10\" refX=\"10\" refY=\"5\" orient=\"auto\">\r\n                                <path d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"#94a3b8\" />\r\n                            <\/marker>\r\n                        <\/defs>\r\n\r\n                        <!-- 베이스 라인 -->\r\n                        <line x1=\"50\" y1=\"180\" x2=\"450\" y2=\"180\" stroke=\"#cbd5e1\" stroke-width=\"2\" />\r\n                        <line x1=\"50\" y1=\"180\" x2=\"50\" y2=\"50\" stroke=\"#cbd5e1\" stroke-width=\"2\" stroke-dasharray=\"4\" />\r\n\r\n                        <text x=\"15\" y=\"85\" class=\"chart-label-main\">ON<\/text>\r\n                        <text x=\"15\" y=\"185\" class=\"chart-label-main\">OFF<\/text>\r\n\r\n                        <!-- 파형 배경 (회색) -->\r\n                        <path id=\"wave-bg\" class=\"wave-path\" d=\"\"><\/path>\r\n                        <!-- 파형 실시간 강조 (파란색) -->\r\n                        <path id=\"wave-active\" class=\"wave-path-active\" d=\"\"><\/path>\r\n\r\n                        <!-- 치수 보조선 및 화살표 -->\r\n                        <g id=\"dimension-group\">\r\n                            <!-- s1 ms -->\r\n                            <line id=\"s1-dim\" class=\"dimension-line\" x1=\"50\" y1=\"210\" x2=\"200\" y2=\"210\" />\r\n                            <text id=\"s1-label-pos\" x=\"125\" y=\"230\" text-anchor=\"middle\" class=\"chart-text\">(s1)\r\n                                ms<\/text>\r\n\r\n                            <!-- s2 ms -->\r\n                            <line id=\"s2-dim\" class=\"dimension-line\" x1=\"50\" y1=\"245\" x2=\"350\" y2=\"245\" />\r\n                            <text id=\"s2-label-pos\" x=\"200\" y=\"260\" text-anchor=\"middle\" class=\"chart-text\">(s2)\r\n                                ms<\/text>\r\n\r\n                            <!-- 수직 점선들 -->\r\n                            <line id=\"v-line-1\" x1=\"50\" y1=\"180\" x2=\"50\" y2=\"250\" stroke=\"#cbd5e1\"\r\n                                stroke-dasharray=\"2\" />\r\n                            <line id=\"v-line-2\" x1=\"200\" y1=\"80\" x2=\"200\" y2=\"215\" stroke=\"#cbd5e1\"\r\n                                stroke-dasharray=\"2\" />\r\n                            <line id=\"v-line-3\" x1=\"350\" y1=\"180\" x2=\"350\" y2=\"250\" stroke=\"#cbd5e1\"\r\n                                stroke-dasharray=\"2\" />\r\n                        <\/g>\r\n                    <\/svg>\r\n                <\/div>\r\n\r\n                <div class=\"flex gap-3\">\r\n                    <button onclick=\"undo()\" id=\"undo-btn\"\r\n                        class=\"flex-1 bg-slate-800 hover:bg-black text-white h-16 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-lg flex items-center justify-center gap-3 transition-all\">\r\n                        <i data-lucide=\"rotate-ccw\"><\/i> 되돌리기\r\n                    <\/button>\r\n                    <button onclick=\"toggleRun()\" id=\"exec-btn\"\r\n                        class=\"flex-[1.5] bg-blue-600 hover:bg-blue-700 text-white h-16 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-y-1 active:shadow-none font-black text-xl flex items-center justify-center gap-3 transition-all\">\r\n                        <i data-lucide=\"play-circle\" fill=\"white\"><\/i> <span id=\"run-text\">출력 정지<\/span>\r\n                    <\/button>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 3: Technical Handbook (25%) -->\r\n        <div class=\"w-[25%] flex flex-col overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] overflow-hidden border-2 border-slate-700\">\r\n                <div class=\"flex items-center gap-3 mb-6 border-b border-slate-700 pb-4\">\r\n                    <i data-lucide=\"book-open\" class=\"text-pink-500\"><\/i>\r\n                    <h3 class=\"text-xl font-black uppercase tracking-widest\">기술 가이드<\/h3>\r\n                    <div id=\"save-status\" class=\"save-indicator ml-auto\">저장 완료!<\/div>\r\n                <\/div>\r\n\r\n                <div class=\"space-y-6 flex-1 overflow-y-auto custom-scrollbar pr-2\">\r\n                    <div class=\"bg-slate-800/80 p-6 rounded-3xl border-2 border-slate-700 shadow-inner\">\r\n                        <h4 class=\"text-2xl font-black text-blue-400 mb-2\">PWM (Pulse Modulation)<\/h4>\r\n                        <div class=\"st-syntax-large text-emerald-400\">PWM(EN, s1, s2, d);<\/div>\r\n                        <p class=\"text-sm font-bold text-slate-300 leading-relaxed mb-4\">\r\n                            ON 시간(s1) 및 주기 시간(s2)을 가진 펄스를 대상 디바이스(d)로 출력합니다.<\/p>\r\n\r\n                        <div class=\"mt-2\">\r\n                            <span\r\n                                class=\"text-[0.7rem] font-black text-slate-500 uppercase tracking-widest block mb-3 border-b border-slate-700 pb-1\">피연산자 사양<\/span>\r\n                            <table class=\"operand-table\">\r\n                                <thead>\r\n                                    <tr>\r\n                                        <th>피연산자<\/th>\r\n                                        <th>설명<\/th>\r\n                                    <\/tr>\r\n                                <\/thead>\r\n                                <tbody>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(s1)<\/span><\/td>\r\n                                        <td>ON 시간 (1~65535 ms)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(s2)<\/span><\/td>\r\n                                        <td>주기 시간 (1~65535 ms)<\/td>\r\n                                    <\/tr>\r\n                                    <tr>\r\n                                        <td><span class=\"op-tag\">(d)<\/span><\/td>\r\n                                        <td>펄스 출력 비트 (Y0)<\/td>\r\n                                    <\/tr>\r\n                                <\/tbody>\r\n                            <\/table>\r\n                        <\/div>\r\n                    <\/div>\r\n\r\n                    <div class=\"p-5 bg-black/50 border border-slate-700 rounded-2xl\">\r\n                        <span\r\n                            class=\"text-[0.7rem] font-black text-slate-500 uppercase block mb-3 flex items-center gap-2\">\r\n                            <i data-lucide=\"code\" size=\"14\"><\/i> ST 프로그램 예제\r\n                        <\/span>\r\n                        <div class=\"st-code-box\">\r\n                            // 0.5초 ON, 1초 주기<br>\r\n                            // s1 < s2 조건을 만족해야 함<br>\r\n                                PWM(SM400, 500, 1000, Y0);\r\n                        <\/div>\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <div class=\"mt-6 p-5 bg-blue-900/40 border-2 border-blue-500/50 rounded-2xl italic\">\r\n                    <p class=\"text-xs font-bold text-blue-100 leading-relaxed flex items-center gap-2\">\r\n                        <i data-lucide=\"award\" size=\"16\"><\/i>\r\n                        \"PWM은 인버터 속도 제어나 히터 전력 제어에 주로 사용되는 핵심 명령어입니다.\"\r\n                    <\/p>\r\n                <\/div>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Col 4: Notepads (25%) -->\r\n        <div class=\"w-[25%] flex flex-col gap-4 overflow-hidden\">\r\n            <div\r\n                class=\"zodd-card p-8 flex-1 flex flex-col bg-slate-900 text-white shadow-[6px_6px_0px_#000] border-emerald-500\">\r\n                <div\r\n                    class=\"memo-section-header flex justify-between items-center border-b border-emerald-900/50 pb-4 mb-4\">\r\n                    <div class=\"flex items-center gap-3 text-emerald-400\">\r\n                        <i data-lucide=\"clipboard-list\"><\/i>\r\n                        <h3 class=\"text-lg font-black uppercase\">전체 메모<\/h3>\r\n                    <\/div>\r\n                <\/div>\r\n                <textarea id=\"global-memo\" class=\"memo-textarea flex-1 border-emerald-900/50 mb-6\"\r\n                    placeholder=\"프로젝트 전체 특이사항 기록...\"><\/textarea>\r\n\r\n                <div class=\"flex items-center gap-3 mb-4 text-blue-400 border-t border-slate-800 pt-6\">\r\n                    <i data-lucide=\"pencil-line\"><\/i>\r\n                    <h3 class=\"text-lg font-black uppercase\">PWM 메모<\/h3>\r\n                <\/div>\r\n                <textarea id=\"op-memo\" class=\"memo-textarea flex-1 border-blue-900/50\"\r\n                    placeholder=\"PWM 명령어 개별 기록...\"><\/textarea>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        let s1 = 500;\r\n        let s2 = 1000;\r\n        let isRunning = true;\r\n        let history = [];\r\n        let memoData = { PWM: '', global: '' };\r\n\r\n        function updatePWM() {\r\n            saveHistory();\r\n            s1 = parseInt(document.getElementById('input-s1').value) || 0;\r\n            s2 = parseInt(document.getElementById('input-s2').value) || 0;\r\n\r\n            const err = document.getElementById('error-tag');\r\n            if (s1 >= s2 || s1 <= 0 || s2 <= 0) {\r\n                err.classList.remove('hidden');\r\n                document.getElementById('duty-label').innerText = \"ERROR\";\r\n            } else {\r\n                err.classList.add('hidden');\r\n                const duty = ((s1 / s2) * 100).toFixed(1);\r\n                document.getElementById('duty-label').innerText = duty + \"%\";\r\n            }\r\n            drawTimeChart();\r\n        }\r\n\r\n        function drawTimeChart() {\r\n            const chartWidth = 400; // 50 ~ 450 영역\r\n            const startX = 50;\r\n            const yHigh = 80;\r\n            const yLow = 180;\r\n\r\n            // s2를 기준으로 비율 계산 (두 사이클 보여주기)\r\n            const ratio = chartWidth / (s2 * 1.5);\r\n            const wOn = s1 * ratio;\r\n            const wOff = (s2 - s1) * ratio;\r\n\r\n            // 1. 배경 파형 (전체 가이드)\r\n            let pathD = `M ${startX},${yLow}`;\r\n            let curX = startX;\r\n            for (let i = 0; i < 2; i++) {\r\n                pathD += ` L ${curX},${yHigh} L ${curX + wOn},${yHigh} L ${curX + wOn},${yLow} L ${curX + wOn + wOff},${yLow}`;\r\n                curX += (wOn + wOff);\r\n            }\r\n            document.getElementById('wave-bg').setAttribute('d', pathD);\r\n\r\n            // 2. 치수선 업데이트\r\n            const s1Dim = document.getElementById('s1-dim');\r\n            s1Dim.setAttribute('x1', startX);\r\n            s1Dim.setAttribute('x2', startX + wOn);\r\n            document.getElementById('s1-label-pos').setAttribute('x', startX + (wOn / 2));\r\n            document.getElementById('s1-label-pos').textContent = `${s1} ms`;\r\n\r\n            const s2Dim = document.getElementById('s2-dim');\r\n            s2Dim.setAttribute('x1', startX);\r\n            s2Dim.setAttribute('x2', startX + wOn + wOff);\r\n            document.getElementById('s2-label-pos').setAttribute('x', startX + (wOn + wOff) / 2);\r\n            document.getElementById('s2-label-pos').textContent = `${s2} ms`;\r\n\r\n            // 수직 점선 위치 업데이트\r\n            document.getElementById('v-line-2').setAttribute('x1', startX + wOn);\r\n            document.getElementById('v-line-2').setAttribute('x2', startX + wOn);\r\n            document.getElementById('v-line-3').setAttribute('x1', startX + wOn + wOff);\r\n            document.getElementById('v-line-3').setAttribute('x2', startX + wOn + wOff);\r\n        }\r\n\r\n        // 실제 출력 d(램프 및 실시간 파형) 시뮬레이션\r\n        function animateOutput() {\r\n            if (!isRunning || s1 >= s2) {\r\n                document.getElementById('output-lamp').classList.remove('on');\r\n                document.getElementById('wave-active').setAttribute('d', '');\r\n                requestAnimationFrame(animateOutput);\r\n                return;\r\n            }\r\n\r\n            const now = Date.now();\r\n            const cyclePos = now % s2;\r\n            const lamp = document.getElementById('output-lamp');\r\n\r\n            // 램프 상태\r\n            if (cyclePos < s1) {\r\n                lamp.classList.add('on');\r\n            } else {\r\n                lamp.classList.remove('on');\r\n            }\r\n\r\n            // 실시간 파란색 추적 파형\r\n            const chartWidth = 400;\r\n            const ratio = chartWidth / (s2 * 1.5);\r\n            const wOn = s1 * ratio;\r\n            const wOff = (s2 - s1) * ratio;\r\n            const startX = 50;\r\n            const yHigh = 80;\r\n            const yLow = 180;\r\n\r\n            let activeD = `M ${startX},${yLow}`;\r\n            const currentTotalX = (now % (s2 * 1.5)) * ratio;\r\n\r\n            // 현재 시점까지 파란색 선 긋기\r\n            let drawX = 0;\r\n            let tempX = startX;\r\n            while (drawX < (now % (s2 * 1.5))) {\r\n                const stepNow = (now + drawX) % s2;\r\n                // 간략화를 위해 현재 시점의 진행도만 표시\r\n                const progressX = (now % (s2 * 1.5)) * ratio;\r\n\r\n                // 실제로는 현재 위치에 수직바 하나가 지나가는게 더 깔끔함\r\n                activeD = `M ${startX + progressX},${yHigh - 10} L ${startX + progressX},${yLow + 10}`;\r\n                break;\r\n            }\r\n            document.getElementById('wave-active').setAttribute('d', activeD);\r\n\r\n            requestAnimationFrame(animateOutput);\r\n        }\r\n\r\n        function toggleRun() {\r\n            isRunning = !isRunning;\r\n            document.getElementById('run-text').innerText = isRunning ? \"출력 정지\" : \"출력 시작\";\r\n            document.getElementById('status-display').innerText = isRunning ? \"동작 중\" : \"정지됨\";\r\n            document.getElementById('status-display').className = isRunning ? \"text-3xl font-black text-slate-800 tracking-tighter uppercase\" : \"text-3xl font-black text-red-500 tracking-tighter uppercase\";\r\n        }\r\n\r\n        function stepS1(v) {\r\n            const el = document.getElementById('input-s1');\r\n            el.value = Math.max(1, parseInt(el.value) + v);\r\n            updatePWM();\r\n        }\r\n        function stepS2(v) {\r\n            const el = document.getElementById('input-s2');\r\n            el.value = Math.max(2, parseInt(el.value) + v);\r\n            updatePWM();\r\n        }\r\n\r\n        function setFastPreset() {\r\n            document.getElementById('input-s1').value = 200;\r\n            document.getElementById('input-s2').value = 1000;\r\n            updatePWM();\r\n        }\r\n\r\n        function saveHistory() { history.push({ s1, s2 }); if (history.length > 20) history.shift(); }\r\n        function undo() {\r\n            if (history.length > 0) {\r\n                const prev = history.pop();\r\n                document.getElementById('input-s1').value = prev.s1;\r\n                document.getElementById('input-s2').value = prev.s2;\r\n                updatePWM();\r\n            }\r\n        }\r\n\r\n        function resetTable() {\r\n            document.getElementById('input-s1').value = 500;\r\n            document.getElementById('input-s2').value = 1000;\r\n            updatePWM();\r\n        }\r\n\r\n        function initMemos() {\r\n            const saved = localStorage.getItem('zodd_pwm_memos_v2');\r\n            if (saved) {\r\n                memoData = JSON.parse(saved);\r\n                document.getElementById('global-memo').value = memoData.global || '';\r\n                document.getElementById('op-memo').value = memoData.PWM || '';\r\n            }\r\n            document.getElementById('global-memo').oninput = (e) => { memoData.global = e.target.value; saveToLocal(); };\r\n            document.getElementById('op-memo').oninput = (e) => { memoData.PWM = e.target.value; saveToLocal(); };\r\n        }\r\n\r\n        function saveToLocal() {\r\n            localStorage.setItem('zodd_pwm_memos_v2', JSON.stringify(memoData));\r\n            const ind = document.getElementById('save-status'); ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1000);\r\n        }\r\n\r\n        window.onload = () => {\r\n            lucide.createIcons();\r\n            initMemos();\r\n            updatePWM();\r\n            animateOutput();\r\n        };\r\n    <\/script>\r\n<\/body>\r\n\r\n<\/html>"},{"id":"p8","label":"RAMPQ 경사신호","title":"PLC RAMPQ 명령어 경사 신호","html":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n\r\n<head>\r\n<!-- 배포 주소: https://cocoslow.github.io/VS_CODE/20_HTML/10_PLC/PLC-RAMPQ_%EA%B2%BD%EC%82%AC%EC%8B%A0%ED%98%B8.html -->\r\n    <meta charset=\"UTF-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    <title>PLC RAMPQ 명령어 경사 신호 - Zodd Ver.<\/title>\r\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\r\n    <style>\r\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');\r\n\r\n        html,\r\n        body {\r\n            height: 100vh;\r\n            overflow: hidden;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Inter', 'Malgun Gothic', sans-serif;\r\n            background-color: #e2e8f0;\r\n        }\r\n\r\n        /* 조드 스타일: 검은색 테두리 강렬한 테마 */\r\n        .thick-border {\r\n            border: 3px solid #000000;\r\n        }\r\n\r\n        .main-container {\r\n            border: 5px solid #000000;\r\n        }\r\n\r\n        .glass-header {\r\n            background: rgba(255, 255, 255, 0.95);\r\n            border-bottom: 4px solid #000000;\r\n        }\r\n\r\n        .cmd-box {\r\n            background: #f1f5f9;\r\n            border: 3px solid #000000;\r\n            box-shadow: 6px 6px 0px #000000;\r\n        }\r\n\r\n        .param-label {\r\n            font-size: 0.75rem;\r\n            background: #000000;\r\n            color: #ffffff;\r\n            padding: 2px 8px;\r\n            border-radius: 4px;\r\n            font-weight: 800;\r\n            margin-top: 6px;\r\n            border: 1px solid #000000;\r\n            white-space: nowrap;\r\n        }\r\n\r\n        .result-display {\r\n            background-color: #ffffff;\r\n            border: 4px solid #000000;\r\n            box-shadow: 8px 8px 0px #000000;\r\n        }\r\n\r\n        .code-block {\r\n            background: #1e293b;\r\n            border: 3px solid #000000;\r\n            border-left: 12px solid #3b82f6;\r\n        }\r\n\r\n        .var {\r\n            color: #ff79c6;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .comment {\r\n            color: #6272a4;\r\n            font-style: italic;\r\n        }\r\n\r\n        .btn-action {\r\n            border: 3px solid #000;\r\n            box-shadow: 4px 4px 0px #000;\r\n            transition: all 0.1s;\r\n        }\r\n\r\n        .btn-action:active {\r\n            transform: translate(2px, 2px);\r\n            box-shadow: 1px 1px 0px #000;\r\n        }\r\n\r\n        /* 계산기 강조 뱃지 */\r\n        .calc-badge {\r\n            background: #7c3aed;\r\n            color: white;\r\n            padding: 2px 8px;\r\n            border-radius: 20px;\r\n            font-size: 0.7rem;\r\n            font-weight: 800;\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body class=\"p-4\">\r\n\r\n    <div class=\"max-w-7xl mx-auto h-full bg-white rounded-3xl overflow-hidden flex flex-col main-container\">\r\n\r\n        <!-- Header: RAMPQ 명령어 카드 -->\r\n        <div class=\"glass-header p-5 flex justify-between items-center\">\r\n            <div>\r\n                <h1 class=\"text-3xl font-black text-black uppercase\">RAMPQ(P) 경사 신호<\/h1>\r\n                <p class=\"text-sm font-bold text-slate-600 mt-1\">초기값(s1)에서 최종값(s2)까지 n번에 걸쳐 부드럽게 값을 변화시킴<\/p>\r\n            <\/div>\r\n\r\n            <div class=\"cmd-box rounded-xl px-8 py-4 flex items-center gap-4 font-mono text-xl\">\r\n                <span class=\"text-slate-400 font-black\">RAMPQ(<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">X0<\/span>\r\n                    <span class=\"param-label uppercase\">EN<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D0<\/span>\r\n                    <span class=\"param-label\">초기(s1)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D2<\/span>\r\n                    <span class=\"param-label\">최종(s2)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">D10<\/span>\r\n                    <span class=\"param-label\">결과(d1)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\" id=\"label-n\">300<\/span>\r\n                    <span class=\"param-label\">횟수(n)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400\">,<\/span>\r\n                <div class=\"flex flex-col items-center\">\r\n                    <span class=\"font-black text-black\">M0<\/span>\r\n                    <span class=\"param-label\">완료(d2)<\/span>\r\n                <\/div>\r\n                <span class=\"text-slate-400 font-black\">);<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <!-- Main Content -->\r\n        <div class=\"flex-1 flex p-6 gap-6 overflow-hidden\">\r\n\r\n            <!-- Left: Graph Simulator -->\r\n            <div class=\"w-3/5 flex flex-col gap-4\">\r\n                <div class=\"thick-border bg-slate-50 rounded-2xl p-6 flex-1 flex flex-col\">\r\n                    <div class=\"flex justify-between items-center mb-4\">\r\n                        <h3 class=\"text-xl font-black text-black flex items-center gap-3\">\r\n                            <div class=\"w-4 h-4 bg-blue-600 border-2 border-black rounded-full\"><\/div>\r\n                            경사 신호 시각화\r\n                        <\/h3>\r\n                        <div class=\"flex gap-2\">\r\n                            <button onclick=\"startRamp()\"\r\n                                class=\"btn-action bg-blue-600 text-white px-6 py-2 font
