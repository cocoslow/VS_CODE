<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servo Basic Parameters 1</title>
<style>
:root{--fs:20px;--z:1}
body{margin:0;font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:var(--fs);background:#f0f0f0;color:#000}
.bar{position:sticky;top:0;z-index:9;background:#e8e8e8;border-bottom:1px solid #999;padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar b{flex:1;min-width:240px}
button,select,input{font:inherit}
button{padding:4px 14px;border:1px solid #adadad;background:linear-gradient(#f2f2f2,#dcdcdc);border-radius:3px;cursor:pointer}
button:hover{border-color:#0078d7;background:#e5f1fb}button.on{background:#cce4f7;border-color:#0078d7}
.win{max-width:1100px;margin:12px auto;background:#f0f0f0;border:1px solid #888;box-shadow:0 2px 8px #0004}
.title{background:linear-gradient(90deg,#1c4aa0,#a9c4ec);color:#fff;font-weight:bold;padding:4px 10px}
.pad{padding:10px 18px}
.desc{margin:4px 0 10px}
.entry{display:flex;gap:20px;flex-wrap:wrap}
.left{flex:1 1 440px}
.right{flex:0 0 auto;background:#000;display:flex;align-items:center;justify-content:center;align-self:flex-start;border:1px solid #888}
.crop{overflow:hidden;position:relative;zoom:var(--z)}
.crop img{position:absolute}
.noimg{color:#aaa;padding:40px;width:250px;text-align:center}
.grp{border:1px solid #aaa;padding:10px 12px;margin-top:6px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap}
.row>label,.row>span.l{flex:1 1 200px}
input[type=number],select{padding:3px 6px;border:1px solid #7a7a7a;background:#fff;text-align:right;width:190px}
select{text-align:left}input:disabled{background:#eee;color:#888}
.unit{color:#222}
.arrow{text-align:center;font-size:2em;line-height:1}
.hr{border-top:2px solid #888;margin:10px 0}
table.res{border:2px inset #999;border-collapse:collapse;background:#aaa}
table.res td{border:1px solid #666;padding:3px 8px;background:#f4f4f4}
table.res td:first-child{background:#fff;font-weight:normal}
table.res td:last-child{background:#d4d4d4;min-width:200px}
.dlg{border:1px solid #666;background:#f0f0f0;box-shadow:0 2px 8px #0005;margin:10px 0;display:none}
.dlg.show{display:block}.dlg .title{background:#fff;color:#000;font-weight:normal}
.dlg .pad{display:flex;gap:16px;flex-wrap:wrap}
.err{color:#c00;font-weight:bold}.note{font-size:.8em}
.zin{width:90px!important}
.wrap{display:flex;gap:14px;max-width:1900px;margin:12px auto;padding:0 12px;flex-wrap:wrap;align-items:flex-start}.wrap .win{margin:0;max-width:none}
.sw{position:relative;display:inline-block;width:3em;height:1.5em;flex:0 0 auto}.sw input{opacity:0;width:0;height:0}.sl{position:absolute;inset:0;background:#aaa;border-radius:1.5em;cursor:pointer;transition:.2s}.sl:before{content:"";position:absolute;width:1.2em;height:1.2em;left:.15em;top:.15em;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+.sl{background:#0078d7}.sw input:checked+.sl:before{transform:translateX(1.5em)}
.row>label.sw{flex:0 0 3em}
input[type=text]{padding:3px 6px;border:1px solid #7a7a7a;background:#fff;text-align:right;width:190px}input[type=text]:disabled{background:#eee;color:#888}.zin{width:90px!important}
.side{flex:0 0 250px!important;position:sticky;top:60px}.rg{padding:6px 10px!important}.rg label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer}.rg label:hover{background:#e5f1fb}.rg input{width:1.1em;height:1.1em;flex:0 0 auto}.rg label.on{background:#cce4f7;font-weight:bold}
.rg.inl{display:flex;flex-wrap:wrap;gap:4px;padding:0!important;flex:1}.rg.inl label{padding:4px 10px}
.rg.inl{display:grid!important;grid-template-columns:repeat(4,1fr);gap:2px!important}.rg.inl label{padding:4px 4px;gap:4px;white-space:nowrap;font-size:.9em}
.sp{display:inline-flex;flex-direction:column;gap:1px;flex:0 0 auto}.sp button{padding:0 8px;line-height:1.1;font-size:.7em;min-width:2.2em}
.row:has(.sp){flex-wrap:nowrap}.row:has(.sp)>label{min-width:0;flex:1 1 120px}.row:has(.sp) input[type=text]{width:170px}.row:has(.sp) .zin{width:90px!important}
.row:has(.sp)>label{white-space:nowrap;flex:1 0 auto}.row:has(.sp) input[type=text]{width:140px}
.ov{position:absolute;width:82px;height:20px;background:#fff;color:#000;font-size:14px;text-align:right;padding-right:4px;line-height:20px;box-sizing:border-box;border:1px solid #777}
table.res td.mm{background:none!important;border:none!important;color:#06c;font-weight:bold;white-space:nowrap;min-width:0!important}
</style></head><body>

/* ===================== 서버 자동 저장 (Apps Script) =====================
 * 어디를 바꾸면 되는지:
 *  1) WEBAPP_URL : Apps Script 웹앱 주소 (이 한 곳만 수정)
 *  2) SAVE_NAME  : 저장 이름 접두사 (서버에는 servo_data.json 으로 저장됨)
 *  3) 저장 대상 변경 : collectState() / applyState() 두 함수만 수정
 * 글씨 크기(sv_fs)와 언어(sv_lang)는 기기별로 localStorage 에만 저장함.
 */
function lsGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{window.localStorage.removeItem(k)}catch(e){}}
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyvpXgt4SA64PONgKdHLM-s9H-GIap6fnOCVUDHZf_oUP2NJEObRZyWbff-A41erSltPw/exec';
const SAVE_NAME = 'servo';
const LS_STATE = SAVE_NAME + '_state';      // 마지막 값 (서버 실패 대비 사본)
const LS_PENDING = SAVE_NAME + '_pending';  // 서버에 아직 못 보낸 값이 있으면 '1'
const SAVE_IDS = ['a','enc','nl','nm','z1','z2','want','rpmR','rpmM','pctJ','pctH','pctC'];
let restoring = true, saveTimer = null;

// 화면 구석 상태 표시 (팝업 없음)
const badge = document.createElement('div');
badge.style.cssText = 'position:fixed;right:8px;bottom:6px;font-size:13px;color:#555;background:#fffd;padding:2px 8px;border-radius:4px;z-index:20';
document.body.appendChild(badge);
function setBadge(t, bad){ badge.textContent = t; badge.style.color = bad ? '#c00' : '#555'; }

// 현재 화면 값을 모아서 객체로
function collectState(){
  const s = { type: $('type').selectedIndex, unit: $('unit').selectedIndex,
    useTeeth: $('useTeeth').checked, gmode: $('gmode').value, mag: MAG, pr8: $('pr8R').checked ? 'r' : 'm' };
  SAVE_IDS.forEach(id => s[id] = $(id).value);
  return s;
}
// 저장된 값을 화면에 복원 후 다시 계산
function applyState(s){
  if(!s || typeof s !== 'object') return;
  if(Number.isInteger(s.type) && s.type >= 0 && s.type < $('type').options.length) $('type').selectedIndex = s.type;
  if(Number.isInteger(s.unit) && s.unit >= 0 && s.unit < $('unit').options.length) $('unit').selectedIndex = s.unit;
  SAVE_IDS.forEach(id => { if(s[id] !== undefined) $(id).value = s[id]; });
  if(s.useTeeth !== undefined) $('useTeeth').checked = !!s.useTeeth;
  if(s.gmode !== undefined) $('gmode').value = s.gmode;
  if(s.pr8 === 'r') $('pr8R').checked = true; else if(s.pr8 === 'm') $('pr8M').checked = true;
  if([1,10,100,1000].includes(s.mag)) MAG = s.mag;
  buildMag(); calc();
}

async function pushToServer(state){
  setBadge('저장 중...');
  try{
    const r = await fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ name: SAVE_NAME, data: state }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'fail');
    lsDel(LS_PENDING);
    setBadge('저장됨 ' + new Date().toTimeString().slice(0,5));
  }catch(e){
    lsSet(LS_PENDING, '1');
    setBadge('저장 실패 (이 기기에 임시 저장됨)', true);
  }
}
function scheduleSave(){
  if(restoring) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const st = collectState();
    lsSet(LS_STATE, JSON.stringify(st));   // 항상 이 기기에도 사본 저장
    pushToServer(st);
  }, 1000);
}
['input','change','click'].forEach(ev => document.addEventListener(ev, scheduleSave, true));

// 페이지를 열 때: 못 보낸 값이 있으면 그것을 우선, 없으면 서버에서 불러옴
(async function initRestore(){
  setBadge('불러오는 중...');
  let local = null;
  try{ local = JSON.parse(lsGet(LS_STATE) || 'null'); }catch(e){}
  if(lsGet(LS_PENDING) && local){
    applyState(local); restoring = false; pushToServer(local); return;
  }
  try{
    const r = await fetch(WEBAPP_URL + '?name=' + encodeURIComponent(SAVE_NAME));
    const j = await r.json();
    if(j.ok && j.data){ applyState(j.data); lsSet(LS_STATE, JSON.stringify(j.data)); setBadge('불러옴'); }
    else if(local){ applyState(local); setBadge('이 기기 값 불러옴'); }
    else setBadge('저장된 값 없음');
  }catch(e){
    if(local){ applyState(local); }
    setBadge('서버 연결 실패 (이 기기 값 사용)', true);
  }
  restoring = false;
})();
