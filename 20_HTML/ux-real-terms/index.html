<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX/UI 찐 실무 용어 도감</title>
<style>
:root{
  --bg:#0b0b0f;--panel:#14141b;--panel2:#1b1b25;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#f4f4f7;--sub:#9a9aaf;--accent:#8b7bff;--accent2:#ff6b9a;--lime:#c6ff4d;
  --col:rgba(139,123,255,.20);--colline:rgba(139,123,255,.75);--gut:rgba(255,200,87,.16);
  --red:#ff5d6c;--orange:#ffa94d;--green:#35d07f;--blue:#4da3ff;--r:24px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
 font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
 background-image:radial-gradient(900px 500px at 15% -10%,rgba(139,123,255,.18),transparent 60%),radial-gradient(700px 400px at 95% 0%,rgba(255,107,154,.12),transparent 60%);
 background-repeat:no-repeat}
button{font:inherit;color:inherit}
.wrap{max-width:1760px;margin:0 auto;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--lime),var(--accent));display:block}
.pill{font-size:12px;color:var(--sub);border:1px solid var(--line2);padding:5px 12px;border-radius:99px}
.hero{padding:34px 0 22px}
.hero h1{font-size:clamp(30px,6.4vw,76px);line-height:1.1;white-space:nowrap;letter-spacing:-.045em;margin:0;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--sub);font-size:clamp(15px,2vw,19px);max-width:760px;margin:18px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 26px}
.filters button{border:1px solid var(--line2);background:transparent;color:var(--sub);padding:7px 16px;border-radius:99px;cursor:pointer;font-size:14px;transition:.2s}
.filters button:hover{color:var(--text);border-color:var(--text)}
.filters button.on{background:var(--text);color:#111;border-color:var(--text);font-weight:700}

/* ===== list cards ===== */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding-bottom:80px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:860px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.cards{grid-template-columns:1fr}}
#detailView{max-width:1160px;margin:0 auto}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%;
 transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--line2);box-shadow:0 30px 60px -20px rgba(139,123,255,.35);outline:none}
.thumb{height:190px;padding:14px;position:relative;overflow:hidden;
 background:radial-gradient(400px 200px at 50% 0%,rgba(139,123,255,.25),transparent 70%),var(--panel2)}
.thumb>.fill{height:100%;position:relative}
.cbody{padding:14px 18px 18px}
.tag{font-size:12px;font-weight:600;color:var(--lime);letter-spacing:.02em}
.cbody h2{margin:4px 0 0;font-size:20px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cbody h2 small{font-size:11.5px;color:var(--sub);font-weight:500;letter-spacing:0}
.cbody p{margin:6px 0 0;color:var(--sub);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero p{white-space:nowrap}
@media(max-width:760px){.hero p{white-space:normal}}
.cta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--sub)}
.arrow{width:36px;height:36px;border-radius:50%;background:var(--text);color:#111;display:grid;place-items:center;font-size:17px;transition:transform .3s}
.card:hover .arrow{transform:rotate(-45deg);background:var(--lime)}
.state{color:var(--lime);font-weight:600}

/* --- thumbs --- */
.mini{height:100%;border-radius:14px;border:1px solid var(--line2);background:#0e0e14;padding:12px 16px;position:relative;overflow:hidden}
.mini .mc{position:absolute;inset:0 16px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.mini .mc i{background:var(--col);border-left:1px solid var(--colline);border-right:1px solid var(--colline);opacity:.6;transition:opacity .4s}
.card:hover .mini .mc i{opacity:1}
.mini .mb{position:relative;height:100%;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:22px 1fr 38px;gap:6px}
.mini .mb div{border-radius:6px;background:rgba(255,255,255,.7);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.mini .mb .h{grid-column:1/13;background:rgba(255,255,255,.95)}
.mini .mb .a{grid-column:1/9;background:linear-gradient(135deg,var(--accent),#5b4bff)}
.mini .mb .b{grid-column:9/13;background:linear-gradient(135deg,var(--accent2),#ff9a6b)}
.mini .mb .c1{grid-column:1/5}.mini .mb .c2{grid-column:5/9}.mini .mb .c3{grid-column:9/13}
.card:hover .mini .mb .a{transform:translate(-3px,-3px)}.card:hover .mini .mb .b{transform:translate(3px,-3px)}.card:hover .mini .mb .c2{transform:translateY(3px)}
.center{display:flex;align-items:center;justify-content:center;height:100%;gap:18px}
.col{flex-direction:column}
/* toggle thumb */
.th-sw{width:96px;height:52px;border-radius:99px;background:#3a3a4a;position:relative;transition:.35s}
.th-sw::after{content:"";position:absolute;top:5px;left:5px;width:42px;height:42px;border-radius:50%;background:#fff;transition:.35s;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.th-sw.on{background:var(--lime)}.th-sw.on::after{left:49px}
.card:hover .th-sw.a{background:#3a3a4a}.card:hover .th-sw.a::after{left:5px}
.card:hover .th-sw.b{background:var(--lime)}.card:hover .th-sw.b::after{left:49px}
/* checkbox radio thumb */
.th-cb,.th-rd{width:38px;height:38px;border:2px solid #5a5a70;display:grid;place-items:center;transition:.3s;font-weight:800;color:transparent;font-size:22px}
.th-cb{border-radius:10px}.th-rd{border-radius:50%}
.th-cb.on{background:var(--lime);border-color:var(--lime);color:#111}
.th-rd.on{border-color:var(--lime)}.th-rd.on::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--lime)}
.th-rd.on.x::after{transition:.3s}
.card:hover .th-cb.t{background:transparent;border-color:#5a5a70;color:transparent}
.card:hover .th-cb.f{background:var(--lime);border-color:var(--lime);color:#111}
.th-grp{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.th-grp small{color:var(--sub);font-size:11px;margin-bottom:2px}
.th-div{width:1px;height:110px;background:var(--line2)}
/* modal thumb */
.th-page{position:absolute;inset:0;border-radius:12px;background:#0e0e14;border:1px solid var(--line2);overflow:hidden}
.th-page b{display:block;height:14px;margin:12px;border-radius:5px;background:#2a2a3a}
.th-dim{position:absolute;inset:0;background:rgba(0,0,0,.35);transition:.4s}
.card:hover .th-dim{background:rgba(0,0,0,.78)}
.th-mdl{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-50%) scale(.92);background:#fff;border-radius:14px;padding:14px;color:#111;transition:.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.card:hover .th-mdl{transform:translate(-50%,-50%) scale(1.04)}
.th-mdl i{display:block;height:8px;border-radius:4px;background:#ddd;margin-bottom:7px}
.th-mdl u{display:block;height:22px;border-radius:7px;background:#111;margin-top:10px;text-decoration:none}
/* breadcrumb thumb */
.th-bc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;max-width:100%}
.th-bc span{padding:7px 12px;border-radius:99px;background:#262634;font-size:13px;color:#cfcfdc;transition:.35s}
.th-bc em{color:#666;font-style:normal}
.th-bc span:last-child{background:var(--lime);color:#111;font-weight:700}
.card:hover .th-bc span:not(:last-child){background:#3b3563;color:#fff}
.th-crumbs{display:flex;gap:6px;margin-top:6px}
.th-crumbs i{width:8px;height:8px;border-radius:50%;background:#4a4a60;transition:.3s}
.card:hover .th-crumbs i{background:var(--accent)}
.th-crumbs i:nth-child(2){transition-delay:.08s}.th-crumbs i:nth-child(3){transition-delay:.16s}.th-crumbs i:nth-child(4){transition-delay:.24s}
/* phone thumb */
.th-ph{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:130px;bottom:-30px;border-radius:22px 22px 0 0;border:2px solid #3a3a50;background:#0e0e14;overflow:hidden}
.th-ph b{display:block;height:10px;margin:12px 12px 0;border-radius:4px;background:#2a2a3a}
.th-sheet{position:absolute;left:0;right:0;bottom:0;height:46%;background:#fff;border-radius:16px 16px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1);padding-top:8px}
.card:hover .th-sheet{height:78%}
.th-sheet::before{content:"";display:block;width:34px;height:4px;border-radius:9px;background:#ccc;margin:0 auto 10px}
.th-sheet i{display:block;height:8px;border-radius:4px;background:#e4e4ee;margin:0 12px 8px}
.th-tabs{position:absolute;left:0;right:0;bottom:0;height:46px;background:#1b1b25;display:flex;justify-content:space-around;align-items:center}
.th-tabs i{width:18px;height:18px;border-radius:6px;background:#555568;transition:.3s}
.th-tabs i:nth-child(1){background:var(--lime)}
.card:hover .th-tabs i:nth-child(1){background:#555568}.card:hover .th-tabs i:nth-child(4){background:var(--lime);transform:translateY(-3px)}
/* menu icons thumb */
.th-ic{display:flex;gap:10px}
.th-ic>div{width:48px;height:48px;border-radius:14px;background:#262634;display:grid;place-items:center;transition:transform .35s}
.th-ic>div:nth-child(odd){transform:translateY(0)}
.card:hover .th-ic>div:nth-child(odd){transform:translateY(-8px);background:#3b3563}
.card:hover .th-ic>div:nth-child(even){transform:translateY(8px)}
.ico{display:block;position:relative}
.ico.ham{width:22px;height:16px;border-top:3px solid #fff;border-bottom:3px solid #fff}
.ico.ham::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff}
.ico.kb,.ico.mb2{background:radial-gradient(circle,#fff 2.5px,transparent 3px) 0 0/100% 33.3%;width:8px;height:22px}
.ico.mb2{background:radial-gradient(circle,#fff 2.5px,transparent 3px) 0 0/33.3% 100%;width:22px;height:8px}
.ico.bento{width:22px;height:16px;background:radial-gradient(circle,#fff 2.3px,transparent 2.8px) 0 0/33.3% 50%}
.ico.dn{width:22px;height:16px;background:linear-gradient(#fff,#fff) 0 0/100% 3px no-repeat,linear-gradient(#fff,#fff) 0 50%/70% 3px no-repeat,linear-gradient(#fff,#fff) 0 100%/40% 3px no-repeat}
/* toast thumb */
.th-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;background:#fff;color:#111;border-radius:99px;padding:8px 14px;font-size:11px;font-weight:700;white-space:nowrap;transition:.45s cubic-bezier(.2,.8,.2,1);opacity:.55;translate:0 22px}
.card:hover .th-toast{opacity:1;translate:0 -12px}
/* skeleton thumb */
.sk{background:linear-gradient(90deg,#22222f 25%,#34344a 50%,#22222f 75%);background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.th-sk{display:flex;gap:12px;height:100%;align-items:flex-start;padding:4px}
.th-sk .av{width:60px;height:60px;border-radius:50%}
.th-sk>div{flex:1;display:flex;flex-direction:column;gap:10px}
/* system color thumb */
.th-sc{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.th-sc div{border-radius:14px;padding:14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;color:#111;transition:transform .3s}
.th-sc div i{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;font-style:normal;color:#fff;font-size:13px}
.card:hover .th-sc div:nth-child(1){transform:scale(1.07)}.card:hover .th-sc div:nth-child(4){transform:scale(1.07)}

/* ===== detail ===== */
.back{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:8px 16px;cursor:pointer;font-size:14px;color:var(--sub);transition:.2s}
.back:hover{color:var(--text);border-color:var(--text)}
.dhead{padding:30px 0 26px}
.dhead h1{font-size:clamp(40px,8vw,88px);letter-spacing:-.05em;line-height:1.04;margin:10px 0 0;font-weight:800}
.dhead h1 small{font-size:.26em;color:var(--sub);letter-spacing:0;font-weight:500;margin-left:10px}
.dhead p{font-size:clamp(15px,1.7vw,19px);color:#cfcfdc;max-width:none;margin:18px 0 0;letter-spacing:-.01em}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.box h3{margin:0 0 14px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.playground{padding:0;overflow:hidden;margin-bottom:20px}
.bar{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;color:var(--sub);transition:.2s}
.seg button.on{background:var(--text);color:#111}
.ctl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.ctl b{color:var(--text);min-width:40px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:4px;border-radius:9px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lime);cursor:pointer;box-shadow:0 0 0 4px rgba(198,255,77,.18)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--lime);cursor:pointer}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--sub);user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.25s;flex:none}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.tg input:checked+i{background:var(--lime)}.tg input:checked+i::after{left:19px;background:#111}
.ghost{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--sub)}
.ghost:hover{color:var(--text);border-color:var(--text)}
.solid{border:0;background:var(--lime);color:#111;border-radius:99px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer}
.solid:hover{filter:brightness(1.08)}
.stage{padding:34px 16px;display:flex;justify-content:center;align-items:center;gap:26px;flex-wrap:wrap;overflow:hidden;min-height:300px;
 }
.note{padding:14px 24px;border-top:1px solid var(--line);font-size:14px;color:#cfcfdc}
.note b{color:var(--lime)}
.legend{display:flex;flex-wrap:wrap;gap:20px;padding:16px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.facts{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.fact{padding:16px 24px;border-right:1px solid var(--line)}.fact:last-child{border:0}
.fact small{color:var(--sub);font-size:12px;display:block}
.fact b{font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
@media(max-width:720px){.facts{grid-template-columns:repeat(2,1fr)}.fact{border-bottom:1px solid var(--line)}}
/* grid demo */
.frame{background:#0e0e14;border:1px solid var(--line2);border-radius:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);position:relative;flex:none;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.inner{position:relative}
.marz{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(80,200,255,.18) 0 6px,transparent 6px 12px);transition:opacity .2s;display:grid;place-items:center;font-size:11px;color:#7fd8ff;font-weight:700;overflow:hidden}
.cols{position:absolute;top:0;bottom:0;display:grid;pointer-events:none;transition:opacity .2s}
.cols i{background:var(--col);border-left:1px solid var(--colline);border-right:1px solid var(--colline);font-style:normal;font-size:10px;color:#c6bfff;text-align:center;padding-top:4px;font-weight:700;overflow:hidden}
.gutlab{position:absolute;top:0;bottom:0;background:var(--gut);transition:opacity .2s}
.frame.hide .cols,.frame.hide .marz,.frame.hide .gutlab{opacity:0}
.content{position:relative;display:grid}
.blk{border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#111;transition:.3s;min-height:30px}
/* phone mock */
.phone{width:290px;height:540px;border-radius:38px;border:1px solid var(--line2);background:#0e0e14;position:relative;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);flex:none}
.phone.sm{width:240px;height:420px;border-radius:30px}
.phone .sb{height:34px;display:flex;justify-content:center;align-items:center}
.phone .sb::before{content:"";width:80px;height:18px;border-radius:99px;background:#000}
.pbody{padding:6px 18px}
.ph-line{height:12px;border-radius:6px;background:#242433;margin-bottom:10px}
.ph-hero{height:110px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:14px}
.ph-card{height:62px;border-radius:12px;background:#1d1d29;margin-bottom:10px}
/* switches */
.sw{width:58px;height:34px;border-radius:99px;background:#3a3a4a;border:0;position:relative;cursor:pointer;transition:.25s;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw[aria-checked=true]{background:var(--lime)}.sw[aria-checked=true]::after{left:28px}
.sw:disabled{opacity:.35;cursor:not-allowed}
.sw.big{width:112px;height:62px}.sw.big::after{width:54px;height:54px;top:4px;left:4px}.sw.big[aria-checked=true]::after{left:54px}
.lbl-onoff{font-size:11px;font-weight:800;color:#111;position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border:0}
.setting b{display:block;font-size:16px}.setting small{color:var(--sub)}
.panelcard{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 22px;width:360px;max-width:100%}
.bigstate{font-size:34px;font-weight:800;letter-spacing:-.04em;text-align:center;margin-top:14px;min-width:90px}
/* form demo */
.fgroup{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:20px 22px;width:310px;max-width:100%}
.fgroup h4{margin:0 0 4px;font-size:16px}.fgroup .sub{color:var(--sub);font-size:12.5px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;font-size:15px}
.opt input{width:22px;height:22px;accent-color:var(--lime);cursor:pointer;flex:none}
.opt.all{border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:700}
.result{margin-top:12px;font-size:13px;background:#0e0e14;border-radius:10px;padding:8px 12px;color:var(--lime)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* modal demo */
.pgm{position:relative;width:100%;max-width:660px;height:380px;border-radius:16px;overflow:hidden;background:#17171f;border:1px solid var(--line2)}
.pgm .fk{padding:16px}
.dim{position:absolute;inset:0;transition:background .25s;display:none}
.mdl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,86%);background:#fff;color:#111;border-radius:18px;padding:22px;display:none;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}}
.mdl h5{margin:0 0 6px;font-size:18px}.mdl p{margin:0 0 18px;color:#555;font-size:14px}
.mdl .acts{display:flex;gap:8px;justify-content:flex-end}
.mdl button{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.mdl .c{background:#eee;color:#333}.mdl .o{background:#111;color:#fff}
.popw{position:absolute;right:20px;top:60px;width:230px;background:#fff;color:#111;border-radius:10px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.5);display:none}
.popw .tb{background:#e6e6ee;padding:7px 10px;font-size:11px;font-weight:700;display:flex;justify-content:space-between}
.popw .tb span{cursor:pointer}
.popw p{margin:0;padding:14px;font-size:13px}
.open .dim.show,.open .mdl.show,.open .popw.show{display:block}
.fakebtn{background:var(--lime);color:#111;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer}
/* breadcrumb */
.browser{width:100%;max-width:640px;background:#17171f;border:1px solid var(--line2);border-radius:16px;overflow:hidden;transition:max-width .35s}
.browser.m{max-width:320px}
.browser .url{padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);background:#101018}
.browser .bd{padding:18px 20px;min-height:230px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;margin-bottom:18px;min-height:30px}
.crumbs button{border:0;background:#262634;color:#cfcfdc;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;transition:.2s}
.crumbs button:hover{background:#3b3563;color:#fff}
.crumbs span.cur{color:var(--lime);font-weight:800;padding:5px 4px}
.crumbs em{color:#666;font-style:normal}
.bd h4{margin:0 0 4px;font-size:24px;letter-spacing:-.03em}.bd p{margin:0 0 16px;color:var(--sub);font-size:14px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{width:90px;height:70px;border-radius:12px;background:#22222f}
/* bottom sheet */
.map{position:absolute;inset:0;background:linear-gradient(#18222b,#14201f);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:38px 38px}
.pin{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent2)}
.bsdim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .2s}
.bs{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#111;border-radius:22px 22px 0 0;height:50%;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.bs .hd{padding:10px 0 12px;cursor:grab;touch-action:none}.bs .hd:active{cursor:grabbing}
.bs .hd::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:#c9c9d6;margin:0 auto}
.bs .it{margin:0 18px 10px;padding:12px 14px;background:#f2f2f7;border-radius:12px;font-size:14px;font-weight:600}
.bs h5{margin:0 18px 10px;font-size:18px}
/* tabbar */
.tb-bar{position:absolute;left:0;right:0;bottom:0;height:72px;background:#1b1b25;border-top:1px solid var(--line2);display:flex}
.tb-bar button{flex:1;border:0;background:transparent;color:#8a8aa0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;min-width:0}
.tb-bar button span{font-size:20px;line-height:1}
.tb-bar button.on{color:var(--lime)}
.verdict{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.v-good{background:rgba(53,208,127,.18);color:var(--green)}.v-bad{background:rgba(255,93,108,.18);color:var(--red)}
.tbtitle{font-size:26px;font-weight:800;letter-spacing:-.03em;padding:6px 18px}
/* menu demo */
.iconrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.iconbtn{width:84px;border:1px solid var(--line2);background:var(--panel2);border-radius:18px;padding:14px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;color:var(--sub);transition:.2s}
.iconbtn .box2{height:26px;display:grid;place-items:center}
.iconbtn.on{border-color:var(--lime);color:var(--text);background:#232331}
.appbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);font-weight:800}
.appbtn{width:40px;height:40px;border-radius:12px;border:0;background:#262634;cursor:pointer;display:grid;place-items:center}
.pop{position:absolute;background:#fff;color:#111;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.55);padding:8px;font-size:14px;font-weight:600;animation:fadeup .2s}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}
.pop div{padding:9px 12px;border-radius:8px}.pop div:hover{background:#f0f0f6}
.pop.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:200px}
.pop.apps div{text-align:center;font-size:11px;padding:10px 4px}.pop.apps div i{display:block;width:30px;height:30px;border-radius:9px;margin:0 auto 4px}
.drawer{position:absolute;top:0;bottom:0;left:0;width:72%;background:#fff;color:#111;padding:20px 18px;font-weight:700;animation:slidein .25s}
@keyframes slidein{from{transform:translateX(-100%)}}
.drawer div{padding:11px 0;border-bottom:1px solid #eee}
.filterpanel{position:absolute;left:14px;right:14px;top:56px;background:#fff;color:#111;border-radius:14px;padding:14px;font-size:13px;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.55);animation:fadeup .2s}
.filterpanel span{display:inline-block;background:#eee;border-radius:99px;padding:6px 12px;margin:3px}
/* toast */
.toastbox{position:absolute;left:14px;right:14px;z-index:5}
.toastbox.top{top:44px}.toastbox.bottom{bottom:18px}
.toastel{background:#fff;color:#111;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:space-between;gap:10px;animation:fadeup .3s;position:relative;overflow:hidden}
.toastel.snack{background:#2a2a3a;color:#fff}
.toastel .act{background:transparent;border:0;color:var(--lime);font-weight:800;cursor:pointer}
.toastel .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);animation:prog linear forwards}
@keyframes prog{from{width:100%}to{width:0}}
/* skeleton demo */
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #33334a;border-top-color:var(--lime);animation:rot .8s linear infinite;margin:auto}
@keyframes rot{to{transform:rotate(360deg)}}
.skimg{height:130px;border-radius:14px;margin-bottom:14px}
.realimg{height:130px;border-radius:14px;margin-bottom:14px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.cap{text-align:center;margin-top:12px;font-weight:700;font-size:14px}
.cap small{display:block;color:var(--sub);font-weight:500}
/* system colors */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;width:340px;max-width:100%;border:1px solid;font-size:14px}
.alert i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#111;flex:none}
.alert b{display:block}
.alert.err{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.5)}.alert.err i{background:var(--red)}
.alert.wrn{background:rgba(255,169,77,.12);border-color:rgba(255,169,77,.5)}.alert.wrn i{background:var(--orange)}
.alert.suc{background:rgba(53,208,127,.12);border-color:rgba(53,208,127,.5)}.alert.suc i{background:var(--green)}
.alert.inf{background:rgba(77,163,255,.12);border-color:rgba(77,163,255,.5)}.alert.inf i{background:var(--blue)}
.gray{filter:grayscale(1)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.brandbtn{border:0;border-radius:12px;padding:11px 22px;font-weight:800;color:#111;cursor:pointer}
.warnline{color:var(--orange);font-weight:700}

/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin-bottom:20px}
.s3{grid-column:span 3}.s6{grid-column:span 6}
@media(max-width:900px){.s3{grid-column:span 6}}
.part{display:flex;gap:14px;margin-bottom:16px}.part:last-child{margin:0}
.dot{width:12px;height:12px;border-radius:4px;margin-top:8px;flex:none}
.part b{font-size:17px;letter-spacing:-.02em}.part p{margin:2px 0 0;color:var(--sub);font-size:14.5px}
.video{background:linear-gradient(135deg,rgba(139,123,255,.25),rgba(255,107,154,.15));border-color:var(--line2)}
.video p{font-size:18px;letter-spacing:-.02em;margin:0;line-height:1.5}
.tipl{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2);color:#d6d6e4;font-size:15px}.tipl b{color:var(--lime)}
.q{border-left:2px solid var(--lime);padding:2px 0 2px 14px;margin:0 0 14px;font-size:16px}
.x{display:flex;gap:10px;color:#ffb3c6;margin-bottom:12px;font-size:15px}.x::before{content:"×";color:var(--accent2);font-weight:800}
.tags a{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:6px 14px;margin:0 8px 8px 0;font-size:14px;color:#dcdcea}
textarea{width:100%;min-height:150px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--text);font:inherit;font-size:15px;resize:vertical;outline:none;transition:.2s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,123,255,.18)}
textarea::placeholder{color:#6b6b80}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:13px;color:var(--sub)}
.log{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--sub)}
.log li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-right:10px}
.spacer{height:80px}
/* ===== 공통 썸네일 모션 ===== */
.hv{transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s,opacity .3s,color .3s,width .5s}
.card:hover .up{transform:translateY(-7px)}.card:hover .dw{transform:translateY(7px)}
.card:hover .rt{transform:translateX(9px)}.card:hover .lf{transform:translateX(-9px)}
.card:hover .sc{transform:scale(1.12)}.card:hover .rot{transform:rotate(90deg)}
.card:hover .lime{background:var(--lime)!important;color:#111!important;border-color:var(--lime)!important}
.card:hover .show{opacity:1!important}.card:hover .grow{width:100%!important}
.tgt{display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:12px}
/* ===== 배치 A 데모 ===== */
.inst{border:0;color:#111;font-weight:800;transition:.25s;background:var(--bc,#8b7bff);border-radius:var(--br,12px);padding:var(--bp,11px 20px);cursor:pointer;font-size:14px}
.mpage{background:#17171f;border:1px solid var(--line);border-radius:14px;padding:14px;width:190px;display:flex;flex-direction:column;gap:10px}
.assets{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.assets i{width:26px;height:26px;border-radius:8px;display:inline-block}
.assets b{font-size:22px;font-weight:800}
.hp{position:relative}
.showlab .hp{outline:1.5px dashed var(--lime);outline-offset:3px}
.showlab .hp::before{content:attr(data-l);position:absolute;top:-20px;left:0;font-size:10px;background:var(--lime);color:#111;padding:1px 6px;border-radius:5px;font-weight:800;white-space:nowrap;z-index:3}
.mock{width:100%;max-width:700px;background:#17171f;border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.mock .hd,.mock .ft{display:flex;align-items:center;gap:18px;padding:22px 20px 14px;background:#1d1d29;font-size:14px;flex-wrap:wrap}
.mock .ft{flex-direction:column;align-items:flex-start;gap:28px;padding:34px 20px 20px;color:var(--sub);font-size:12.5px}
.mock .bd2{padding:20px;min-height:90px}
.mock .logo2{font-weight:800;font-size:17px}
.mock .sch{margin-left:auto;background:#0e0e14;border-radius:99px;padding:6px 14px;font-size:12px;color:var(--sub);min-width:130px}
.mock .bt{background:#262634;border-radius:99px;padding:5px 12px;font-size:12px}
.mock .row{display:flex;gap:16px;flex-wrap:wrap}
.site{width:100%;max-width:700px;display:flex;flex-direction:column;gap:8px}
.z{border:1.5px solid var(--line2);border-radius:10px;padding:10px 14px;transition:.25s;font-size:13px;background:#17171f}
.z b{color:var(--lime);margin-right:8px}
.site.f .z{opacity:.22}.site.f .z.on{opacity:1;border-color:var(--lime);background:rgba(198,255,77,.09)}
.sbody{display:flex;gap:8px}.sbody .snb{width:130px;flex:none}.sbody .main{flex:1;min-height:90px}
.navbox{width:100%;max-width:640px;display:flex;gap:10px;min-height:260px}
.navbox .nv{background:#1d1d29;border:1px solid var(--line2);border-radius:12px;padding:8px;display:flex;gap:4px}
.navbox .nv button{border:0;background:transparent;color:var(--sub);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.navbox .nv button.on{background:var(--lime);color:#111;font-weight:800}
.navbox .pg2{flex:1;background:#17171f;border:1px solid var(--line);border-radius:12px;padding:24px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.tabs{display:flex;gap:6px}
.tabs button{border:0;background:transparent;color:var(--sub);padding:10px 18px;cursor:pointer;font-size:15px;font-weight:600;transition:.2s}
.tabs.under{border-bottom:1px solid var(--line2)}.tabs.under button.on{color:var(--lime);box-shadow:inset 0 -3px 0 var(--lime)}
.tabs.pill button{border-radius:99px}.tabs.pill button.on{background:var(--text);color:#111}
.tabs.box{background:#0e0e14;border-radius:12px;padding:4px}.tabs.box button{border-radius:9px;flex:1}.tabs.box button.on{background:#2b2b3d;color:#fff}
.tabpanel{padding:20px 4px;color:#d6d6e4;min-height:70px}
.cols2{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;width:100%}
.col2{width:290px;max-width:100%}
.col2 h4{margin:0 0 10px;font-size:15px}.col2 h4 small{color:var(--sub);font-weight:500;margin-left:6px}
.nsel{width:100%;background:#1d1d29;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:12px;font:inherit;font-size:15px}
.dd{position:relative}
.ddb{width:100%;text-align:left;background:#1d1d29;border:1px solid var(--line2);border-radius:14px;padding:12px 16px;cursor:pointer;font-size:15px;display:flex;justify-content:space-between}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#232331;border:1px solid var(--line2);border-radius:14px;padding:6px;z-index:6;box-shadow:0 20px 40px rgba(0,0,0,.5);animation:fadeup .18s}
.ddl .o{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.ddl .o:hover{background:#2f2f42}.ddl .o .ac2{margin-left:auto;display:flex;gap:4px}
.ddl .o .ac2 span{font-size:11px;background:#3b3563;border-radius:6px;padding:2px 7px}
.ddl .o i{width:20px;height:20px;border-radius:6px;display:inline-block}
.faq{width:100%;max-width:520px}
.faq .it2{position:relative;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;background:#17171f}
.faq .q2{width:100%;text-align:left;background:transparent;border:0;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}
.faq .q2 span{transition:transform .25s;color:var(--lime)}.faq .it2.open .q2 span{transform:rotate(180deg)}
.faq .ap{overflow:hidden;max-height:0;transition:max-height .3s;color:var(--sub);font-size:14px;padding:0 16px}
.faq .it2.open .ap{max-height:140px;padding-bottom:14px}
.faq.dd2 .ap{position:absolute;left:-1px;right:-1px;top:100%;background:#2b2b3d;border:1px solid var(--lime);border-radius:0 0 12px 12px;z-index:5;max-height:0;padding:0 16px;visibility:hidden}
.faq.dd2 .it2.open .ap{max-height:140px;padding:12px 16px;visibility:visible}
.below{height:46px;border-radius:10px;background:repeating-linear-gradient(135deg,#1f1f2c 0 10px,#252535 10px 20px);margin-top:8px;display:grid;place-items:center;color:var(--sub);font-size:12px}
.cal{background:#1d1d29;border:1px solid var(--line2);border-radius:18px;padding:16px;width:290px}
.cal .hd3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.cal .hd3 button{border:0;background:#2b2b3d;color:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer}
.cal .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .g7 span{color:var(--sub);font-size:11px}
.cal .g7 button{border:0;background:transparent;color:var(--text);height:34px;border-radius:50%;cursor:pointer}
.cal .g7 button:hover{background:#2b2b3d}.cal .g7 button.sel{background:var(--lime);color:#111;font-weight:800}
.cal .g7 button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.wheels{display:flex;gap:6px;background:#1d1d29;border:1px solid var(--line2);border-radius:18px;padding:14px;width:240px;position:relative}
.wheels .wl{flex:1;height:170px;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center;scrollbar-width:none;padding:68px 0}
.wheels .wl::-webkit-scrollbar{display:none}
.wheels .wl div{height:34px;line-height:34px;scroll-snap-align:center;color:#6b6b80;cursor:pointer;font-size:16px}
.wheels .wl div.sel{color:#fff;font-weight:800;font-size:19px}
.wheels::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:34px;margin-top:-17px;border-radius:10px;background:rgba(198,255,77,.1);border:1px solid rgba(198,255,77,.4);pointer-events:none}
.resbox{margin-top:12px;background:#0e0e14;border-radius:10px;padding:8px 12px;color:var(--lime);font-size:14px;font-weight:700;text-align:center}
.pgbox{width:100%;max-width:640px}
.rows{background:#17171f;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rows div{display:flex;justify-content:space-between;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px}
.rows div:last-child{border:0}.rows div span{color:var(--sub)}
.pager{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;font-size:14px}
.pager button.on{background:var(--lime);color:#111;border-color:var(--lime);font-weight:800}
.pager button:disabled{opacity:.3;cursor:default}.pager em{align-self:center;color:var(--sub);font-style:normal}
.meter{height:10px;background:#252535;border-radius:99px;overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--lime));border-radius:99px;transition:width .3s}

/* ===== 배치 B ===== */
.bars{display:flex;gap:6px;align-items:flex-end;height:60px}.bars i{width:12px;border-radius:4px;background:#34344a;transition:.15s}.bars i.on{background:var(--lime)}
.sl-card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:20px 22px;width:300px}
.sl-card h4{margin:0 0 14px;font-size:15px}.sl-card .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:12px}
.sl-card input[type=range]{width:100%}
.zoomview{height:90px;background:#0e0e14;border-radius:12px;display:grid;place-items:center;overflow:hidden;margin-bottom:14px}
.zoomview i{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .1s}
.carousel{width:100%;max-width:560px}
.cvp{overflow:hidden;border-radius:18px;border:1px solid var(--line2)}
.ctrack{display:flex;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cslide{flex:none;width:100%;height:210px;display:grid;place-items:center;font-size:26px;font-weight:800;color:#111;letter-spacing:-.03em}
.cdots{display:flex;gap:8px;justify-content:center;margin-top:14px;align-items:center}

      <h1>보면서 <span>이해하는</span> 실무 용어.</h1>
      <p>회의에서 쓰는 찐 실무 용어, 그림으로 먼저 익혀요.</p>
    </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = id => { try{return JSON.parse(localStorage.getItem('uiTerm:'+id))||{}}catch(e){return {}} };
const save = (id,d) => { try{localStorage.setItem('uiTerm:'+id,JSON.stringify(d))}catch(e){} };

/* ---------- 데모용 작은 헬퍼 ---------- */
const seg = (id,items) => `<div class="seg" id="${id}">${items.map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</div>`;
function wireSeg(root,id,cb,init){
  const el = root.querySelector('#'+id);
  const set = v => { el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(v))); cb(String(v)); };
  el.onclick = e => { const b=e.target.closest('button'); if(b) set(b.dataset.v); };
  el.set = set; set(init); return set;
}
const rng = (id,label,min,max,val,unit='') => `<label class="ctl">${label}<input type="range" id="${id}" min="${min}" max="${max}" value="${val}"><b id="${id}V">${val}${unit}</b></label>`;
function wireRng(root,id,cb,unit=''){
  const el = root.querySelector('#'+id), out = root.querySelector('#'+id+'V');
  el.oninput = () => { out.textContent = el.value+unit; cb(+el.value); }; return el;
}
const tgl = (id,label,on=true) => `<label class="tg"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i>${label}</label>`;
const phone = (inner,cls='') => `<div class="phone ${cls}"><div class="sb"></div>${inner}</div>`;
const fakePage = () => `<div class="pbody"><div class="ph-hero"></div><div class="ph-line" style="width:70%"></div><div class="ph-line" style="width:90%"></div><div class="ph-card"></div><div class="ph-card"></div></div>`;
const sample = () => `<div class="realimg"></div><div class="ph-line" style="width:60%;height:16px;background:#3a3a50"></div><div class="ph-line" style="width:95%"></div><div class="ph-line" style="width:80%"></div>`;

/* =====================================================
   용어 데이터. 새 용어는 이 배열에 같은 형식으로 추가
   thumb(): 카드 그림 / demo(pg): 상세 체험 영역
   ===================================================== */
const TERMS = [];
const bx=(st,cls='',inner='')=>`<div class="hv ${cls}" style="${st}">${inner}</div>`;
const ln=(w='100%',h=8,c='#34344a',ex='')=>`<div style="width:${w};height:${h}px;border-radius:99px;background:${c};${ex}"></div>`;

TERMS.push({
  id:"wireframe", cat:"기획 문서", ko:"와이어프레임", en:"Wireframe",
  sum:"위치만 잡은 화면 설계도",

let activeCat='전체';
function renderList(){
  const cats=['전체',...new Set(TERMS.map(t=>t.cat))];
  $('#filters').innerHTML=cats.map(c=>`<button class="${c===activeCat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const list=TERMS.filter(t=>activeCat==='전체'||t.cat===activeCat);
  $('#cards').innerHTML=list.map(t=>{const d=load(t.id);
    return `<button class="card" data-id="${t.id}"><div class="thumb"><div class="fill">${t.thumb()}</div></div>
    <div class="cbody"><span class="tag">${esc(t.cat)}</span>${t.extra?'<span class="extra-tag">영상 외 보충</span>':''}<h2>${esc(t.ko)}<small>${esc(t.en)}</small></h2><p>${esc(t.sum)}</p>
    <div class="cta"><span>${d.done?'<span class="state">학습 완료</span>':d.memo?'<span class="state">메모 있음</span>':'만져보고 기록 남기기'}</span><span class="arrow">→</span></div></div></button>`}).join('');
  $('#count').textContent=`용어 ${TERMS.length}개`;
}
$('#filters').onclick=e=>{const b=e.target.closest('button');if(b){activeCat=b.dataset.c;renderList()}};
$('#cards').onclick=e=>{const c=e.target.closest('.card');if(c)location.hash='#/'+c.dataset.id};

  ['pvT','pvB'].forEach(k=>{const e=$('#'+k);if(e)e.onclick=()=>goT(idx-1)});['nxT','nxB'].forEach(k=>{const e=$('#'+k);if(e)e.onclick=()=>goT(idx+1)});
  const persist=()=>{const x=load(t.id);x.memo=$('#memo').value;x.done=$('#doneChk').checked;x.updated=new Date().toLocaleString('ko-KR');save(t.id,x);$('#saved').textContent='저장됨 · '+x.updated};
  let tm;$('#memo').oninput=()=>{clearTimeout(tm);tm=setTimeout(persist,300)};$('#doneChk').onchange=persist;
  $('#addLog').onclick=()=>{const x=load(t.id);x.log=x.log||[];x.log.push(new Date().toLocaleString('ko-KR')+' 복습');save(t.id,x);$('#log').innerHTML=x.log.map(l=>`<li>${esc(l)}</li>`).join('')};
  t.demo($('#pg'));
}
function route(){
  const id=location.hash.replace('#/','');const t=TERMS.find(x=>x.id===id);
  $('#listView').hidden=!!t;$('#detailView').hidden=!t;
  if(t){renderDetail(t);scrollTo(0,0)}else renderList();
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if($('#detailView').hidden||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName))return;const id=location.hash.replace('#/','');const i=TERMS.findIndex(x=>x.id===id);if(e.key==='ArrowLeft'&&i>0)location.hash='#/'+TERMS[i-1].id;if(e.key==='ArrowRight'&&i<TERMS.length-1)location.hash='#/'+TERMS[i+1].id});
addEventListener('resize',()=>{const p=$('#pg');if(p&&p._redraw)p._redraw()});
route();
</script>
</body>
</html>
